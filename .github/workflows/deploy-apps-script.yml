# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy to Production Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install clasp
        run: npm install -g @google/clasp@2

      - name: Set up clasp credentials
        run: |
          echo '{
            "token": {
              "access_token": "",
              "refresh_token": "${{ secrets.CLASP_REFRESH_TOKEN }}",
              "token_type": "Bearer",
              "expiry_date": 1
            },
            "oauth2ClientSettings": {
              "clientId": "${{ secrets.CLASP_CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLASP_CLIENT_SECRET }}",
              "redirectUri": "http://localhost"
            },
            "isLocalCreds": false
          }' > ~/.clasprc.json

      - name: Use production configuration
        run: cp .clasp.prod.json .clasp.json

      - name: Push to Google Apps Script
        run: clasp push --force

      - name: Redeploy to production
        run: clasp deploy -i ${{secrets.DEPLOYMENT_ID}} --description "Public Link"
