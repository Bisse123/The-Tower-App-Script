# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy to Production Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install clasp
        run: npm install -g @google/clasp@2

      - name: Set up clasp credentials
        run: |
          echo '{
            "token": {
              "access_token": "",
              "refresh_token": "${{ secrets.CLASP_REFRESH_TOKEN }}",
              "token_type": "Bearer",
              "expiry_date": 1
            },
            "oauth2ClientSettings": {
              "clientId": "${{ secrets.CLASP_CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLASP_CLIENT_SECRET }}",
              "redirectUri": "http://localhost"
            },
            "isLocalCreds": false
          }' > ~/.clasprc.json

      - name: Pull current production HEAD
        run: |
          mkdir -p remote_head
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('.clasp.prod.json','utf8'));c.rootDir='remote_head';c.fileExtension='js';fs.writeFileSync('.clasp.json',JSON.stringify(c));"
          clasp pull

      - name: Verify tested HEAD matches this commit
        run: |
          if ! node .github/scripts/compare-src.js src remote_head; then
            echo "::error::Production HEAD does not match this commit. The code on 'main' was not the code you pushed and tested via 'npm run dev'. Run 'npm run dev' with the exact 'main' code, verify it, then re-run this workflow. Nothing was deployed."
            exit 1
          fi

      - name: Use production configuration
        run: cp .clasp.prod.json .clasp.json

      - name: Redeploy to production
        run: clasp deploy -i ${{ secrets.DEPLOYMENT_ID }} --description "Public Link"

      # Publishing main means the web app and the add-on are both on this
      # release, so this is the moment LATEST_APP_VERSION becomes true. Older
      # copies read it to learn they are behind.
      #
      # This runs after the deploy on purpose: a failure here leaves the
      # release itself published and only the pointer stale, which is a red
      # build to fix rather than a broken deploy. Needs the API-executable
      # deployment described in documentation/07-deployment.md — `clasp deploy`
      # and `clasp run` are different APIs and the second one needs it.
      #
      # Deliberately not --nondev. Dev mode runs the project's HEAD, which the
      # step above just verified matches this commit, so the version it bakes
      # in is this release. --nondev would instead run whatever version the
      # API-executable deployment is pinned to — a deployment nothing here
      # updates — and publish that older version as "latest".
      - name: Record this release as the latest
        run: |
          if ! clasp run setLatestAppVersion; then
            echo "::error::LATEST_APP_VERSION was not updated, so older copies will not learn they are behind. The deploy itself succeeded. Fix: finish the 'clasp run' setup in documentation/07-deployment.md, or set LATEST_APP_VERSION by hand under Project Settings ▸ Script Properties."
            exit 1
          fi
