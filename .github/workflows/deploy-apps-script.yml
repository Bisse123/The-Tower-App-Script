# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy to Production Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Set up clasp credentials
        run: |
          echo '{
            "tokens": {
              "default": {
                "client_id": "${{ secrets.CLASP_CLIENT_ID }}",
                "client_secret": "${{ secrets.CLASP_CLIENT_SECRET }}",
                "type": "authorized_user",
                "refresh_token": "${{ secrets.CLASP_REFRESH_TOKEN }}",
                "access_token": "",
                "token_type": "Bearer",
                "expiry_date": 0
              }
            }
          }' > ~/.clasprc.json

      - name: Use production configuration
        run: cp .clasp.prod.json .clasp.json

      - name: Push to Google Apps Script
        run: clasp push --force

      - name: Redeploy to production
        run: clasp deploy -i ${{secrets.DEPLOYMENT_ID}} --description "Public Link"

      - name: Get latest script version
        id: get_version
        run: |
          VERSION=$(clasp versions | head -1 | awk '{print $1}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Write Google credentials
        run: echo "${{ secrets.GOOGLE_ADDON_CREDENTIALS }}" > /tmp/credentials.json

      - name: Get access token
        id: get_token
        run: |
          ACCESS_TOKEN=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/credentials.json \
            "https://oauth2.googleapis.com/token" | jq -r .access_token)
          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Update Google Workspace Add-on version
        env:
          ACCESS_TOKEN: ${{ steps.get_token.outputs.token }}
          PROJECT_ID: "the-tower-import-data"
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sheetsAddon\":{\"scriptVersion\":$VERSION}}" \
            "https://workspace.googleapis.com/v1/projects/$PROJECT_ID/addOns"