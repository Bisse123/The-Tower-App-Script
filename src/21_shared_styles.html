<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
    margin: 20px;
    line-height: 1.4;
  }

  button {
    padding: 0 32px;
    font-size: 18px;
    border: none;
    box-sizing: border-box;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    margin: 0 5px;
    width: auto;
    height: 56px;
    white-space: normal;
    vertical-align: top;
    text-align: center;
    line-height: 1.2;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
    display: inline-flex;
  }
  
  button:hover {
    transform: translateY(-1px);
  }

  button:disabled {
    background-color: #e0e0e0 !important;
    color: #888;
    cursor: not-allowed;
    transform: none;
  }

  input[type="text"] {
    width: 320px;
    max-width: 90%;
    padding: 0 8px;
    font-size: 1.1em;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    height: 56px;
    line-height: normal;
    margin-bottom: 0;
  }

  select {
    width: auto;
    max-width: 90%;
    padding: 0 12px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    height: 56px;
    line-height: normal;
    margin: 0 5px;
    background-color: white;
    color: #333;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  select:hover {
    border-color: #999;
    transform: translateY(-1px);
  }

  select:focus {
    outline: none;
    border-color: #4285f4;
    box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
  }

  label {
    display: block;
    font-size: 0.85em;
    color: #666;
    margin-bottom: 3px;
    margin-left: 13px;
    font-weight: 500;
  }

  ul {
    margin-top: 8px;
    margin-bottom: 16px;
  }
  
  kbd {
    background-color: #f1f3f4;
    border: 1px solid #dadce0;
    border-radius: 3px;
    padding: 2px 6px;
    font-family: monospace;
    font-size: 0.9em;
    color: #3c4043;
  }
  
  .section {
    margin: 10px 0;
    padding: 15px;
    border-radius: 6px;
    border-width: 1px;
    border-style: solid;
    box-sizing: border-box;
    word-wrap: break-word;
    overflow-wrap: break-word;
    animation: slideIn 0.3s ease-out;
    display: none;
  }
  
  .title {
    margin-top: 0;
    margin-bottom: 15px;
  }
  
  .selectedFileSummary {
    font-size: 16px;
    line-height: 1.5;
  }
  
  .hint {
    font-size: 0.9em;
    color: #666;
    line-height: 1.4;
    margin-top: 5px;
    word-break: break-all;
  }
  
.appHeader {
  text-align: center;
  padding: 18px 12px;
  border-radius: 8px;
  border: 1px solid #d0d0d0;
  margin-bottom: 24px;
  background: linear-gradient(135deg, #e6e8ea 0%, #f1f2f3 100%);
  box-shadow: 0 2px 8px rgba(60,64,67,0.10);
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
  .appHeaderIcon {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(60,64,67,0.10);
    background: #f8f9fa;
    object-fit: contain;
    margin: 0;
    transition: box-shadow 0.2s, transform 0.2s;
    border: 1px solid #e0e0e0;
  }
  .appHeaderTitle {
    display: inline-block;
    font-size: 2.1em;
    color: #222;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
    text-shadow: 0 1px 2px rgba(60,64,67,0.07);
    vertical-align: middle;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 768px) {
    button {
      padding: 12px;
      font-size: 18px;
      margin: 0;
      width: 100%;
      min-width: 100%;
      max-width: 100%;
      height: auto;
      min-height: 54px;
      white-space: normal;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .section button {
      margin-top: 15px;
    }
    select {
      width: 100%;
      max-width: 100%;
      padding: 12px;
      font-size: 16px;
      height: 54px;
      margin: 0;
    }
    label {
      font-size: 0.9em;
      margin-left: 8px;
    }
    body {
      font-size: 16px;
      padding: 10px;
    }
    h1 {
      font-size: 24px;
    }
    .selectedFileSummary {
      font-size: 16px;
      line-height: 1.5;
    }
    .hint {
      font-size: 0.85em;
      line-height: 1.3;
    }
    
    .appHeader {
      padding: 15px 10px;
      margin-bottom: 15px;
    }
    
    .appHeaderIcon {
      width: 48px;
      height: 48px;
    }
    
    .appHeaderTitle {
      font-size: 1.3em;
      display: block;
    }
  }

  /* Loading Spinner Styles */
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid #e0e0e0;
    border-radius: 50%;
    border-top-color: #4285f4;
    animation: spin 1s ease-in-out infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  .spinner-large {
    width: 32px;
    height: 32px;
    border-width: 3px;
  }

  .spinner-small {
    width: 16px;
    height: 16px;
    border-width: 2px;
    margin-right: 6px;
  }

  /* Spinner with text container */
  .loading-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .loading-text {
    color: #666;
    font-size: 14px;
  }

  /* Button with spinner */
  .button-loading {
    position: relative;
    color: transparent !important;
  }

  .button-loading::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
  }

  /* Overlay spinner for full loading states */
  .loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .loading-overlay .spinner {
    width: 40px;
    height: 40px;
    border-width: 4px;
    margin-right: 0;
  }

  /* Keyframe animation */
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }

  /* Hide element utility */
  .hidden {
    display: none !important;
  }
</style>
