      } else {
        // No cached data available, fetch from server
        console.log("No cached subsheet data found, fetching from server");
        setStatusWithSpinner("Getting subsheet information...");

        const subsheetsResult = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getTemplateAndsheetIds(oldSheetID, "all");
        });

        if (!subsheetsResult.success) {
          setStatusText(
            `Error getting subsheet info: ${subsheetsResult.message}`,
          );
          resetIDSMasterState();
          return;
        }

        allSubsheetIds = subsheetsResult.sheetIds;
        allTemplateInfo = subsheetsResult.templateInfo;

        // Cache subsheet template info for future use
        cachedTemplatesWithSameVersion = subsheetsResult.templateInfo;
      }

      // Check access to all subsheets before proceeding
      setStatusWithSpinner(
        `Checking access to ${allSubsheetIds.length} subsheets...`,
      );

      const subsheetAccessResult = await checkMultipleSheetAccess(
        allSubsheetIds,
        userEmail,
      );

      if (!subsheetAccessResult.success) {
        setStatusText(
          `Error checking subsheet access: ${subsheetAccessResult.message}`,
        );
        resetIDSMasterState();
        return;
      }

      // Check if we have access to all subsheets
      if (
        subsheetAccessResult.inaccessibleFiles &&
        subsheetAccessResult.inaccessibleFiles.length > 0
      ) {
        // Some subsheets need access - set up for picker
        setStatusText(
          `${subsheetAccessResult.inaccessibleFiles.length} subsheets need access permission. Please grant access...`,
        );

        // Update the caches with inaccessible files
        inaccessibleFilesCache = subsheetAccessResult.inaccessibleFiles;
        accessibleFilesCache = subsheetAccessResult.accessibleFiles || [];
        notOwnedFilesCache = subsheetAccessResult.notOwnedFiles || [];
        templateInaccessibleFilesCache = []; // No template access issues for IDS Master only
        templateAccessibleFilesCache = [];

        // Show the picker for access (the picker callback will continue the flow)
        openMultiFilePicker();
        return;
      }

      // All subsheets are accessible - proceed with IDS Master creation
      console.log(
        `✅ Access verified for all ${allSubsheetIds.length} subsheets - proceeding with IDS Master update`,
      );
      hideIDSMasterButtons();
      // Use updateSingleSheet logic for IDS Master
      // oldSheetID is the current IDS Master, newSheetID will be the new copy
      updateSingleSheet();
    } catch (error) {
      console.error("Error in updateIDSMasterOnly:", error);
      setStatusText(
        `Error preparing IDS Master update: ${error.message || error}`,
      );
      resetIDSMasterState();
    }
  }

  function updateSubsheetsOnly() {
    console.log("Subsheets update selected");
    setStatusWithSpinner("Preparing subsheet updates...");

    isCombinedUpdate = false;
    idMasterID = oldSheetID;
    currentCopyMode = "update";
    cachedTemplateInfo = null;
    cachedSheetIds = null;

    document.getElementById("selectedFileSummary").innerHTML =
      "<strong>📋 Updating subsheets with new versions.</strong><br>";

    // document.getElementById("copyButton").style.display = "none";
    // document.getElementById("copyUpdateButton").style.display = "none";
    document.getElementById("moveSheetButton").innerText = "Move Subsheets";

    // Hide the IDS Master option buttons
    hideIDSMasterButtons();

    copyTemplates("update");
  }

  function updateMasterAndSubsheets() {
    console.log("Master and Subsheets update selected");
    setStatusWithSpinner("Preparing combined update...");

    // Set a flag to indicate we're doing combined update
    isCombinedUpdate = true;

    // Disable all buttons during operation
    disableIDSMasterButtons();

    // Use the new combined function to handle all ID discovery and file creation
    updateMasterAndSubsheetsWithAllFiles();
  }

  async function updateMasterAndSubsheetsWithAllFiles() {
    try {
      let allTemplateInfo,
        allSheetIds,
        masterTemplateInfo,
        subsheetsTemplateInfo;

      // Check if we have cached data to optimize the process
      if (cachedTemplateInfo && cachedSheetIds) {
        console.log(
          "Using cached template info and sheet IDs for combined update",
        );

        // Use cached data for subsheets
        subsheetsTemplateInfo = cachedTemplateInfo;
        const subsheetsSheetIds = cachedSheetIds;

        // Check if we also have cached master template info
        if (cachedMasterTemplateInfo) {
          console.log("Using cached master template info");
          masterTemplateInfo = cachedMasterTemplateInfo;
        } else {
          // Still need to get IDS Master template info separately
          setStatusWithSpinner("Getting IDS Master template information...");
          ("Getting IDS Master template information...");

          const masterTemplateResult = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .getTemplateIdForSingleSheet(oldSheetID, sheetType);
          });

          if (!masterTemplateResult.success) {
            throw new Error(
              `Failed to get IDS Master template: ${masterTemplateResult.message}`,
            );
          }

          // Create template info structure for IDS Master
          masterTemplateInfo = {
            templateID: masterTemplateResult.templateID,
            sheetType: sheetType, // This is "IDS Master"
            version: masterTemplateResult.templateVersion,
          };

          // Cache the master template info for future use
          cachedMasterTemplateInfo = masterTemplateInfo;
        }

        // Combine all template info (IDS Master + cached subsheets)
        allTemplateInfo = [masterTemplateInfo, ...subsheetsTemplateInfo];
        allSheetIds = [oldSheetID, ...subsheetsSheetIds]; // Include the old IDS Master for access check
      } else {
        console.log(
          "No cached data found, fetching all template and sheet information from server",
        );

        setStatusWithSpinner(
          "Getting all required template and sheet information...",
        );

        // Get all required IDs in parallel - both IDS Master template and all subsheet templates
        const [masterTemplateResult, subsheetsResult] = await Promise.all([
          // Get IDS Master template ID
          new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .getTemplateIdForSingleSheet(oldSheetID, sheetType);
          }),
          // Get all subsheet template and sheet IDs (using oldSheetID which is the current IDS Master)
          new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .getTemplateAndsheetIds(oldSheetID, "all");
          }),
        ]);

        if (!masterTemplateResult.success) {
          throw new Error(
            `Failed to get IDS Master template: ${masterTemplateResult.message}`,
          );
        }

        if (!subsheetsResult.success) {
          throw new Error(
            `Failed to get subsheet templates: ${subsheetsResult.message}`,
          );
        }

        // Create template info structure for IDS Master
        masterTemplateInfo = {
          templateID: masterTemplateResult.templateID,
          sheetType: sheetType, // This is "IDS Master"
          version: masterTemplateResult.templateVersion,
        };

        // Filter templates based on version differences
        const templatesWithUpdates = subsheetsResult.templateInfo.filter(
          (template) => template.templateVersion !== template.oldVersion,
        );
        const templatesWithSameVersion = subsheetsResult.templateInfo.filter(
          (template) => template.templateVersion === template.oldVersion,
        );

        // Filter sheet IDs to match templates with updates
        const sheetIdsWithUpdates = subsheetsResult.sheetIds.filter(
          (sheetId, index) => {
            const template = subsheetsResult.templateInfo[index];
            return template && template.templateVersion !== template.oldVersion;
          },
        );

        // Use only templates with updates for the combined update process
        subsheetsTemplateInfo = templatesWithUpdates;

        // Combine all template info (IDS Master + subsheets with updates)
        allTemplateInfo = [masterTemplateInfo, ...subsheetsTemplateInfo];
        allSheetIds = [...subsheetsResult.sheetIds]; // Use filtered sheet IDs

        // Cache the data for later use
        cachedTemplateInfo = subsheetsTemplateInfo;
        cachedTemplatesWithSameVersion = templatesWithSameVersion; // Cache templates with matching versions
        cachedSheetIds = sheetIdsWithUpdates;
        cachedMasterTemplateInfo = masterTemplateInfo;
      }

      console.log("All template info for combined update:", allTemplateInfo);
      console.log("All sheet IDs for combined update:", allSheetIds);

      hasSubsheetsToUpdate = cachedTemplateInfo.length > 0;
      console.log(
        `Has subsheets to update: ${hasSubsheetsToUpdate} (${cachedTemplateInfo.length} total subsheet templates)`,
      );

      setStatusWithSpinner(
        `Checking access to ${allTemplateInfo.length} templates and ${allSheetIds.length} sheets...`,
      );

      // Check access to all templates and sheets in parallel
      const [templateResults, sheetResults] = await Promise.all([
        checkMultipleTemplateAccess(allTemplateInfo),
        checkMultipleSheetAccess(allSheetIds, userEmail),
      ]);

      if (!templateResults.success || !sheetResults.success) {
        const message = !templateResults.success
          ? templateResults.message
          : sheetResults.message;
        throw new Error(`Access check failed: ${message}`);
      }

      // Update caches with results for openMultiFilePicker
      accessibleFilesCache = sheetResults.accessibleFiles || [];
      inaccessibleFilesCache = sheetResults.inaccessibleFiles || [];
      notOwnedFilesCache = sheetResults.notOwnedFiles || [];
      templateAccessibleFilesCache = templateResults.accessibleFiles || [];
      templateInaccessibleFilesCache = templateResults.inaccessibleFiles || [];

      const totalInaccessibleFiles =
        inaccessibleFilesCache.length + templateInaccessibleFilesCache.length;

      if (totalInaccessibleFiles > 0) {
        // Show picker for access permission
        let statusMessages = [];
        if (templateInaccessibleFilesCache.length > 0) {
          statusMessages.push(
            `${templateInaccessibleFilesCache.length} template(s)`,
          );
        }
        if (inaccessibleFilesCache.length > 0) {
          statusMessages.push(`${inaccessibleFilesCache.length} sheet(s)`);
        }

        setStatusWithSpinner(
          `${statusMessages.join(
            " and ",
          )} need access permission. Opening file picker...`,
        );

        // Open picker for access permission
        openMultiFilePicker();
        return;
      }

      proceedWithCombinedUpdate(masterTemplateInfo, subsheetsTemplateInfo);
    } catch (error) {
      console.error("Combined update preparation failed:", error);
      setStatusText(
        `Combined update preparation failed: ${error.message || error}`,
      );
      if (isConvertToMasterFlow) {
        resetToCollectionState();
      } else {
        resetIDSMasterState();
      }
    }
  }

  async function proceedWithCombinedUpdate(masterTemplate, subsheetTemplates) {
    try {
      const totalTemplates = 1 + subsheetTemplates.length; // IDS Master + subsheets
      let successCount = 0;
      let failedCount = 0;
      let completedCount = 0;

      // Initialize the summary with header
      let linksHtml = "<strong>📂 Created sheets for update:</strong>";
      document.getElementById("selectedFileSummary").innerHTML = linksHtml;

      setStatusWithSpinner(`Creating ${totalTemplates} sheets for update...`);

      // Step 1: Create IDS Master sheet copy
      console.log("Creating IDS Master sheet copy...");

      const masterResult = await new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function (result) {
            resolve({
              success: true,
              result: result,
            });
          })
          .withFailureHandler(function (error) {
            resolve({
              success: false,
              result: {
                success: false,
                message: error.message || error,
              },
            });
          })
          .copyFileTemplate(
            masterTemplate.templateID,
            masterTemplate.sheetType,
            masterTemplate.version,
            parentFolderID
          );
      });

      // Update progress for IDS Master
      completedCount++;
      if (masterResult.success && masterResult.result.success) {
        successCount++;
        const newMasterID = masterResult.result.fileId;
        newSheetID = newMasterID;
        idMasterID = newSheetID;

        console.log("✅ IDS Master sheet created successfully:", newMasterID);
        linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${newMasterID}/edit" target="_blank">IDS Master Sheet™</a>`;
      } else {
        failedCount++;
        const errorMessage =
          masterResult.result?.message || "IDS Master creation failed";
        console.error("❌ IDS Master sheet creation failed:", errorMessage);
        linksHtml += `<br>&nbsp;&nbsp;• ❌ IDS Master Sheet™ (failed)`;
      }

      // Update UI with IDS Master result
      document.getElementById("selectedFileSummary").innerHTML = linksHtml;
      setStatusWithSpinner(
        `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
      );

      // If IDS Master creation failed, stop the process gracefully
      if (!masterResult.success || !masterResult.result.success) {
        const errorMessage = masterResult.result?.message || "Unknown error";
        setStatusText(
          `❌ Update failed: IDS Master sheet creation failed - ${errorMessage}`,
        );
        document.getElementById("fileAccessTitle").innerHTML =
          "❌ Update Failed";
        if (isConvertToMasterFlow) {
          resetToCollectionState();
        } else {
          resetIDSMasterState();
        }
        return;
      }

      // Step 2: Create all subsheet copies if there are any
      if (hasSubsheetsToUpdate && subsheetTemplates.length > 0) {
        console.log(`Creating ${subsheetTemplates.length} subsheet copies...`);

        // Create promises for all subsheet copying operations
        const subsheetCopyPromises = subsheetTemplates.map(
          (template, index) => {
            console.log(
              `Starting copy for ${template.sheetType} sheet:`,
              template,
            );

            return new Promise((resolve) => {
              google.script.run
                .withSuccessHandler(function (result) {
                  console.log(
                    `✅ ${template.sheetType} sheet copy result:`,
                    result,
                  );

                  let templateResult;
                  if (result.success && result.fileId) {
                    templateResult = {
                      success: true,
                      sheetType: template.sheetType,
                      version: template.version,
                      fileId: result.fileId,
                      gid: result.gid,
                    };

                    // Add to copiedTemplateFiles for later import
                    copiedTemplateFiles.push(templateResult);

                    // Add the newly copied file to accessible files cache
                    accessibleFilesCache.push({
                      id: result.fileId,
                      name: `Copy of ${template.sheetType} ${template.version}`,
                      sheetType: template.sheetType,
                    });

                    // Immediately add successful item to display
                    linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${result.fileId}/edit" target="_blank">${template.sheetType} Sheet™</a>`;
                  } else {
                    const errorMessage =
                      result.message ||
                      "Copy operation returned unsuccessful result";
                    templateResult = {
                      success: false,
                      sheetType: template.sheetType,
                      error: errorMessage,
                    };

                    // Immediately add failure message to display
                    linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
                  }

                  // Update UI immediately
                  completedCount++;
                  if (templateResult.success) {
                    successCount++;
                  } else {
                    failedCount++;
                  }

                  document.getElementById("selectedFileSummary").innerHTML =
                    linksHtml;
                  setStatusWithSpinner(
                    `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
                  );

                  resolve(templateResult);
                })
                .withFailureHandler(function (error) {
                  console.error(
                    `❌ Error copying sheet ${template.sheetType}:`,
                    error,
                  );

                  completedCount++;
                  failedCount++;
                  const errorMessage = error.message || error;

                  // Immediately add failure message to display
                  linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
                  document.getElementById("selectedFileSummary").innerHTML =
                    linksHtml;
                  setStatusWithSpinner(
                    `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
                  );

                  resolve({
                    success: false,
                    sheetType: template.sheetType,
                    error: errorMessage,
                  });
                })
                .copyFileTemplate(
                  template.templateID,
                  template.sheetType,
                  template.version,
                  parentFolderID
                );
            });
          },
        );

        // Wait for all subsheet copying operations to complete
        await Promise.all(subsheetCopyPromises);
      }

      // Final status update after all sheets are created
      const subsheetMessage = hasSubsheetsToUpdate
        ? ` and ${subsheetTemplates.length} subsheets`
        : "";

      let statusMessage;
      let titleMessage;

      if (failedCount === 0) {
        statusMessage = `🎉 All sheets created successfully! IDS Master${subsheetMessage} ready for import.`;
        titleMessage = `✅ Sheets Created Successfully!`;
      } else if (successCount === 0) {
        statusMessage = `❌ All ${totalTemplates} sheet creations failed.`;
        titleMessage = `❌ Sheet Creation Failed`;
      } else {
        statusMessage = `⚠️ Sheet creation completed: ${successCount} successful, ${failedCount} failed.`;
        titleMessage = `⚠️ Sheets Partially Created`;
      }

      setStatusText(statusMessage);
      document.getElementById("fileAccessTitle").innerHTML = titleMessage;

      // Show buttons only if at least IDS Master was created successfully
      if (newSheetID) {
        // Show import button
        document.getElementById("importButton").style.display = "inline-block";
        document.getElementById("importButton").disabled = false;
        document.getElementById("importButton").innerText = hasSubsheetsToUpdate
          ? "Import Subsheets"
          : "Import IDS Master";

        // Show move button
        document.getElementById("moveSheetButton").style.display =
          "inline-block";
        document.getElementById("moveSheetButton").disabled = true;
        document.getElementById("moveSheetButton").innerText =
          hasSubsheetsToUpdate
            ? "Move Subsheets and Move/Update Master"
            : "Move IDS Master";
      }

      hideUpdateSingleSheetButton();
      hideIDSMasterButtons();
    } catch (error) {
      console.error("Combined update execution failed:", error);
      setStatusText(`Update failed: ${error.message || error}`);
      if (isConvertToMasterFlow) {
        resetToCollectionState();
      } else {
        resetIDSMasterState();
      }
    }
  }

  function disableIDSMasterButtons() {
    const buttons = [
      // "updateMasterOnlyButton",
      "updateSubsheetsOnlyButton",
      "updateMasterAndSubsheetsButton",
      "convertToCollectionButton",
    ];
    buttons.forEach((buttonId) => {
      const button = document.getElementById(buttonId);
      if (button) button.disabled = true;
    });
  }

  function enableIDSMasterButtons() {
    const buttons = [
      // "updateMasterOnlyButton",
      "updateSubsheetsOnlyButton",
      "updateMasterAndSubsheetsButton",
      "convertToCollectionButton",
    ];
    buttons.forEach((buttonId) => {
      const button = document.getElementById(buttonId);
      if (button) button.disabled = false;
    });
  }

  function hideIDSMasterButtons() {
    const buttons = [
      // "updateMasterOnlyButton",
      "updateSubsheetsOnlyButton",
      "updateMasterAndSubsheetsButton",
      "convertToCollectionButton",
    ];
    buttons.forEach((buttonId) => {
      const button = document.getElementById(buttonId);
      if (button) button.style.display = "none";
    });
  }

  function showIDSMasterButtons() {
    renderIdMasterOptions();
  }

  function resetIDSMasterState() {
    // Reset any combined update state
    isCombinedUpdate = false;

    // Reset IDS Master only update state
    isUpdateSingleSheetFlow = false;

    // Reset conversion state
    isConvertToMasterFlow = false;
    isConvertToCollectionFlow = false;

    // Clean up temporary master template cache
    cachedMasterTemplateInfo = null;

    // Clean up cached templates with same version
    cachedTemplatesWithSameVersion = null;

    // Re-enable buttons
    enableIDSMasterButtons();

    sheetType = "IDS Master";
    idMasterID = oldSheetID;
    isUpdateSingleSheetFlow = true;
    isCombinedUpdate = false;
    renderIdMasterOptions();
  }

  function resetToCollectionState() {
    isCombinedUpdate = false;
    isUpdateSingleSheetFlow = false;
    isConvertToMasterFlow = false;
    isConvertToCollectionFlow = false;
    sheetType = "IDS Collection";
    versionDifference = null;
    masterVersionDifference = null;
    enableUpdateSingleSheetButton();
    showUpdateSingleSheetButton();
  }
</script>
