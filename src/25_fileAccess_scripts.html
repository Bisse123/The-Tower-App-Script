<script>
  const MERGED_THEMES_SHEET_TYPE = "Themes, Songs & Relics";
  const LEGACY_THEMES_SHEET_TYPE = "Themes & Songs";
  const LEGACY_RELICS_SHEET_TYPE = "Relics";
  let mergeLegacyThemesSheets = false;

  /**
   * Whether the IDS Master still lists Themes and Relics as separate sheets.
   * @param {Object} templateInfo
   * @returns {boolean}
   */
  function detectLegacyThemesSheets(templateInfo) {
    mergeLegacyThemesSheets =
      templateInfo.some(
        (template) => template.sheetType === LEGACY_THEMES_SHEET_TYPE,
      ) &&
      templateInfo.some(
        (template) => template.sheetType === LEGACY_RELICS_SHEET_TYPE,
      );

    if (mergeLegacyThemesSheets) {
      console.log(
        `IDS Master is older than v4.0 - merging ${LEGACY_THEMES_SHEET_TYPE} and ${LEGACY_RELICS_SHEET_TYPE} into ${MERGED_THEMES_SHEET_TYPE}`,
      );
    }
    return mergeLegacyThemesSheets;
  }

  /**
   * Folds legacy Themes and Relics entries into the combined sheet type.
   * @param {Object} templateInfo
   * @returns {Object} The adjusted template info.
   */
  function mergeLegacyThemesTemplates(templateInfo) {
    if (!detectLegacyThemesSheets(templateInfo)) {
      return templateInfo;
    }

    const themesTemplate = templateInfo.find(
      (template) => template.sheetType === LEGACY_THEMES_SHEET_TYPE,
    );
    const relicsTemplate = templateInfo.find(
      (template) => template.sheetType === LEGACY_RELICS_SHEET_TYPE,
    );

    return templateInfo
      .filter(
        (template) =>
          template !== themesTemplate && template !== relicsTemplate,
      )
      .concat([
        {
          ...relicsTemplate,
          sheetType: MERGED_THEMES_SHEET_TYPE,
          merged: true,
          oldSheetIDs: [themesTemplate.oldSheetID, relicsTemplate.oldSheetID],
        },
      ]);
  }

  /**
   * Expands a merged template back into the sheets it stands for.
   * @param {Array<Object>} templateFiles
   * @returns {Array<Object>}
   */
  function expandMergedTemplateFiles(templateFiles) {
    if (!mergeLegacyThemesSheets) {
      return templateFiles;
    }

    return templateFiles.reduce((expanded, file) => {
      if (file.sheetType !== MERGED_THEMES_SHEET_TYPE) {
        expanded.push(file);
        return expanded;
      }
      expanded.push({ ...file, sheetType: LEGACY_THEMES_SHEET_TYPE });
      expanded.push({ ...file, sheetType: LEGACY_RELICS_SHEET_TYPE });
      return expanded;
    }, []);
  }

  /**
   * Collapses the tasks for merged sheets back into one import task.
   * @param {Array<Object>} tasks
   * @returns {Array<Object>}
   */
  function collapseMergedImportTasks(tasks) {
    if (!mergeLegacyThemesSheets) {
      return tasks;
    }

    const mergeSources = tasks.filter(
      (task) =>
        task.sheetType === LEGACY_THEMES_SHEET_TYPE ||
        task.sheetType === LEGACY_RELICS_SHEET_TYPE,
    );
    if (mergeSources.length === 0) {
      return tasks;
    }

    return tasks
      .filter((task) => !mergeSources.includes(task))
      .concat([
        {
          ...mergeSources[0],
          sheetType: MERGED_THEMES_SHEET_TYPE,

          oldSheetIDs: mergeSources.map((task) => task.oldSheetID),
          exportSources: mergeSources.map((task) => ({
            sheetType: task.sheetType,
            oldSheetID: task.oldSheetID,
            versionDifference: task.versionDifference,
          })),
        },
      ]);
  }

  /**
   * Reveals the file-access section.
   * @returns {void}
   */
  function showFileAccessSection() {
    var selectImportSection = document.getElementById("selectImportSection");
    var fileAccessSection = document.getElementById("fileAccessSection");
    selectImportSection.style.display = "none";
    fileAccessSection.style.display = "block";
    setStatusWithSpinner("Checking which files need access permissions...");
  }

  /**
   * Opens the picker so the user can grant another file.
   * @returns {Promise<void>}
   */
  async function addAnotherFile() {
    setStatusWithSpinner("Checking authorization...");
    document.getElementById("addAnotherButton").disabled = true;
    if (!accessToken) {
      setStatusText("Authorization failed. Cannot open picker.");
      return;
    }
    openMultiFilePicker();
  }

  /**
   * Entry point for the update workflow's export and import.
   * @returns {Promise<void>}
   */
  async function importData() {
    document.getElementById("importButton").disabled = true;
    document.getElementById("moveSheetButton").disabled = true;
    if (
      sheetType === "IDS Master" &&
      !isUpdateSingleSheetFlow &&
      hasSubsheetsToUpdate
    ) {
      const totalAvailableFiles =
        (copiedTemplateFiles || []).length +
        (importedFilesFailed || []).length +
        (exportedFilesFailed || []).length;
      if (totalAvailableFiles === 0) {
        setStatusText(
          "No copied sheets available for import. Please copy templates first.",
        );

        displayOperationResults();
        return;
      }

      if (isConvertToMasterFlow) {
        setStatusWithSpinner("Exporting IDS Collection data...");
        let exportResult;
        try {
          exportResult = await runAppsScript(
            "exportData",
            oldSheetID,
            "IDS Collection",
            versionDifference,
          );
        } catch (error) {
          document.getElementById("importButton").disabled = false;
          console.error("Export error:", error);
          AppError.show(error, {
            source: "importData",
            message: "Reading the data out of your sheet did not finish.",
          });
          return;
        }

        if (!exportResult || !exportResult.success) {
          document.getElementById("importButton").disabled = false;
          setStatusText(
            `Export failed: ${exportResult?.message || "Unknown export error"}`,
          );
          return;
        }

        const collectionData = exportResult.data || {};
        const allTemplateFiles = (copiedTemplateFiles || [])
          .concat(importedFilesFailed || [])
          .concat(exportedFilesFailed || []);

        copiedTemplateFiles = [];
        importedFilesFailed = [];
        exportedFilesFailed = [];
        exportedFilesSuccess = [];

        allTemplateFiles.forEach((file) => {
          const exportData = collectionData[file.sheetType];

          if (exportData !== undefined) {
            exportedFilesSuccess.push({
              ...file,
              exportData: exportData,
              sheetVisibility: exportResult.sheetVisibility,
            });
          } else {
            exportedFilesFailed.push({
              ...file,
              error: `No IDS Collection export data for ${file.sheetType}`,
            });
          }
        });

        if (exportedFilesSuccess.length === 0) {
          document.getElementById("importButton").disabled = false;
          setStatusText(
            "No data was successfully exported. Cannot proceed with import.",
          );
          displayOperationResults();
          return;
        }

        const importTasks = exportedFilesSuccess.map((file) => ({
          newSheetID: file.fileId,
          sheetType: file.sheetType,
        }));

        setStatusWithSpinner(
          `Importing data into ${importTasks.length} sheets...`,
        );
        await importAllData(importTasks);
        return;
      }

      const exportSourceLabel = isConvertToMasterFlow
        ? "IDS Collection"
        : "IDS Master";
      setStatusWithSpinner(
        `Preparing import from ${exportSourceLabel} for ${totalAvailableFiles} sheets...`,
      );

      try {
        const prepareResult = await runAppsScript(
          "prepareImportData",
          oldSheetID,
          expandMergedTemplateFiles(copiedTemplateFiles || []),
          expandMergedTemplateFiles(importedFilesFailed || []),
          expandMergedTemplateFiles(exportedFilesFailed || []),
        );
        await onprepareImportDataSuccess(prepareResult);
      } catch (error) {
        onprepareImportDataFailure(error);
      }
      return;
    } else if (sheetType === "IDS Collection" && isConvertToCollectionFlow) {
      setStatusWithSpinner("Preparing import for sheet...");
      const sheetTypes = [
        "Laboratory",
        "Workshop",
        "Ultimate Weapon",
        MERGED_THEMES_SHEET_TYPE,
        "Bots",
        "Vault",
        "Cards",
        "Modules",
        "Guardians",
        "Player & Stuff",
      ];
      sheetTypes.forEach((type) => {
        copiedTemplateFiles.push({
          sheetType: type,
          fileId: newSheetID,
        });
      });
      let result;
      try {
        result = await runAppsScript(
          "prepareImportData",
          oldSheetID,
          expandMergedTemplateFiles(copiedTemplateFiles),
        );
      } catch (error) {
        document.getElementById("importButton").disabled = false;
        console.error("Import preparation failed:", error);
        AppError.show(error, {
          source: "importData",
          message: "Preparing the import did not finish.",
        });
        return;
      }

      console.log("Import preparation result:", result);

      const rejected = recordPreparationFailures(result);

      if (!result.succeededTasks || result.succeededTasks.length === 0) {
        setStatusText(
          rejected.length > 0
            ? `${rejected.length} sheet(s) cannot be imported. Nothing else was prepared.`
            : "No valid import tasks prepared.",
        );
        displayOperationResults();
        return;
      }

      try {
        const exportTasks = collapseMergedImportTasks(result.succeededTasks);
        setStatusWithSpinner(
          `Exporting data from ${exportTasks.length} sheets...` +
            (rejected.length > 0
              ? ` (${rejected.length} cannot be imported)`
              : ""),
        );
        const exportResults = await exportAllData(exportTasks);

        console.log("Export results:", exportResults);

        if (exportResults.failedCount > 0) {
          console.warn(
            `${exportResults.failedCount} exports failed out of ${exportResults.totalTasks}`,
          );
        }

        if (exportedFilesSuccess.length === 0) {
          document.getElementById("importButton").disabled = false;
          setStatusText(
            "No data was successfully exported. Cannot proceed with import.",
          );
          return;
        }

        const exportedData = {};
        const sheetVisibilityData = {};
        exportedFilesSuccess.forEach((exportedFile) => {
          if (exportedFile.exportData && exportedFile.sheetType) {
            exportedData[exportedFile.sheetType] = exportedFile.exportData;
            if (exportedFile.sheetVisibility) {
              Object.assign(sheetVisibilityData, exportedFile.sheetVisibility);
            }
          }
        });

        setStatusWithSpinner(`Importing ${sheetType} data...`);
        try {
          const importResult = await runAppsScript(
            "importData",
            newSheetID,
            sheetType,
            exportedData,
            sheetVisibilityData,
            idMasterID,
          );
          await onImportSuccess(importResult);
        } catch (error) {
          onImportFailure(error);
        }
      } catch (error) {
        document.getElementById("importButton").disabled = false;
        AppError.show(error, {
          source: "importData",
          message: "The export did not finish.",
        });
      }
      return;
    }

    setStatusWithSpinner(`Exporting ${sheetType} data...`);
    try {
      const exportResult = await runAppsScript(
        "exportData",
        oldSheetID,
        sheetType,
        versionDifference,
      );
      if (exportResult.success) {
        setStatusWithSpinner(`Importing ${sheetType} data...`);

        try {
          const importResult = await runAppsScript(
            "importData",
            newSheetID,
            sheetType,
            exportResult.data,
            exportResult.sheetVisibility,
            idMasterID,
          );
          await onImportSuccess(importResult);
        } catch (error) {
          onImportFailure(error);
        }
      } else {
        document.getElementById("importButton").disabled = false;
        AppError.show(exportResult, { source: "importData" });
      }
    } catch (error) {
      document.getElementById("importButton").disabled = false;
      console.error("Export error:", error);
      AppError.show(error, {
        source: "importData",
        message: "Reading the data out of your sheet did not finish.",
      });
    }
  }

  /**
   * Records sheets whose import preparation failed, keeping each envelope.
   * @param {Object} result
   * @returns {void}
   */
  function recordPreparationFailures(result) {
    const failedTasks = result.failedTasks || [];
    if (failedTasks.length === 0) return [];

    const preparedTypes = new Set(
      (result.succeededTasks || []).map((task) => task.sheetType),
    );
    const reasonByType = {};
    failedTasks.forEach((task) => {
      if (task && task.sheetType) reasonByType[task.sheetType] = task;
    });

    const rejected = [];
    const partition = (files) =>
      (files || []).filter((file) => {
        const types = expandMergedTemplateFiles([file]).map((f) => f.sheetType);
        if (types.some((type) => preparedTypes.has(type))) return true;
        const failure = types.map((type) => reasonByType[type]).find(Boolean);
        if (!failure) return true;
        rejected.push({ ...file, error: failure.message });
        return false;
      });

    copiedTemplateFiles = partition(copiedTemplateFiles);
    importedFilesFailed = partition(importedFilesFailed);
    exportedFilesFailed = partition(exportedFilesFailed);
    preparationFailedFiles = preparationFailedFiles.concat(rejected);

    console.warn(
      `${failedTasks.length} task(s) failed during preparation:`,
      failedTasks,
    );
    return rejected;
  }

  /**
   * Continues once import preparation succeeded: exports, then imports.
   * @param {Object} result
   * @returns {Promise<void>}
   */
  async function onprepareImportDataSuccess(result) {
    console.log("Import preparation result:", result);

    const rejected = recordPreparationFailures(result);

    if (!result.succeededTasks || result.succeededTasks.length === 0) {
      const statusMessage =
        rejected.length > 0
          ? `${rejected.length} sheet(s) cannot be imported. Nothing else was prepared.`
          : "No valid import tasks prepared.";
      setStatusText(statusMessage);

      displayOperationResults();
      return;
    }

    try {
      const exportTasks = collapseMergedImportTasks(result.succeededTasks);
      setStatusWithSpinner(
        `Exporting data from ${
          exportTasks.length + (isCombinedUpdate ? 1 : 0)
        } sheets...` +
          (rejected.length > 0
            ? ` (${rejected.length} cannot be imported)`
            : ""),
      );

      const [exportResults, masterFile] = await Promise.all([
        exportAllData(exportTasks),
        isCombinedUpdate ? stageMasterExport() : Promise.resolve(null),
      ]);

      console.log("Export results:", exportResults);

      if (exportResults.failedCount > 0) {
        console.warn(
          `${exportResults.failedCount} exports failed out of ${exportResults.totalTasks}`,
        );
      }

      if (exportedFilesSuccess.length === 0) {
        document.getElementById("importButton").disabled = false;
        setStatusText("No data was exported. Cannot proceed with import.");
        return;
      }
      console.log(masterFile)

      if (masterFile) {
        masterFile.exportData = remapMasterIdsToNewSheets(masterFile.exportData);
      }

      const importTasks = exportedFilesSuccess.map((exportedFile) => ({
        newSheetID: exportedFile.fileId,
        sheetType: exportedFile.sheetType,
        exportData: exportedFile.exportData,
      }));

      setStatusWithSpinner(
        `Importing data into ${importTasks.length} sheets...`,
      );
      await importAllData(importTasks);

      if (isCombinedUpdate) {
        masterIdsWritten = importedFilesSuccess.some(
          (file) => file.sheetType === "IDS Master",
        );
      }
    } catch (error) {
      document.getElementById("importButton").disabled = false;
      AppError.show(error, {
        source: "onprepareImportDataSuccess",
        message: "The export and import did not finish.",
      });
    }
  }

  /**
   * Rewrites the IDS Master's exported IDs to point at the new sheets.
   * @param {Object} masterExportData
   * @returns {Object} The adjusted export data.
   */
  function remapMasterIdsToNewSheets(masterExportData) {
    const remapped = { ...(masterExportData || {}) };
    const oldIdsData = { ...(remapped.oldIdsData || {}) };

    expandMergedTemplateFiles(
      (exportedFilesSuccess || []).concat(importedFilesSuccess || []),
    ).forEach((file) => {
      if (!file.fileId || file.sheetType === "IDS Master") {
        return;
      }
      if (oldIdsData[file.sheetType] !== file.fileId) {
        console.log(
          `IDS Master: repointing ${file.sheetType} from ${
            oldIdsData[file.sheetType] || "(unset)"
          } to ${file.fileId}`,
        );
      }
      oldIdsData[file.sheetType] = file.fileId;
    });

    remapped.oldIdsData = oldIdsData;
    return remapped;
  }

  /**
   * Exports the IDS Master and holds it until the subsheets are in place.
   * @returns {Promise<Object>} The staged export.
   */
  async function stageMasterExport() {

    const compatibility = await runAppsScript(
      "checkExportCompatibility",
      oldSheetID,
      "IDS Master",
    );
    if (!compatibility || !compatibility.success) {
      console.error(
        "IDS Master export compatibility check failed:",
        compatibility && compatibility.message,
      );
      exportedFilesFailed.push({
        sheetType: "IDS Master",
        fileId: newSheetID,
        oldSheetID: oldSheetID,
        error:
          (compatibility && compatibility.message) ||
          "IDS Master is not compatible for export",
      });
      return null;
    }
    const masterExportVersion = compatibility.versionDifference;

    const exportResult = await runAppsScript(
      "exportData",
      oldSheetID,
      "IDS Master",
      masterExportVersion,
    );
    if (!exportResult || !exportResult.success) {
      console.error(
        "IDS Master export failed:",
        exportResult && exportResult.message,
      );
      exportedFilesFailed.push({
        sheetType: "IDS Master",
        fileId: newSheetID,
        oldSheetID: oldSheetID,
        error:
          (exportResult && exportResult.message) || "IDS Master export failed",
      });
      return null;
    }

    const masterFile = {
      sheetType: "IDS Master",
      fileId: newSheetID,
      oldSheetID: oldSheetID,
      version: cachedMasterTemplateInfo ? cachedMasterTemplateInfo.version : "",
      exportData: exportResult.data,
      sheetVisibility: exportResult.sheetVisibility,
    };
    exportedFilesSuccess.push(masterFile);

    return masterFile;
  }

  /**
   * Shows the panel when import preparation could not run.
   * @param {*} error
   * @returns {void}
   */
  function onprepareImportDataFailure(error) {
    document.getElementById("importButton").disabled = false;
    AppError.show(error, {
      source: "onprepareImportDataFailure",
      message: "Preparing the import did not finish.",
    });
    console.error("Import preparation failed:", error);
  }

  /**
   * Exports one sheet.
   * @param {Object} task
   * @returns {Promise<Object>} The export result.
   */
  async function runExportForTask(task) {
    const sources = task.exportSources || [
      {
        sheetType: task.sheetType,
        oldSheetID: task.oldSheetID,
        versionDifference: task.versionDifference,
      },
    ];

    const results = await Promise.all(
      sources.map((source) =>
        runAppsScript(
          "exportData",
          source.oldSheetID,
          source.sheetType,
          source.versionDifference,
        ),
      ),
    );

    if (results.length === 1) {
      return results[0];
    }

    const failedIndex = results.findIndex(
      (result) => !result || !result.success,
    );
    if (failedIndex !== -1) {
      const failed = results[failedIndex];
      return {
        success: false,
        message:
          (failed && failed.message) ||
          `Unknown error exporting ${sources[failedIndex].sheetType}`,
      };
    }

    const data = {};
    const sheetVisibility = {};
    results.forEach((result) => {
      Object.assign(data, result.data || {});
      Object.assign(sheetVisibility, result.sheetVisibility || {});
    });

    return { success: true, data: data, sheetVisibility: sheetVisibility };
  }

  /**
   * Exports every task in parallel, recording each failure's envelope.
   * @param {Array<Object>} exportTasks
   * @returns {Promise<{success: boolean, successCount: number, failedCount: number, totalTasks: number}>}
   */
  async function exportAllData(exportTasks) {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalTasks = exportTasks.length;

    try {
      console.log(`Starting ${totalTasks} exports`);

      const exportPromises = exportTasks.map((task, index) => {
        return new Promise((resolve) => {
          console.log(`Starting export for ${task.sheetType}`);

          runExportForTask(task).then(
            function (result) {
              completedCount++;
              if (result.success) {
                successCount++;
                console.log(
                  `✅ ${task.sheetType} export completed successfully`,
                );

                let exportedFile = null;
                let sourceArray = null;

                const copiedFileIndex = copiedTemplateFiles.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (copiedFileIndex !== -1) {
                  exportedFile = copiedTemplateFiles.splice(
                    copiedFileIndex,
                    1,
                  )[0];
                  sourceArray = "copy failed";
                } else {

                  const failedFileIndex = exportedFilesFailed.findIndex(
                    (f) => f.sheetType === task.sheetType,
                  );
                  if (failedFileIndex !== -1) {
                    exportedFile = exportedFilesFailed.splice(
                      failedFileIndex,
                      1,
                    )[0];
                    sourceArray = "export failed";
                  } else {

                    const importedFileIndex = importedFilesFailed.findIndex(
                      (f) => f.sheetType === task.sheetType,
                    );
                    if (importedFileIndex !== -1) {
                      exportedFile = importedFilesFailed.splice(
                        importedFileIndex,
                        1,
                      )[0];
                      sourceArray = "import failed";
                    }
                  }
                }

                if (exportedFile) {
                  exportedFilesSuccess.push({
                    ...exportedFile,
                    oldSheetID: task.oldSheetID,
                    oldSheetIDs: task.oldSheetIDs,
                    idMasterID: task.idMasterID,
                    exportData: result.data,
                    sheetVisibility: result.sheetVisibility,
                  });
                  console.log(
                    `Moved ${task.sheetType} from ${sourceArray} to exported success`,
                  );
                } else {
                  console.warn(
                    `Could not find ${task.sheetType} in either copiedTemplateFiles or exportedFilesFailed`,
                  );
                }
              } else {
                failedCount++;
                console.error(
                  `❌ ${task.sheetType} export failed:`,
                  result.message,
                );

                const copiedFileIndex = copiedTemplateFiles.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (copiedFileIndex !== -1) {
                  const failedFile = copiedTemplateFiles.splice(
                    copiedFileIndex,
                    1,
                  )[0];
                  exportedFilesFailed.push({
                    ...failedFile,
                    error: result.message || "Export failed",
                    envelope: result,
                    oldSheetID: task.oldSheetID,
                    idMasterID: task.idMasterID,
                  });
                  console.log(
                    `Moved ${task.sheetType} from copied to export failed with error: ${result.message}`,
                  );
                } else {

                  const failedFileIndex = exportedFilesFailed.findIndex(
                    (f) => f.sheetType === task.sheetType,
                  );
                  if (failedFileIndex !== -1) {
                    exportedFilesFailed[failedFileIndex].error =
                      result.message || "Export failed";

                    exportedFilesFailed[failedFileIndex].envelope = result;
                    console.log(
                      `Updated error for ${task.sheetType} in export failed list: ${result.message}`,
                    );
                  }
                }
              }

              setStatusWithSpinner(
                `Export progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                ...result,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            },
            function (error) {
              completedCount++;
              failedCount++;
              console.error(`❌ ${task.sheetType} export error:`, error);

              const copiedFileIndex = copiedTemplateFiles.findIndex(
                (f) => f.sheetType === task.sheetType,
              );
              if (copiedFileIndex !== -1) {
                const failedFile = copiedTemplateFiles.splice(
                  copiedFileIndex,
                  1,
                )[0];
                exportedFilesFailed.push({
                  ...failedFile,
                  error: error.message || error,
                  envelope: error,
                  oldSheetID: task.oldSheetID,
                  idMasterID: task.idMasterID,
                });
                console.log(
                  `Moved ${
                    task.sheetType
                  } from copied to export failed with error: ${
                    error.message || error
                  }`,
                );
              } else {

                const failedFileIndex = exportedFilesFailed.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (failedFileIndex !== -1) {
                  exportedFilesFailed[failedFileIndex].error =
                    error.message || error;

                  exportedFilesFailed[failedFileIndex].envelope = error;
                  console.log(
                    `Updated error for ${
                      task.sheetType
                    } in export failed list: ${error.message || error}`,
                  );
                }
              }

              setStatusWithSpinner(
                `Export progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                success: false,
                message: error.message || error,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            },
          );
        });
      });

      const results = await Promise.all(exportPromises);

      return {
        success: failedCount === 0,
        totalTasks,
        successCount,
        failedCount,
        results,
      };
    } catch (error) {
      AppError.log(error, "exportAllData: Error in export execution");
      throw error;
    }
  }

  /**
   * Imports every exported sheet in parallel, then raises the panel for the
   * first failure that is a defect and logs the rest.
   * @param {Array<Object>} importTasks
   * @returns {Promise<void>}
   */
  async function importAllData(importTasks) {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalTasks = importTasks.length;

    try {
      console.log(`Starting ${totalTasks} imports`);

      const importPromises = importTasks.map((task, index) => {
        return new Promise((resolve) => {
          console.log(`Starting import for ${task.sheetType}`);

          const exportedFile = exportedFilesSuccess.find(
            (f) => f.sheetType === task.sheetType,
          );
          if (!exportedFile || !exportedFile.exportData) {
            completedCount++;
            failedCount++;
            const errorMessage = `No exported data found for ${task.sheetType}`;
            console.error(`❌ ${errorMessage}`);

            setStatusWithSpinner(
              `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
            );

            resolve({
              success: false,
              message: errorMessage,
              sheetType: task.sheetType,
              taskIndex: index,
            });
            return;
          }

          google.script.run
            .withSuccessHandler(function (result) {
              completedCount++;
              if (result.success) {
                successCount++;
                console.log(
                  `✅ ${task.sheetType} import completed successfully`,
                );

                const exportedFileIndex = exportedFilesSuccess.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (exportedFileIndex !== -1) {
                  const importedFile = exportedFilesSuccess.splice(
                    exportedFileIndex,
                    1,
                  )[0];

                  const { exportData, ...fileWithoutExportData } = importedFile;
                  importedFilesSuccess.push(fileWithoutExportData);
                  console.log(
                    `Moved ${task.sheetType} from exported success to imported success`,
                  );
                } else {
                  console.warn(
                    `Could not find ${task.sheetType} in exportedFilesSuccess after successful import`,
                  );
                }
              } else {
                failedCount++;
                console.error(
                  `❌ ${task.sheetType} import failed:`,
                  result.message,
                );

                const exportedFileIndex = exportedFilesSuccess.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (exportedFileIndex !== -1) {
                  const failedFile = exportedFilesSuccess.splice(
                    exportedFileIndex,
                    1,
                  )[0];

                  const { exportData, ...fileWithoutExportData } = failedFile;
                  importedFilesFailed.push({
                    ...fileWithoutExportData,
                    error: result.message || "Import failed",
                    envelope: result,
                  });
                  console.log(
                    `Moved ${task.sheetType} from exported success to imported failed with error: ${result.message}`,
                  );
                } else {
                  console.warn(
                    `Could not find ${task.sheetType} in exportedFilesSuccess for failure handling`,
                  );
                }
              }

              setStatusWithSpinner(
                `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                ...result,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            })
            .withFailureHandler(function (error) {
              completedCount++;
              failedCount++;
              console.error(`❌ ${task.sheetType} import error:`, error);

              const exportedFileIndex = exportedFilesSuccess.findIndex(
                (f) => f.sheetType === task.sheetType,
              );
              if (exportedFileIndex !== -1) {
                const failedFile = exportedFilesSuccess.splice(
                  exportedFileIndex,
                  1,
                )[0];

                const { exportData, ...fileWithoutExportData } = failedFile;
                importedFilesFailed.push({
                  ...fileWithoutExportData,
                  error: error.message || error,
                  envelope: error,
                });
                console.log(
                  `Moved ${
                    task.sheetType
                  } from exported success to imported failed with error: ${
                    error.message || error
                  }`,
                );
              } else {
                console.warn(
                  `Could not find ${task.sheetType} in exportedFilesSuccess for error handling`,
                );
              }

              setStatusWithSpinner(
                `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                success: false,
                message: error.message || error,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            })
            .importData(
              task.newSheetID,
              task.sheetType,
              exportedFile.exportData,
              exportedFile.sheetVisibility,
              idMasterID,
            );
        });
      });

      const results = await Promise.all(importPromises);

      let finalMessage;
      let titleText;

      if (failedCount === 0) {
        finalMessage = `🎉 All ${totalTasks} sheet imports completed successfully!`;
        titleText = `✅ Copied Sheets Imported (${successCount}/${totalTasks})`;
      } else if (successCount === 0) {
        finalMessage = `❌ All ${totalTasks} sheet imports failed.`;
        titleText = `❌ Copied Sheet Import Failed (0/${totalTasks})`;
      } else {
        finalMessage = `⚠️ Imports completed: ${successCount} successful, ${failedCount} failed.`;
        titleText = `⚠️ Sheets Partial Import (${successCount}/${totalTasks})`;
      }

      setStatusText(finalMessage);
      document.getElementById("fileAccessTitle").innerHTML = titleText;

      displayOperationResults();
      if (failedCount > 0) surfaceFailureIfBug("importAllData");

      console.log("Import results:", results);
      console.log("Remaining copiedTemplateFiles:", copiedTemplateFiles);
      console.log("Remaining exportedFilesSuccess:", exportedFilesSuccess);
      console.log("Remaining exportedFilesFailed:", exportedFilesFailed);
      console.log("Remaining importedFilesSuccess:", importedFilesSuccess);
      console.log("Remaining importedFilesFailed:", importedFilesFailed);
    } catch (error) {
      AppError.show(error, {
        source: "importAllData",
        message: "Importing your data did not finish.",
      });
      document.getElementById("importButton").disabled = false;
    }
  }

  /**
   * Continues once a single-sheet import succeeded.
   * @param {Object} result
   * @returns {Promise<void>}
   */
  async function onImportSuccess(result) {
    console.log("Import result:", result);

    const importButton = document.getElementById("importButton");
    const moveSheetButton = document.getElementById("moveSheetButton");
    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const selectedFileSummary = document.getElementById("selectedFileSummary");

    importButton.disabled = false;

    if (result.success) {
      setStatusText(`${result.message}`);
      fileAccessTitle.innerHTML = `✅ ${sheetType} Imported Successfully`;

      moveSheetButton.disabled = false;

      selectedFileSummary.innerHTML = `<strong>⚠️ Make sure your data is imported correctly before ${
        sheetType === "IDS Collection"
          ? "moving your IDS Collection"
          : sheetType === "Effective Paths"
            ? "moving your Effective Paths"
            : sheetType === "IDS Master"
              ? "moving your IDS Master"
              : "updating your IDS Master"
      }! ⚠️</strong><br>`;
      if (sheetType === "Effective Paths") {
        selectedFileSummary.innerHTML += `<strong>⚠️ If the sheet shows errors after a minute, try refreshing the page. ⚠️</strong><br>`;
      }
      selectedFileSummary.innerHTML += `<a href="${googleLink}/${newSheetID}/edit" target="_blank" style="margin-left: 2em">📋 Open ${sheetType} Sheet™</a><br>`;
      selectedFileSummary.innerHTML += `<br><strong>✅ Successfully Imported ${sheetType} (Ready to be moved and renamed):</strong><br>`;

  /**
   * Moves the new sheet into place and trashes the old one.
   * @returns {void}
   */
  function moveSheet() {

    if (
      sheetType === "IDS Master" &&
      !isUpdateSingleSheetFlow &&
      importedFilesSuccess.length > 0
    ) {
      document.getElementById("importButton").disabled = true;
      document.getElementById("moveSheetButton").disabled = true;

      if (isCombinedUpdate) {

        const idsMasterExists = importedFilesSuccess.some(
          (file) => file.sheetType === sheetType && file.fileId === newSheetID,
        );
        if (!idsMasterExists) {
          importedFilesSuccess.push({
            sheetType: sheetType,
            fileId: newSheetID,
            oldSheetID: oldSheetID,
            version: cachedMasterTemplateInfo
              ? cachedMasterTemplateInfo.version
              : "",
          });
          console.log(
            `Combined update: Added IDS Master to importedFilesSuccess for batch processing`,
          );
        } else {
          console.log(
            `Combined update: IDS Master already exists in importedFilesSuccess, skipping duplicate`,
          );
        }
      }
      console.log(
        `Calling moveMultipleSheets for IDS Master with ${importedFilesSuccess.length} imported files`,
      );

      moveMultipleSheets();
      return;
    }

    document.getElementById("importButton").disabled = true;
    document.getElementById("moveSheetButton").disabled = true;
    setStatusWithSpinner(`Moving and renaming new ${sheetType} file...`);

    console.log(
      `Calling moveSheet -> sheetType: ${sheetType}, newSheetID: ${newSheetID}, oldSheetID: ${oldSheetID}`,
    );

    google.script.run
      .withSuccessHandler(onmoveSheetSuccess)
      .withFailureHandler(onmoveSheetFailure)
      .moveSheet(sheetType, newSheetID, oldSheetID);
  }

  /**
   * Moves every updated sheet into place and updates the IDS Master.
   * @returns {Promise<void>}
   */
  async function moveMultipleSheets() {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalUpdates = importedFilesSuccess.length;

    try {
      if (totalUpdates > 0) {
        console.log(`Starting ${totalUpdates} sheet updates`);

        setStatusWithSpinner(
          `Processing ${importedFilesSuccess.length} imported files...`,
        );

        const movePromises = importedFilesSuccess.map((file, index) => {
          return new Promise((resolve) => {
            console.log(`Starting update for ${file.sheetType}`);

            const moveMethod = isConvertToMasterFlow
              ? "moveConvertedSheet"
              : "moveSheet";
            const oldIdForMove = isConvertToMasterFlow
              ? oldSheetID
              : file.oldSheetID;

            google.script.run
              .withSuccessHandler(function (result) {
                completedCount++;
                if (result.success) {
                  successCount++;
                  console.log(
                    `✅ ${file.sheetType} update completed successfully`,
                  );

                  if (file.fileId !== idMasterID) {

                    movedFiles.push({
                      ...file,
                      updateResult: result,
                    });
                  } else {
                    console.log(
                      `Skipping adding IDS Master (${file.sheetType}) to movedFiles as it matches idMasterID`,
                    );
                  }
                } else {
                  failedCount++;
                  console.error(
                    `❌ ${file.sheetType} update failed:`,
                    result.message,
                  );
                }

                setStatusWithSpinner(
                  `Moving progress: ${completedCount}/${totalUpdates} completed (${successCount} successful, ${failedCount} failed)`,
                );

                resolve({
                  ...result,
                  sheetType: file.sheetType,
                  newSheetID: file.fileId,
                  updateIndex: index,
                  fileData: file,
                });
              })
              .withFailureHandler(function (error) {
                completedCount++;
                failedCount++;
                console.error(`❌ ${file.sheetType} update error:`, error);

                setStatusWithSpinner(
                  `Moving progress: ${completedCount}/${totalUpdates} completed (${successCount} successful, ${failedCount} failed)`,
                );

                resolve({
                  success: false,
                  message: error.message || error,
                  sheetType: file.sheetType,
                  newSheetID: file.fileId,
                  updateIndex: index,
                  fileData: file,
                });
              })
              [moveMethod](
                file.sheetType,
                file.fileId,
                oldIdForMove,
                file.oldSheetIDs || [],
              );
          });
        });

        const moveResults = await Promise.all(movePromises);

        const successfulResults = moveResults.filter(
          (result) => result.success,
        );

        for (let i = importedFilesSuccess.length - 1; i >= 0; i--) {
          const file = importedFilesSuccess[i];
          const successfulResult = successfulResults.find(
            (result) => result.sheetType === file.sheetType,
          );
          if (successfulResult) {

            const removedFile = importedFilesSuccess.splice(i, 1)[0];

            if (
              !movedFiles.find((f) => f.sheetType === removedFile.sheetType) &&
              removedFile.fileId !== idMasterID
            ) {
              movedFiles.push({
                ...removedFile,
                updateResult: successfulResult,
              });
            }
          }
        }
        console.log("Move results:", moveResults);
      }

      let finalMessage;
      let titleText;
      const totalSuccessCount = movedFiles.length;
      const totalAllCount = importedFilesSuccess.length + movedFiles.length;
      if (failedCount === 0) {
        titleText = `✅ Moved & renamed sheets (${totalSuccessCount}/${totalAllCount})`;
      } else if (totalSuccessCount === 0) {
        titleText = `❌ Failed to move & rename sheets (0/${totalAllCount})`;
      } else {
        titleText = `⚠️ Partially moved & renamed sheets (${totalSuccessCount}/${totalAllCount})`;
      }

      setStatusWithSpinner(
        `Updating IDS Master with ${movedFiles.length} moved files...`,
      );
      document.getElementById("fileAccessTitle").innerHTML = titleText;

      var idDataEntries = movedFiles.map((file) => ({
        sheetType: file.sheetType,
        newSheetID: file.fileId,
      }));

      if (
        cachedTemplatesWithSameVersion &&
        cachedTemplatesWithSameVersion.length > 0
      ) {
        console.log(
          `Processing ${cachedTemplatesWithSameVersion.length} templates with same versions for IDS Master update`,
        );

        cachedTemplatesWithSameVersion.forEach((template) => {

          const existingEntry = idDataEntries.find(
            (entry) => entry.newSheetID === template.oldSheetID,
          );
          if (!existingEntry) {
            idDataEntries.push({
              sheetType: template.sheetType,
              newSheetID: template.oldSheetID,
            });
            console.log(
              `Added ${template.sheetType} (${template.oldSheetID}) to IDS Master update`,
            );
          } else {
            console.log(
              `Skipped ${template.sheetType} (${template.oldSheetID}) - already exists in IDS Master update`,
            );
          }
        });

        console.log(
          `Total entries for IDS Master update: ${idDataEntries.length}`,
        );
      }

      const updateIdsMasterResult = masterIdsWritten
        ? await runAppsScript("getIdsMasterGid", idMasterID)
        : await runAppsScript("updateIdsMaster", idMasterID, idDataEntries);

      if (!updateIdsMasterResult) {
        setStatusText(`Error updating IDS Master: No result returned`);
        document.getElementById("fileAccessTitle").innerHTML =
          `❌ IDS Master Update Failed`;
        document.getElementById("importButton").disabled = false;
        document.getElementById("moveSheetButton").disabled = false;
        return;
      }
      let gid = updateIdsMasterResult.gid || "";
      if (!updateIdsMasterResult.success) {
        finalMessage = `Error updating IDS Master: ${
          updateIdsMasterResult.message || "Unknown error"
        }`;
        titleText = `❌ IDS Master Update Failed (${totalSuccessCount}/${totalAllCount} files moved)`;
      } else {
        if (isConvertToMasterFlow && failedCount === 0) {
          try {
            await runAppsScript("deleteOldSheet", oldSheetID);
          } catch (error) {
            AppError.log(error, "moveMultipleSheets: Failed to delete old IDS Collection");
          }
        }
        if (failedCount === 0) {
          finalMessage = `🎉 All ${totalAllCount} sheet updates completed successfully!`;
          document.getElementById("importButton").style.display = "none";
          document.getElementById("moveSheetButton").style.display = "none";
        } else if (totalSuccessCount === 0) {
          finalMessage = `❌ All ${totalAllCount} sheet updates failed.`;
        } else {
          finalMessage = `⚠️ Updates completed: ${totalSuccessCount} successful, ${failedCount} failed.`;
        }
        titleText = `✅ IDS Master Updated (${totalSuccessCount}/${totalAllCount})`;

        if (
          cachedTemplatesWithSameVersion &&
          cachedTemplatesWithSameVersion.length > 0
        ) {
          console.log(
            `Updating master IDs for ${cachedTemplatesWithSameVersion.length} templates with same versions...`,
          );
          setStatusWithSpinner(
            `IDS Master updated. Updating master IDs in ${cachedTemplatesWithSameVersion.length} subsheets...`,
          );

          const updatePromises = cachedTemplatesWithSameVersion.map(
            (template, index) => {
              console.log(
                `Updating sheet ID for ${template.sheetType} template (${
                  index + 1
                }/${cachedTemplatesWithSameVersion.length})`,
              );

              return new Promise((resolve) => {
                google.script.run
                  .withSuccessHandler(function (updateResult) {
                    console.log(
                      `✅ Sheet ID updated successfully for ${template.sheetType}:`,
                      updateResult,
                    );
                    resolve({
                      success: true,
                      template: template,
                      result: updateResult,
                    });
                  })
                  .withFailureHandler(function (error) {
                    console.error(
                      `❌ Failed to update sheet ID for ${template.sheetType}:`,
                      error,
                    );
                    resolve({
                      success: false,
                      template: template,
                      error: error,
                    });
                  })
                  .updateSheetID(
                    template.oldSheetID,
                    idMasterID,
                    template.sheetType,
                  );
              });
            },
          );

          try {
            const updateResults = await Promise.all(updatePromises);
            const successResults = updateResults.filter((r) => r.success);
            const failResults = updateResults.filter((r) => !r.success);

            cachedTemplatesWithSameVersion = failResults.map((r) => r.template);
          } catch (error) {
            AppError.log(error, "moveMultipleSheets: Error updating master IDs");
          }
        }
      }

      setStatusText(finalMessage);
      document.getElementById("fileAccessTitle").innerHTML = titleText;

      document.getElementById("importButton").disabled = false;

      displayOperationResults(gid, updateIdsMasterResult.success);

      console.log("Successfully movedFiles:", movedFiles);
      console.log("Remaining importedFilesSuccess:", importedFilesSuccess);
    } catch (error) {
      AppError.show(error, {
        source: "moveMultipleSheets",
        message: "Updating your sheets did not finish.",
      });
      document.getElementById("importButton").disabled = false;
      document.getElementById("moveSheetButton").disabled = false;
    }
  }

  /**
   * Raises the panel for the first import or export failure that is a defect,
   * and logs every other one.
   * @param {string} source
   * @returns {Object|null} The shown error, or null when none was a defect.
   */
  function surfaceFailureIfBug(source) {

    return AppError.surfaceBatch(
      [].concat(importedFilesFailed || [], exportedFilesFailed || []),
      { source: source },
    );
  }

  /**
   * Escapes a string for the results summary markup.
   * @param {*} str
   * @returns {string}
   */
  function escapeSummaryHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /**
   * One row of the results summary.
   * @param {Object} file
   * @param {string} [reason]
   * @returns {string} Row markup.
   */
  function summaryFileRow(file, reason) {
    const label = `Copy of ${file.sheetType} ${file.version}`;
    const link = file.fileId
      ? `<a href="${googleLink}/${file.fileId}/edit" target="_blank">${label}</a>`
      : label;
    return `&nbsp;&nbsp;• ${link}${
      reason ? ` - ${escapeSummaryHtml(reason)}` : ""
    }<br>`;
  }

  /**
   * Renders the per-sheet results lists for the finished operation.
   * @param {number} [gid] Grid id to link the new sheet to.
   * @param {boolean} [idsMasterUpdated]
   * @returns {void}
   */
  function displayOperationResults(gid, idsMasterUpdated = false) {
    let summaryHtml = "";

    if (importedFilesSuccess && importedFilesSuccess.length > 0) {
      document.getElementById("importButton").disabled = true;
      summaryHtml += `<strong>⚠️ Make sure your data is imported correctly before ${
        sheetType === "IDS Collection"
          ? "moving your IDS Collection"
          : sheetType === "Effective Paths"
            ? "moving your Effective Paths"
            : sheetType === "IDS Master" && isUpdateSingleSheetFlow
              ? "moving your IDS Master"
              : sheetType !== "IDS Master"
                ? `moving your ${sheetType}`
                : "moving your subsheets"
      }! ⚠️</strong><br>`;
    }

    if (idsMasterUpdated) {
      let masterLabel = "IDS Master";
      let epLabel = "";
      if (cachedMasterTemplateInfo) {
        masterLabel =
          '<strong style="color:#fff;background:#e53935;padding:0 0.4em;border-radius:0.3em;">new</strong> IDS Master';
          epLabel = ` <strong>⚠️ Remember to update Effective Path to use your new IDS Master ⚠️</strong><br>`;
      }
      summaryHtml += `<strong>🔄 Please go to your ${masterLabel} and grant the new sheet(s) access.</strong>`;
      summaryHtml += `<br><a href="${googleLink}/${idMasterID}/edit#gid=${gid}" target="_blank" style="margin-left: 2em"> Open your IDS Master sheet™.</a><br>`;
      summaryHtml += `${epLabel}`;
    }

    if (!idsMasterUpdated && sheetType === "IDS Master" && isCombinedUpdate) {
      if (newSheetID) {
        summaryHtml += `<strong>📄 New IDS Master (copy):</strong><br>`;
        summaryHtml += `&nbsp;&nbsp;• <a href="${googleLink}/${newSheetID}/edit" target="_blank">Open IDS Master Sheet™</a><br>`;
        summaryHtml += `<strong>⚠️ Remember to update your Effective Paths to use the new IDS Master! ⚠️</strong><br>`;
      }
    }

    if (copiedTemplateFiles && copiedTemplateFiles.length > 0) {
      document.getElementById("importButton").disabled = false;
      summaryHtml += `<br><strong>📋 Sheets (Ready for Import):</strong><br>`;
      copiedTemplateFiles.forEach((file) => {
        summaryHtml += summaryFileRow(file);
      });
    }

    if (exportedFilesFailed && exportedFilesFailed.length > 0) {
      document.getElementById("importButton").disabled = false;
      summaryHtml += `<br><strong>❌ Export Failed (Requires Retry):</strong><br>`;
      exportedFilesFailed.forEach((file) => {
        summaryHtml += summaryFileRow(file, file.error || "Export failed");
      });
    }

    if (importedFilesFailed && importedFilesFailed.length > 0) {
      document.getElementById("importButton").disabled = false;
      summaryHtml += `<br><strong>❌ Import Failed (Requires Retry):</strong><br>`;
      importedFilesFailed.forEach((file) => {
        summaryHtml += summaryFileRow(file, file.error || "Import failed");
      });
    }

    if (preparationFailedFiles && preparationFailedFiles.length > 0) {
      summaryHtml += `<br><strong>⛔ Cannot Be Imported:</strong><br>`;
      preparationFailedFiles.forEach((file) => {
        summaryHtml += summaryFileRow(
          file,
          file.error || "Preparation failed",
        );
      });
      summaryHtml += `&nbsp;&nbsp;<em>The copies above were created but left empty. You can delete them.</em><br>`;
    }

    if (importedFilesSuccess && importedFilesSuccess.length > 0) {
      summaryHtml += `<br><strong>✅ Successfully Imported Sheets (Ready to be moved and renamed):</strong><br>`;
      importedFilesSuccess.forEach((file) => {
        summaryHtml += summaryFileRow(file);
      });
    }

    if (movedFiles && movedFiles.length > 0) {
      summaryHtml += `<br><strong>🎉 Successfully moved & renamed:</strong><br>`;
      movedFiles.forEach((file) => {
        const displayName =
          file.updateResult && file.updateResult.newName
            ? file.updateResult.newName
            : `Updated Copy of ${file.sheetType} ${file.version}`;

        if (file.fileId) {
          summaryHtml += `&nbsp;&nbsp;• <a href="${googleLink}/${file.fileId}/edit" target="_blank">${displayName}</a><br>`;
        } else {
          summaryHtml += `&nbsp;&nbsp;• ${displayName}<br>`;
        }
      });

      if (
        cachedTemplatesWithSameVersion &&
        cachedTemplatesWithSameVersion.length > 0
      ) {
        summaryHtml += `<br><strong>⚠️ Existing subsheets that failed to get new IDS Master ID (need manual update):</strong><br>`;
        cachedTemplatesWithSameVersion.forEach((template) => {

          if (template.oldSheetID) {
            summaryHtml += `&nbsp;&nbsp;• <a href="${googleLink}/${template.oldSheetID}/edit" target="_blank">${template.sheetType} Sheet™</a><br>`;
          } else {
            summaryHtml += `&nbsp;&nbsp;• ${template.sheetType} Sheet™<br>`;
          }
        });
      }
    }

    const moveSheetButton = document.getElementById("moveSheetButton");
    if (moveSheetButton) {
      moveSheetButton.disabled = !(
        importedFilesSuccess && importedFilesSuccess.length > 0
      );
    }

    document.getElementById("selectedFileSummary").innerHTML = summaryHtml;
  }

  /**

      if (sheetType === "IDS Master") {

        if (
          cachedTemplatesWithSameVersion &&
          cachedTemplatesWithSameVersion.length > 0
        ) {
          console.log(
            `IDS Master moved successfully. Updating sheet IDs for ${cachedTemplatesWithSameVersion.length} templates with same versions...`,
          );

          setStatusWithSpinner(
            `IDS Master moved successfully. Updating Master ID in subsheets...`,
          );

          let completedCount = 0;
          let successCount = 0;

          const updatePromises = cachedTemplatesWithSameVersion.map(
            (template, index) => {
              console.log(
                `Updating sheet ID for ${template.sheetType} template (${
                  index + 1
                }/${cachedTemplatesWithSameVersion.length})`,
              );

              return new Promise((resolve) => {
                google.script.run
                  .withSuccessHandler(function (updateResult) {
                    completedCount++;
                    successCount++;
                    console.log(
                      `✅ Sheet ID updated successfully for ${template.sheetType}:`,
                      updateResult,
                    );

                    setStatusWithSpinner(
                      `Updating Master IDs: ${completedCount}/${cachedTemplatesWithSameVersion.length} completed (${successCount} successful)`,
                    );

                    resolve({
                      success: true,
                      template: template,
                      result: updateResult,
                    });
                  })
                  .withFailureHandler(function (error) {
                    completedCount++;
                    console.error(
                      `❌ Failed to update sheet ID for ${template.sheetType}:`,
                      error,
                    );

                    setStatusWithSpinner(
                      `Updating Master IDs: ${completedCount}/${cachedTemplatesWithSameVersion.length} completed (${successCount} successful)`,
                    );

                    resolve({
                      success: false,
                      template: template,
                      error: error,
                    });
                  })
                  .updateSheetID(
                    template.oldSheetID,
                    newSheetID,
                    template.sheetType,
                  );
              });
            },
          );

          try {
            const updateResults = await Promise.all(updatePromises);
            const successResults = updateResults.filter((r) => r.success);
            const failResults = updateResults.filter((r) => !r.success);

            cachedTemplatesWithSameVersion = failResults.map((r) => r.template);

            console.log(
              `Sheet ID updates completed - ${successResults.length} successful, ${failResults.length} failed`,
            );
            console.log(
              `Removed ${successResults.length} successful templates from cache. ${cachedTemplatesWithSameVersion.length} templates remaining.`,
            );
          } catch (error) {
            AppError.log(error, "onmoveSheetSuccess: Error waiting for sheet ID updates");
          }
        }

        setStatusText(result.message);
        document.getElementById("fileAccessTitle").innerHTML =
          `✅ IDS Master updated successfully!`;

        let summaryHtml = `<strong>🎉 IDS Master updated successfully!</strong><br><strong>⚠️ Update your master ID in Effective Paths ⚠️</strong>`;
        summaryHtml += `<br><a href="${googleLink}/${newSheetID}/edit" target="_blank" style="margin-left: 2em">📋 Open your new IDS Master sheet™</a><br>`;

        if (
          cachedTemplatesWithSameVersion &&
          cachedTemplatesWithSameVersion.length > 0
        ) {
          summaryHtml += `<br><br><strong>⚠️ Failed to update Master ID in existing subsheets:</strong><br>`;
          cachedTemplatesWithSameVersion.forEach((template) => {
            if (template.oldSheetID) {
              summaryHtml += `&nbsp;&nbsp;• <a href="${googleLink}/${template.oldSheetID}/edit" target="_blank">${template.sheetType} Sheet™</a><br>`;
            } else {
              summaryHtml += `&nbsp;&nbsp;• ${template.sheetType} Sheet™<br>`;
            }
          });
        }

        document.getElementById("selectedFileSummary").innerHTML = summaryHtml;
        isConvertToMasterFlow = false;
      } else if (sheetType === "IDS Collection") {

        if (cachedSheetIds && cachedSheetIds.length > 0) {
          console.log(
            `IDS Collection updated successfully. Checking ${cachedSheetIds.length} cached sheet IDs for cleanup...`,
          );

          const sheetsToDelete = cachedSheetIds.filter(
            (sheetId) =>
              sheetId && sheetId !== oldSheetID && sheetId !== newSheetID,
          );

          if (sheetsToDelete.length > 0) {
            setStatusWithSpinner(
              `${result.message} Cleaning up ${sheetsToDelete.length} old subsheets...`,
            );
            document.getElementById("fileAccessTitle").innerHTML =
              `✅ IDS Collection updated! Cleaning up subsheets...`;

            await deleteImportedSubsheets(sheetsToDelete);

        document.getElementById("selectedFileSummary").innerHTML =

      } else if (sheetType === "Effective Paths") {

        document.getElementById("fileAccessTitle").innerHTML =

  /**
   * Trashes the subsheets that were merged into an IDS Collection.
   * @param {string[]} sheetIds
   * @returns {Promise<number>} How many were deleted.
   */
  async function deleteImportedSubsheets(sheetIds) {
    let deletedCount = 0;
    let failedDeletions = [];
    const totalDeletions = sheetIds.length;

    try {
      console.log(`Starting deletion of ${totalDeletions} subsheets`);

      const deletionPromises = sheetIds.map((sheetId, index) => {
        return new Promise((resolve) => {
          console.log(`Starting deletion of sheet ID: ${sheetId}`);

          google.script.run
            .withSuccessHandler(function (result) {
              if (result.success) {
                deletedCount++;
                console.log(`✅ Sheet ${sheetId} deleted successfully`);
              } else {
                failedDeletions.push({
                  sheetId: sheetId,
                  error: result.message,
                });
                console.error(
                  `❌ Sheet ${sheetId} deletion failed:`,
                  result.message,
                );
              }

              setStatusWithSpinner(
                `Cleanup progress: ${
                  deletedCount + failedDeletions.length
                }/${totalDeletions} processed (${deletedCount} deleted)`,
              );

              resolve({
                ...result,
                sheetId: sheetId,
              });
            })
            .withFailureHandler(function (error) {
              failedDeletions.push({
                sheetId: sheetId,
                error: error.message || error,
              });
              console.error(`❌ Sheet ${sheetId} deletion error:`, error);

              setStatusWithSpinner(
                `Cleanup progress: ${
                  deletedCount + failedDeletions.length
                }/${totalDeletions} processed (${deletedCount} deleted)`,
              );

              resolve({
                success: false,
                message: error.message || error,
                sheetId: sheetId,
              });
            })
            .deleteOldSheet(sheetId);
        });
      });

      await Promise.all(deletionPromises);

      if (failedDeletions.length === 0) {
        setStatusText(
          `✅ IDS Collection updated and ${deletedCount} subsheets cleaned up successfully!`,
        );
        document.getElementById("fileAccessTitle").innerHTML =
          `✅ IDS Collection updated! All subsheets cleaned up!`;
      } else {
        setStatusText(
          `✅ IDS Collection updated! ${deletedCount} subsheets cleaned up, ${failedDeletions.length} failed to delete.`,
        );
        document.getElementById("fileAccessTitle").innerHTML =
          `✅ IDS Collection updated! Partial cleanup completed.`;

        console.warn("Some subsheets failed to delete:", failedDeletions);
      }
    } catch (error) {
      AppError.log(error, "deleteImportedSubsheets: Error during subsheet cleanup");

      setStatusText(
        "✅ IDS Collection updated, but cleaning up the old subsheets did not finish.",
      );
    }
  }

    const summary = document.getElementById("selectedFileSummary");

    const updateSubsheetsOnlyButton = document.getElementById(
      "updateSubsheetsOnlyButton",
    );
    const updateMasterAndSubsheetsButton = document.getElementById(
      "updateMasterAndSubsheetsButton",
    );
    const convertToCollectionButton = document.getElementById(
      "convertToCollectionButton",
    );

    updateSubsheetsOnlyButton.style.display = "inline-block";
    updateSubsheetsOnlyButton.disabled = true;
    updateMasterAndSubsheetsButton.style.display = "none";
    updateMasterAndSubsheetsButton.disabled = true;
    convertToCollectionButton.style.display = "inline-block";
    convertToCollectionButton.disabled = true;

    if (!masterVersionDifference || masterVersionDifference === "unknown") {
      setStatusWithSpinner(`Checking IDS Master version...`);

      try {
        versionResult = await runAppsScript(
          "compareSheetVersions",
          oldSheetID,
          "IDS Master",

        AppError.log(error, "renderIdMasterOptions: IDS Master version check failed");

        );
      } else {
        masterVersionDifference = "unknown";
        console.warn(
          "IDS Master version check returned an unexpected result:",
          versionResult,
        );
      }
    }

    if (
      masterVersionDifference === "older" ||
      masterVersionDifference === "unknown"
    ) {
      if (versionDifference === null) {
        const compatibilityResult = await checkVersionCompatibility(
          oldSheetID,
          "IDS Master",
        );
        if (!compatibilityResult.success || !compatibilityResult.versionDifference) {
          setStatusText(compatibilityResult.message);
          return;
        }
        versionDifference = compatibilityResult.versionDifference;
      }
      setStatusText(
        masterVersionDifference === "unknown"
          ? "Unable to verify IDS Master version. You can still update."
          : "Choose update option:",
      );

        <strong> IDS Master is up to date!</strong><br>
        <strong> Update Subsheets with new versions</strong>
      `;

      <strong>⚠️ Note: IDS Collection is a single all-in-one sheet that can be used as a substitute for IDS Master and subsheets </strong>`;

  }

  /**
   * Converts an IDS Collection into an IDS Master with subsheets.
   * @returns {Promise<void>}
   */
  async function convertToMaster() {
    const templates = CONVERT_TO_TEMPLATES["master-and-subsheets"];
    const masterTemplate = templates.find(
      (template) => template.sheetType === "IDS Master",
    );
    const subsheetTemplates = templates.filter(
      (template) => template.sheetType !== "IDS Master",
    );

    if (!masterTemplate) {
      setStatusText("Missing IDS Master template for conversion.");
      return;
    }

    const compatibilityResult = await checkVersionCompatibility(
      oldSheetID,
      "IDS Collection",
    );
    if (!compatibilityResult.success) {
      setStatusText(compatibilityResult.message);
      return;
    }
    versionDifference = compatibilityResult.versionDifference;
    isConvertToMasterFlow = true;
    isConvertToCollectionFlow = false;

    sheetType = "IDS Master";
    masterVersionDifference = null;
    isUpdateSingleSheetFlow = false;
    isCombinedUpdate = true;
    currentCopyMode = "all";

    disableUpdateSingleSheetButton();

    cachedMasterTemplateInfo = {
      templateID: masterTemplate.templateID,
      sheetType: "IDS Master",
      version: masterTemplate.templateVersion || "",
    };
    cachedTemplateInfo = subsheetTemplates.map((template) => ({
      templateID: template.templateID,
      sheetType: template.sheetType,
      version: template.templateVersion || "",
    }));
    cachedSheetIds = [oldSheetID];
    cachedTemplatesWithSameVersion = [];
    cachedSkippedTemplates = [];
    hasSubsheetsToUpdate = cachedTemplateInfo.length > 0;

    copyTemplates(currentCopyMode);
  }

  /**
   * Converts an IDS Master and its subsheets into an IDS Collection.
   * @returns {Promise<void>}
   */
  async function convertToCollection() {
    const template = CONVERT_TO_TEMPLATES["ids-collection"][0];

    disableIDSMasterButtons();
    isConvertToMasterFlow = false;
    isConvertToCollectionFlow = true;

    sheetType = "IDS Collection";
    idMasterID = oldSheetID;
    isUpdateSingleSheetFlow = true;
    isCombinedUpdate = false;

    try {
      const subsheetsResult = await runAppsScript("getTemplateAndsheetIds", oldSheetID, "all");

      if (subsheetsResult && subsheetsResult.success) {
        cachedSheetIds = subsheetsResult.sheetIds || [];

        detectLegacyThemesSheets(subsheetsResult.templateInfo || []);
      } else {
        cachedSheetIds = [];
        mergeLegacyThemesSheets = false;
        console.warn(
          "Unable to collect subsheet IDs for cleanup:",
          subsheetsResult,
        );
      }
    } catch (error) {
      cachedSheetIds = [];
      mergeLegacyThemesSheets = false;
      console.error("Error collecting subsheet IDs for cleanup:", error);
    }

    cachedTemplateInfo = [
      {
        templateID: template.templateID,
        sheetType: "IDS Collection",
        version: "",
        oldSheetID: oldSheetID,
      },
    ];
    cachedSkippedTemplates = [];

    const templateInfoForAccess = [
      {
        templateID: template.templateID,
        sheetType: "IDS Collection",
        version: "",
      },
    ];

    const sheetIdsToCheck = [oldSheetID];
    if (cachedSheetIds && cachedSheetIds.length > 0) {
      cachedSheetIds.forEach((sheetId) => {
        if (sheetId && sheetId !== oldSheetID) {
          sheetIdsToCheck.push(sheetId);
        }
      });
    }

    setStatusWithSpinner(
      `Checking access to IDS Collection template and ${sheetIdsToCheck.length} sheet(s)...`,
    );

    const [templateAccess, sheetAccess] = await Promise.all([
      checkMultipleTemplateAccess(templateInfoForAccess),
      checkMultipleSheetAccess(sheetIdsToCheck),
    ]);

    if (!templateAccess.success || !sheetAccess.success) {
      const failedCheck = !templateAccess.success ? templateAccess : sheetAccess;
      AppError.show(failedCheck, { source: "checkFileAccessStatus" });
      templateAccessibleFilesCache = [];
      templateInaccessibleFilesCache = [];
      accessibleFilesCache = [];
      inaccessibleFilesCache = [];
      notOwnedFilesCache = [];
      warningFilesCache = [];
      return;
    }

    templateAccessibleFilesCache = templateAccess.accessibleFiles || [];
    templateInaccessibleFilesCache = templateAccess.inaccessibleFiles || [];
    accessibleFilesCache = sheetAccess.accessibleFiles || [];
    inaccessibleFilesCache = sheetAccess.inaccessibleFiles || [];
    notOwnedFilesCache = sheetAccess.notOwnedFiles || [];
    warningFilesCache = sheetAccess.warningFiles || [];

    if (notOwnedFilesCache.length > 0) {
      setStatusText(
        "Some files are not owned or editable by you. You must be the owner or an editor to continue.",
      );
      showContinueSection();
      return;
    }

    const totalInaccessibleFiles =
      templateInaccessibleFilesCache.length + inaccessibleFilesCache.length;
    if (totalInaccessibleFiles > 0) {
      let statusMessages = [];
      if (templateInaccessibleFilesCache.length > 0) {
        statusMessages.push(
          `${templateInaccessibleFilesCache.length} template(s)`,
        );
      }
      if (inaccessibleFilesCache.length > 0) {
        statusMessages.push(`${inaccessibleFilesCache.length} sheet(s)`);
      }
      setStatusWithSpinner(
        `${statusMessages.join(" and ")} need access. Opening file picker...`,
      );
      openMultiFilePicker();
      return;
    }

    proceedWithUpdateSingleSheetTemplateCopy();
  }

  /**
   * Checks whether a sheet's version has a converter, caching the answer.
   * @param {string} sheetId
   * @param {string} sheetTypeToCheck
   * @returns {Promise<{success: boolean, versionDifference: string|null}>}
   */
  async function checkVersionCompatibility(sheetId, sheetTypeToCheck) {
    try {

      if (versionDifference === null) {
        setStatusWithSpinner(`Checking version compatibility...`);

        const compatibilityResult = await runAppsScript("checkExportCompatibility", sheetId, sheetTypeToCheck);

        if (!compatibilityResult.success) {
          return {
            success: false,
            message: `Compatibility check failed: ${compatibilityResult.message}`,
            versionDifference: null,
          };
        }

        versionDifference = compatibilityResult.versionDifference;
        console.log(
          `Compatibility check completed. Version difference: ${versionDifference}`,
        );
      } else {
        console.log(
          `Using cached compatibility result. Version difference: ${versionDifference}`,
        );
      }

      return {
        success: true,
        message: "Version compatibility check completed successfully",
        versionDifference: versionDifference,
      };
    } catch (error) {
      AppError.log(error, "checkVersionCompatibility: Error in checkVersionCompatibility");
      return {
        success: false,
        message: `Compatibility check error: ${error.message || error}`,
        versionDifference: null,
      };
    }
  }

  /**

   * @returns {Promise<void>}

    disableUpdateSingleSheetButton();

    isUpdateSingleSheetFlow = true;
