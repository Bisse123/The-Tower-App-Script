<script>
  function showFileAccessSection() {
    var selectImportSection = document.getElementById("selectImportSection");
    var fileAccessSection = document.getElementById("fileAccessSection");
    selectImportSection.style.display = "none";
    fileAccessSection.style.display = "block";
    setStatusWithSpinner("Checking which files need access permissions...");
  }

  async function addAnotherFile() {
    setStatusWithSpinner("Checking authorization...");
    document.getElementById("addAnotherButton").disabled = true;
    if (!accessToken) {
      setStatusText("Authorization failed. Cannot open picker.");
      return;
    }
    openMultiFilePicker();
  }

  function runAppsScript(method, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[method](...args);
    });
  }

  async function importData() {
    document.getElementById("importButton").disabled = true;
    document.getElementById("moveSheetButton").disabled = true;
    if (
      sheetType === "IDS Master" &&
      !isUpdateSingleSheetFlow &&
      hasSubsheetsToUpdate
    ) {
      const totalAvailableFiles =
        (copiedTemplateFiles || []).length +
        (importedFilesFailed || []).length +
        (exportedFilesFailed || []).length;
      if (totalAvailableFiles === 0) {
        setStatusText(
          "No copied sheets available for import. Please copy templates first.",
        );
        return;
      }

      if (isConvertToMasterFlow) {
        setStatusWithSpinner("Exporting IDS Collection data...");
        let exportResult;
        try {
          exportResult = await runAppsScript(
            "exportData",
            oldSheetID,
            "IDS Collection",
            versionDifference,
          );
        } catch (error) {
          document.getElementById("importButton").disabled = false;
          console.error("Export error:", error);
          setStatusText(`Export error: ${error.message || error}`);
          return;
        }

        if (!exportResult || !exportResult.success) {
          document.getElementById("importButton").disabled = false;
          setStatusText(
            `Export failed: ${
              exportResult?.message || "Unknown export error"
            }`,
          );
          return;
        }

        const collectionData = exportResult.data || {};
        const allTemplateFiles = (copiedTemplateFiles || [])
          .concat(importedFilesFailed || [])
          .concat(exportedFilesFailed || []);

        copiedTemplateFiles = [];
        importedFilesFailed = [];
        exportedFilesFailed = [];
        exportedFilesSuccess = [];

        allTemplateFiles.forEach((file) => {
          const exportData = collectionData[file.sheetType];

          if (exportData !== undefined) {
            exportedFilesSuccess.push({
              ...file,
              exportData: exportData,
              sheetVisibility: exportResult.sheetVisibility,
            });
          } else {
            exportedFilesFailed.push({
              ...file,
              error: `No IDS Collection export data for ${file.sheetType}`,
            });
          }
        });

        if (exportedFilesSuccess.length === 0) {
          document.getElementById("importButton").disabled = false;
          setStatusText(
            "No data was successfully exported. Cannot proceed with import.",
          );
          displayOperationResults();
          return;
        }

        const importTasks = exportedFilesSuccess.map((file) => ({
          newSheetID: file.fileId,
          sheetType: file.sheetType,
        }));

        setStatusWithSpinner(
          `Importing data into ${importTasks.length} sheets...`,
        );
        await importAllData(importTasks);
        return;
      }

      const exportSourceLabel = isConvertToMasterFlow
        ? "IDS Collection"
        : "IDS Master";
      setStatusWithSpinner(
        `Preparing import from ${exportSourceLabel} for ${totalAvailableFiles} sheets...`,
      );

      try {
        const prepareResult = await runAppsScript(
          "prepareImportData",
          oldSheetID,
          copiedTemplateFiles || [],
          importedFilesFailed || [],
          exportedFilesFailed || [],
        );
        await onprepareImportDataSuccess(prepareResult);
      } catch (error) {
        onprepareImportDataFailure(error);
      }
      return;
    }
    if (sheetType === "IDS Collection" && isConvertToCollectionFlow) {
      setStatusWithSpinner("Preparing import for sheet...");
      const sheetTypes = [
        "Laboratory",
        "Workshop",
        "Ultimate Weapon",
        "Themes & Songs",
        "Bots",
        "Relics",
        "Vault",
        "Cards",
        "Modules",
        "Guardians",
        "Player & Stuff",
      ];
      sheetTypes.forEach((type) => {
        copiedTemplateFiles.push({
          sheetType: type,
          fileId: newSheetID,
        });
      });
      let result;
      try {
        result = await runAppsScript(
          "prepareImportData",
          oldSheetID,
          copiedTemplateFiles,
        );
      } catch (error) {
        document.getElementById("importButton").disabled = false;
        console.error("Import preparation failed:", error);
        setStatusText(`Import preparation error: ${error.message || error}`);
        return;
      }

      console.log("Import preparation result:", result);

      if (!result.succeededTasks || result.succeededTasks.length === 0) {
        document.getElementById("importButton").disabled = false;

        const statusMessage =
          result.failedTasks && result.failedTasks.length > 0
            ? "Import preparation failed for all tasks."
            : "No valid import tasks prepared.";
        setStatusText(statusMessage);

        if (result.failedTasks && result.failedTasks.length > 0) {
          let summaryHtml =
            "<strong>❌ Import Preparation Failed:</strong><br>";
          result.failedTasks.forEach((task) => {
            summaryHtml += `&nbsp;&nbsp;• ${task.sheetType}: ${task.message}<br>`;
          });
          document.getElementById("selectedFileSummary").innerHTML =
            summaryHtml;
        }
        return;
      }

      if (result.failedTasks && result.failedTasks.length > 0) {
        console.warn(
          `${result.failedTasks.length} tasks failed during preparation:`,
          result.failedTasks,
        );
      }

      try {
        setStatusWithSpinner(
          `Exporting data from ${result.succeededTasks.length} sheets...`,
        );
        const exportResults = await exportAllData(result.succeededTasks);

        console.log("Export results:", exportResults);

        if (exportResults.failedCount > 0) {
          console.warn(
            `${exportResults.failedCount} exports failed out of ${exportResults.totalTasks}`,
          );
        }

        if (exportedFilesSuccess.length === 0) {
          document.getElementById("importButton").disabled = false;
          setStatusText(
            "No data was successfully exported. Cannot proceed with import.",
          );
          return;
        }

        const exportedData = {};
        const sheetVisibilityData = {};
        exportedFilesSuccess.forEach((exportedFile) => {
          if (exportedFile.exportData && exportedFile.sheetType) {
            exportedData[exportedFile.sheetType] = exportedFile.exportData;
            if (exportedFile.sheetVisibility) {
              Object.assign(sheetVisibilityData, exportedFile.sheetVisibility);
            }
          }
        });

        setStatusWithSpinner(`Importing ${sheetType} data...`);
        try {
          const importResult = await runAppsScript(
            "importData",
            newSheetID,
            sheetType,
            exportedData,
            sheetVisibilityData,
            idMasterID,
          );
          await onImportSuccess(importResult);
        } catch (error) {
          onImportFailure(error);
        }
      } catch (error) {
        console.error("Error in export/import process:", error);
        document.getElementById("importButton").disabled = false;
        setStatusText(
          `Error during export/import process: ${error.message || error}`,
        );
      }
      return;
    }

    // For non-IDS Master sheets, first export data, then import it
    setStatusWithSpinner(`Exporting ${sheetType} data...`);
    try {
      const exportResult = await runAppsScript(
        "exportData",
        oldSheetID,
        sheetType,
        versionDifference,
      );
      if (exportResult.success) {
        setStatusWithSpinner(`Importing ${sheetType} data...`);

        try {
          const importResult = await runAppsScript(
            "importData",
            newSheetID,
            sheetType,
            exportResult.data,
            exportResult.sheetVisibility,
            idMasterID,
          );
          await onImportSuccess(importResult);
        } catch (error) {
          onImportFailure(error);
        }
      } else {
        document.getElementById("importButton").disabled = false;
        setStatusText(`Export failed: ${exportResult.message}`);
      }
    } catch (error) {
      document.getElementById("importButton").disabled = false;
      console.error("Export error:", error);
      setStatusText(`Export error: ${error.message || error}`);
    }
  }

  async function onprepareImportDataSuccess(result) {
    console.log("Import preparation result:", result);

    if (!result.succeededTasks || result.succeededTasks.length === 0) {
      document.getElementById("importButton").disabled = false;

      // Show generic message in status text
      const statusMessage =
        result.failedTasks && result.failedTasks.length > 0
          ? "Import preparation failed for all tasks."
          : "No valid import tasks prepared.";
      setStatusText(statusMessage);

      // Show detailed error messages for each failed task in the summary
      if (result.failedTasks && result.failedTasks.length > 0) {
        let summaryHtml = "<strong>❌ Import Preparation Failed:</strong><br>";
        result.failedTasks.forEach((task) => {
          summaryHtml += `&nbsp;&nbsp;• ${task.sheetType}: ${task.message}<br>`;
        });
        document.getElementById("selectedFileSummary").innerHTML = summaryHtml;
      }

      return;
    }

    if (result.failedTasks && result.failedTasks.length > 0) {
      console.warn(
        `${result.failedTasks.length} tasks failed during preparation:`,
        result.failedTasks,
      );
    }

    try {
      // First, export all data
      setStatusWithSpinner(
        `Exporting data from ${result.succeededTasks.length} sheets...`,
      );
      const exportResults = await exportAllData(result.succeededTasks);

      console.log("Export results:", exportResults);

      if (exportResults.failedCount > 0) {
        console.warn(
          `${exportResults.failedCount} exports failed out of ${exportResults.totalTasks}`,
        );
      }

      // Check if we have any successful exports to import
      if (exportedFilesSuccess.length === 0) {
        document.getElementById("importButton").disabled = false;
        setStatusText("No data was exported. Cannot proceed with import.");
        return;
      }

      // Create import tasks based on successfully exported files
      const importTasks = exportedFilesSuccess.map((exportedFile) => ({
        newSheetID: exportedFile.fileId,
        sheetType: exportedFile.sheetType,
        exportData: exportedFile.exportData,
      }));

      // Now proceed with imports
      setStatusWithSpinner(
        `Importing data into ${importTasks.length} sheets...`,
      );
      importAllData(importTasks);
    } catch (error) {
      console.error("Error in export/import process:", error);
      document.getElementById("importButton").disabled = false;
      setStatusText(
        `Error during export/import process: ${error.message || error}`,
      );
    }
  }

  function onprepareImportDataFailure(error) {
    document.getElementById("importButton").disabled = false;
    setStatusText(`Import preparation error: ${error.message || error}`);
    console.error("Import preparation failed:", error);
  }

  async function exportAllData(exportTasks) {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalTasks = exportTasks.length;

    try {
      console.log(`Starting ${totalTasks} exports`);

      // Create promises for all export operations
      const exportPromises = exportTasks.map((task, index) => {
        return new Promise((resolve) => {
          console.log(`Starting export for ${task.sheetType}`);

          google.script.run
            .withSuccessHandler(function (result) {
              completedCount++;
              if (result.success) {
                successCount++;
                console.log(
                  `✅ ${task.sheetType} export completed successfully`,
                );

                // Check both arrays for the file to move to success
                let exportedFile = null;
                let sourceArray = null;

                // First check copiedTemplateFiles
                const copiedFileIndex = copiedTemplateFiles.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (copiedFileIndex !== -1) {
                  exportedFile = copiedTemplateFiles.splice(
                    copiedFileIndex,
                    1,
                  )[0];
                  sourceArray = "copy failed";
                } else {
                  // Then check exportedFilesFailed (for retry attempts)
                  const failedFileIndex = exportedFilesFailed.findIndex(
                    (f) => f.sheetType === task.sheetType,
                  );
                  if (failedFileIndex !== -1) {
                    exportedFile = exportedFilesFailed.splice(
                      failedFileIndex,
                      1,
                    )[0];
                    sourceArray = "export failed";
                  } else {
                    // Then check importedFilesFailed (for retry attempts)
                    const importedFileIndex = importedFilesFailed.findIndex(
                      (f) => f.sheetType === task.sheetType,
                    );
                    if (importedFileIndex !== -1) {
                      exportedFile = importedFilesFailed.splice(
                        importedFileIndex,
                        1,
                      )[0];
                      sourceArray = "import failed";
                    }
                  }
                }

                if (exportedFile) {
                  exportedFilesSuccess.push({
                    ...exportedFile,
                    oldSheetID: task.oldSheetID,
                    idMasterID: task.idMasterID,
                    exportData: result.data,
                    sheetVisibility: result.sheetVisibility,
                  });
                  console.log(
                    `Moved ${task.sheetType} from ${sourceArray} to exported success`,
                  );
                } else {
                  console.warn(
                    `Could not find ${task.sheetType} in either copiedTemplateFiles or exportedFilesFailed`,
                  );
                }
              } else {
                failedCount++;
                console.error(
                  `❌ ${task.sheetType} export failed:`,
                  result.message,
                );

                // Move failed export from copiedTemplateFiles to exportedFilesFailed
                const copiedFileIndex = copiedTemplateFiles.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (copiedFileIndex !== -1) {
                  const failedFile = copiedTemplateFiles.splice(
                    copiedFileIndex,
                    1,
                  )[0];
                  exportedFilesFailed.push({
                    ...failedFile,
                    error: result.message || "Export failed",
                    oldSheetID: task.oldSheetID,
                    idMasterID: task.idMasterID,
                  });
                  console.log(
                    `Moved ${task.sheetType} from copied to export failed with error: ${result.message}`,
                  );
                } else {
                  // File was already in exportedFilesFailed (retry attempt) - update error info
                  const failedFileIndex = exportedFilesFailed.findIndex(
                    (f) => f.sheetType === task.sheetType,
                  );
                  if (failedFileIndex !== -1) {
                    exportedFilesFailed[failedFileIndex].error =
                      result.message || "Export failed";
                    console.log(
                      `Updated error for ${task.sheetType} in export failed list: ${result.message}`,
                    );
                  }
                }
              }

              // Update status
              setStatusWithSpinner(
                `Export progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                ...result,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            })
            .withFailureHandler(function (error) {
              completedCount++;
              failedCount++;
              console.error(`❌ ${task.sheetType} export error:`, error);

              // Move failed export from copiedTemplateFiles to exportedFilesFailed
              const copiedFileIndex = copiedTemplateFiles.findIndex(
                (f) => f.sheetType === task.sheetType,
              );
              if (copiedFileIndex !== -1) {
                const failedFile = copiedTemplateFiles.splice(
                  copiedFileIndex,
                  1,
                )[0];
                exportedFilesFailed.push({
                  ...failedFile,
                  error: error.message || error,
                  oldSheetID: task.oldSheetID,
                  idMasterID: task.idMasterID,
                });
                console.log(
                  `Moved ${
                    task.sheetType
                  } from copied to export failed with error: ${
                    error.message || error
                  }`,
                );
              } else {
                // File was already in exportedFilesFailed (retry attempt) - update error info
                const failedFileIndex = exportedFilesFailed.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (failedFileIndex !== -1) {
                  exportedFilesFailed[failedFileIndex].error =
                    error.message || error;
                  console.log(
                    `Updated error for ${
                      task.sheetType
                    } in export failed list: ${error.message || error}`,
                  );
                }
              }

              // Update status
              setStatusWithSpinner(
                `Export progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                success: false,
                message: error.message || error,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            })
            .exportData(
              task.oldSheetID,
              task.sheetType,
              task.versionDifference,
            );
        });
      });

      // Wait for all exports to complete
      const results = await Promise.all(exportPromises);

      // Return export results summary
      return {
        success: failedCount === 0,
        totalTasks,
        successCount,
        failedCount,
        results,
      };
    } catch (error) {
      console.error("Error in export execution:", error);
      throw error;
    }
  }

  async function importAllData(importTasks) {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalTasks = importTasks.length;

    try {
      console.log(`Starting ${totalTasks} imports`);

      // Create promises for all import operations
      const importPromises = importTasks.map((task, index) => {
        return new Promise((resolve) => {
          console.log(`Starting import for ${task.sheetType}`);

          // Find the corresponding exported file data
          const exportedFile = exportedFilesSuccess.find(
            (f) => f.sheetType === task.sheetType,
          );
          if (!exportedFile || !exportedFile.exportData) {
            completedCount++;
            failedCount++;
            const errorMessage = `No exported data found for ${task.sheetType}`;
            console.error(`❌ ${errorMessage}`);

            // Update status
            setStatusWithSpinner(
              `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
            );

            resolve({
              success: false,
              message: errorMessage,
              sheetType: task.sheetType,
              taskIndex: index,
            });
            return;
          }

          google.script.run
            .withSuccessHandler(function (result) {
              completedCount++;
              if (result.success) {
                successCount++;
                console.log(
                  `✅ ${task.sheetType} import completed successfully`,
                );

                // Move successfully imported file from exportedFilesSuccess to importedFilesSuccess
                const exportedFileIndex = exportedFilesSuccess.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (exportedFileIndex !== -1) {
                  const importedFile = exportedFilesSuccess.splice(
                    exportedFileIndex,
                    1,
                  )[0];
                  // Remove exportData from the imported file object as it's no longer needed
                  const { exportData, ...fileWithoutExportData } = importedFile;
                  importedFilesSuccess.push(fileWithoutExportData);
                  console.log(
                    `Moved ${task.sheetType} from exported success to imported success`,
                  );
                } else {
                  console.warn(
                    `Could not find ${task.sheetType} in exportedFilesSuccess after successful import`,
                  );
                }
              } else {
                failedCount++;
                console.error(
                  `❌ ${task.sheetType} import failed:`,
                  result.message,
                );

                // Move failed import from exportedFilesSuccess to importedFilesFailed
                const exportedFileIndex = exportedFilesSuccess.findIndex(
                  (f) => f.sheetType === task.sheetType,
                );
                if (exportedFileIndex !== -1) {
                  const failedFile = exportedFilesSuccess.splice(
                    exportedFileIndex,
                    1,
                  )[0];
                  // Remove exportData from the failed file object
                  const { exportData, ...fileWithoutExportData } = failedFile;
                  importedFilesFailed.push({
                    ...fileWithoutExportData,
                    error: result.message || "Import failed",
                  });
                  console.log(
                    `Moved ${task.sheetType} from exported success to imported failed with error: ${result.message}`,
                  );
                } else {
                  console.warn(
                    `Could not find ${task.sheetType} in exportedFilesSuccess for failure handling`,
                  );
                }
              }

              // Update status
              setStatusWithSpinner(
                `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                ...result,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            })
            .withFailureHandler(function (error) {
              completedCount++;
              failedCount++;
              console.error(`❌ ${task.sheetType} import error:`, error);

              // Move failed import from exportedFilesSuccess to importedFilesFailed
              const exportedFileIndex = exportedFilesSuccess.findIndex(
                (f) => f.sheetType === task.sheetType,
              );
              if (exportedFileIndex !== -1) {
                const failedFile = exportedFilesSuccess.splice(
                  exportedFileIndex,
                  1,
                )[0];
                // Remove exportData from the failed file object
                const { exportData, ...fileWithoutExportData } = failedFile;
                importedFilesFailed.push({
                  ...fileWithoutExportData,
                  error: error.message || error,
                });
                console.log(
                  `Moved ${
                    task.sheetType
                  } from exported success to imported failed with error: ${
                    error.message || error
                  }`,
                );
              } else {
                console.warn(
                  `Could not find ${task.sheetType} in exportedFilesSuccess for error handling`,
                );
              }

              // Update status
              setStatusWithSpinner(
                `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`,
              );

              resolve({
                success: false,
                message: error.message || error,
                sheetType: task.sheetType,
                taskIndex: index,
              });
            })
            .importData(
              task.newSheetID,
              task.sheetType,
              exportedFile.exportData,
              exportedFile.sheetVisibility,
              idMasterID,
            );
        });
      });

      // Wait for all imports to complete
      const results = await Promise.all(importPromises);

      // Final status update
      let finalMessage;
      let titleText;

      if (failedCount === 0) {
        finalMessage = `🎉 All ${totalTasks} sheet imports completed successfully!`;
        titleText = `✅ Copied Sheets Imported (${successCount}/${totalTasks})`;
      } else if (successCount === 0) {
        finalMessage = `❌ All ${totalTasks} sheet imports failed.`;
        titleText = `❌ Copied Sheet Import Failed (0/${totalTasks})`;
      } else {
        finalMessage = `⚠️ Imports completed: ${successCount} successful, ${failedCount} failed.`;
        titleText = `⚠️ Sheets Partial Import (${successCount}/${totalTasks})`;
      }

      document.getElementById("moveSheetButton").disabled = false;

      // Update status text and title
      setStatusText(finalMessage);
      document.getElementById("fileAccessTitle").innerHTML = titleText;

      // Use display function for file sections
      displayOperationResults();

      console.log("Import results:", results);
      console.log("Remaining copiedTemplateFiles:", copiedTemplateFiles);
      console.log("Remaining exportedFilesSuccess:", exportedFilesSuccess);
      console.log("Remaining exportedFilesFailed:", exportedFilesFailed);
      console.log("Remaining importedFilesSuccess:", importedFilesSuccess);
      console.log("Remaining importedFilesFailed:", importedFilesFailed);
    } catch (error) {
      console.error("Error in import execution:", error);
      setStatusText(`Error during imports: ${error.message || error}`);
      document.getElementById("importButton").disabled = false;
    }
  }

  async function onImportSuccess(result) {
    console.log("Import result:", result);

    // DOM element constants
    const importButton = document.getElementById("importButton");
    const moveSheetButton = document.getElementById("moveSheetButton");
    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const selectedFileSummary = document.getElementById("selectedFileSummary");

    importButton.disabled = false;

    // Regular import success handling
    if (result.success) {
      setStatusText(`${result.message}`);
      fileAccessTitle.innerHTML = `✅ ${sheetType} Imported Successfully`;

      moveSheetButton.disabled = false;

      selectedFileSummary.innerHTML = `<strong>⚠️ Make sure your data is imported correctly before ${
        sheetType === "IDS Collection"
          ? "moving your IDS Collection"
          : sheetType === "Effective Paths"
            ? "moving your Effective Paths"
            : sheetType === "IDS Master"
              ? "moving your IDS Master"
              : "updating your IDS Master"
      }! ⚠️</strong><br>`;
      if (sheetType === "Effective Paths") {
        selectedFileSummary.innerHTML += `<strong>⚠️ If the sheet shows errors after a minute, try refreshing the page. ⚠️</strong><br>`;
      }
      selectedFileSummary.innerHTML += `<a href="${googleLink}/${newSheetID}/edit" target="_blank" style="margin-left: 2em">📋 Open ${sheetType} Sheet™</a><br>`;
      selectedFileSummary.innerHTML += `<br><strong>✅ Successfully Imported ${sheetType} (Ready to be moved and renamed):</strong><br>`;
    } else {
      if (result.failedUpdates && result.failedUpdates.length > 0) {
        let summaryHtml = "<strong>❌ Import Failed:</strong><br>";
        result.failedUpdates.forEach((update) => {
          summaryHtml += `&nbsp;&nbsp;• ${update.sheetType}: ${update.message}<br>`;
        });
        selectedFileSummary.innerHTML = summaryHtml;
      } else {
        selectedFileSummary.innerText =
          "Import failed with no specific updates.";
      }
      setStatusText(`Import failed: ${result.message}`);
    }
  }

  function onImportFailure(error) {
    document.getElementById("importButton").disabled = false;
    console.error("Import error:", error);
    setStatusText(`Import error: ${error.message || error}`);
  }

  function moveSheet() {
    // Check if this is IDS Master with multiple imported files
    if (
      sheetType === "IDS Master" &&
      !isUpdateSingleSheetFlow &&
      importedFilesSuccess.length > 0
    ) {
      document.getElementById("importButton").disabled = true;
      document.getElementById("moveSheetButton").disabled = true;

      if (isCombinedUpdate) {
        // Add IDS Master to importedFilesSuccess so it gets processed with other files
        // Check if IDS Master is not already in the array to prevent duplicates
        const idsMasterExists = importedFilesSuccess.some(
          (file) => file.sheetType === sheetType && file.fileId === newSheetID,
        );
        if (!idsMasterExists) {
          importedFilesSuccess.push({
            sheetType: sheetType,
            fileId: newSheetID,
            oldSheetID: oldSheetID,
            version: cachedMasterTemplateInfo
              ? cachedMasterTemplateInfo.version
              : "",
          });
          console.log(
            `Combined update: Added IDS Master to importedFilesSuccess for batch processing`,
          );
        } else {
          console.log(
            `Combined update: IDS Master already exists in importedFilesSuccess, skipping duplicate`,
          );
        }
      }
      console.log(
        `Calling moveMultipleSheets for IDS Master with ${importedFilesSuccess.length} imported files`,
      );

      moveMultipleSheets();
      return;
    }

    document.getElementById("importButton").disabled = true;
    document.getElementById("moveSheetButton").disabled = true;
    setStatusWithSpinner(`Moving and renaming new ${sheetType} file...`);

    console.log(
      `Calling moveSheet -> sheetType: ${sheetType}, newSheetID: ${newSheetID}, oldSheetID: ${oldSheetID}`,
    );

    // Call the Apps Script function to process the selected files
    google.script.run
      .withSuccessHandler(onmoveSheetSuccess)
      .withFailureHandler(onmoveSheetFailure)
      .moveSheet(sheetType, newSheetID, oldSheetID);
  }

  async function moveMultipleSheets() {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalUpdates = importedFilesSuccess.length;

    try {
      if (totalUpdates > 0) {
        console.log(`Starting ${totalUpdates} sheet updates`);

        setStatusWithSpinner(
          `Processing ${importedFilesSuccess.length} imported files...`,
        );

        const movePromises = importedFilesSuccess.map((file, index) => {
          return new Promise((resolve) => {
            console.log(`Starting update for ${file.sheetType}`);

            const moveMethod = isConvertToMasterFlow
              ? "moveConvertedSheet"
              : "moveSheet";
            const oldIdForMove = isConvertToMasterFlow
              ? oldSheetID
              : file.oldSheetID;

            google.script.run
              .withSuccessHandler(function (result) {
                completedCount++;
                if (result.success) {
                  successCount++;
                  console.log(
                    `✅ ${file.sheetType} update completed successfully`,
                  );

                  // Only add to movedFiles if this is not the IDS Master
                  if (file.fileId !== idMasterID) {
                    // Move successfully updated file to movedFiles list
                    movedFiles.push({
                      ...file,
                      updateResult: result,
                    });
                  } else {
                    console.log(
                      `Skipping adding IDS Master (${file.sheetType}) to movedFiles as it matches idMasterID`,
                    );
                  }
                } else {
                  failedCount++;
                  console.error(
                    `❌ ${file.sheetType} update failed:`,
                    result.message,
                  );
                }

                // Update status
                setStatusWithSpinner(
                  `Moving progress: ${completedCount}/${totalUpdates} completed (${successCount} successful, ${failedCount} failed)`,
                );

                resolve({
                  ...result,
                  sheetType: file.sheetType,
                  newSheetID: file.fileId,
                  updateIndex: index,
                  fileData: file,
                });
              })
              .withFailureHandler(function (error) {
                completedCount++;
                failedCount++;
                console.error(`❌ ${file.sheetType} update error:`, error);

                // Update status
                setStatusWithSpinner(
                  `Moving progress: ${completedCount}/${totalUpdates} completed (${successCount} successful, ${failedCount} failed)`,
                );

                resolve({
                  success: false,
                  message: error.message || error,
                  sheetType: file.sheetType,
                  newSheetID: file.fileId,
                  updateIndex: index,
                  fileData: file,
                });
              })
              [moveMethod](file.sheetType, file.fileId, oldIdForMove);
          });
        });

        // Wait for all updates to complete
        const moveResults = await Promise.all(movePromises);

        // Remove successfully updated files from importedFiles and add to movedFiles
        const successfulResults = moveResults.filter(
          (result) => result.success,
        );

        // Remove successful files from importedFilesSuccess (working backwards to avoid index issues)
        for (let i = importedFilesSuccess.length - 1; i >= 0; i--) {
          const file = importedFilesSuccess[i];
          const successfulResult = successfulResults.find(
            (result) => result.sheetType === file.sheetType,
          );
          if (successfulResult) {
            // Remove from importedFilesSuccess and ensure it's in movedFiles
            const removedFile = importedFilesSuccess.splice(i, 1)[0];

            // Check if not already in movedFiles (defensive programming) and not the IDS Master
            if (
              !movedFiles.find((f) => f.sheetType === removedFile.sheetType) &&
              removedFile.fileId !== idMasterID
            ) {
              movedFiles.push({
                ...removedFile,
                updateResult: successfulResult,
              });
            }
          }
        }
        console.log("Move results:", moveResults);
      }
      // Final status update
      let finalMessage;
      let titleText;
      const totalSuccessCount = movedFiles.length;
      const totalAllCount = importedFilesSuccess.length + movedFiles.length;
      if (failedCount === 0) {
        titleText = `✅ Moved & renamed sheets (${totalSuccessCount}/${totalAllCount})`;
      } else if (totalSuccessCount === 0) {
        titleText = `❌ Failed to move & rename sheets (0/${totalAllCount})`;
      } else {
        titleText = `⚠️ Partially moved & renamed sheets (${totalSuccessCount}/${totalAllCount})`;
      }

      // Update status text and title
      setStatusWithSpinner(
        `Updating IDS Master with ${movedFiles.length} moved files...`,
      );
      document.getElementById("fileAccessTitle").innerHTML = titleText;

      var idDataEntries = movedFiles.map((file) => ({
        sheetType: file.sheetType,
        newSheetID: file.fileId,
      }));

      // Add files from cachedTemplatesWithSameVersion to idDataEntries if available
      if (
        cachedTemplatesWithSameVersion &&
        cachedTemplatesWithSameVersion.length > 0
      ) {
        console.log(
          `Processing ${cachedTemplatesWithSameVersion.length} templates with same versions for IDS Master update`,
        );

        cachedTemplatesWithSameVersion.forEach((template) => {
          // Check if this sheet ID doesn't already exist in idDataEntries
          const existingEntry = idDataEntries.find(
            (entry) => entry.newSheetID === template.oldSheetID,
          );
          if (!existingEntry) {
            idDataEntries.push({
              sheetType: template.sheetType,
              newSheetID: template.oldSheetID, // Use oldSheetID as these are existing sheets
            });
            console.log(
              `Added ${template.sheetType} (${template.oldSheetID}) to IDS Master update`,
            );
          } else {
            console.log(
              `Skipped ${template.sheetType} (${template.oldSheetID}) - already exists in IDS Master update`,
            );
          }
        });

        console.log(
          `Total entries for IDS Master update: ${idDataEntries.length}`,
        );
      }

      const updateIdsMasterResult = await new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function (result) {
            resolve(result);
          })
          .withFailureHandler(function (error) {
            resolve(error);
          })
          .updateIdsMaster(idMasterID, idDataEntries);
      });

      if (!updateIdsMasterResult) {
        setStatusText(`Error updating IDS Master: No result returned`);
        document.getElementById("fileAccessTitle").innerHTML =
          `❌ IDS Master Update Failed`;
        document.getElementById("importButton").disabled = false;
        document.getElementById("moveSheetButton").disabled = false;
        return;
      }
      let gid = updateIdsMasterResult.gid || "";
      if (!updateIdsMasterResult.success) {
        finalMessage = `Error updating IDS Master: ${
          updateIdsMasterResult.message || "Unknown error"
        }`;
        titleText = `❌ IDS Master Update Failed (${totalSuccessCount}/${totalAllCount} files moved)`;
      } else {
        if (isConvertToMasterFlow && failedCount === 0) {
          try {
            await runAppsScript("deleteOldSheet", oldSheetID);
          } catch (error) {
            console.warn("Failed to delete old IDS Collection:", error);
          }
        }
        if (failedCount === 0) {
          finalMessage = `🎉 All ${totalAllCount} sheet updates completed successfully!`;
          document.getElementById("importButton").style.display = "none";
          document.getElementById("moveSheetButton").style.display = "none";
        } else if (totalSuccessCount === 0) {
          finalMessage = `❌ All ${totalAllCount} sheet updates failed.`;
        } else {
          finalMessage = `⚠️ Updates completed: ${totalSuccessCount} successful, ${failedCount} failed.`;
        }
        titleText = `✅ IDS Master Updated (${totalSuccessCount}/${totalAllCount})`;

        // Update master IDs for cached templates with same versions
        if (
          cachedTemplatesWithSameVersion &&
          cachedTemplatesWithSameVersion.length > 0
        ) {
          console.log(
            `Updating master IDs for ${cachedTemplatesWithSameVersion.length} templates with same versions...`,
          );
          setStatusWithSpinner(
            `IDS Master updated. Updating master IDs in ${cachedTemplatesWithSameVersion.length} subsheets...`,
          );

          const updatePromises = cachedTemplatesWithSameVersion.map(
            (template, index) => {
              console.log(
                `Updating sheet ID for ${template.sheetType} template (${
                  index + 1
                }/${cachedTemplatesWithSameVersion.length})`,
              );

              return new Promise((resolve) => {
                google.script.run
                  .withSuccessHandler(function (updateResult) {
                    console.log(
                      `✅ Sheet ID updated successfully for ${template.sheetType}:`,
                      updateResult,
                    );
                    resolve({
                      success: true,
                      template: template,
                      result: updateResult,
                    });
                  })
                  .withFailureHandler(function (error) {
                    console.error(
                      `❌ Failed to update sheet ID for ${template.sheetType}:`,
                      error,
                    );
                    resolve({
                      success: false,
                      template: template,
                      error: error,
                    });
                  })
                  .updateSheetID(
                    template.oldSheetID,
                    idMasterID,
                    template.sheetType,
                  );
              });
            },
          );

          try {
            const updateResults = await Promise.all(updatePromises);
            const successResults = updateResults.filter((r) => r.success);
            const failResults = updateResults.filter((r) => !r.success);

            // Remove successfully updated templates from cachedTemplatesWithSameVersion
            cachedTemplatesWithSameVersion = failResults.map((r) => r.template);
          } catch (error) {
            console.error("Error updating master IDs:", error);
          }
        }
      }

      // Update status text and title
      setStatusText(finalMessage);
      document.getElementById("fileAccessTitle").innerHTML = titleText;

      // Update UI state
      document.getElementById("importButton").disabled = false;
      document.getElementById("moveSheetButton").disabled = false;

      // Use display function for file sections
      displayOperationResults(gid, updateIdsMasterResult.success);

      console.log("Successfully movedFiles:", movedFiles);
      console.log("Remaining importedFilesSuccess:", importedFilesSuccess);
    } catch (error) {
      console.error("Error in update execution:", error);
      setStatusText(`Error during updates: ${error.message || error}`);
      document.getElementById("importButton").disabled = false;
      document.getElementById("moveSheetButton").disabled = false;
    }
  }

  async function deleteImportedSubsheets(sheetIds) {
    let deletedCount = 0;
    let failedDeletions = [];
    const totalDeletions = sheetIds.length;

    try {
      console.log(`Starting deletion of ${totalDeletions} subsheets`);

      // Create promises for all deletion operations
      const deletionPromises = sheetIds.map((sheetId, index) => {
        return new Promise((resolve) => {
          console.log(`Starting deletion of sheet ID: ${sheetId}`);

          google.script.run
            .withSuccessHandler(function (result) {
              if (result.success) {
                deletedCount++;
                console.log(`✅ Sheet ${sheetId} deleted successfully`);
              } else {
                failedDeletions.push({
                  sheetId: sheetId,
                  error: result.message,
                });
                console.error(
                  `❌ Sheet ${sheetId} deletion failed:`,
                  result.message,
                );
              }

              // Update status
              setStatusWithSpinner(
                `Cleanup progress: ${
                  deletedCount + failedDeletions.length
                }/${totalDeletions} processed (${deletedCount} deleted)`,
              );

              resolve({
                ...result,
                sheetId: sheetId,
              });
            })
            .withFailureHandler(function (error) {
              failedDeletions.push({
                sheetId: sheetId,
                error: error.message || error,
              });
              console.error(`❌ Sheet ${sheetId} deletion error:`, error);

              // Update status
              setStatusWithSpinner(
                `Cleanup progress: ${
                  deletedCount + failedDeletions.length
                }/${totalDeletions} processed (${deletedCount} deleted)`,
              );

              resolve({
                success: false,
                message: error.message || error,
                sheetId: sheetId,
              });
            })
            .deleteOldSheet(sheetId);
        });
      });

      // Wait for all deletions to complete
      await Promise.all(deletionPromises);

      // Update final status
      if (failedDeletions.length === 0) {
        setStatusText(
          `✅ IDS Collection updated and ${deletedCount} subsheets cleaned up successfully!`,
        );
        document.getElementById("fileAccessTitle").innerHTML =
          `✅ IDS Collection updated! All subsheets cleaned up!`;
      } else {
        setStatusText(

  async function proceedWithTemplateCopying(copyMode) {
    const totalTemplates = templateAccessibleFilesCache.length;
    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const selectedFileSummary = document.getElementById("selectedFileSummary");
    hasSubsheetsToUpdate = true;

    const modeDescription =
      copyMode === "update" ? "sheets with updates" : "sheets";

    // Initialize the summary with header
    let linksHtml = "<strong>📂 Created sheets for update:</strong>";
    selectedFileSummary.innerHTML = linksHtml;

    setStatusWithSpinner(`Copying ${totalTemplates} ${modeDescription}...`);

    let successCount = 0;
    let failedCount = 0;
    let completedCount = 0;

    // Create promises for all template copying operations with immediate UI updates
    const copyPromises = templateAccessibleFilesCache.map((template, index) => {
      console.log(`Starting copy for ${template.sheetType} sheet:`, template);

      return new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function (result) {
            console.log(
              `Sheet ${template.sheetType} copied successfully:`,
              result,
            );

            let templateResult;
            if (result.success && result.fileId) {
              successCount++;
              templateResult = {
                success: true,
                sheetType: template.sheetType,
                fileId: result.fileId,
                gid: result.gid || "",
                version: template.version,
              };

              copiedTemplateFiles.push(templateResult);

              // Add the newly copied file to accessible files cache
              accessibleFilesCache.push({
                id: result.fileId,
                name: `Copy of ${template.sheetType} ${template.version}`,
                sheetType: template.sheetType,
              });

              // Immediately add successful item to display
              linksHtml += `<br>&nbsp;&nbsp;• ${template.sheetType} Sheet™`;
            } else {
              failedCount++;
              const errorMessage =
                result.message || "Copy operation returned unsuccessful result";
              templateResult = {
                success: false,
                sheetType: template.sheetType,
                error: errorMessage,
              };

              // Immediately add failure message to display
              linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
            }

            // Update UI immediately
            completedCount++;
            selectedFileSummary.innerHTML = linksHtml;
            setStatusWithSpinner(
              `Copying sheets... (${completedCount}/${totalTemplates} completed)`,
            );

            resolve(templateResult);
          })
          .withFailureHandler(function (error) {
            console.error(`Error copying sheet ${template.sheetType}:`, error);

            failedCount++;
            completedCount++;

            const errorMessage = error.message || error;

            // Immediately add failure message to display
            linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
            selectedFileSummary.innerHTML = linksHtml;
            setStatusWithSpinner(
              `Copying sheets... (${completedCount}/${totalTemplates} completed)`,
            );

            resolve({
              success: false,
              sheetType: template.sheetType,
              error: errorMessage,
            });
          })
          .copyFileTemplate(template.id, template.sheetType, template.version, parentFolderID);
      });
    });

    // Wait for all copying operations to complete
    try {
      await Promise.all(copyPromises);

      // Final status update
      const modeDescription =
        copyMode === "update" ? "sheets with updates" : "sheets";
      let statusMessage = `All ${modeDescription} copied successfully.`;
      if (failedCount > 0) {
        statusMessage = `${
          modeDescription.charAt(0).toUpperCase() + modeDescription.slice(1)
        } copying completed: ${successCount} successful, ${failedCount} failed`;
      }
      setStatusText(statusMessage);

      // Update title
      if (successCount > 0) {
        const titleModeDescription =
          copyMode === "update" ? "Sheet(s) with Updates" : "Sheet(s)";
        fileAccessTitle.innerHTML = `✅ ${successCount} ${titleModeDescription} Copied Successfully!`;
        if (failedCount > 0) {
          fileAccessTitle.innerHTML += ` (${failedCount} failed)`;
        }

        // document.getElementById("copyButton").style.display = "none";
        // document.getElementById("copyUpdateButton").style.display = "none";
        document.getElementById("addAnotherButton").style.display = "none";
        document.getElementById("instructionsSection").style.display = "none";
        document.getElementById("importButton").style.display = "inline-block";
        document.getElementById("importButton").innerText = "Import Data";
        document.getElementById("importButton").disabled = false;
        document.getElementById("moveSheetButton").style.display =
          "inline-block";
        document.getElementById("moveSheetButton").disabled = true;
        hideIDSMasterButtons();
      } else {
        const titleModeDescription =
          copyMode === "update" ? "Sheets with Updates" : "Sheets";
        fileAccessTitle.innerHTML = `❌ All ${totalTemplates} ${titleModeDescription} Failed to Copy`;
      }
    } catch (error) {
      console.error("Error in sheet copying process:", error);
      setStatusText(`Error during sheet copying: ${error.message || error}`);
    } finally {
      // document.getElementById("copyButton").disabled = false;
      // document.getElementById("copyUpdateButton").disabled = false;
    }
  }

  async function convertToMaster() {
    const templates = CONVERT_TO_TEMPLATES["master-and-subsheets"];
    const masterTemplate = templates.find(
      (template) => template.sheetType === "IDS Master",
    );
    const subsheetTemplates = templates.filter(
      (template) => template.sheetType !== "IDS Master",
    );

    if (!masterTemplate) {
      setStatusText("Missing IDS Master template for conversion.");
      return;
    }

    const compatibilityResult = await checkVersionCompatibility(
      oldSheetID,
      "IDS Collection",
    );
    if (!compatibilityResult.success) {
      setStatusText(compatibilityResult.message);
      return;
    }
    versionDifference = compatibilityResult.versionDifference;
    isConvertToMasterFlow = true;
    isConvertToCollectionFlow = false;

    sheetType = "IDS Master";
    masterVersionDifference = null;
    isUpdateSingleSheetFlow = false;
    isCombinedUpdate = true;
    currentCopyMode = "all";

    disableUpdateSingleSheetButton();
    
    cachedMasterTemplateInfo = {
      templateID: masterTemplate.templateID,
      sheetType: "IDS Master",
      version: masterTemplate.templateVersion || "",
    };
    cachedTemplateInfo = subsheetTemplates.map((template) => ({
      templateID: template.templateID,
      sheetType: template.sheetType,
      version: template.templateVersion || "",
    }));
    cachedSheetIds = [];
    cachedTemplatesWithSameVersion = [];
    hasSubsheetsToUpdate = cachedTemplateInfo.length > 0;

    updateMasterAndSubsheetsWithAllFiles();
  }

  // Check version compatibility function - can be used by multiple functions
  async function checkVersionCompatibility(sheetId, sheetTypeToCheck) {
    try {
      // Check compatibility if not already done (versionDifference is null means no check yet)
      if (versionDifference === null) {
        setStatusWithSpinner(`Checking version compatibility...`);

        // Check version compatibility for export before proceeding
        const compatibilityResult = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .checkExportCompatibility(sheetId, sheetTypeToCheck);
        });

        if (!compatibilityResult.success) {
          return {
            success: false,
            message: `Compatibility check failed: ${compatibilityResult.message}`,
            versionDifference: null,
          };
        }

        // Store the version difference result for future use
        versionDifference = compatibilityResult.versionDifference;
        console.log(
          `Compatibility check completed. Version difference: ${versionDifference}`,
        );
      } else {
        console.log(
          `Using cached compatibility result. Version difference: ${versionDifference}`,
        );
      }

      return {
        success: true,
        message: "Version compatibility check completed successfully",
        versionDifference: versionDifference,
      };
    } catch (error) {
      console.error("Error in checkVersionCompatibility:", error);
      return {
        success: false,
        message: `Compatibility check error: ${error.message || error}`,
        versionDifference: null,
      };
    }
  }

  // Update single sheet function - creates template copy for any supported sheet type
  async function updateSingleSheet() {
    // Disable the button immediately to prevent multiple clicks
    disableUpdateSingleSheetButton();
    // Set the flow flag
    isUpdateSingleSheetFlow = true;

    try {
      let templateInfo;

      // Check version compatibility
      const compatibilityResult = await checkVersionCompatibility(
        oldSheetID,
        sheetType,
      );
      if (!compatibilityResult.success) {
        setStatusText(compatibilityResult.message);
        resetUpdateSingleSheetButton();
        return;
      }

      // Check if we already have cached template info for this sheet type and oldSheetID
      if (
        cachedTemplateInfo &&
        cachedTemplateInfo.length > 0 &&
        cachedTemplateInfo[0].sheetType === sheetType &&
        cachedTemplateInfo[0].oldSheetID === oldSheetID
      ) {
        console.log(`Using cached template info for ${sheetType}`);
        templateInfo = cachedTemplateInfo;
      } else {
        // Need to get template information from server
        setStatusWithSpinner(
          `Getting ${sheetType} template and sheet information...`,
        );

        const templateResult = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getTemplateIdForSingleSheet(oldSheetID, sheetType);
        });

        if (!templateResult.success) {
          setStatusText(
            `Error getting template info: ${templateResult.message}`,
          );
          resetUpdateSingleSheetButton();
          return;
        }

        console.log(`${sheetType} template info:`, templateResult);

        // Store template information in existing cached variables with oldSheetID for validation
        cachedTemplateInfo = [
          {
            templateID: templateResult.templateID,
            sheetType: sheetType,
            version: templateResult.templateVersion,
            oldSheetID: oldSheetID, // Cache the oldSheetID for validation
          },
        ];

        templateInfo = cachedTemplateInfo;
      }

      // Update status for access checking
      setStatusWithSpinner(
        `Checking access to ${sheetType} template and sheet...`,
      );

      // Create template info array for access checking
      const templateInfoForAccess = [
        {
          templateID: templateInfo[0].templateID,
          sheetType: sheetType,
          version: templateInfo[0].version,
        },
      ];

      const sheetIds = [oldSheetID];

      // Now check access using the simplified function
      const accessResult = await checkSingleSheetAccess(
        templateInfoForAccess,
        sheetIds,
      );

      if (!accessResult.success) {
        setStatusText(
          `Error checking ${sheetType} access: ${accessResult.message}`,
        );
        resetUpdateSingleSheetButton();
        return;
      }

      if (accessResult.hasAccess) {
        // We have access to both files - continue with template copy
        const templateID =
          cachedTemplateInfo && cachedTemplateInfo.length > 0
            ? cachedTemplateInfo[0].templateID
            : null;
        const templateVersion =
          cachedTemplateInfo && cachedTemplateInfo.length > 0
            ? cachedTemplateInfo[0].version
            : null;

        if (!oldSheetID || !templateID) {
          console.error(`Missing required IDs for ${sheetType} template copy`);
          setStatusText("Error: Missing required sheet or template ID");
          resetUpdateSingleSheetButton();
          return;
        }

        // Update status for template creation
        setStatusWithSpinner("Creating template copy...");

        // Call the unified template copy function
        proceedWithUpdateSingleSheetTemplateCopy();
      } else {
        // We need to grant access - set up for picker
        setStatusText("File access required. Please grant access...");

        // Update the caches with inaccessible files from the access result
        if (
          accessResult.inaccessibleSheets &&
          accessResult.inaccessibleSheets.length > 0
        ) {
          inaccessibleFilesCache = accessResult.inaccessibleSheets;
        }
        if (
          accessResult.inaccessibleTemplates &&
          accessResult.inaccessibleTemplates.length > 0
        ) {
          templateInaccessibleFilesCache = accessResult.inaccessibleTemplates;
        }

        // Show the picker for access (the picker callback will continue the flow)
        openMultiFilePicker();
      }
    } catch (error) {
      console.error(`Error in ${sheetType} access check:`, error);
      setStatusText(
        `Error checking ${sheetType} access: ${error.message || error}`,
      );
      resetUpdateSingleSheetButton();
    }
  }
