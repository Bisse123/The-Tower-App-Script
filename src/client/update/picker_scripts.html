<script>
  /**
   * gapi onload hook: loads the client and picker libraries.
   * @returns {void}
   */
  function gapiLoaded() {
    console.log("GAPI loaded, loading client and picker...");
    gapi.load("client:picker", {
      callback: initializePicker,
      onerror: function () {
        console.error("Failed to load GAPI client:picker");
        setStatusText("Failed to load Google™ APIs");
      },
    });
  }

  /**
   * Initialises the Drive picker and starts authorization.
   * @returns {Promise<void>}
   */
  async function initializePicker() {
    try {
      console.log("Initializing GAPI client...");

      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: [
          "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest",
        ],
      });

      console.log("GAPI client initialized successfully");
      console.log(
        "Picker API available:",
        typeof google.picker !== "undefined",
      );

      pickerInited = true;

      authorizeAndContinue();
    } catch (error) {
      AppError.show(error, {
        source: "initializePicker",
        message: "This page could not finish loading. Reload and try again.",
      });
    }
  }

  /**
   * Picker dimensions for the current viewport.
   * @returns {{width: number, height: number}}
   */
  function calculatePickerSize() {
    let pickerWidth, pickerHeight;
    if (isMobile) {
      pickerWidth = Math.min(window.innerWidth - 10, 900);
      pickerHeight = Math.min(window.innerHeight - 80, 700);

      pickerWidth = Math.max(pickerWidth, 320);
      pickerHeight = Math.max(pickerHeight, 450);
    } else {
      pickerWidth = 1400;
      pickerHeight = 900;
    }
    return { width: pickerWidth, height: pickerHeight };
  }

  /**
   * Opens the picker so the user can grant several files at once.
   * @returns {void}
   */
  function openMultiFilePicker() {
    if (!accessToken) {
      setStatusText("Please authorize first");
      return;
    }

    if (!pickerInited) {
      setStatusText("Picker not initialized yet");
      return;
    }

    if (typeof google === "undefined" || typeof google.picker === "undefined") {
      setStatusText("Google™ Picker API not loaded");
      console.error("Google Picker API not available");
      return;
    }

    const allInaccessibleFiles = [
      ...inaccessibleFilesCache,
      ...templateInaccessibleFilesCache,
    ];

    if (allInaccessibleFiles.length === 0) {
      setStatusText("No files need access permission");
      return;
    }

    const inaccessibleFileIds = allInaccessibleFiles
      .map((file) => file.id)
      .filter((id) => typeof id === "string" && id.length > 0);
    if (inaccessibleFileIds.length !== allInaccessibleFiles.length) {
      console.warn(
        "Some inaccessible files are missing an id:",
        allInaccessibleFiles,
      );
    }

    console.log("Opening picker with inaccessible files:", {
      total: inaccessibleFileIds.length,
      templates: templateInaccessibleFilesCache.length,
      sheets: inaccessibleFilesCache.length,
      fileIds: inaccessibleFileIds,
    });

    try {
      setStatusText("Opening picker with files that need access...");

      const fileIdsString = inaccessibleFileIds.join(",");
      console.log("File IDs string:", fileIdsString);
      if (!fileIdsString) {
        setStatusText("No valid file IDs to show in picker.");
        return;
      }
      const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEET)
        .setFileIds(fileIdsString)
        .setIncludeFolders(false)
        .setSelectFolderEnabled(false)
        .setMode(google.picker.DocsViewMode.LIST)
        .setMimeTypes("application/vnd.google-apps.spreadsheet");

      console.log(
        "DocsView created with",
        inaccessibleFileIds.length,
        "inaccessible files",
      );

      const pickerSize = calculatePickerSize();

      const picker = new google.picker.PickerBuilder()
        .setDeveloperKey(API_KEY)
        .setAppId(APP_ID)
        .setOAuthToken(accessToken)
        .setSelectableMimeTypes("application/vnd.google-apps.spreadsheet")
        .addView(view)
        .setCallback(pickerCallback)
        .setOrigin(google.script.host.origin)
        .setSize(pickerSize.width, pickerSize.height);

      if (!isMobile || !isTouchOnlyDevice()) {
        picker.enableFeature(google.picker.Feature.MULTISELECT_ENABLED);
        console.log("Multi-select enabled for non-touch device");
      } else {
        console.log("Multi-select disabled for touch-only device");
      }

      if (isMobile) {
        picker.enableFeature(google.picker.Feature.NAV_HIDDEN);
      }

      const builtPicker = picker.build();

      console.log(
        "Picker built successfully with",
        inaccessibleFileIds.length,
        "inaccessible files",
      );

      const statusMessage = isMobile
        ? `Tap files to select (${inaccessibleFileIds.length} available)`
        : `Select the files you want to grant access to (${inaccessibleFileIds.length} files available).`;
      setStatusText(statusMessage);

      builtPicker.setVisible(true);
      console.log("Picker.setVisible(true) called");
    } catch (error) {
      AppError.show(error, {
        source: "openMultiFilePicker",
        message: "The Google file picker could not be opened. Reload and try again.",
      });
    }
  }

  /**
   * Handles a picker selection: rechecks access and continues the workflow.
   * @param {Object} data The picker's callback payload.
   * @returns {Promise<void>}
   */
  async function pickerCallback(data) {
    console.log("Picker callback received:", data);
    try {
      if (data.action === google.picker.Action.PICKED) {
        const documents = data[google.picker.Response.DOCUMENTS];

        if (!documents || documents.length === 0) {
          setStatusText("No files selected");
          return;
        }

        setStatusText(
          `Access granted to ${documents.length} files. Rechecking access status...`,
        );

        var fileIds = [newSheetID, oldSheetID, idMasterID].filter(
          (id) => id != null && id !== "",
        );
        if (isUpdateSingleSheetFlow) {

          console.log(
            `${sheetType} picker completed in updateSingleSheet flow - continuing with template copy`,
          );

          if (cachedTemplateInfo && cachedTemplateInfo.length > 0) {
            const templateInfo = cachedTemplateInfo;
            const sheetIds = [oldSheetID];

            checkSingleSheetAccess(templateInfo, sheetIds)
              .then((accessResult) => {
                if (accessResult.success && accessResult.hasAccess) {

                  proceedWithUpdateSingleSheetTemplateCopy();
                } else {
                  console.error("Still no access after picker:", accessResult);
                  setStatusText("Still missing access after file selection.");
                  if (isConvertToCollectionFlow) {
                    resetIDSMasterState();
                  } else {
                    resetUpdateSingleSheetButton();
                  }
                }
              })
              .catch((error) => {
                console.error("Error re-checking access after picker:", error);
                AppError.show(error, {
                  source: "pickerCallback",
                  message: "The script could not re-check access to your files.",
                });
                if (isConvertToCollectionFlow) {
                  resetIDSMasterState();
                } else {
                  resetUpdateSingleSheetButton();
                }
              });
          } else {
            console.error(
              "No cached template info available for re-checking access",
            );
            setStatusText(
              "Error: Missing template information for access check.",
            );
            if (isConvertToCollectionFlow) {
              resetIDSMasterState();
            } else {
              resetUpdateSingleSheetButton();
            }
          }
          return;
        } else if (sheetType === "IDS Master") {
          if (isCombinedUpdate) {

            console.log("Rechecking access for combined update flow");

            if (currentCopyMode) {
              copyTemplates(currentCopyMode);
            } else {
              copyTemplates("update");
            }
          } else if (currentCopyMode) {
            copyTemplates(currentCopyMode);
          } else {
            checkMultipleSheetAccess([oldSheetID])
              .then(onSheetAccessCheckSuccess)
              .catch(onSheetAccessCheckFailure);
          }
          return;
        } else if (sheetType === "Effective Paths") {
          checkMultipleSheetAccess([oldSheetID])
            .then(onSheetAccessCheckSuccess)
            .catch(onSheetAccessCheckFailure);
          return;
        } else if (sheetType === "IDS Collection" && newSheetID && oldSheetID) {
          checkCollectionsAccess();
          return;
        }
        console.log("Re-checking access for selected files:", fileIds);
        checkMultipleSheetAccess(fileIds)
          .then(onSheetAccessCheckSuccess)
          .catch(onSheetAccessCheckFailure);
      } else if (data.action === google.picker.Action.CANCEL) {
        console.log("User cancelled the picker");
        setStatusText("File selection cancelled");
        document.getElementById("addAnotherButton").disabled = false;

        if (isUpdateSingleSheetFlow) {
          if (isConvertToCollectionFlow) {
            resetIDSMasterState();
          } else {
            resetUpdateSingleSheetButton();
          }
        }

        if (isCombinedUpdate) {
          enableIDSMasterButtons();
          resetIDSMasterState();
        }
      } else if (data.action === "loaded") {
        console.log("Picker loaded successfully");
        setStatusText("Picker loaded successfully");
      } else {
        console.log("Unknown picker action:", data.action);
        setStatusText(`Unknown action: ${data.action}`);
      }
    } catch (error) {
      AppError.show(error, {
        source: "pickerCallback",
        message: "The file picker returned something this page could not handle.",
      });
    }
  }

  /**
   * Opens the picker for one file and hands the choice to callback.
   * @param {string} fileId File to preselect.
   * @param {Function} callback Called with the picked file.
   * @param {Object} [options]
   * @returns {void}
   */
  function openSingleFilePicker(fileId, callback, options = {}) {
    if (!accessToken || !pickerInited) {
      setStatusText("Picker not ready or not authorized.");
      return callback(false);
    }
    try {
      const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEET)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(false)
        .setMode(google.picker.DocsViewMode.LIST)
        .setMimeTypes("application/vnd.google-apps.spreadsheet");

      if (typeof fileId === "string") {
        view.setFileIds(fileId);
      } else {
        view.setQuery(fileId.join(" "));
      }

      const pickerSize = calculatePickerSize();

      const picker = new google.picker.PickerBuilder()
        .setDeveloperKey(API_KEY)
        .setAppId(APP_ID)
        .setOAuthToken(accessToken)
        .setSelectableMimeTypes("application/vnd.google-apps.spreadsheet")
        .addView(view)
        .setCallback(function (data) {
          if (data.action === google.picker.Action.PICKED) {
            callback(data.docs[0][google.picker.Document.ID]);
          } else if (data.action !== "loaded") {
            callback(null);
          }
        })
        .setOrigin(google.script.host.origin)
        .setSize(pickerSize.width, pickerSize.height);

      if (isMobile) {
        picker.enableFeature(google.picker.Feature.NAV_HIDDEN);
      }

      const builtPicker = picker.build();
      builtPicker.setVisible(true);
      console.log("Picker.setVisible(true) called");
    } catch (e) {
      AppError.log(e, "openSingleFilePicker: Picker error");
      setStatusText("Picker error: " + (e.message || e));
      callback(null);
    }
  }
</script>
