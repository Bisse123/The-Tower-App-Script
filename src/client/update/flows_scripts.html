<script>
  /**
   * Hides every workflow section.
   * @returns {void}
   */
  function hideAllSections() {
    document.getElementById("selectImportSection").style.display = "none";
    document.getElementById("fileAccessSection").style.display = "none";
    document.getElementById("instructionsSection").style.display = "none";
  }

  /**
   * Disables the single-sheet update button.
   * @returns {void}
   */
  function disableUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.disabled = true;
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton) {
      convertToMasterButton.disabled = true;
    }
  }

  /**
   * Enables the single-sheet update button.
   * @returns {void}
   */
  function enableUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.disabled = false;
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton && sheetType === "IDS Collection") {
      convertToMasterButton.disabled = false;
    }
  }

  /**
   * Hides the single-sheet update button.
   * @returns {void}
   */
  function hideUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.style.display = "none";
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton) {
      convertToMasterButton.style.display = "none";
    }
  }

  /**
   * Shows the single-sheet update button.
   * @returns {void}
   */
  function showUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.style.display = "inline-block";
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton && sheetType === "IDS Collection") {
      convertToMasterButton.style.display = "inline-block";
    }
  }

  /**
   * Returns the single-sheet update button to its idle state.
   * @returns {void}
   */
  function resetUpdateSingleSheetButton() {
    isUpdateSingleSheetFlow = false;
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.disabled = false;
      updateSingleSheetButton.innerText = `Update ${sheetType}`;
    }
    if (isConvertToMasterFlow) {
      const convertToMasterButton = document.getElementById(
        "convertToMasterButton",
      );
      convertToMasterButton.disabled = false;
    }
  }

  /**
   * Renders the IDS Master update choices, checking its version first.
   * @returns {Promise<void>}
   */
  async function renderIdMasterOptions() {
    const summary = document.getElementById("selectedFileSummary");

    const updateSubsheetsOnlyButton = document.getElementById(
      "updateSubsheetsOnlyButton",
    );
    const updateMasterAndSubsheetsButton = document.getElementById(
      "updateMasterAndSubsheetsButton",
    );
    const convertToCollectionButton = document.getElementById(
      "convertToCollectionButton",
    );

    updateSubsheetsOnlyButton.style.display = "inline-block";
    updateSubsheetsOnlyButton.disabled = true;
    updateMasterAndSubsheetsButton.style.display = "none";
    updateMasterAndSubsheetsButton.disabled = true;
    convertToCollectionButton.style.display = "inline-block";
    convertToCollectionButton.disabled = true;

    if (!masterVersionDifference || masterVersionDifference === "unknown") {
      setStatusWithSpinner(`Checking IDS Master version...`);
      let versionResult = null;
      try {
        versionResult = await runAppsScript(
          "compareSheetVersions",
          oldSheetID,
          "IDS Master",
        );
      } catch (error) {
        AppError.log(error, "renderIdMasterOptions: IDS Master version check failed");
      }

      if (versionResult && versionResult.success && versionResult.comparisonResult) {
        masterVersionDifference = versionResult.comparisonResult;
        console.log(
          `Master version difference between IDS Master and template: ${masterVersionDifference}`,
        );
      } else {
        masterVersionDifference = "unknown";
        console.warn(
          "IDS Master version check returned an unexpected result:",
          versionResult,
        );
      }
    }

    if (
      masterVersionDifference === "older" ||
      masterVersionDifference === "unknown"
    ) {
      if (versionDifference === null) {
        const compatibilityResult = await checkVersionCompatibility(
          oldSheetID,
          "IDS Master",
        );
        if (!compatibilityResult.success || !compatibilityResult.versionDifference) {
          setStatusText(compatibilityResult.message);
          return;
        }
        versionDifference = compatibilityResult.versionDifference;
      }
      setStatusText(
        masterVersionDifference === "unknown"
          ? "Unable to verify IDS Master version. You can still update."
          : "Choose update option:",
      );
      updateMasterAndSubsheetsButton.style.display = "inline-block";
      updateMasterAndSubsheetsButton.disabled = false;
      summary.innerHTML += `<br>
        <strong>🔧 Select your preferred update method:</strong><br>
        <small>
          <strong>🔄 Update IDS Master & Subsheets:</strong> Updates the IDS Master and subsheets with new versions</strong><br>
          <strong>📋 Update Subsheets:</strong> Updates only subsheets with new versions</strong>
        </small>
      `;
    } else {
      setStatusText("Ready to update subsheets.");
      summary.innerHTML += `<br>
        <strong> IDS Master is up to date!</strong><br>
        <strong> Update Subsheets with new versions</strong>
      `;

    }
    summary.innerHTML += `<br><br>
      <strong>⚠️ Note: IDS Collection is a single all-in-one sheet that can be used as a substitute for IDS Master and subsheets </strong>`;

    updateSubsheetsOnlyButton.disabled = false;
    convertToCollectionButton.disabled = false;
  }

  /**
   * Converts an IDS Collection into an IDS Master with subsheets.
   * @returns {Promise<void>}
   */
  async function convertToMaster() {
    const templates = SHEET_TEMPLATES["master-and-subsheets"];
    const masterTemplate = templates.find(
      (template) => template.sheetType === "IDS Master",
    );
    const subsheetTemplates = templates.filter(
      (template) => template.sheetType !== "IDS Master",
    );

    if (!masterTemplate) {
      setStatusText("Missing IDS Master template for conversion.");
      return;
    }

    const compatibilityResult = await checkVersionCompatibility(
      oldSheetID,
      "IDS Collection",
    );
    if (!compatibilityResult.success) {
      setStatusText(compatibilityResult.message);
      return;
    }
    versionDifference = compatibilityResult.versionDifference;
    isConvertToMasterFlow = true;
    isConvertToCollectionFlow = false;

    sheetType = "IDS Master";
    masterVersionDifference = null;
    isUpdateSingleSheetFlow = false;
    isCombinedUpdate = true;
    currentCopyMode = "all";

    disableUpdateSingleSheetButton();

    cachedMasterTemplateInfo = {
      templateID: masterTemplate.templateID,
      sheetType: "IDS Master",
      version: masterTemplate.templateVersion || "",
    };
    cachedTemplateInfo = subsheetTemplates.map((template) => ({
      templateID: template.templateID,
      sheetType: template.sheetType,
      version: template.templateVersion || "",
    }));
    cachedSheetIds = [oldSheetID];
    cachedTemplatesWithSameVersion = [];
    cachedSkippedTemplates = [];
    hasSubsheetsToUpdate = cachedTemplateInfo.length > 0;

    copyTemplates(currentCopyMode);
  }

  /**
   * Converts an IDS Master and its subsheets into an IDS Collection.
   * @returns {Promise<void>}
   */
  async function convertToCollection() {
    const template = SHEET_TEMPLATES["ids-collection"][0];

    disableIDSMasterButtons();
    isConvertToMasterFlow = false;
    isConvertToCollectionFlow = true;

    sheetType = "IDS Collection";
    idMasterID = oldSheetID;
    isUpdateSingleSheetFlow = true;
    isCombinedUpdate = false;

    try {
      const subsheetsResult = await runAppsScript("getTemplateAndsheetIds", oldSheetID, "all");

      if (subsheetsResult && subsheetsResult.success) {
        cachedSheetIds = subsheetsResult.sheetIds || [];

        detectLegacyThemesSheets(subsheetsResult.templateInfo || []);
      } else {
        cachedSheetIds = [];
        mergeLegacyThemesSheets = false;
        console.warn(
          "Unable to collect subsheet IDs for cleanup:",
          subsheetsResult,
        );
      }
    } catch (error) {
      cachedSheetIds = [];
      mergeLegacyThemesSheets = false;
      console.error("Error collecting subsheet IDs for cleanup:", error);
    }

    cachedTemplateInfo = [
      {
        templateID: template.templateID,
        sheetType: "IDS Collection",
        version: "",
        oldSheetID: oldSheetID,
      },
    ];
    cachedSkippedTemplates = [];

    const templateInfoForAccess = [
      {
        templateID: template.templateID,
        sheetType: "IDS Collection",
        version: "",
      },
    ];

    const sheetIdsToCheck = [oldSheetID];
    if (cachedSheetIds && cachedSheetIds.length > 0) {
      cachedSheetIds.forEach((sheetId) => {
        if (sheetId && sheetId !== oldSheetID) {
          sheetIdsToCheck.push(sheetId);
        }
      });
    }

    setStatusWithSpinner(
      `Checking access to IDS Collection template and ${sheetIdsToCheck.length} sheet(s)...`,
    );

    const [templateAccess, sheetAccess] = await Promise.all([
      checkMultipleTemplateAccess(templateInfoForAccess),
      checkMultipleSheetAccess(sheetIdsToCheck),
    ]);

    if (!templateAccess.success || !sheetAccess.success) {
      const failedCheck = !templateAccess.success ? templateAccess : sheetAccess;
      AppError.show(failedCheck, { source: "checkFileAccessStatus" });
      templateAccessibleFilesCache = [];
      templateInaccessibleFilesCache = [];
      accessibleFilesCache = [];
      inaccessibleFilesCache = [];
      notOwnedFilesCache = [];
      warningFilesCache = [];
      return;
    }

    templateAccessibleFilesCache = templateAccess.accessibleFiles || [];
    templateInaccessibleFilesCache = templateAccess.inaccessibleFiles || [];
    accessibleFilesCache = sheetAccess.accessibleFiles || [];
    inaccessibleFilesCache = sheetAccess.inaccessibleFiles || [];
    notOwnedFilesCache = sheetAccess.notOwnedFiles || [];
    warningFilesCache = sheetAccess.warningFiles || [];

    if (notOwnedFilesCache.length > 0) {
      setStatusText(
        "Some files are not owned or editable by you. You must be the owner or an editor to continue.",
      );
      showContinueSection();
      return;
    }

    const totalInaccessibleFiles =
      templateInaccessibleFilesCache.length + inaccessibleFilesCache.length;
    if (totalInaccessibleFiles > 0) {
      let statusMessages = [];
      if (templateInaccessibleFilesCache.length > 0) {
        statusMessages.push(
          `${templateInaccessibleFilesCache.length} template(s)`,
        );
      }
      if (inaccessibleFilesCache.length > 0) {
        statusMessages.push(`${inaccessibleFilesCache.length} sheet(s)`);
      }
      setStatusWithSpinner(
        `${statusMessages.join(" and ")} need access. Opening file picker...`,
      );
      openMultiFilePicker();
      return;
    }

    proceedWithUpdateSingleSheetTemplateCopy();
  }

  /**
   * Reveals the continue section once a workflow finishes.
   * @returns {void}
   */
  function showContinueSection() {
    console.log("Accessible files:", accessibleFilesCache);
    console.log("Inaccessible files:", inaccessibleFilesCache);
    console.log("Not owned/editable files:", notOwnedFilesCache);
    console.log("Editable (not owned) files:", warningFilesCache);
    console.log("Template inaccessible files:", templateInaccessibleFilesCache);

    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const summary = document.getElementById("selectedFileSummary");
    const addAnotherButton = document.getElementById("addAnotherButton");
    const importButton = document.getElementById("importButton");

    const updateButton = document.getElementById("moveSheetButton");
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    const instructionsSection = document.getElementById("instructionsSection");

    const updateSubsheetsOnlyButton = document.getElementById(
      "updateSubsheetsOnlyButton",
    );
    const updateMasterAndSubsheetsButton = document.getElementById(
      "updateMasterAndSubsheetsButton",
    );
    const fileAccessSection = document.getElementById("fileAccessSection");

    const totalInaccessibleFiles =
      inaccessibleFilesCache.length + templateInaccessibleFilesCache.length;

    if (notOwnedFilesCache.length > 0) {
      fileAccessTitle.innerHTML = `⛔ ${notOwnedFilesCache.length} files not owned or editable by you`;

      summary.innerHTML =
        `<br><strong>📂 You must be the owner or an editor of the following files to continue </strong><br>` +
        notOwnedFilesCache
          .map((file) => `&nbsp;&nbsp;• ${file.name || file.id}`)
          .join("<br>");

      addAnotherButton.style.display = "none";
      importButton.style.display = "none";
      updateButton.style.display = "none";

      hideUpdateSingleSheetButton();
      instructionsSection.style.display = "none";
    } else if (totalInaccessibleFiles === 0) {
      fileAccessTitle.innerText = `✅ All Required Files Access Granted`;
      summary.innerHTML = "";
      showNotOwnedWarning();
      showAccessibleFilesSummary();
      addAnotherButton.style.display = "none";
      instructionsSection.style.display = "none";
      if (sheetType === "IDS Master") {

        importButton.style.display = "none";
        updateButton.style.display = "none";
        updateSingleSheetButton.style.display = "none";

        renderIdMasterOptions();

      } else {

        setStatusText(`Ready to update ${sheetType}.`);
        updateSingleSheetButton.style.display = "inline-block";
        updateSingleSheetButton.disabled = false;
        updateSingleSheetButton.innerText = `Update ${sheetType}`;
        importButton.style.display = "none";
        updateButton.style.display = "none";

        if (sheetType === "IDS Collection") {
          summary.innerHTML += `<br><br>
            <strong>⚠️ Note: IDS Master is multiple sheets that can be used as a substitute for IDS Collection</strong>`;
          document.getElementById("convertToMasterButton").style.display =
            "inline-block";
          document.getElementById("convertToMasterButton").disabled = false;
        }
      }
    } else {
      let summaryParts = [];
      if (inaccessibleFilesCache.length > 0) {
        summaryParts.push(`${inaccessibleFilesCache.length} sheet(s)`);
      }
      if (templateInaccessibleFilesCache.length > 0) {
        summaryParts.push(
          `${templateInaccessibleFilesCache.length} template(s)`,
        );
      }

      summary.innerHTML = `<strong>🔐 ${summaryParts.join(
        " and ",
      )} need access permission</strong><br>`;

      instructionsSection.style.display = "block";
      addAnotherButton.style.display = "inline-block";
      addAnotherButton.disabled = false;
      importButton.style.display = "none";
      updateButton.style.display = "none";

      hideUpdateSingleSheetButton();
    }

    fileAccessSection.style.display = "block";
  }

  /**
   * Checks whether a sheet's version has a converter, caching the answer.
   * @param {string} sheetId
   * @param {string} sheetTypeToCheck
   * @returns {Promise<{success: boolean, versionDifference: string|null}>}
   */
  async function checkVersionCompatibility(sheetId, sheetTypeToCheck) {
    try {

      if (versionDifference === null) {
        setStatusWithSpinner(`Checking version compatibility...`);

        const compatibilityResult = await runAppsScript("checkExportCompatibility", sheetId, sheetTypeToCheck);

        if (!compatibilityResult.success) {
          return {
            success: false,
            message: `Compatibility check failed: ${compatibilityResult.message}`,
            versionDifference: null,
          };
        }

        versionDifference = compatibilityResult.versionDifference;
        console.log(
          `Compatibility check completed. Version difference: ${versionDifference}`,
        );
      } else {
        console.log(
          `Using cached compatibility result. Version difference: ${versionDifference}`,
        );
      }

      return {
        success: true,
        message: "Version compatibility check completed successfully",
        versionDifference: versionDifference,
      };
    } catch (error) {
      AppError.log(error, "checkVersionCompatibility: Error in checkVersionCompatibility");
      return {
        success: false,
        message: `Compatibility check error: ${error.message || error}`,
        versionDifference: null,
      };
    }
  }

  /**
   * Runs the update workflow for one sheet.
   * @returns {Promise<void>}
   */
  async function updateSingleSheet() {

    disableUpdateSingleSheetButton();

    isUpdateSingleSheetFlow = true;

    try {
      let templateInfo;

      const compatibilityResult = await checkVersionCompatibility(
        oldSheetID,
        sheetType,
      );
      if (!compatibilityResult.success) {
        setStatusText(compatibilityResult.message);
        resetUpdateSingleSheetButton();
        return;
      }

      if (
        cachedTemplateInfo &&
        cachedTemplateInfo.length > 0 &&
        cachedTemplateInfo[0].sheetType === sheetType &&
        cachedTemplateInfo[0].oldSheetID === oldSheetID
      ) {
        console.log(`Using cached template info for ${sheetType}`);
        templateInfo = cachedTemplateInfo;
      } else {

        setStatusWithSpinner(
          `Getting ${sheetType} template and sheet information...`,
        );

        const templateResult = await runAppsScript(
          "getTemplateIdForSingleSheet",
          oldSheetID,
          sheetType,
        );

        if (!templateResult.success) {
          AppError.show(templateResult, { source: "updateSingleSheet" });
          resetUpdateSingleSheetButton();
          return;
        }

        console.log(`${sheetType} template info:`, templateResult);

        cachedTemplateInfo = [
          {
            templateID: templateResult.templateID,
            sheetType: sheetType,
            version: templateResult.templateVersion,
            oldSheetID: oldSheetID,
          },
        ];
        cachedSkippedTemplates = [];

        templateInfo = cachedTemplateInfo;
      }

      setStatusWithSpinner(
        `Checking access to ${sheetType} template and sheet...`,
      );

      const templateInfoForAccess = [
        {
          templateID: templateInfo[0].templateID,
          sheetType: sheetType,
          version: templateInfo[0].version,
        },
      ];

      const sheetIds = [oldSheetID];

      const accessResult = await checkSingleSheetAccess(
        templateInfoForAccess,
        sheetIds,
      );

      if (!accessResult.success) {
        AppError.show(accessResult, { source: "updateSingleSheet" });
        resetUpdateSingleSheetButton();
        return;
      }

      if (accessResult.hasAccess) {

        const templateID =
          cachedTemplateInfo && cachedTemplateInfo.length > 0
            ? cachedTemplateInfo[0].templateID
            : null;
        const templateVersion =
          cachedTemplateInfo && cachedTemplateInfo.length > 0
            ? cachedTemplateInfo[0].version
            : null;

        if (!oldSheetID || !templateID) {
          console.error(`Missing required IDs for ${sheetType} template copy`);
          setStatusText("Error: Missing required sheet or template ID");
          resetUpdateSingleSheetButton();
          return;
        }

        setStatusWithSpinner("Creating template copy...");

        proceedWithUpdateSingleSheetTemplateCopy();
      } else {

        setStatusText("File access required. Please grant access...");

        if (
          accessResult.inaccessibleSheets &&
          accessResult.inaccessibleSheets.length > 0
        ) {
          inaccessibleFilesCache = accessResult.inaccessibleSheets;
        }
        if (
          accessResult.inaccessibleTemplates &&
          accessResult.inaccessibleTemplates.length > 0
        ) {
          templateInaccessibleFilesCache = accessResult.inaccessibleTemplates;
        }

        openMultiFilePicker();
      }
    } catch (error) {
      AppError.show(error, {
        source: "updateSingleSheet",
        message: `The script could not check access to your ${sheetType} sheet.`,
      });
      resetUpdateSingleSheetButton();
    }
  }

  /**
   * Runs the update workflow for the IDS Master alone.
   * @returns {Promise<void>}
   */
  async function updateIDSMasterOnly() {
    console.log("IDS Master Only update selected");

    isUpdateSingleSheetFlow = true;

    disableIDSMasterButtons();

    try {
      let allSubsheetIds;
      let allTemplateInfo;

      if (
        cachedTemplatesWithSameVersion &&
        cachedTemplatesWithSameVersion.length > 0
      ) {
        console.log("✅ Using cached subsheet template info");
        setStatusWithSpinner("Using cached subsheet information...");

        allTemplateInfo = cachedTemplatesWithSameVersion;
        allSubsheetIds = cachedTemplatesWithSameVersion.map(
          (template) => template.oldSheetID,
        );

        console.log(
          `Using cached data for ${allTemplateInfo.length} templates and ${allSubsheetIds.length} sheet IDs`,
        );
      } else {

        console.log("No cached subsheet data found, fetching from server");
        setStatusWithSpinner("Getting subsheet information...");

        const subsheetsResult = await runAppsScript("getTemplateAndsheetIds", oldSheetID, "all");

        if (!subsheetsResult.success) {
          AppError.show(subsheetsResult, { source: "updateIDSMasterOnly" });
          resetIDSMasterState();
          return;
        }

        allSubsheetIds = subsheetsResult.sheetIds;
        allTemplateInfo = subsheetsResult.templateInfo;

        cachedTemplatesWithSameVersion = subsheetsResult.templateInfo;
      }

      setStatusWithSpinner(
        `Checking access to ${allSubsheetIds.length} subsheets...`,
      );

      const subsheetAccessResult =
        await checkMultipleSheetAccess(allSubsheetIds);

      if (!subsheetAccessResult.success) {
        AppError.show(subsheetAccessResult, { source: "updateIDSMasterOnly" });
        resetIDSMasterState();
        return;
      }

      if (
        subsheetAccessResult.inaccessibleFiles &&
        subsheetAccessResult.inaccessibleFiles.length > 0
      ) {

        setStatusText(
          `${subsheetAccessResult.inaccessibleFiles.length} subsheets need access permission. Please grant access...`,
        );

        inaccessibleFilesCache = subsheetAccessResult.inaccessibleFiles;
        accessibleFilesCache = subsheetAccessResult.accessibleFiles || [];
        notOwnedFilesCache = subsheetAccessResult.notOwnedFiles || [];
        warningFilesCache = subsheetAccessResult.warningFiles || [];
        templateInaccessibleFilesCache = [];
        templateAccessibleFilesCache = [];

        openMultiFilePicker();
        return;
      }

      console.log(
        `✅ Access verified for all ${allSubsheetIds.length} subsheets - proceeding with IDS Master update`,
      );
      hideIDSMasterButtons();

      updateSingleSheet();
    } catch (error) {
      AppError.show(error, {
        source: "updateIDSMasterOnly",
        message: "Preparing the IDS Master update did not finish.",
      });
      resetIDSMasterState();
    }
  }

  /**
   * Runs the update workflow for the subsheets alone.
   * @returns {void}
   */
  function updateSubsheetsOnly() {
    console.log("Subsheets update selected");
    setStatusWithSpinner("Preparing subsheet updates...");

    isCombinedUpdate = false;
    idMasterID = oldSheetID;
    currentCopyMode = "update";
    cachedTemplateInfo = null;
    cachedSheetIds = null;
    cachedSkippedTemplates = null;

    document.getElementById("selectedFileSummary").innerHTML =
      "<strong>📋 Updating subsheets with new versions.</strong><br>";

    document.getElementById("moveSheetButton").innerText = "Move Subsheets";

    hideIDSMasterButtons();

    copyTemplates("update");
  }

  /**
   * Runs the update workflow for the IDS Master and its subsheets.
   * @returns {Promise<void>}
   */
  async function updateMasterAndSubsheets() {
    console.log("Master and Subsheets update selected");
    setStatusWithSpinner("Preparing combined update...");

    isCombinedUpdate = true;

    currentCopyMode = "update";
    idMasterID = oldSheetID;

    disableIDSMasterButtons();

    document.getElementById("selectedFileSummary").innerHTML =
      "<strong>📋 Updating IDS Master and subsheets with new versions.</strong><br>";

    try {
      if (
        !cachedMasterTemplateInfo ||
        cachedMasterTemplateInfo.oldSheetID !== oldSheetID
      ) {
        setStatusWithSpinner("Getting IDS Master template information...");
        const masterTemplateResult = await runAppsScript(
          "getTemplateIdForSingleSheet",
          oldSheetID,
          sheetType,
        );

        if (!masterTemplateResult.success) {
          throw new Error(
            `Failed to get IDS Master template: ${masterTemplateResult.message}`,
          );
        }

        cachedMasterTemplateInfo = {
          templateID: masterTemplateResult.templateID,
          sheetType: sheetType,
          version: masterTemplateResult.templateVersion,
          templateVersion: masterTemplateResult.templateVersion,
          oldSheetID: oldSheetID,
        };
      }

      const subsheetsResult = await runAppsScript(
        "getTemplateAndsheetIds",
        oldSheetID,
        "all",
      );

      if (!subsheetsResult.success) {
        throw new Error(
          `Failed to get subsheet templates: ${subsheetsResult.message}`,
        );
      }

      const templateInfo = mergeLegacyThemesTemplates(
        subsheetsResult.templateInfo,
      );

      const templatesWithUpdates = templateInfo.filter(
        (template) =>
          template.merged || template.templateVersion !== template.oldVersion,
      );
      const templatesWithSameVersion = templateInfo.filter(
        (template) =>
          !template.merged && template.templateVersion === template.oldVersion,
      );

      cachedTemplateInfo = templatesWithUpdates;
      cachedTemplatesWithSameVersion = templatesWithSameVersion;
      cachedSkippedTemplates = subsheetsResult.skippedTemplates || [];
      cachedSheetIds = [oldSheetID];
      templatesWithUpdates.forEach((template) => {

        const oldSheetIDs = template.oldSheetIDs || [template.oldSheetID];
        oldSheetIDs.forEach((id) => {
          if (id && !cachedSheetIds.includes(id)) {
            cachedSheetIds.push(id);
          }
        });
      });

      copyTemplates(currentCopyMode);
    } catch (error) {
      AppError.show(error, {
        source: "updateMasterAndSubsheets",
        message: "Preparing the combined update did not finish.",
      });
      resetIDSMasterState();
    }
  }

  /**
   * Disables the IDS Master action buttons.
   * @returns {void}
   */
  function disableIDSMasterButtons() {
    const buttons = [

      "updateSubsheetsOnlyButton",
      "updateMasterAndSubsheetsButton",
      "convertToCollectionButton",
    ];
    buttons.forEach((buttonId) => {
      const button = document.getElementById(buttonId);
      if (button) button.disabled = true;
    });
  }

  /**
   * Enables the IDS Master action buttons.
   * @returns {void}
   */
  function enableIDSMasterButtons() {
    const buttons = [

      "updateSubsheetsOnlyButton",
      "updateMasterAndSubsheetsButton",
      "convertToCollectionButton",
    ];
    buttons.forEach((buttonId) => {
      const button = document.getElementById(buttonId);
      if (button) button.disabled = false;
    });
  }

  /**
   * Hides the IDS Master action buttons.
   * @returns {void}
   */
  function hideIDSMasterButtons() {
    const buttons = [

      "updateSubsheetsOnlyButton",
      "updateMasterAndSubsheetsButton",
      "convertToCollectionButton",
    ];
    buttons.forEach((buttonId) => {
      const button = document.getElementById(buttonId);
      if (button) button.style.display = "none";
    });
  }

  /**
   * Returns the IDS Master controls to their idle state.
   * @returns {void}
   */
  function resetIDSMasterState() {

    isCombinedUpdate = false;
    masterIdsWritten = false;

    mergeLegacyThemesSheets = false;

    isUpdateSingleSheetFlow = false;

    isConvertToMasterFlow = false;
    isConvertToCollectionFlow = false;

    cachedMasterTemplateInfo = null;

    cachedTemplatesWithSameVersion = null;

    enableIDSMasterButtons();

    sheetType = "IDS Master";
    idMasterID = oldSheetID;
    isUpdateSingleSheetFlow = true;
    isCombinedUpdate = false;
    renderIdMasterOptions();
  }

  /**
   * Returns the controls to the IDS Collection starting state.
   * @returns {void}
   */
  function resetToCollectionState() {
    isCombinedUpdate = false;
    masterIdsWritten = false;
    mergeLegacyThemesSheets = false;
    isUpdateSingleSheetFlow = false;
    isConvertToMasterFlow = false;
    isConvertToCollectionFlow = false;
    sheetType = "IDS Collection";
    versionDifference = null;
    masterVersionDifference = null;
    enableUpdateSingleSheetButton();
    showUpdateSingleSheetButton();
  }
</script>
