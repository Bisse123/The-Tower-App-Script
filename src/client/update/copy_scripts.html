<script>
  /**
   * Joins sheet type names as "A, B and C".
   * @param {string[]} names
   * @returns {string}
   */
  function formatSheetTypeList(names) {
    if (names.length === 0) return "";
    if (names.length === 1) return names[0];
    if (names.length === 2) return `${names[0]} and ${names[1]}`;
    return `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
  }

  /**
   * Sentence naming the templates that cannot be copied.
   * @param {Array<Object>} blocked
   * @returns {string}
   */
  function describeBlockedTemplates(blocked) {
    const byLabel = new Map();
    blocked.forEach((skipped) => {
      const label = skipped.label || "unavailable";
      if (!byLabel.has(label)) byLabel.set(label, []);
      byLabel.get(label).push(skipped.sheetType);
    });
    return Array.from(byLabel, ([label, names]) => {
      const verb = names.length === 1 ? "is" : "are";
      return `${formatSheetTypeList(names)} ${verb} ${label}`;
    });
  }

  /**
   * Notice markup for templates that cannot be copied.
   * @param {Array<Object>} blocked
   * @returns {string} "" when nothing is blocked.
   */
  function blockedTemplatesNoticeHtml(blocked) {
    if (!blocked || blocked.length === 0) return "";
    const items = blocked
      .map(
        (skipped) =>
          `<li><strong>${skipped.sheetType}</strong> — ${
            skipped.label || "unavailable"
          }</li>`,
      )
      .join("");
    return `
      <div class="notOwnedWarning">
        <div class="notOwnedWarningTitle">🚧 Held back for now</div>
        <ul class="notOwnedWarningList">${items}</ul>
        <small>These templates are not ready to be handed out yet. Run this again once they have been released.</small>
      </div>`;
  }

  /**
   * Message for when a copy mode has nothing left to copy.
   * @param {string} copyMode
   * @param {Array<Object>} blocked
   * @returns {string}
   */
  function describeNothingToCopy(copyMode, blocked) {
    const parts = describeBlockedTemplates(blocked);
    const subject = blocked.length === 1 ? "it" : "they";
    if (copyMode === "update") {
      if (parts.length === 0) {
        return "Every sheet is already on the latest version, so there is nothing to update.";
      }
      return `${parts.join(", and ")}, so ${subject} cannot be updated yet. Every other sheet is already on the latest version.`;
    }
    if (parts.length === 0) {
      return "No templates were found to copy.";
    }
    return `${parts.join(", and ")}, so ${subject} cannot be copied yet.`;
  }

  /**
   * Entry point for the update workflow's template copying.
   * @param {string} copyMode
   * @returns {Promise<void>}
   */
  async function copyTemplates(copyMode) {
    copyMode = copyMode || "all";
    currentCopyMode = copyMode;

    setStatusWithSpinner("Getting template and sheet information...");

    try {
      let templateInfo, sheetIds;

      if (cachedTemplateInfo && cachedSheetIds) {
        console.log("Using cached template info and sheet IDs for copy check");
        templateInfo = cachedTemplateInfo;
        sheetIds = cachedSheetIds;
        cachedSkippedTemplates = cachedSkippedTemplates || [];
      } else {
        console.log("No cached IDs found, fetching from server");
        const idsResult = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getTemplateAndsheetIds(idMasterID, copyMode);
        });

        if (!idsResult.success) {
          throw new Error(idsResult.message);
        }

        templateInfo = idsResult.templateInfo;
        sheetIds = idsResult.sheetIds;

        cachedTemplateInfo = templateInfo;
        cachedSheetIds = sheetIds;
        cachedSkippedTemplates = idsResult.skippedTemplates || [];
      }

      if (isCombinedUpdate) {
        const masterTemplateId = cachedMasterTemplateInfo
          ? cachedMasterTemplateInfo.templateID
          : null;
        if (!masterTemplateId) {
          throw new Error("Missing IDS Master template information.");
        }

        const masterTemplateVersion = cachedMasterTemplateInfo
          ? cachedMasterTemplateInfo.templateVersion ||
            cachedMasterTemplateInfo.version ||
            ""
          : "";
        const masterSheetType =
          cachedMasterTemplateInfo && cachedMasterTemplateInfo.sheetType
            ? cachedMasterTemplateInfo.sheetType
            : "IDS Master";

        const hasMasterTemplate = templateInfo.some(
          (template) => template.templateID === masterTemplateId,
        );
        if (!hasMasterTemplate) {
          templateInfo = templateInfo.concat([
            {
              templateID: masterTemplateId,
              templateVersion: masterTemplateVersion,
              sheetType: masterSheetType,
            },
          ]);
        }
      }

      console.log(`Template Info:`, templateInfo);
      console.log(`Sheet IDs: ${sheetIds}`);
      setStatusWithSpinner(
        `Checking access to ${templateInfo.length} templates and ${sheetIds.length} sheets...`,
      );

      var templateResults = {};
      var oldSheetResults = {};
      const blockedTemplates = (cachedSkippedTemplates || []).filter(
        (skipped) => skipped.blocked,
      );
      var nothingToCopy = false;
      var message = describeNothingToCopy(copyMode, blockedTemplates);
      if (templateInfo.length !== 0 && sheetIds.length !== 0) {
        [templateResults, oldSheetResults] = await Promise.all([
          checkMultipleTemplateAccess(templateInfo),
          checkMultipleSheetAccess(sheetIds),
        ]);
        if (!templateResults.success) {
          message = `${templateResults.message}`;
        } else if (!oldSheetResults.success) {
          message = `${oldSheetResults.message}`;
        } else {
          message = `Access check completed for ${templateInfo.length} templates and ${sheetIds.length} sheets.`;
        }
      } else {
        nothingToCopy = true;
      }
      const result = {
        success: templateResults.success && oldSheetResults.success,
        nothingToCopy: nothingToCopy,
        blockedTemplates: blockedTemplates,
        message: message,
        templateResults: templateResults,
        oldSheetResults: oldSheetResults,
      };

      onTemplateAndOldSheetAccessCheckSuccess(result);
    } catch (error) {
      AppError.log(error, "copyTemplates: Parallel access check failed");
      resetIDSMasterState();

      cachedTemplateInfo = null;
      cachedSheetIds = null;
      cachedSkippedTemplates = null;

      onTemplateAndOldSheetAccessCheckFailure(error);
    }
  }

  /**
   * Copies every accessible template in parallel, then reports the failures.
   * @param {string} copyMode
   * @returns {Promise<void>}
   */
  async function proceedWithTemplateCopying(copyMode) {
    if (isCombinedUpdate) {
      const masterTemplateId = cachedMasterTemplateInfo
        ? cachedMasterTemplateInfo.templateID
        : null;
      const masterTemplateVersion = cachedMasterTemplateInfo
        ? cachedMasterTemplateInfo.version ||
          cachedMasterTemplateInfo.templateVersion ||
          ""
        : "";
      const masterSheetType =
        cachedMasterTemplateInfo && cachedMasterTemplateInfo.sheetType
          ? cachedMasterTemplateInfo.sheetType
          : "IDS Master";

      if (!masterTemplateId) {
        console.error("Missing IDS Master template info for combined update");
        setStatusText("Missing IDS Master template information.");
        if (isConvertToMasterFlow) {
          resetToCollectionState();
        } else {
          resetIDSMasterState();
        }
        return;
      }

      const subsheetTemplates = templateAccessibleFilesCache.map((template) => ({
        templateID: template.id,
        sheetType: template.sheetType,
        version: template.version || template.templateVersion || "",
      }));

      hasSubsheetsToUpdate = subsheetTemplates.length > 0;

      await proceedWithCombinedUpdate(
        {
          templateID: masterTemplateId,
          sheetType: masterSheetType,
          version: masterTemplateVersion,
        },
        subsheetTemplates,
      );
      return;
    }

    const totalTemplates = templateAccessibleFilesCache.length;
    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const selectedFileSummary = document.getElementById("selectedFileSummary");
    hasSubsheetsToUpdate = true;

    const modeDescription =
      copyMode === "update" ? "sheets with updates" : "sheets";

    let linksHtml =
      blockedTemplatesNoticeHtml(
        (cachedSkippedTemplates || []).filter((skipped) => skipped.blocked),
      ) + "<strong>📂 Created sheets for update:</strong>";
    selectedFileSummary.innerHTML = linksHtml;

    setStatusWithSpinner(`Copying ${totalTemplates} ${modeDescription}...`);

    let successCount = 0;
    let failedCount = 0;
    let completedCount = 0;

    const copyFailures = [];

    const copyPromises = templateAccessibleFilesCache.map((template, index) => {
      console.log(`Starting copy for ${template.sheetType} sheet:`, template);

      return new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function (result) {
            console.log(
              `Sheet ${template.sheetType} copied successfully:`,
              result,
            );

            let templateResult;
            if (result.success && result.fileId) {
              successCount++;
              templateResult = {
                success: true,
                sheetType: template.sheetType,
                fileId: result.fileId,
                gid: result.gid || "",
                version: template.version,
              };

              copiedTemplateFiles.push(templateResult);

              accessibleFilesCache.push({
                id: result.fileId,
                name: `Copy of ${template.sheetType} ${template.version}`,
                sheetType: template.sheetType,
              });

              linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${result.fileId}/edit" target="_blank">${template.sheetType} Sheet™</a>`;
            } else {
              failedCount++;
              const errorMessage =
                result.message || "Copy operation returned unsuccessful result";
              templateResult = {
                success: false,
                sheetType: template.sheetType,
                error: errorMessage,
              };
              copyFailures.push({
                sheetType: template.sheetType,
                error: errorMessage,
                envelope: result,
              });

              linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
            }

            completedCount++;
            selectedFileSummary.innerHTML = linksHtml;
            setStatusWithSpinner(
              `Copying sheets... (${completedCount}/${totalTemplates} completed)`,
            );

            resolve(templateResult);
          })
          .withFailureHandler(function (error) {
            console.error(`Error copying sheet ${template.sheetType}:`, error);

            failedCount++;
            completedCount++;

            const errorMessage = error.message || error;
            copyFailures.push({
              sheetType: template.sheetType,
              error: errorMessage,
              envelope: error,
            });

            linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
            selectedFileSummary.innerHTML = linksHtml;
            setStatusWithSpinner(
              `Copying sheets... (${completedCount}/${totalTemplates} completed)`,
            );

            resolve({
              success: false,
              sheetType: template.sheetType,
              error: errorMessage,
            });
          })
          .copyFileTemplate(
            template.id,
            template.sheetType,
            template.version,
            parentFolderID,
          );
      });
    });

    try {
      await Promise.all(copyPromises);

      const modeDescription =
        copyMode === "update" ? "sheets with updates" : "sheets";
      let statusMessage = `All ${modeDescription} copied successfully.`;
      if (failedCount > 0) {
        statusMessage = `${
          modeDescription.charAt(0).toUpperCase() + modeDescription.slice(1)
        } copying completed: ${successCount} successful, ${failedCount} failed`;
      }
      setStatusText(statusMessage);

      if (successCount > 0) {
        const titleModeDescription =
          copyMode === "update" ? "Sheet(s) with Updates" : "Sheet(s)";
        fileAccessTitle.innerHTML = `✅ ${successCount} ${titleModeDescription} Copied Successfully!`;
        if (failedCount > 0) {
          fileAccessTitle.innerHTML += ` (${failedCount} failed)`;
        }

        document.getElementById("addAnotherButton").style.display = "none";
        document.getElementById("instructionsSection").style.display = "none";
        document.getElementById("importButton").style.display = "inline-block";
        document.getElementById("importButton").innerText = "Import Data";
        document.getElementById("importButton").disabled = false;
        document.getElementById("moveSheetButton").style.display =
          "inline-block";
        document.getElementById("moveSheetButton").disabled = true;
        hideIDSMasterButtons();
      } else {
        const titleModeDescription =
          copyMode === "update" ? "Sheets with Updates" : "Sheets";
        fileAccessTitle.innerHTML = `❌ All ${totalTemplates} ${titleModeDescription} Failed to Copy`;
      }

      AppError.surfaceBatch(copyFailures, {
        source: "proceedWithTemplateCopying",
      });
    } catch (error) {
      AppError.show(error, {
        source: "proceedWithTemplateCopying",
        message: "Copying your sheets did not finish.",
      });
    } finally {

    }
  }

  /**
   * Creates the IDS Master, then its subsheets, reporting subsheet failures.
   * @param {Object} masterTemplate
   * @param {Array<Object>} subsheetTemplates
   * @returns {Promise<void>}
   */
  async function proceedWithCombinedUpdate(masterTemplate, subsheetTemplates) {
    try {
      const totalTemplates = 1 + subsheetTemplates.length;
      let successCount = 0;
      let failedCount = 0;
      let completedCount = 0;

      const subsheetFailures = [];

      let linksHtml =
        blockedTemplatesNoticeHtml(
          (cachedSkippedTemplates || []).filter((skipped) => skipped.blocked),
        ) + "<strong>📂 Created sheets for update:</strong>";
      document.getElementById("selectedFileSummary").innerHTML = linksHtml;

      setStatusWithSpinner(`Creating ${totalTemplates} sheets for update...`);

      console.log("Creating IDS Master sheet copy...");

      const masterResult = await new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function (result) {
            resolve({
              success: true,
              result: result,
            });
          })
          .withFailureHandler(function (error) {
            resolve({
              success: false,
              result: {
                success: false,
                message: error.message || error,
              },
            });
          })
          .copyFileTemplate(
            masterTemplate.templateID,
            masterTemplate.sheetType,
            masterTemplate.version,
            parentFolderID,
          );
      });

      completedCount++;
      if (masterResult.success && masterResult.result.success) {
        successCount++;
        const newMasterID = masterResult.result.fileId;
        newSheetID = newMasterID;
        idMasterID = newSheetID;

        console.log("✅ IDS Master sheet created successfully:", newMasterID);
        linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${newMasterID}/edit" target="_blank">IDS Master Sheet™</a>`;
      } else {
        failedCount++;
        const errorMessage =
          masterResult.result?.message || "IDS Master creation failed";
        console.error("❌ IDS Master sheet creation failed:", errorMessage);
        linksHtml += `<br>&nbsp;&nbsp;• ❌ IDS Master Sheet™ (failed)`;
      }

      document.getElementById("selectedFileSummary").innerHTML = linksHtml;
      setStatusWithSpinner(
        `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
      );

      if (!masterResult.success || !masterResult.result.success) {
        AppError.show(masterResult.result, {
          source: "createIdsMasterAndSubsheets",
          message: "Your IDS Master sheet could not be created, so the update stopped here.",
        });
        document.getElementById("fileAccessTitle").innerHTML =
          "❌ Update Failed";
        if (isConvertToMasterFlow) {
          resetToCollectionState();
        } else {
          resetIDSMasterState();
        }
        return;
      }

      if (hasSubsheetsToUpdate && subsheetTemplates.length > 0) {
        console.log(`Creating ${subsheetTemplates.length} subsheet copies...`);

        const subsheetCopyPromises = subsheetTemplates.map(
          (template, index) => {
            console.log(
              `Starting copy for ${template.sheetType} sheet:`,
              template,
            );

            return new Promise((resolve) => {
              google.script.run
                .withSuccessHandler(function (result) {
                  console.log(
                    `✅ ${template.sheetType} sheet copy result:`,
                    result,
                  );

                  let templateResult;
                  if (result.success && result.fileId) {
                    templateResult = {
                      success: true,
                      sheetType: template.sheetType,
                      version: template.version,
                      fileId: result.fileId,
                      gid: result.gid,
                    };

                    copiedTemplateFiles.push(templateResult);

                    accessibleFilesCache.push({
                      id: result.fileId,
                      name: `Copy of ${template.sheetType} ${template.version}`,
                      sheetType: template.sheetType,
                    });

                    linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${result.fileId}/edit" target="_blank">${template.sheetType} Sheet™</a>`;
                  } else {
                    const errorMessage =
                      result.message ||
                      "Copy operation returned unsuccessful result";
                    templateResult = {
                      success: false,
                      sheetType: template.sheetType,
                      error: errorMessage,
                    };
                    subsheetFailures.push({
                      sheetType: template.sheetType,
                      error: errorMessage,
                      envelope: result,
                    });

                    linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
                  }

                  completedCount++;
                  if (templateResult.success) {
                    successCount++;
                  } else {
                    failedCount++;
                  }

                  document.getElementById("selectedFileSummary").innerHTML =
                    linksHtml;
                  setStatusWithSpinner(
                    `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
                  );

                  resolve(templateResult);
                })
                .withFailureHandler(function (error) {
                  console.error(
                    `❌ Error copying sheet ${template.sheetType}:`,
                    error,
                  );

                  completedCount++;
                  failedCount++;
                  const errorMessage = error.message || error;
                  subsheetFailures.push({
                    sheetType: template.sheetType,
                    error: errorMessage,
                    envelope: error,
                  });

                  linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
                  document.getElementById("selectedFileSummary").innerHTML =
                    linksHtml;
                  setStatusWithSpinner(
                    `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
                  );

                  resolve({
                    success: false,
                    sheetType: template.sheetType,
                    error: errorMessage,
                  });
                })
                .copyFileTemplate(
                  template.templateID,
                  template.sheetType,
                  template.version,
                  parentFolderID,
                );
            });
          },
        );

        await Promise.all(subsheetCopyPromises);
      }

      const subsheetMessage = hasSubsheetsToUpdate
        ? ` and ${subsheetTemplates.length} subsheets`
        : "";

      let statusMessage;
      let titleMessage;

      if (failedCount === 0) {
        statusMessage = `🎉 All sheets created successfully! IDS Master${subsheetMessage} ready for import.`;
        titleMessage = `✅ Sheets Created Successfully!`;
      } else if (successCount === 0) {
        statusMessage = `❌ All ${totalTemplates} sheet creations failed.`;
        titleMessage = `❌ Sheet Creation Failed`;
      } else {
        statusMessage = `⚠️ Sheet creation completed: ${successCount} successful, ${failedCount} failed.`;
        titleMessage = `⚠️ Sheets Partially Created`;
      }

      setStatusText(statusMessage);
      document.getElementById("fileAccessTitle").innerHTML = titleMessage;

      AppError.surfaceBatch(subsheetFailures, {
        source: "proceedWithCombinedUpdate",
      });

      if (newSheetID) {

        document.getElementById("importButton").style.display = "inline-block";
        document.getElementById("importButton").disabled = false;
        document.getElementById("importButton").innerText = hasSubsheetsToUpdate
          ? "Import Subsheets"
          : "Import IDS Master";

        document.getElementById("moveSheetButton").style.display =
          "inline-block";
        document.getElementById("moveSheetButton").disabled = true;
        document.getElementById("moveSheetButton").innerText =
          hasSubsheetsToUpdate
            ? "Move Subsheets and Move/Update Master"
            : "Move IDS Master";
      }

      hideUpdateSingleSheetButton();
      hideIDSMasterButtons();
    } catch (error) {
      AppError.show(error, {
        source: "proceedWithCombinedUpdate",
        message: "The update did not finish.",
      });
      if (isConvertToMasterFlow) {
        resetToCollectionState();
      } else {
        resetIDSMasterState();
      }
    }
  }

  /**
   * Copies the template for a single-sheet update.
   * @returns {void}
   */
  function proceedWithUpdateSingleSheetTemplateCopy() {

    const templateID =
      cachedTemplateInfo && cachedTemplateInfo.length > 0
        ? cachedTemplateInfo[0].templateID
        : null;
    const templateVersion =
      cachedTemplateInfo && cachedTemplateInfo.length > 0
        ? cachedTemplateInfo[0].version
        : null;

    if (!oldSheetID || !templateID) {
      console.error(`Missing required IDs for ${sheetType} template copy`);
      setStatusText("Error: Missing required sheet or template ID");
      if (isConvertToCollectionFlow) {
        resetIDSMasterState();
      } else {
        resetUpdateSingleSheetButton();
      }
      return;
    }

    setStatusWithSpinner("Creating template copy...");

    google.script.run
      .withSuccessHandler(async function (copyResult) {
        if (copyResult.success) {

          setStatusText("Template copy created successfully!");

          hideUpdateSingleSheetButton();
          hideIDSMasterButtons();

          const importButton = document.getElementById("importButton");
          importButton.innerText = `Import ${sheetType} data`;
          importButton.style.display = "inline-block";
          importButton.disabled = false;

          const moveSheetButton = document.getElementById("moveSheetButton");
          moveSheetButton.innerText = `Move ${sheetType}`;
          moveSheetButton.style.display = "inline-block";
          moveSheetButton.disabled = true;

          newSheetID = copyResult.fileId;

          const newSheetFile = {
            id: newSheetID,
            name: copyResult.fileName || `${sheetType} Sheet Copy`,
          };
          accessibleFilesCache.push(newSheetFile);

          document.getElementById("fileAccessTitle").innerHTML =
            `✅ ${sheetType} Template Created Successfully!`;

          const selectedFileSummary = document.getElementById(
            "selectedFileSummary",
          );
          selectedFileSummary.innerHTML = `<strong>✅ Template copy created successfully!</strong><br>
              <a href="${googleLink}/${newSheetID}/edit" target="_blank" style="margin-left: 2em;">
                Open ${sheetType} Sheet
              </a><br>`;

          const addAnotherButton = document.getElementById("addAnotherButton");
          if (addAnotherButton) addAnotherButton.style.display = "none";

          const instructionsSection = document.getElementById(
            "instructionsSection",
          );
          if (instructionsSection) instructionsSection.style.display = "none";
        } else {
          console.error(
            "Template copy failed:",
            copyResult.message || "Template copy failed",
          );
          setStatusText(
            `Template copy failed: ${
              copyResult.message || "Template copy failed"
            }`,
          );
          if (isConvertToCollectionFlow) {
            resetIDSMasterState();
          } else {
            resetUpdateSingleSheetButton();
          }
        }
      })
      .withFailureHandler(function (error) {
        console.error("Template copy error:", error);
        AppError.show(error, {
          source: "proceedWithUpdateSingleSheetTemplateCopy",
          message: "A template could not be copied.",
        });
        if (isConvertToCollectionFlow) {
          resetIDSMasterState();
        } else {
          resetUpdateSingleSheetButton();
        }
      })
      .copyFileTemplate(templateID, sheetType, templateVersion, parentFolderID);
  }
</script>
