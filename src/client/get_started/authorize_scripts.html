<script>
  /**
   * Ensures scopes are granted, then loads the Get Started parameters.
   * @param {boolean} [forceTokenRefresh]
   * @returns {Promise<boolean>} Whether the workflow may continue.
   */
  async function authorizeGetStarted(forceTokenRefresh = false) {
    setStatusWithSpinner("Checking scope access permissions...");

    if (!accessToken || forceTokenRefresh) {
      const authSuccess = await getOAuthToken();
      if (!authSuccess) {
        return false;
      }
    }

    hideConsentModal();

    if (viewType === "sidebar") {
      try {
        var getStartedParams = await new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getGetStartedParameters();
        });

        var effectivePathsTemplateId = "";
        if (
          SHEET_TEMPLATES["effective-paths"] &&
          SHEET_TEMPLATES["effective-paths"][0] &&
          SHEET_TEMPLATES["effective-paths"][0].templateID
        ) {
          effectivePathsTemplateId =
            SHEET_TEMPLATES["effective-paths"][0].templateID;
        }

        if (
          getStartedParams &&
          getStartedParams.success &&
          getStartedParams.sheetId &&
          effectivePathsTemplateId &&
          getStartedParams.sheetId !== effectivePathsTemplateId
        ) {
          effectivePathsID = getStartedParams.sheetId;
        } else {
          effectivePathsID = "";
        }
      } catch (error) {
        AppError.log(error, "authorizeGetStarted: Error loading Get Started parameters");
        effectivePathsID = "";
      }
    }

    continueGetStarted();
    return true;
  }
</script>
