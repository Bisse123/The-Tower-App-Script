<style>
  /* =====================================================================
     Per-category layouts: vault, relics, lab
     ===================================================================== */

  .sfVaultGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 16%);
    gap: 4px;
    margin: 2px;
  }

  .sfRelicsGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 12%);
    gap: 4px;
    margin: 2px;
  }

  .sfLabGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 16%);
    gap: 5px;
    margin: 2px;
  }

  .sfLabItem {
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 4px 6px;
  }

  .sfPair {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 2px 0;
    border-bottom: 1px solid #f5f5f5;
    font-size: 0.95em;
  }
  .sfPairKey { color: #555; word-break: break-word; }
  .sfPairVal { color: #222; flex-shrink: 0; }

  /* =====================================================================
     Themes and songs columns
     ===================================================================== */

  .sfThemeColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .sfThemeColumn {
    min-width: 0;
    flex: 1 1 130px;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 6px 8px;
  }
  .sfThemeColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }
  .sfThemeItem { font-size: 0.95em; color: #333; padding: 1px 0; }

  .sfTag {
    display: inline-block;
    font-size: 0.85em;
    background: #eef1f8;
    color: #2752b0;
    border-radius: 3px;
    padding: 0 5px;
    font-weight: 600;
    vertical-align: middle;
  }
  .sfMul {
    color: #1e7e34;
    font-size: 0.95em;
    font-weight: 600;
    padding: 0 4px;
  }
  .sfBool.is-true { color: #1e7e34; font-weight: 600; }
  .sfBool.is-false { color: #c41010; font-weight: 600; }

  .sfLevelRow {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 1px 0;
    font-size: 0.95em;
  }
  .sfLevel {
    color: #2752b0;
    font-weight: 600;
    min-width: 28px;
    text-align: right;
    flex-shrink: 0;
  }
  .sfLevelName { color: #333; word-break: break-word; }

  /* =====================================================================
     Modules columns and substats
     ===================================================================== */

  .sfModuleColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-start;
  }
  .sfModuleColumn { min-width: 0; flex: 1 1 150px; }
  .sfModuleColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #777;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }
  .sfModMeta { font-size: 0.9em; color: #666; padding: 1px 0; }
  .sfModuleEntry {
    margin: 5px 0;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 4px 6px;
  }
  .sfModuleName, .sfMilestoneName { font-weight: 600; font-size: 0.9em; color: #444; }
  .sfSubstatRow {
    display: flex;
    justify-content: left;
    gap: 6px;
    font-size: 0.9em;
    color: #555;
    padding-left: 8px;
  }
  .sfSubstatRarity { color: #2752b0; flex-shrink: 0; }

  /* =====================================================================
     Ultimate weapon columns
     ===================================================================== */

  .sfUltimateColumns {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    align-items: start;
  }
  .sfUltimateColumns .sfBlock {
    margin: 0;
    min-width: 0;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 6px 8px;
  }
  .sfUltimateColumns .sfBlockHeader {
    text-align: center;
  }
  @media (max-width: 1100px) {
    .sfUltimateColumns { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 700px) {
    .sfUltimateColumns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 460px) {
    .sfUltimateColumns { grid-template-columns: minmax(0, 1fr); }
  }

  /* =====================================================================
     Cards columns and tiers
     ===================================================================== */

  .sfCardColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .sfCardColumn {
    min-width: 0;
    flex: 1 1 140px;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 6px 8px;
  }
  .sfCardColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }

  .sfTierRow {
    display: flex;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    align-items: flex-start;
  }
  .sfTierRow:last-child { border-bottom: none; }

  .sfTierMilestone {
    width: auto;
    min-width: 10%;
    max-width: 25%;
    min-width: 80px;
    display: flex;
    align-items: flex-start;
    padding-top: 2px;
    font-size: 0.95em;
  }

  .sfTierCol {
    flex: 1 1 0;
    min-width: 0;
    gap: 2px;
  }

  .sfTierColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #555;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }

  /* =====================================================================
     Player wave-cap toggle switch
     ===================================================================== */

  .sfPlayerWaveToggle {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 10px;
    background: #f6f7f8;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 5px 8px;
    margin-bottom: 8px;
  }
  .sfPlayerWaveOption {
    font-size: 0.95em;
    color: #888;
    cursor: pointer;
    user-select: none;
  }
  .sfPlayerWaveOption.is-active { color: #2752b0; font-weight: 600; }

  .sfPlayerWaveSwitch {
    position: relative;
    display: inline-block;
    flex-shrink: 0;
    width: 38px;
    height: 20px;
  }
  .sfPlayerWaveSwitch input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .sfPlayerWaveSlider {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #b9bec5;
    border-radius: 999px;
    transition: background 0.15s ease;
    pointer-events: none;
  }
  .sfPlayerWaveSlider::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s ease;
  }
  .sfPlayerWaveSwitch input:checked ~ .sfPlayerWaveSlider { background: #2752b0; }
  .sfPlayerWaveSwitch input:checked ~ .sfPlayerWaveSlider::before {
    transform: translateX(18px);
  }
  .sfPlayerWaveSwitch input:focus-visible ~ .sfPlayerWaveSlider {
    outline: 2px solid #2752b0;
    outline-offset: 2px;
  }
  .sfPlayerWaveSwitch input:disabled { cursor: not-allowed; }
  .sfPlayerWaveSwitch input:disabled ~ .sfPlayerWaveSlider { opacity: 0.5; }

  .sfTierStat {
    display: flex;
    justify-content: flex-start;
    gap: 10px;
    font-size: 0.95em;
    padding: 2px 0;
  }
  .sfTierStatKey { color: #888; }
  .sfTierStatVal { color: #222; }

  /* =====================================================================
     Bots columns
     ===================================================================== */

  .sfBotsColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .sfBotColumn { min-width: 0; flex: 1 1 120px; }
  .sfBotColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }

  /* =====================================================================
     Presets and workshop
     ===================================================================== */

  .sfPresetBox {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 6px 8px;
  }
  .sfPresetGroup {
    flex: 1 1 280px;
    min-width: 0;
  }
  .sfPresetGroupHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #888;
    margin-bottom: 4px;
  }
  .sfPresetTracks {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .sfWorkshopColumn { min-width: 0; flex: 1 1 140px; }
  .sfWorkshopColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }
</style>
