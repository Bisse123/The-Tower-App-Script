<div id="saveFileSection" class="section saveFileSection">
  <h3 class="title saveFileTitle">Import Data From Game</h3>

  <div id="saveFileAccessControls" class="saveFileAccessControls" style="display: none;">
    <p id="saveFileAccessSummary" class="selectedFileSummary">
      The script needs access to your IDS Master before you can import data.
    </p>
    <button id="saveFileAccessBtn" onclick="grantSaveFileAccess()">
      Grant Access to Files
    </button>
  </div>

  <div id="saveFileNotOwnedControls" class="saveFileNotOwnedControls" style="display: none;">
    <p id="saveFileNotOwnedSummary" class="selectedFileSummary"></p>
    <div id="saveFileNotOwnedList" class="saveFileNotOwnedList"></div>
  </div>

  <!-- Non-blocking amber warning for editable-but-not-owned sheets. Hidden while empty. -->
  <div id="saveFileWarning" class="saveFileWarning"></div>

  <div id="saveFileInputRow" class="saveFileInputRow">
    <div class="saveFileSource saveFileSourceDrive">
      <div class="saveFileSourceLabel">
        <svg class="saveFileDriveLogo" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
          <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/>
          <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
          <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
          <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
          <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
        </svg>
        From Google Drive
      </div>
      <div class="saveFileSourceControls">
        <button type="button" id="saveFileDriveBtn" class="saveFileDriveBtn" onclick="pickSaveFileFromDrive()" disabled>
          <svg class="saveFileDriveLogo" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
            <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/>
            <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
            <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
            <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
            <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
          </svg>
          Choose file from Drive
        </button>
      </div>
    </div>

    <div class="saveFileSourceDivider">or</div>

    <div class="saveFileSource saveFileSourceLocal">
      <div class="saveFileSourceLabel">
        <span class="saveFileSourceIcon" aria-hidden="true">💻</span>
        From your computer
      </div>
      <div class="saveFileSourceControls">
        <input type="file" id="saveFileInput" accept=".dat" disabled>
      </div>
    </div>
  </div>

  <div id="saveFileHeldName" class="saveFileHeldName" style="display: none;"></div>
  <div id="saveFileActionRow" class="saveFileActionRow">
    <button id="saveFileParseBtn" onclick="parseFile()" disabled>
      Parse File
    </button>

    <div id="saveFileImportControls" class="saveFileImportControls" style="display: none;">
      <button id="saveFileImportBtn" onclick="startSaveFileImport()" disabled>
        Import selected data
      </button>
    </div>
    <div id="saveFileViewControls" class="sfViewControls" style="display: none;">
      <button id="saveFileViewToggleBtn" type="button" onclick="toggleSaveFileViewMode()">
        Show only differences
      </button>
      <span id="saveFileDiffLegend" class="sfDiffLegend" style="display: none;">
        <span class="sfDiffOld">your sheet</span>
        <span class="sfDiffArrow">→</span>
        <span class="sfDiffNew">save file</span>
      </span>
    </div>
  </div>
  

  <div id="saveFileImportSummary" class="saveFileImportSummary"></div>

  <div id="saveFileResults"></div>
</div>
