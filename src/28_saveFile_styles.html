<style>
  /* Hidden until authorizeSaveFile() acquires the token (continueSaveFile). */
  .saveFileSection {
    background-color: #e8eefb;
    border-color: #2752b0;
  }

  .saveFileTitle {
    color: #1f4391;
  }

  .saveFileSection a {
    color: #2752b0;
  }

  /* Shown only when the IDS Master needs access (hides the rest) */
  .saveFileAccessControls .selectedFileSummary {
    margin: 0 0 14px;
    color: #2a3550;
  }

  /* Shown when the signed-in account doesn't own the sheet(s) — hard stop */
  .saveFileNotOwnedControls {
    padding: 12px 14px;
    color: #7a1d1d;
    line-height: 1.6;
    background: #fdecec;
    border: 1px solid #f3c2c2;
    border-left: 5px solid #d64545;
    border-radius: 6px;
  }
  .saveFileNotOwnedControls .selectedFileSummary {
    margin: 0 0 10px;
    color: #7a1d1d;
  }
  .saveFileNotOwnedControls .sfImportGroup {
    margin-bottom: 0;
  }

  /* Prominent, non-blocking warning callout (editable-but-not-owned sheets).
     Amber stands apart from the blue import summary and the red not-owned hard
     stop. High-contrast, near-black text keeps it readable and colorblind
     friendly; the boundary does not rely on hue alone. */
  .saveFileWarning {
    margin: 14px 0;
    padding: 12px 14px;
    background-color: #fff3cd;
    border: 1px solid #d39e00;
    border-left: 5px solid #b36b00;
    border-radius: 6px;
    color: #2b2200;
    font-size: 1em;
    line-height: 1.6;
    box-shadow: 0 1px 3px rgba(60, 64, 67, 0.18);
  }
  .saveFileWarning:empty {
    display: none;
  }

  .saveFileWarningTitle {
    font-weight: 700;
    color: #3d2f00;
    margin-bottom: 6px;
  }

  .saveFileWarningList {
    margin: 0;
    padding-left: 22px;
  }
  .saveFileWarningList li {
    margin: 2px 0;
    word-break: break-word;
  }

  /* Input + Import button side by side */
  .saveFileInputRow {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }

  .saveFileSection button {
    background-color: #2752b0;
    margin: 0;
  }
  .saveFileSection button:hover:not(:disabled) {
    background-color: #1f4391;
  }

  .saveFileSection input[type="file"] {
    border-color: #c7d3ec;
    background-color: #f4f6fb;
  }
  .saveFileSection input[type="file"]:hover {
    border-color: #2752b0;
    background-color: #eef1f8;
  }
  .saveFileSection input[type="file"]::file-selector-button {
    background-color: #2752b0;
  }
  .saveFileSection input[type="file"]::file-selector-button:hover {
    background-color: #1f4391;
  }

  /* ── Results ── */
  .saveFileResults {
    margin-top: 18px;
    display: none;
  }

  /* ── Collapsible category ── */
  .sfCategory {
    margin-bottom: 8px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    overflow: hidden;
    animation: slideIn 0.2s ease-out;
  }

  .sfCategoryHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    background: #f1f3f4;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .sfCategoryHeader:hover { background: #e8eaed; }

  .sfCategoryTitle {
    font-weight: 600;
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #444;
  }

  .sfCategoryChevron {
    font-size: 0.9em;
    color: #666;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .sfCategory.open .sfCategoryChevron { transform: rotate(90deg); }

  .sfCategoryBody {
    display: none;
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    background: #fff;
  }
  .sfCategory.open .sfCategoryBody { display: block; }

  /* ── Field rows ── */
  .sfFieldRow {
    display: grid;
    grid-template-columns: minmax(160px, 30%) 1fr;
    gap: 6px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 1em;
    align-items: start;
  }
  .sfFieldRow:last-child { border-bottom: none; }

  .sfFieldName {
    color: #555;
    font-weight: 500;
    word-break: break-word;
  }

  .sfFieldValue {
    color: #222;
    font-size: 1em;
    word-break: break-all;
  }

  .sfFieldValue.is-array {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }

  .sfArrayItem {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.95em;
    background: #f1f3f4;
    border: 1px solid #000000;
    color: #444;
  }
  .sfArrayItem.is-true  { background: #e6f4ea; color: #1e7e34; }
  .sfArrayItem.is-false { background: #f4f4f4; color: #999; }

  /* ── Nested objects / arrays ── */
  .sfNestedList,
  .sfNestedObject {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 2px;
  }

  .sfNestedItem {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 0.95em;
  }

  .sfNestedIndex {
    color: #999;
    font-size: 1em;
    flex-shrink: 0;
  }

  .sfNestedRow {
    display: grid;
    grid-template-columns: minmax(100px, 25%) 1fr;
    gap: 6px;
    padding: 2px 0;
    border-bottom: 1px solid #f5f5f5;
    font-size: 0.95em;
    align-items: baseline;
  }
  .sfNestedRow:last-child { border-bottom: none; }

  .sfNestedKey {
    color: #777;
    font-weight: 500;
    font-size: 0.95em;
    word-break: break-word;
  }

  .sfNestedVal {
    color: #333;
    font-size: 0.95em;
    word-break: break-all;
  }

  .sfPrimitive {
    color: #222;
  }

  .sfNull {
    color: #aaa;
    font-style: italic;
  }

  /* ── Missing fields ── */
  .sfMissingSection {
    margin-top: 12px;
    padding: 8px 12px;
    background: #fff8f0;
    border: 1px solid #f5c885;
    border-left: 5px solid #b36b00;
    border-radius: 6px;
    font-size: 0.95em;
    color: #7a4a00;
  }
  .sfMissingSection strong { display: block; margin-bottom: 4px; }

  .sfCategoryHeaderMain {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .sfCategoryCheckbox {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: #2752b0;
  }

  /* ── Import controls (inline, right of the file input) ── */
  .saveFileImportControls {
    display: inline-flex;
  }

  .saveFileSection button:disabled {
    background-color: #e0e0e0;
    color: #888;
    cursor: not-allowed;
  }

  /* ── Import result summary ── */
  .saveFileImportSummary {
    margin-top: 16px;
    padding: 12px 14px;
    font-size: 1em;
    color: #2a3550;
    line-height: 1.6;
    background: #eef1f8;
    border: 1px solid #c7d3ec;
    border-left: 5px solid #2752b0;
    border-radius: 6px;
  }
  .saveFileImportSummary:empty { display: none; }

  .sfImportGroup {
    margin-bottom: 8px;
  }
  .sfImportGroup strong { display: block; margin-bottom: 2px; }

  .sfBlock { margin: 6px 0 10px; }
  .sfBlockHeader {
    font-weight: 600;
    font-size: 1em;
    color: #333;
    padding: 3px 0;
    margin-bottom: 4px;
    border-bottom: 1px solid #eee;
  }

  .sfSubBlock { margin: 4px 0 6px 8px; }
  .sfSubBlockHeader {
    font-weight: 600;
    font-size: 0.9em;
    color: #555;
    margin-bottom: 3px;
  }

  .sfSubLabel {
    font-weight: 600;
    font-size: 0.9em;
    width: 100%;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #888;
    margin: 10px 0 4px;
  }

  /* Inline "chip" key/value pairs */
  .sfInlineKV {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 6px;
  }
  .sfInlinePair {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    background: #f6f7f8;
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 0.95em;
  }
  .sfInlineKey { color: #666; }
  .sfInlineVal { color: #222; }

  .sfVaultGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 16%);
    gap: 4px;
    margin: 2px;
  }

  .sfRelicsGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 12%);
    gap: 4px;
    margin: 2px;
  }

  .sfLabGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 16%);
    gap: 5px;
    margin: 2px;
  }

  .sfLabItem {
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 4px 6px;
  }

  .sfPair {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 2px 0;
    border-bottom: 1px solid #f5f5f5;
    font-size: 0.95em;
  }
  .sfPairKey { color: #555; word-break: break-word; }
  .sfPairVal { color: #222; flex-shrink: 0; }

  /* Themes & Songs: one column per type */
  .sfThemeColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .sfThemeColumn {
    min-width: 0;
    flex: 1 1 130px;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 6px 8px;
  }
  .sfThemeColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }
  .sfThemeItem { font-size: 0.95em; color: #333; padding: 1px 0; }

  .sfTag {
    display: inline-block;
    font-size: 0.85em;
    background: #eef1f8;
    color: #2752b0;
    border-radius: 3px;
    padding: 0 5px;
    font-weight: 600;
    vertical-align: middle;
  }
  .sfMul {
    color: #1e7e34;
    font-size: 0.95em;
    font-weight: 600;
    padding: 0 4px;
  }
  .sfBool.is-true { color: #1e7e34; font-weight: 600; }
  .sfBool.is-false { color: #c41010; font-weight: 600; }

  .sfLevelRow {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 1px 0;
    font-size: 0.95em;
  }
  .sfLevel {
    color: #2752b0;
    font-weight: 600;
    min-width: 28px;
    text-align: right;
    flex-shrink: 0;
  }
  .sfLevelName { color: #333; word-break: break-word; }

  .sfModuleColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-start;
  }
  .sfModuleColumn { min-width: 0; flex: 1 1 150px; }
  .sfModuleColHeader {
    font-weight: 600;
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;

  }
  .sfModMeta { font-size: 0.9em; color: #666; padding: 1px 0; }
  .sfModuleEntry {
    margin: 5px 0;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 4px 6px;
  }
  .sfModuleName, .sfMilestoneName { font-weight: 600; font-size: 0.9em; color: #444; }
  .sfSubstatRow {
    display: flex;
    justify-content: left;
    gap: 6px;
    font-size: 0.9em;
    color: #555;
    padding-left: 8px;
  }
  .sfSubstatRarity { color: #2752b0; flex-shrink: 0; }

  .sfCardColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .sfCardColumn {
    min-width: 0;
    flex: 1 1 140px;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 6px 8px;
  }
  .sfCardColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }

  /* Player & Stuff: 4-column tier rows */
  .sfTierRow {
    display: flex;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    align-items: flex-start;
  }
  .sfTierRow:last-child { border-bottom: none; }

  .sfTierMilestone {
    width: auto;
    min-width: 10%;
    max-width: 25%;
    min-width: 80px;
    display: flex;
    align-items: flex-start;
    padding-top: 2px;
    font-size: 0.95em;
  }

  .sfTierCol {
    flex: 1 1 0;
    min-width: 0;
    gap: 2px;
  }

  .sfTierColHeader {
    font-weight: 600;
    font-size: 0.9em; /* column label */
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #555;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }

  .sfTierStat {
    display: flex;
    justify-content: flex-start;
    gap: 10px;
    font-size: 0.95em;
    padding: 2px 0;
  }
  .sfTierStatKey { color: #888; }
  .sfTierStatVal { color: #222; }

  /* Bots: one column per preset */
  .sfBotsColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .sfBotColumn { min-width: 0; flex: 1 1 120px; }
  .sfBotColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }

  .sfWorkshopGroups {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .sfWorkshopGroupCol {
    flex: 1 1 0;
    min-width: 0;
  }

  .sfWorkshopColumns {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
    background: #f6f7f8;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 6px 8px;
  }
  .sfWorkshopColumn { min-width: 0; flex: 1 1 140px; }
  .sfWorkshopColHeader {
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 2px;
    margin-bottom: 3px;
  }

  /* ── Diff view (compare save file vs linked sheet) ── */
  .sfViewControls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }
  .sfDiffLegend {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9em;
  }

  /* Green check on category headers that have no differences (diff view). */
  .sfCategoryCheck {
    color: #1e7e34;
    font-weight: 700;
    flex-shrink: 0;
  }

  .sfDiffOld { color: #c41010; font-weight: 600; }
  .sfDiffNew { color: #2752b0; font-weight: 600; }
  .sfDiffArrow { color: #888; flex-shrink: 0; }

  /* Diff rows flow and wrap as whole units; each row sizes to its content and
     never breaks "old → new name" across lines (see .sfDiffRow nowrap). */
  .sfDiffGrid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 8px;
    margin: 2px 0;
  }
  .sfDiffRow {
    display: flex;
    align-items: baseline;
    flex-wrap: nowrap;
    white-space: nowrap;
    gap: 6px;
    padding: 3px 8px;
    font-size: 0.95em;
    background: #eef1f8;
    border: 1px solid #d3ddf0;
    border-radius: 4px;
  }
  .sfDiffName { color: #333; }

  /* Module diff: columns size to content so their (no-wrap) rows always fit,
     and stack their rows with a little breathing room between each. */
  .sfDiffModuleColumns .sfModuleColumn {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 0 0 auto;
    max-width: 100%;
    overflow-x: auto;
  }
  .sfDiffModuleColumns .sfModuleEntry {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .sfDiffChips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 2px 0;
  }
  .sfDiffAddItem { background: #e6f4ea; color: #1e7e34; border-color: #1e7e34; }
  .sfDiffRemItem { background: #fdecea; color: #c41010; border-color: #c41010; }

  .sfDiffNone {
    color: #1e7e34;
    font-size: 0.95em;
    padding: 4px 0;
  }
  .sfDiffUnavailable {
    color: #7a4a00;
    background: #fff8f0;
    border: 1px solid #f5c885;
    border-left: 5px solid #b36b00;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.95em;
  }
</style>
