<div id="fileAccessSection" class="section fileAccessSection">
  <h3 id="fileAccessTitle" class="title fileAccessTitle">
    📂 File Access Required
  </h3>
  <p id="selectedFileSummary" class="selectedFileSummary">
    Checking which files need access permissions...
  </p>
  <button
    id="addAnotherButton"
    onclick="addAnotherFile()"
    style="display: none"
  >
    Grant Access to Files
  </button>
  <button
    id="copyButton"
    onclick="copyTemplates('all')"
    style="display: none"
    disabled
  >
    Update All Subsheets
  </button>
  <button
    id="copyUpdateButton"
    onclick="copyTemplates('update')"
    style="display: none"
    disabled
  >
    Update Subsheets with new versions
  </button>
  <button
    id="importButton"
    onclick="importData()"
    style="display: none"
    disabled
  >
    Import data
  </button>
  <button
    id="moveSheetButton"
    onclick="moveSheet()"
    style="display: none"
    disabled
  >
    Move IDS Master
  </button>
  <button
    id="updateSingleSheetButton"
    onclick="updateSingleSheet()"
    style="display: none"
    disabled
  >
    Update Single Sheet
  </button>
  <button
    id="updateMasterOnlyButton"
    onclick="updateIDSMasterOnly()"
    style="display: none"
    disabled
  >
    📄 Update IDS Master Only
  </button>
  <button
    id="updateSubsheetsOnlyButton"
    onclick="updateSubsheetsOnly()"
    style="display: none"
    disabled
  >
    📋 Update Subsheets Only
  </button>
  <button
    id="updateMasterAndSubsheetsButton"
    onclick="updateMasterAndSubsheets()"
    style="display: none"
    disabled
  >
    🔄 Update Master & Subsheets
  </button>
</div>
