  // Google API initialization
  function gapiLoaded() {
    console.log("GAPI loaded, loading client and picker...");
    gapi.load("client:picker", {
      callback: initializePicker,
      onerror: function () {
        console.error("Failed to load GAPI client:picker");
        setStatusText("Failed to load Google™ APIs");
      },
    });
  }

  async function initializePicker() {
    try {
      console.log("Initializing GAPI client...");

      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: [
          "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest",
        ],
      });

      console.log("GAPI client initialized successfully");
      console.log(
        "Picker API available:",
        typeof google.picker !== "undefined",
      );

      pickerInited = true;

      authorizeAndContinue();
    } catch (error) {
      AppError.show(error, {
        source: "initializePicker",
        message: "This page could not finish loading. Reload and try again.",
      });
    }
  }

  function checkValidParameters() {
    setStatusWithSpinner("Checking file access...");
    console.log("Checking valid parameters...");
    console.log("Current parameters:", {
      newSheetID,
      oldSheetID,
      idMasterID,
      sheetType,
    });
    var fileIds = [newSheetID, oldSheetID, idMasterID].filter(
      (id) => id != null && id !== "",
    );
    if (
      sheetType === "IDS Collection" &&
      newSheetID &&
      oldSheetID &&
      !idMasterID
    ) {
      checkCollectionsAccess();
      return;
    } else if (sheetType === "Effective Paths" && oldSheetID && !newSheetID) {
      checkMultipleSheetAccess([oldSheetID])
        .then(onSheetAccessCheckSuccess)
        .catch(onSheetAccessCheckFailure);
      return;
    } else if (oldSheetID && !newSheetID) {
      checkMultipleSheetAccess(fileIds)
        .then(onSheetAccessCheckSuccess)
        .catch(onSheetAccessCheckFailure);
      return;
    } else if (!newSheetID || !oldSheetID || !idMasterID || !sheetType) {
      console.log(
        "Invalid or missing parameters:",
        newSheetID,
        oldSheetID,
        idMasterID,
        sheetType,
      );
      showSelectImportSection();
      return;
    } else if (new Set([newSheetID, oldSheetID, idMasterID]).size !== 3) {
      console.log(
        "Duplicate or invalid parameters detected:",
        newSheetID,
        oldSheetID,
        idMasterID,
      );
      if (newSheetID === oldSheetID) {
        setStatusText(
          "New and Old Sheet™ IDs cannot be the same. Make sure your linked IDs are correct.",
        );
      } else {
        setStatusText(
          "Duplicate or invalid file IDs detected. Please check your linked IDs.",
        );
      }
      hideAllSections();
      return;
    }

    showFileAccessSection();
    checkMultipleSheetAccess(fileIds)
      .then(onSheetAccessCheckSuccess)
      .catch(onSheetAccessCheckFailure);
  }

  function hideAllSections() {
    document.getElementById("selectImportSection").style.display = "none";
    document.getElementById("fileAccessSection").style.display = "none";
    document.getElementById("instructionsSection").style.display = "none";
  }

  function calculatePickerSize() {
    let pickerWidth, pickerHeight;
    if (isMobile) {
      pickerWidth = Math.min(window.innerWidth - 10, 900);
      pickerHeight = Math.min(window.innerHeight - 80, 700);

      pickerWidth = Math.max(pickerWidth, 320);
      pickerHeight = Math.max(pickerHeight, 450);
    } else {
      pickerWidth = 1400;
      pickerHeight = 900;
    }
    return { width: pickerWidth, height: pickerHeight };
  }

  function openMultiFilePicker() {
    if (!accessToken) {
      setStatusText("Please authorize first");
      return;
    }

    if (!pickerInited) {
      setStatusText("Picker not initialized yet");
      return;
    }

    if (typeof google === "undefined" || typeof google.picker === "undefined") {
      setStatusText("Google™ Picker API not loaded");
      console.error("Google Picker API not available");
      return;
    }

    // Collect all inaccessible files from separate caches
    const allInaccessibleFiles = [
      ...inaccessibleFilesCache,
      ...templateInaccessibleFilesCache,
    ];

    // Check if we have inaccessible files to show
    if (allInaccessibleFiles.length === 0) {
      setStatusText("No files need access permission");
      return;
    }

    // Extract file IDs from inaccessible files, filter out any without a valid id
    const inaccessibleFileIds = allInaccessibleFiles
      .map((file) => file.id)
      .filter((id) => typeof id === "string" && id.length > 0);
    if (inaccessibleFileIds.length !== allInaccessibleFiles.length) {
      console.warn(
        "Some inaccessible files are missing an id:",
        allInaccessibleFiles,
      );
    }

    console.log("Opening picker with inaccessible files:", {
      total: inaccessibleFileIds.length,
      templates: templateInaccessibleFilesCache.length,
      sheets: inaccessibleFilesCache.length,
      fileIds: inaccessibleFileIds,
    });

    try {
      setStatusText("Opening picker with files that need access...");

      const fileIdsString = inaccessibleFileIds.join(",");
      console.log("File IDs string:", fileIdsString);
      if (!fileIdsString) {
        setStatusText("No valid file IDs to show in picker.");
        return;
      }
      const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEET)
        .setFileIds(fileIdsString)
        .setIncludeFolders(false)
        .setSelectFolderEnabled(false)
        .setMode(google.picker.DocsViewMode.LIST)
        .setMimeTypes("application/vnd.google-apps.spreadsheet");

      console.log(
        "DocsView created with",
        inaccessibleFileIds.length,
        "inaccessible files",
      );

      const pickerSize = calculatePickerSize();

      const picker = new google.picker.PickerBuilder()
        .setDeveloperKey(API_KEY)
        .setAppId(APP_ID)
        .setOAuthToken(accessToken)
        .setSelectableMimeTypes("application/vnd.google-apps.spreadsheet")
        .addView(view)
        .setCallback(pickerCallback)
        .setOrigin(google.script.host.origin)
        .setSize(pickerSize.width, pickerSize.height);


      if (!isMobile || !isTouchOnlyDevice()) {
        picker.enableFeature(google.picker.Feature.MULTISELECT_ENABLED);
        console.log("Multi-select enabled for non-touch device");
      } else {
        console.log("Multi-select disabled for touch-only device");
      }

      if (isMobile) {
        picker.enableFeature(google.picker.Feature.NAV_HIDDEN);
      }

      const builtPicker = picker.build();

      console.log(
        "Picker built successfully with",
        inaccessibleFileIds.length,
        "inaccessible files",
      );

      const statusMessage = isMobile
        ? `Tap files to select (${inaccessibleFileIds.length} available)`
        : `Select the files you want to grant access to (${inaccessibleFileIds.length} files available).`;
      setStatusText(statusMessage);

      builtPicker.setVisible(true);
      console.log("Picker.setVisible(true) called");
    } catch (error) {
      AppError.show(error, {
        source: "openMultiFilePicker",
        message: "The Google file picker could not be opened. Reload and try again.",
      });
    }
  }

  async function pickerCallback(data) {
    console.log("Picker callback received:", data);
    try {
      if (data.action === google.picker.Action.PICKED) {
        const documents = data[google.picker.Response.DOCUMENTS];

        if (!documents || documents.length === 0) {
          setStatusText("No files selected");
          return;
        }

        setStatusText(
          `Access granted to ${documents.length} files. Rechecking access status...`,
        );

        var fileIds = [newSheetID, oldSheetID, idMasterID].filter(
          (id) => id != null && id !== "",
        );
        if (isUpdateSingleSheetFlow) {
          // We're in updateSingleSheet flow - automatically continue with template copy
          console.log(
            `${sheetType} picker completed in updateSingleSheet flow - continuing with template copy`,
          );

          // Use cached template info for re-checking access
          if (cachedTemplateInfo && cachedTemplateInfo.length > 0) {
            const templateInfo = cachedTemplateInfo;
            const sheetIds = [oldSheetID];

            // Continue the updateSingleSheet process by calling checkSingleSheetAccess again
            checkSingleSheetAccess(templateInfo, sheetIds)
              .then((accessResult) => {
                if (accessResult.success && accessResult.hasAccess) {
                  // Now we have access - continue with template copy in updateSingleSheet
                  proceedWithUpdateSingleSheetTemplateCopy();
                } else {
                  console.error("Still no access after picker:", accessResult);
                  setStatusText("Still missing access after file selection.");
                  if (isConvertToCollectionFlow) {
                    resetIDSMasterState();
                  } else {
                    resetUpdateSingleSheetButton();
                  }
                }
              })
              .catch((error) => {
                console.error("Error re-checking access after picker:", error);
                AppError.show(error, {
                  source: "pickerCallback",
                  message: "The script could not re-check access to your files.",
                });
                if (isConvertToCollectionFlow) {
                  resetIDSMasterState();
                } else {
                  resetUpdateSingleSheetButton();
                }
              });
          } else {
            console.error(
              "No cached template info available for re-checking access",
            );
            setStatusText(
              "Error: Missing template information for access check.",
            );
            if (isConvertToCollectionFlow) {
              resetIDSMasterState();
            } else {
              resetUpdateSingleSheetButton();
            }
          }
          return;
        } else if (sheetType === "IDS Master") {
          if (isCombinedUpdate) {
            // Handle combined update after access granted
            console.log("Rechecking access for combined update flow");

            if (currentCopyMode) {
              copyTemplates(currentCopyMode);
            } else {
              copyTemplates("update");
            }
          } else if (currentCopyMode) {
            copyTemplates(currentCopyMode);
          } else {
            checkMultipleSheetAccess([oldSheetID])
              .then(onSheetAccessCheckSuccess)
              .catch(onSheetAccessCheckFailure);
          }
          return;
        } else if (sheetType === "Effective Paths") {
          checkMultipleSheetAccess([oldSheetID])
            .then(onSheetAccessCheckSuccess)
            .catch(onSheetAccessCheckFailure);
          return;
        } else if (sheetType === "IDS Collection" && newSheetID && oldSheetID) {
          checkCollectionsAccess();
          return;
        }
        console.log("Re-checking access for selected files:", fileIds);
        checkMultipleSheetAccess(fileIds)
          .then(onSheetAccessCheckSuccess)
          .catch(onSheetAccessCheckFailure);
      } else if (data.action === google.picker.Action.CANCEL) {
        console.log("User cancelled the picker");
        setStatusText("File selection cancelled");
        document.getElementById("addAnotherButton").disabled = false;
        // document.getElementById("copyButton").disabled = false;
        // document.getElementById("copyUpdateButton").disabled = false;

        // Re-enable updateSingleSheetButton if we were in that flow
        if (isUpdateSingleSheetFlow) {
          if (isConvertToCollectionFlow) {
            resetIDSMasterState();
          } else {
            resetUpdateSingleSheetButton();
          }
        }

        // Reset combined update state if cancelled
        if (isCombinedUpdate) {
          enableIDSMasterButtons();
          resetIDSMasterState();
        }
      } else if (data.action === "loaded") {
        console.log("Picker loaded successfully");
        setStatusText("Picker loaded successfully");
      } else {
        console.log("Unknown picker action:", data.action);
        setStatusText(`Unknown action: ${data.action}`);
      }
    } catch (error) {
      AppError.show(error, {
        source: "pickerCallback",
        message: "The file picker returned something this page could not handle.",
      });
    }
  }

  function openSingleFilePicker(fileId, callback, options = {}) {
    if (!accessToken || !pickerInited) {
      setStatusText("Picker not ready or not authorized.");
      return callback(false);
    }
    try {
      const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEET)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(false)
        .setMode(google.picker.DocsViewMode.LIST)
        .setMimeTypes("application/vnd.google-apps.spreadsheet");

      if (typeof fileId === "string") {
        view.setFileIds(fileId);
      } else {
        view.setQuery(fileId.join(" "));
      }

      const pickerSize = calculatePickerSize();

      const picker = new google.picker.PickerBuilder()
        .setDeveloperKey(API_KEY)
        .setAppId(APP_ID)
        .setOAuthToken(accessToken)
        .setSelectableMimeTypes("application/vnd.google-apps.spreadsheet")
        .addView(view)
        .setCallback(function (data) {
          if (data.action === google.picker.Action.PICKED) {
            callback(data.docs[0][google.picker.Document.ID]);
          } else if (data.action !== "loaded") {
            callback(null);
          }
        })
        .setOrigin(google.script.host.origin)
        .setSize(pickerSize.width, pickerSize.height);

      // Mobile-specific optimizations
      if (isMobile) {
        picker.enableFeature(google.picker.Feature.NAV_HIDDEN);
      }

      const builtPicker = picker.build();
      builtPicker.setVisible(true);
      console.log("Picker.setVisible(true) called");
    } catch (e) {
      AppError.log(e, "openSingleFilePicker: Picker error");
      setStatusText("Picker error: " + (e.message || e));
      callback(null);
    }
  }

  async function checkCollectionsAccess() {
    setStatusWithSpinner("Checking access to collections sheet...");

    try {
      // First check access to the oldSheetID
      console.log("Checking access to oldSheetID:", oldSheetID);
      const sheetAccess = await checkMultipleSheetAccess([
        newSheetID,
        oldSheetID,
      ]);

      if (!sheetAccess.success || sheetAccess.inaccessibleFiles.length > 0) {
        onSheetAccessCheckSuccess(sheetAccess);
        return;
      }

      let sheetIds;

      if (cachedSheetIds) {
        console.log("Using cached sheet IDs for collections access check");
        sheetIds = cachedSheetIds;
      } else {
        console.log("No cached sheet IDs found, fetching from server");
        setStatusWithSpinner("Getting sheet information from collections...");

        // Get sheet IDs from server (we only need sheetIds, not templateInfo)
        const idsResult = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getTemplateAndsheetIds(oldSheetID, currentCopyMode || "all");
        });

        if (!idsResult.success) {
          if (idsResult.collection) {
            onSheetAccessCheckSuccess(sheetAccess);
            return;
          } else {
            throw new Error(
              idsResult.message ||
                "Failed to retrieve sheet IDs from collections.",
            );
          }
        }

        // Cache the sheet IDs (we don't need template info for collections)
        cachedSheetIds = [newSheetID, ...idsResult.sheetIds];
        sheetIds = cachedSheetIds;
      }

      console.log(
        `Using ${sheetIds.length} sheet IDs from collections:`,
        sheetIds,
      );

      setStatusWithSpinner(`Checking access to ${sheetIds.length} sheets...`);

      // Check access to all sheets using the existing success/failure handlers
      checkMultipleSheetAccess(sheetIds)
        .then(onSheetAccessCheckSuccess)
        .catch(onSheetAccessCheckFailure);
    } catch (error) {
      AppError.log(error, "checkCollectionsAccess: Collections access check failed");
      onSheetAccessCheckFailure(error);
    }
  }

  async function checkSingleSheetAccess(templateInfo, sheetIds) {
    setStatusWithSpinner(
      `Checking access to ${sheetType} template and sheet...`,
    );

    try {
      console.log(`Checking ${sheetType} access for template and sheet IDs:`, {
        templateInfo,
        sheetIds,
      });

      // Check access to both template and sheet in parallel
      const [templateResults, oldSheetResults] = await Promise.all([
        checkMultipleTemplateAccess(templateInfo),
        checkMultipleSheetAccess(sheetIds),
      ]);

      if (!templateResults.success || !oldSheetResults.success) {
        return {
          success: false,
          message: `Error checking access: ${
            !templateResults.success
              ? templateResults.message
              : oldSheetResults.message
          }`,
          hasAccess: false,
        };
      }

      // Check if we have access to both files
      const hasSheetAccess =
        oldSheetResults.accessibleFiles &&
        oldSheetResults.accessibleFiles.length > 0;
      const hasTemplateAccess =
        templateResults.accessibleFiles &&
        templateResults.accessibleFiles.length > 0;

      if (hasSheetAccess && hasTemplateAccess) {
        // Update accessible files cache (avoid duplicates)
        if (oldSheetResults.accessibleFiles) {
          oldSheetResults.accessibleFiles.forEach((file) => {
            if (!accessibleFilesCache.find((cached) => cached.id === file.id)) {
              accessibleFilesCache.push(file);
            }
          });
        }
        if (templateResults.accessibleFiles) {
          templateResults.accessibleFiles.forEach((file) => {
            if (
              !templateAccessibleFilesCache.find(
                (cached) => cached.id === file.id,
              )
            ) {
              templateAccessibleFilesCache.push(file);
            }
          });
        }

        return {
          success: true,
          message: `Access granted to both ${sheetType} sheet and template`,
          hasAccess: true,
        };
      } else {
        // Return information about which files need access
        return {
          success: true,
          message: "Some files need access permission",
          hasAccess: false,
          inaccessibleSheets: oldSheetResults.inaccessibleFiles || [],
          inaccessibleTemplates: templateResults.inaccessibleFiles || [],
        };
      }
    } catch (error) {
      AppError.log(error, "checkSingleSheetAccess: access check failed");
      return {
        success: false,
        message: error.message || error.toString(),
        hasAccess: false,
      };
    }
  }

  function formatSheetTypeList(names) {
    if (names.length === 0) return "";
    if (names.length === 1) return names[0];
    if (names.length === 2) return `${names[0]} and ${names[1]}`;
    return `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
  }

  function describeBlockedTemplates(blocked) {
    const byLabel = new Map();
    blocked.forEach((skipped) => {
      const label = skipped.label || "unavailable";
      if (!byLabel.has(label)) byLabel.set(label, []);
      byLabel.get(label).push(skipped.sheetType);
    });
    return Array.from(byLabel, ([label, names]) => {
      const verb = names.length === 1 ? "is" : "are";
      return `${formatSheetTypeList(names)} ${verb} ${label}`;
    });
  }

  function blockedTemplatesNoticeHtml(blocked) {
    if (!blocked || blocked.length === 0) return "";
    const items = blocked
      .map(
        (skipped) =>
          `<li><strong>${skipped.sheetType}</strong> — ${
            skipped.label || "unavailable"
          }</li>`,
      )
      .join("");
    return `
      <div class="notOwnedWarning">
        <div class="notOwnedWarningTitle">🚧 Held back for now</div>
        <ul class="notOwnedWarningList">${items}</ul>
        <small>These templates are not ready to be handed out yet. Run this again once they have been released.</small>
      </div>`;
  }

  function describeNothingToCopy(copyMode, blocked) {
    const parts = describeBlockedTemplates(blocked);
    const subject = blocked.length === 1 ? "it" : "they";
    if (copyMode === "update") {
      if (parts.length === 0) {
        return "Every sheet is already on the latest version, so there is nothing to update.";
      }
      return `${parts.join(", and ")}, so ${subject} cannot be updated yet. Every other sheet is already on the latest version.`;
    }
    if (parts.length === 0) {
      return "No templates were found to copy.";
    }
    return `${parts.join(", and ")}, so ${subject} cannot be copied yet.`;
  }

  async function copyTemplates(copyMode) {
    copyMode = copyMode || "all";
    currentCopyMode = copyMode;
    // document.getElementById("copyButton").disabled = true;
    // document.getElementById("copyUpdateButton").disabled = true;

    setStatusWithSpinner("Getting template and sheet information...");

    try {
      let templateInfo, sheetIds;

      if (cachedTemplateInfo && cachedSheetIds) {
        console.log("Using cached template info and sheet IDs for copy check");
        templateInfo = cachedTemplateInfo;
        sheetIds = cachedSheetIds;
        cachedSkippedTemplates = cachedSkippedTemplates || [];
      } else {
        console.log("No cached IDs found, fetching from server");
        const idsResult = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getTemplateAndsheetIds(idMasterID, copyMode);
        });

        if (!idsResult.success) {
          throw new Error(idsResult.message);
        }

        templateInfo = idsResult.templateInfo;
        sheetIds = idsResult.sheetIds;

        cachedTemplateInfo = templateInfo;
        cachedSheetIds = sheetIds;
        cachedSkippedTemplates = idsResult.skippedTemplates || [];
      }

      if (isCombinedUpdate) {
        const masterTemplateId = cachedMasterTemplateInfo
          ? cachedMasterTemplateInfo.templateID
          : null;
        if (!masterTemplateId) {
          throw new Error("Missing IDS Master template information.");
        }

        const masterTemplateVersion = cachedMasterTemplateInfo
          ? cachedMasterTemplateInfo.templateVersion ||
            cachedMasterTemplateInfo.version ||
            ""
          : "";
        const masterSheetType =
          cachedMasterTemplateInfo && cachedMasterTemplateInfo.sheetType
            ? cachedMasterTemplateInfo.sheetType
            : "IDS Master";

        const hasMasterTemplate = templateInfo.some(
          (template) => template.templateID === masterTemplateId,
        );
        if (!hasMasterTemplate) {
          templateInfo = templateInfo.concat([
            {
              templateID: masterTemplateId,
              templateVersion: masterTemplateVersion,
              sheetType: masterSheetType,
            },
          ]);
        }
      }

      console.log(`Template Info:`, templateInfo);
      console.log(`Sheet IDs: ${sheetIds}`);
      setStatusWithSpinner(
        `Checking access to ${templateInfo.length} templates and ${sheetIds.length} sheets...`,
      );

      var templateResults = {};
      var oldSheetResults = {};
      const blockedTemplates = (cachedSkippedTemplates || []).filter(
        (skipped) => skipped.blocked,
      );
      var nothingToCopy = false;
      var message = describeNothingToCopy(copyMode, blockedTemplates);
      if (templateInfo.length !== 0 && sheetIds.length !== 0) {
        [templateResults, oldSheetResults] = await Promise.all([
          checkMultipleTemplateAccess(templateInfo),
          checkMultipleSheetAccess(sheetIds),
        ]);
        if (!templateResults.success) {
          message = `${templateResults.message}`;
        } else if (!oldSheetResults.success) {
          message = `${oldSheetResults.message}`;
        } else {
          message = `Access check completed for ${templateInfo.length} templates and ${sheetIds.length} sheets.`;
        }
      } else {
        nothingToCopy = true;
      }
      const result = {
        success: templateResults.success && oldSheetResults.success,
        nothingToCopy: nothingToCopy,
        blockedTemplates: blockedTemplates,
        message: message,
        templateResults: templateResults,
        oldSheetResults: oldSheetResults,
      };

      onTemplateAndOldSheetAccessCheckSuccess(result);
    } catch (error) {
      AppError.log(error, "copyTemplates: Parallel access check failed");
      resetIDSMasterState();
      // document.getElementById("copyButton").disabled = false;
      // document.getElementById("copyUpdateButton").disabled = false;

      cachedTemplateInfo = null;
      cachedSheetIds = null;
      cachedSkippedTemplates = null;

      onTemplateAndOldSheetAccessCheckFailure(error);
    }
  }

  async function onTemplateAndOldSheetAccessCheckSuccess(result) {
    console.log("Template and sheet access check result:", result);

    try {
      if (result.nothingToCopy) {
        const blocked = result.blockedTemplates || [];
        console.log("Nothing to copy:", result.message);
        setStatusText(result.message);
        document.getElementById("fileAccessTitle").innerHTML =
          blocked.length > 0
            ? `🚧 Update Unavailable`
            : `✅ Everything Is Up To Date`;
        document.getElementById("selectedFileSummary").innerHTML =
          `<p>${result.message}</p>` + blockedTemplatesNoticeHtml(blocked);
        accessibleFilesCache = [];
        inaccessibleFilesCache = [];
        notOwnedFilesCache = [];
        warningFilesCache = [];
        templateAccessibleFilesCache = [];
        templateInaccessibleFilesCache = [];
        resetIDSMasterState();
        return;
      }

      if (result.success) {
        // Update all file caches with results
        accessibleFilesCache = result.oldSheetResults.accessibleFiles || [];
        inaccessibleFilesCache = result.oldSheetResults.inaccessibleFiles || [];
        notOwnedFilesCache = result.oldSheetResults.notOwnedFiles || [];
        warningFilesCache = result.oldSheetResults.warningFiles || [];
        templateAccessibleFilesCache =
          result.templateResults.accessibleFiles || [];
        templateInaccessibleFilesCache =
          result.templateResults.inaccessibleFiles || [];

        if (
          isCombinedUpdate &&
          cachedMasterTemplateInfo &&
          cachedMasterTemplateInfo.templateID
        ) {
          const masterTemplateId = cachedMasterTemplateInfo.templateID;
          templateAccessibleFilesCache = templateAccessibleFilesCache.filter(
            (template) => template.id !== masterTemplateId,
          );
        }

        const totalInaccessibleFiles =
          inaccessibleFilesCache.length + templateInaccessibleFilesCache.length;

        // Check if any files still need access permission
        if (totalInaccessibleFiles > 0) {
          // Still have inaccessible files - open picker again
          let statusMessages = [];
          if (templateInaccessibleFilesCache.length > 0) {
            statusMessages.push(
              `${templateInaccessibleFilesCache.length} template(s)`,
            );
          }
          if (inaccessibleFilesCache.length > 0) {
            statusMessages.push(`${inaccessibleFilesCache.length} sheet(s)`);
          }

          setStatusWithSpinner(
            `${statusMessages.join(
              " and ",
            )} still need access. Opening file picker...`,
          );

          console.log("Still have inaccessible files, opening picker again:", {
            templates: templateInaccessibleFilesCache,
            oldSheets: inaccessibleFilesCache,
          });

          // Directly open the multi-file picker
          openMultiFilePicker();
          return;
        }

        // All files are accessible - proceed with template copying using stored copy mode
        setStatusText(
          "All files accessible. Proceeding with template copying...",
        );
        console.log(
          "All files accessible, proceeding with template copying using mode:",
          currentCopyMode,
        );

        // Call the template copying function from the fileAccess scripts
        proceedWithTemplateCopying(currentCopyMode);
      } else {
        console.error("Template and sheet access check failed:", result.message);
        resetIDSMasterState();
        AppError.show(result, { source: "onTemplateAndOldSheetAccessCheckSuccess" });
        const title = document.getElementById("fileAccessTitle");
        title.innerHTML = `❌ Access Check Failed`;
        const summary = document.getElementById("selectedFileSummary");
        summary.innerHTML = `
        <p>${result.message}</p>
      `;
        accessibleFilesCache = [];
        inaccessibleFilesCache = [];
        notOwnedFilesCache = [];
        warningFilesCache = [];
        templateAccessibleFilesCache = [];
        templateInaccessibleFilesCache = [];
        // document.getElementById("copyButton").disabled = false;
        // document.getElementById("copyUpdateButton").disabled = false;
      }
    } catch (error) {
      AppError.show(error, {
        source: "onTemplateAndOldSheetAccessCheckSuccess",
        message: "The script could not check access to your files.",
      });
      resetIDSMasterState();
    }
  }

  async function proceedWithTemplateCopying(copyMode) {
    if (isCombinedUpdate) {
      const masterTemplateId = cachedMasterTemplateInfo
        ? cachedMasterTemplateInfo.templateID
        : null;
      const masterTemplateVersion = cachedMasterTemplateInfo
        ? cachedMasterTemplateInfo.version ||
          cachedMasterTemplateInfo.templateVersion ||
          ""
        : "";
      const masterSheetType =
        cachedMasterTemplateInfo && cachedMasterTemplateInfo.sheetType
          ? cachedMasterTemplateInfo.sheetType
          : "IDS Master";

      if (!masterTemplateId) {
        console.error("Missing IDS Master template info for combined update");
        setStatusText("Missing IDS Master template information.");
        if (isConvertToMasterFlow) {
          resetToCollectionState();
        } else {
          resetIDSMasterState();
        }
        return;
      }

      const subsheetTemplates = templateAccessibleFilesCache.map((template) => ({
        templateID: template.id,
        sheetType: template.sheetType,
        version: template.version || template.templateVersion || "",
      }));

      hasSubsheetsToUpdate = subsheetTemplates.length > 0;

      await proceedWithCombinedUpdate(
        {
          templateID: masterTemplateId,
          sheetType: masterSheetType,
          version: masterTemplateVersion,
        },
        subsheetTemplates,
      );
      return;
    }

    const totalTemplates = templateAccessibleFilesCache.length;
    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const selectedFileSummary = document.getElementById("selectedFileSummary");
    hasSubsheetsToUpdate = true;

    const modeDescription =
      copyMode === "update" ? "sheets with updates" : "sheets";

    let linksHtml =
      blockedTemplatesNoticeHtml(
        (cachedSkippedTemplates || []).filter((skipped) => skipped.blocked),
      ) + "<strong>📂 Created sheets for update:</strong>";
    selectedFileSummary.innerHTML = linksHtml;

    setStatusWithSpinner(`Copying ${totalTemplates} ${modeDescription}...`);

    let successCount = 0;
    let failedCount = 0;
    let completedCount = 0;
    // The failure envelopes, kept so the copies that failed can be reported.
    // The "❌ … (failed)" lines below are the record of what happened to each
    // sheet; they carry no reference and reach no log, and a bug the browser
    // never hands back is never written at all (see 00_Errors.js).
    const copyFailures = [];

    // Create promises for all template copying operations with immediate UI updates
    const copyPromises = templateAccessibleFilesCache.map((template, index) => {
      console.log(`Starting copy for ${template.sheetType} sheet:`, template);

      return new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function (result) {
            console.log(
              `Sheet ${template.sheetType} copied successfully:`,
              result,
            );

            let templateResult;
            if (result.success && result.fileId) {
              successCount++;
              templateResult = {
                success: true,
                sheetType: template.sheetType,
                fileId: result.fileId,
                gid: result.gid || "",
                version: template.version,
              };

              copiedTemplateFiles.push(templateResult);

              // Add the newly copied file to accessible files cache
              accessibleFilesCache.push({
                id: result.fileId,
                name: `Copy of ${template.sheetType} ${template.version}`,
                sheetType: template.sheetType,
              });

              linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${result.fileId}/edit" target="_blank">${template.sheetType} Sheet™</a>`;
            } else {
              failedCount++;
              const errorMessage =
                result.message || "Copy operation returned unsuccessful result";
              templateResult = {
                success: false,
                sheetType: template.sheetType,
                error: errorMessage,
              };
              copyFailures.push({
                sheetType: template.sheetType,
                error: errorMessage,
                envelope: result,
              });

              // Immediately add failure message to display
              linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
            }

            // Update UI immediately
            completedCount++;
            selectedFileSummary.innerHTML = linksHtml;
            setStatusWithSpinner(
              `Copying sheets... (${completedCount}/${totalTemplates} completed)`,
            );

            resolve(templateResult);
          })
          .withFailureHandler(function (error) {
            console.error(`Error copying sheet ${template.sheetType}:`, error);

            failedCount++;
            completedCount++;

            const errorMessage = error.message || error;
            copyFailures.push({
              sheetType: template.sheetType,
              error: errorMessage,
              envelope: error,
            });

            // Immediately add failure message to display
            linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
            selectedFileSummary.innerHTML = linksHtml;
            setStatusWithSpinner(
              `Copying sheets... (${completedCount}/${totalTemplates} completed)`,
            );

            resolve({
              success: false,
              sheetType: template.sheetType,
              error: errorMessage,
            });
          })
          .copyFileTemplate(
            template.id,
            template.sheetType,
            template.version,
            parentFolderID,
          );
      });
    });

    // Wait for all copying operations to complete
    try {
      await Promise.all(copyPromises);

      // Final status update
      const modeDescription =
        copyMode === "update" ? "sheets with updates" : "sheets";
      let statusMessage = `All ${modeDescription} copied successfully.`;
      if (failedCount > 0) {
        statusMessage = `${
          modeDescription.charAt(0).toUpperCase() + modeDescription.slice(1)
        } copying completed: ${successCount} successful, ${failedCount} failed`;
      }
      setStatusText(statusMessage);

      // Update title
      if (successCount > 0) {
        const titleModeDescription =
          copyMode === "update" ? "Sheet(s) with Updates" : "Sheet(s)";
        fileAccessTitle.innerHTML = `✅ ${successCount} ${titleModeDescription} Copied Successfully!`;
        if (failedCount > 0) {
          fileAccessTitle.innerHTML += ` (${failedCount} failed)`;
        }

        // document.getElementById("copyButton").style.display = "none";
        // document.getElementById("copyUpdateButton").style.display = "none";
        document.getElementById("addAnotherButton").style.display = "none";
        document.getElementById("instructionsSection").style.display = "none";
        document.getElementById("importButton").style.display = "inline-block";
        document.getElementById("importButton").innerText = "Import Data";
        document.getElementById("importButton").disabled = false;
        document.getElementById("moveSheetButton").style.display =
          "inline-block";
        document.getElementById("moveSheetButton").disabled = true;
        hideIDSMasterButtons();
      } else {
        const titleModeDescription =
          copyMode === "update" ? "Sheets with Updates" : "Sheets";
        fileAccessTitle.innerHTML = `❌ All ${totalTemplates} ${titleModeDescription} Failed to Copy`;
      }

      // After the status line, so the panel it raises is not immediately
      // cleared again by setStatusWithSpinner.
      AppError.surfaceBatch(copyFailures, {
        source: "proceedWithTemplateCopying",
      });
    } catch (error) {
      AppError.show(error, {
        source: "proceedWithTemplateCopying",
        message: "Copying your sheets did not finish.",
      });
    } finally {
      // document.getElementById("copyButton").disabled = false;
      // document.getElementById("copyUpdateButton").disabled = false;
    }
  }
  
  async function proceedWithCombinedUpdate(masterTemplate, subsheetTemplates) {
    try {
      const totalTemplates = 1 + subsheetTemplates.length; // IDS Master + subsheets
      let successCount = 0;
      let failedCount = 0;
      let completedCount = 0;
      // Same reason as `copyFailures` in proceedWithTemplateCopying above:
      // the "❌ … (failed)" lines are a record, not a bug report, and the
      // envelope is the only thing carrying a reference and a code.
      const subsheetFailures = [];

      let linksHtml =
        blockedTemplatesNoticeHtml(
          (cachedSkippedTemplates || []).filter((skipped) => skipped.blocked),
        ) + "<strong>📂 Created sheets for update:</strong>";
      document.getElementById("selectedFileSummary").innerHTML = linksHtml;

      setStatusWithSpinner(`Creating ${totalTemplates} sheets for update...`);

      // Step 1: Create IDS Master sheet copy
      console.log("Creating IDS Master sheet copy...");

      const masterResult = await new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function (result) {
            resolve({
              success: true,
              result: result,
            });
          })
          .withFailureHandler(function (error) {
            resolve({
              success: false,
              result: {
                success: false,
                message: error.message || error,
              },
            });
          })
          .copyFileTemplate(
            masterTemplate.templateID,
            masterTemplate.sheetType,
            masterTemplate.version,
            parentFolderID,
          );
      });

      // Update progress for IDS Master
      completedCount++;
      if (masterResult.success && masterResult.result.success) {
        successCount++;
        const newMasterID = masterResult.result.fileId;
        newSheetID = newMasterID;
        idMasterID = newSheetID;

        console.log("✅ IDS Master sheet created successfully:", newMasterID);
        linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${newMasterID}/edit" target="_blank">IDS Master Sheet™</a>`;
      } else {
        failedCount++;
        const errorMessage =
          masterResult.result?.message || "IDS Master creation failed";
        console.error("❌ IDS Master sheet creation failed:", errorMessage);
        linksHtml += `<br>&nbsp;&nbsp;• ❌ IDS Master Sheet™ (failed)`;
      }

      // Update UI with IDS Master result
      document.getElementById("selectedFileSummary").innerHTML = linksHtml;
      setStatusWithSpinner(
        `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
      );

      // If IDS Master creation failed, stop the process gracefully
      if (!masterResult.success || !masterResult.result.success) {
        AppError.show(masterResult.result, {
          source: "createIdsMasterAndSubsheets",
          message: "Your IDS Master sheet could not be created, so the update stopped here.",
        });
        document.getElementById("fileAccessTitle").innerHTML =
          "❌ Update Failed";
        if (isConvertToMasterFlow) {
          resetToCollectionState();
        } else {
          resetIDSMasterState();
        }
        return;
      }

      // Step 2: Create all subsheet copies if there are any
      if (hasSubsheetsToUpdate && subsheetTemplates.length > 0) {
        console.log(`Creating ${subsheetTemplates.length} subsheet copies...`);

        // Create promises for all subsheet copying operations
        const subsheetCopyPromises = subsheetTemplates.map(
          (template, index) => {
            console.log(
              `Starting copy for ${template.sheetType} sheet:`,
              template,
            );

            return new Promise((resolve) => {
              google.script.run
                .withSuccessHandler(function (result) {
                  console.log(
                    `✅ ${template.sheetType} sheet copy result:`,
                    result,
                  );

                  let templateResult;
                  if (result.success && result.fileId) {
                    templateResult = {
                      success: true,
                      sheetType: template.sheetType,
                      version: template.version,
                      fileId: result.fileId,
                      gid: result.gid,
                    };

                    // Add to copiedTemplateFiles for later import
                    copiedTemplateFiles.push(templateResult);

                    // Add the newly copied file to accessible files cache
                    accessibleFilesCache.push({
                      id: result.fileId,
                      name: `Copy of ${template.sheetType} ${template.version}`,
                      sheetType: template.sheetType,
                    });

                    // Immediately add successful item to display
                    linksHtml += `<br>&nbsp;&nbsp;• <a href="${googleLink}/${result.fileId}/edit" target="_blank">${template.sheetType} Sheet™</a>`;
                  } else {
                    const errorMessage =
                      result.message ||
                      "Copy operation returned unsuccessful result";
                    templateResult = {
                      success: false,
                      sheetType: template.sheetType,
                      error: errorMessage,
                    };
                    subsheetFailures.push({
                      sheetType: template.sheetType,
                      error: errorMessage,
                      envelope: result,
                    });

                    // Immediately add failure message to display
                    linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
                  }

                  // Update UI immediately
                  completedCount++;
                  if (templateResult.success) {
                    successCount++;
                  } else {
                    failedCount++;
                  }

                  document.getElementById("selectedFileSummary").innerHTML =
                    linksHtml;
                  setStatusWithSpinner(
                    `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
                  );

                  resolve(templateResult);
                })
                .withFailureHandler(function (error) {
                  console.error(
                    `❌ Error copying sheet ${template.sheetType}:`,
                    error,
                  );

                  completedCount++;
                  failedCount++;
                  const errorMessage = error.message || error;
                  subsheetFailures.push({
                    sheetType: template.sheetType,
                    error: errorMessage,
                    envelope: error,
                  });

                  // Immediately add failure message to display
                  linksHtml += `<br>&nbsp;&nbsp;• ❌ ${template.sheetType} Sheet™ (failed)`;
                  document.getElementById("selectedFileSummary").innerHTML =
                    linksHtml;
                  setStatusWithSpinner(
                    `Creating sheets... (${completedCount}/${totalTemplates} completed)`,
                  );

                  resolve({
                    success: false,
                    sheetType: template.sheetType,
                    error: errorMessage,
                  });
                })
                .copyFileTemplate(
                  template.templateID,
                  template.sheetType,
                  template.version,
                  parentFolderID,
                );
            });
          },
        );

        // Wait for all subsheet copying operations to complete
        await Promise.all(subsheetCopyPromises);
      }

      // Final status update after all sheets are created
      const subsheetMessage = hasSubsheetsToUpdate
        ? ` and ${subsheetTemplates.length} subsheets`
        : "";

      let statusMessage;
      let titleMessage;

      if (failedCount === 0) {
        statusMessage = `🎉 All sheets created successfully! IDS Master${subsheetMessage} ready for import.`;
        titleMessage = `✅ Sheets Created Successfully!`;
      } else if (successCount === 0) {
        statusMessage = `❌ All ${totalTemplates} sheet creations failed.`;
        titleMessage = `❌ Sheet Creation Failed`;
      } else {
        statusMessage = `⚠️ Sheet creation completed: ${successCount} successful, ${failedCount} failed.`;
        titleMessage = `⚠️ Sheets Partially Created`;
      }

      setStatusText(statusMessage);
      document.getElementById("fileAccessTitle").innerHTML = titleMessage;

      // The IDS Master's own failure already stops this function further up,
      // with a panel of its own; this is for the subsheets, which until now
      // failed silently past the "(failed)" line in the list.
      AppError.surfaceBatch(subsheetFailures, {
        source: "proceedWithCombinedUpdate",
      });

      // Show buttons only if at least IDS Master was created successfully
      if (newSheetID) {
        // Show import button
        document.getElementById("importButton").style.display = "inline-block";
        document.getElementById("importButton").disabled = false;
        document.getElementById("importButton").innerText = hasSubsheetsToUpdate
          ? "Import Subsheets"
          : "Import IDS Master";

        // Show move button
        document.getElementById("moveSheetButton").style.display =
          "inline-block";
        document.getElementById("moveSheetButton").disabled = true;
        document.getElementById("moveSheetButton").innerText =
          hasSubsheetsToUpdate
            ? "Move Subsheets and Move/Update Master"
            : "Move IDS Master";
      }

      hideUpdateSingleSheetButton();
      hideIDSMasterButtons();
    } catch (error) {
      AppError.show(error, {
        source: "proceedWithCombinedUpdate",
        message: "The update did not finish.",
      });
      if (isConvertToMasterFlow) {
        resetToCollectionState();
      } else {
        resetIDSMasterState();
      }
    }
  }

  // Client-side wrapper functions for parallel access checking
  async function checkMultipleSheetAccess(fileIds) {
    try {
      if (!Array.isArray(fileIds) || fileIds.length === 0) {
        return {
          success: true,
          accessibleFiles: [],
          inaccessibleFiles: [],
          notOwnedFiles: [],
          warningFiles: [],
          message: "No files to check.",
        };
      }

      console.log(
        `Client-side checking access to ${fileIds.length} files in parallel`,
      );

      // Create promises for all sheet access checks
      const promises = fileIds.map((fileId) => {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((result) => resolve({ id: fileId, result }))
            .withFailureHandler((error) => reject({ id: fileId, error }))
            .checkSheetAccess(fileId);
        });
      });

      // Wait for all access checks to complete
      const results = await Promise.allSettled(promises);

      // Process results
      const accessibleFiles = [];
      const inaccessibleFiles = [];
      const notOwnedFiles = [];
      const warningFiles = [];

      results.forEach((promiseResult) => {
        if (promiseResult.status === "fulfilled") {
          const { id, result } = promiseResult.value;

          if (result.accessible) {
            // The user can proceed if they own the file OR they have edit access.
            if (result.owned || result.canEdit) {
              if (!parentFolderID && result.parentFolderID) {
                parentFolderID = result.parentFolderID;
                console.log(
                  `Parent folder ID set to ${parentFolderID} based on file ${id}`,
                );
              }
              accessibleFiles.push({ id: id, name: result.name });
              if (!result.owned) {
                // Editable but not owned - allowed to continue, but warn the user.
                warningFiles.push({ id: id, name: result.name });
              }
            } else {
              // Accessible but neither owner nor editor - cannot continue.
              notOwnedFiles.push({ id: id, name: result.name });
            }
          } else {
            inaccessibleFiles.push({ id: id });
          }
        } else {
          console.error(
            "Sheet access check failed for",
            promiseResult.reason.id,
            ":",
            promiseResult.reason.error,
          );
          inaccessibleFiles.push({ id: promiseResult.reason.id });
        }
      });

      let message = "";
      if (inaccessibleFiles.length > 0) {
        message = `${inaccessibleFiles.length} file(s) need access permission.`;
      } else if (notOwnedFiles.length > 0) {
        message = `${notOwnedFiles.length} file(s) are not owned or editable by you.`;
      } else if (warningFiles.length > 0) {
        message = `All files accessible. ${warningFiles.length} file(s) are shared with edit access (not owned by you).`;
      } else {
        message = "All files are accessible and owned by you.";
      }

      console.log(
        `Client-side access check complete: ${accessibleFiles.length} accessible, ${inaccessibleFiles.length} inaccessible, ${notOwnedFiles.length} blocked, ${warningFiles.length} editable-not-owned`,
      );

      return {
        success: true,
        accessibleFiles: accessibleFiles,
        inaccessibleFiles: inaccessibleFiles,
        notOwnedFiles: notOwnedFiles,
        warningFiles: warningFiles,
        message: message,
      };
    } catch (error) {
      AppError.log(error, "checkMultipleSheetAccess: Client-side sheet access check error");
      return {
        success: false,
        accessibleFiles: [],
        inaccessibleFiles: [],
        notOwnedFiles: [],
        warningFiles: [],
        message: `Error checking sheet access: ${error.message || error}`,
      };
    }
  }

          console.error(
            "Template access check failed for",
            promiseResult.reason.template.templateID,
            ":",
            promiseResult.reason.error,
          );
          inaccessibleFiles.push({
            id: promiseResult.reason.template.templateID,
            version: promiseResult.reason.template.templateVersion,
            sheetType: promiseResult.reason.template.sheetType,
          });
        }
      });

      const message = `Template access check complete. ${accessibleFiles.length} of ${templateInfo.length} templates are accessible.`;

      console.log(
        `Client-side template access check complete: ${accessibleFiles.length} accessible, ${inaccessibleFiles.length} inaccessible`,
      );

      return {
        success: true,
        accessibleFiles: accessibleFiles,
        inaccessibleFiles: inaccessibleFiles,
        message: message,
      };
    } catch (error) {
      AppError.log(error, "checkMultipleTemplateAccess: Client-side template access check error");
      return {
        success: false,
        accessibleFiles: [],
        inaccessibleFiles: [],
        message: `Error checking template access: ${error.message || error}`,
      };
    }
  }

  function onSheetAccessCheckSuccess(result) {
    console.log("Sheet access check result:", result);
    if (result.success) {
      accessibleFilesCache = result.accessibleFiles || [];
      inaccessibleFilesCache = result.inaccessibleFiles || [];
      notOwnedFilesCache = result.notOwnedFiles || [];
      warningFilesCache = result.warningFiles || [];
      templateAccessibleFilesCache = [];
      templateInaccessibleFilesCache = [];

      console.log("File caches updated:", {
        accessible: accessibleFilesCache,
        inaccessible: inaccessibleFilesCache,
        notOwned: notOwnedFilesCache,
        warning: warningFilesCache,
      });
      showContinueSection();

      if (result.inaccessibleFiles && result.inaccessibleFiles.length > 0) {
        setStatusText(result.message);
      }
    } else {
      console.error("Sheet™ access check failed:", result.message);
      AppError.show(result, { source: "onSheetAccessCheckFailure" });
      accessibleFilesCache = [];
      inaccessibleFilesCache = [];
      notOwnedFilesCache = [];
      warningFilesCache = [];
      templateAccessibleFilesCache = [];
      templateInaccessibleFilesCache = [];
      showContinueSection();
    }
  }

  function onSheetAccessCheckFailure(error) {
    console.error("Sheet™ access check error:", error);
    AppError.show(error, {
      source: "onSheetAccessCheckFailure",
      message: "The script could not check access to your Sheet™.",
    });
    accessibleFilesCache = [];
    inaccessibleFilesCache = [];
    notOwnedFilesCache = [];
    warningFilesCache = [];
    templateAccessibleFilesCache = [];
    templateInaccessibleFilesCache = [];
    showContinueSection();
  }

  // Helper functions for updateSingleSheet flow
  function disableUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.disabled = true;
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton) {
      convertToMasterButton.disabled = true;
    }
  }

  function enableUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.disabled = false;
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton && sheetType === "IDS Collection") {
      convertToMasterButton.disabled = false;
    }
  }

  function hideUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.style.display = "none";
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton) {
      convertToMasterButton.style.display = "none";
    }
  }

  function showUpdateSingleSheetButton() {
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.style.display = "inline-block";
    }
    const convertToMasterButton = document.getElementById("convertToMasterButton");
    if (convertToMasterButton && sheetType === "IDS Collection") {
      convertToMasterButton.style.display = "inline-block";
    }
  }

  function resetUpdateSingleSheetButton() {
    isUpdateSingleSheetFlow = false;
    const updateSingleSheetButton = document.getElementById(
      "updateSingleSheetButton",
    );
    if (updateSingleSheetButton) {
      updateSingleSheetButton.disabled = false;
      updateSingleSheetButton.innerText = `Update ${sheetType}`;
    }
    if (isConvertToMasterFlow) {
      const convertToMasterButton = document.getElementById(
        "convertToMasterButton",
      );
      convertToMasterButton.disabled = false;
    }
  }

  function proceedWithUpdateSingleSheetTemplateCopy() {
    // This function will be called from the picker callback to continue template copy
    const templateID =
      cachedTemplateInfo && cachedTemplateInfo.length > 0
        ? cachedTemplateInfo[0].templateID
        : null;
    const templateVersion =
      cachedTemplateInfo && cachedTemplateInfo.length > 0
        ? cachedTemplateInfo[0].version
        : null;

    if (!oldSheetID || !templateID) {
      console.error(`Missing required IDs for ${sheetType} template copy`);
      setStatusText("Error: Missing required sheet or template ID");
      if (isConvertToCollectionFlow) {
        resetIDSMasterState();
      } else {
        resetUpdateSingleSheetButton();
      }
      return;
    }

    // Proceed with template copy
    setStatusWithSpinner("Creating template copy...");

    google.script.run
      .withSuccessHandler(async function (copyResult) {
        if (copyResult.success) {
          // Check if we need to add a delay for Effective Paths sheets
          // if (sheetType === "Effective Paths") {
          //   console.log(
          //     "Waiting 10 seconds for Effective Paths calculations to complete..."
          //   );
          //   // Add a 10-second delay for Effective Paths to allow calculations to complete
          //   await new Promise((resolve) => setTimeout(resolve, 10000));
          // }

          setStatusText("Template copy created successfully!");

          hideUpdateSingleSheetButton();
          hideIDSMasterButtons();

          // Set up the import button for the new workflow
          const importButton = document.getElementById("importButton");
          importButton.innerText = `Import ${sheetType} data`;
          importButton.style.display = "inline-block";
          importButton.disabled = false;

          // Set up the update master button as well
          const moveSheetButton = document.getElementById("moveSheetButton");
          moveSheetButton.innerText = `Move ${sheetType}`;
          moveSheetButton.style.display = "inline-block";
          moveSheetButton.disabled = true; // Will be enabled after successful import

          // Update global newSheetID for the import process
          newSheetID = copyResult.fileId;

          // Add the new sheet to accessible files cache
          const newSheetFile = {
            id: newSheetID,
            name: copyResult.fileName || `${sheetType} Sheet Copy`,
          };
          accessibleFilesCache.push(newSheetFile);

          // Update the file access title to show success
          document.getElementById("fileAccessTitle").innerHTML =
            `✅ ${sheetType} Template Created Successfully!`;

          // Show link to the new sheet in selectedFileSummary
          const selectedFileSummary = document.getElementById(
            "selectedFileSummary",
          );
          selectedFileSummary.innerHTML = `<strong>✅ Template copy created successfully!</strong><br>
              <a href="${googleLink}/${newSheetID}/edit" target="_blank" style="margin-left: 2em;">
                Open ${sheetType} Sheet
              </a><br>`;

          // Hide access-related buttons since we're now in import workflow
          const addAnotherButton = document.getElementById("addAnotherButton");
          if (addAnotherButton) addAnotherButton.style.display = "none";

          const instructionsSection = document.getElementById(
            "instructionsSection",
          );
          if (instructionsSection) instructionsSection.style.display = "none";
        } else {
          console.error(
            "Template copy failed:",
            copyResult.message || "Template copy failed",
          );
          setStatusText(
            `Template copy failed: ${
              copyResult.message || "Template copy failed"
            }`,
          );
          if (isConvertToCollectionFlow) {
            resetIDSMasterState();
          } else {
            resetUpdateSingleSheetButton();
          }
        }
      })
      .withFailureHandler(function (error) {
        console.error("Template copy error:", error);
        AppError.show(error, {
          source: "proceedWithUpdateSingleSheetTemplateCopy",
          message: "A template could not be copied.",
        });
        if (isConvertToCollectionFlow) {
          resetIDSMasterState();
        } else {
          resetUpdateSingleSheetButton();
        }
      })
      .copyFileTemplate(templateID, sheetType, templateVersion, parentFolderID);
  }
</script>
