<!-- WebApp.html -->
<html>
  <head>
    <!-- picker.styles.html (applied to WebApp) -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 20px;
        line-height: 1.4;
      }
      button {
        padding: 14px 24px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background-color: #4285f4;
        color: white;
        cursor: pointer;
        margin: 5px;
        min-height: 48px;
        white-space: nowrap;
        text-align: center;
        line-height: 1.2;
      }
      button:hover {
        background-color: #3367d6;
      }
      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      /* Mobile-specific styles */
      @media (max-width: 768px) {
        button {
          padding: 24px 32px;
          font-size: 22px;
          margin: 12px 0;
          min-height: 70px;
          width: 100%;
          max-width: 100%;
          white-space: normal;
          line-height: 1.3;
          text-align: center;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #importButton, #updateMasterIdButton {
          padding: 28px 32px !important;
          min-height: 80px !important;
          height: 80px !important;
          max-height: 80px !important;
          font-size: 24px !important;
          margin: 12px 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          text-align: center !important;
          line-height: 1.3 !important;
        }
        #importButton {
          font-size: 26px !important;
          padding: 32px 36px !important;
          min-height: 90px !important;
          height: 90px !important;
          max-height: 90px !important;
        }
        body {
          font-size: 16px;
          padding: 10px;
        }
        h1 {
          font-size: 24px;
        }
        #status_web {
          font-size: 16px;
          padding: 12px;
        }
        .centered-content {
          padding: 0 2vw;
        }
      }
      kbd {
        background-color: #f1f3f4;
        border: 1px solid #dadce0;
        border-radius: 3px;
        padding: 2px 6px;
        font-family: monospace;
        font-size: 0.9em;
        color: #3c4043;
      }
      #importButton, #updateMasterIdButton {
        height: 56px !important;
        min-height: 56px !important;
        max-height: 56px !important;
        padding: 16px 32px !important;
        box-sizing: border-box !important;
        margin: 5px !important;
        display: inline-block;
        vertical-align: top;
        text-align: center !important;
        line-height: 1.2 !important;
        justify-content: center;
        align-items: center;
        width: 200px !important;
        max-width: 200px !important;
      }
      .centered-content {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
    <!-- End of picker.styles.html -->
    <title>Import Data</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <div class="centered-content">
      <div id="status_web" style="margin: 10px 0; padding: 10px; background-color: #f0f0f0; border-radius: 4px;">
        <strong>Status:</strong> <span id="status_text_web">Idle</span>
      </div>
      <button
        id="importButton"
        onclick="importData()"
      >
        Import<br><?= sheetType ?>
      </button>
      <button
        id="updateMasterIdButton"
        onclick="switchToPicker()"
        disabled
        style="margin-bottom: 2vw;"
      >
        Update<br>Master ID
      </button>
    </div>
    <div id="picker-container"></div>
    <!-- Yes/No Modal -->
    <div id="yesNoModal">
      <div class="modal-content">
        <div id="yesNoMsg"></div>
        <div class="modal-buttons">
          <button onclick="handleYesNo(true)">Yes</button>
          <button onclick="handleYesNo(false)">No</button>
        </div>
      </div>
    </div>

    <!-- WebApp.scripts.html -->
<script>
// These are dynamically filled by your server script
const newSheetID = '<?= newSheetID ?>';
const oldsheetID = '<?= oldsheetID ?>';
const idMasterID = '<?= idMasterID ?>';
const sheetType = '<?= sheetType ?>';
const newVersion = '<?= newVersion ?>';
const oldVersion = '<?= oldVersion ?>';
const compareResult = '<?= compareResult ?>';
const idType = '<?= idType ?>';
const isImported = '<?= isImported ?>';

function setStatus(text) {
  document.getElementById('status_text_web').innerText = text;
}

// Modal logic
let yesNoCallback = null;
function showYesNo(msg, callback) {
  document.getElementById('yesNoMsg').textContent = msg;
  const modal = document.getElementById('yesNoModal');
  modal.classList.add('visible');
  yesNoCallback = callback;
}
function handleYesNo(answer) {
  const modal = document.getElementById('yesNoModal');
  modal.classList.remove('visible');
  if (yesNoCallback) yesNoCallback(callback);
}

  function switchToPicker() {
    // Hide all direct children of <body> except #picker-container
    var bodyChildren = Array.from(document.body.children);
    bodyChildren.forEach(function(child) {
      if (child.id !== 'picker-container') {
        child.style.display = 'none';
      } else {
        child.style.display = '';
      }
    });

    google.script.run.withSuccessHandler(function(html) {
      var container = document.getElementById('picker-container');
      container.innerHTML = html;

      // Re-execute scripts in the injected HTML
      var scripts = container.querySelectorAll('script');
      scripts.forEach(function(oldScript) {
        var newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
          newScript.async = oldScript.async;
          newScript.defer = oldScript.defer;
          // Add onload handler for Google API script
          if (oldScript.src.includes('apis.google.com/js/api.js')) {
            newScript.onload = function() {
              if (typeof window.gapiLoaded === 'function') {
                window.gapiLoaded();
              }
            };
          }
        } else {
          newScript.textContent = oldScript.textContent;
        }
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });

      // If gapi is already loaded, call gapiLoaded manually
      if (typeof window.gapi !== 'undefined' && typeof window.gapi.load === 'function') {
        if (typeof window.gapiLoaded === 'function') {
          window.gapiLoaded();
        }
      }
    }).getPickerHtml(idType, newSheetID, oldsheetID, idMasterID);
  }

function enableUpdateMasterIdBtn(enable) {
  const btn = document.getElementById('updateMasterIdButton');
  if (btn) btn.disabled = !enable;
}

function importData() {
  setStatus("Importing data...");
  // DO NOT disable the importButton!
  google.script.run
    .withSuccessHandler(function (result) {
      setStatus("Import completed!");
      enableUpdateMasterIdBtn(true); // Enable the update button after import
    })
    .withFailureHandler(function (error) {
      setStatus("Failed!");
      alert('Import failed: ' + error.message);
      // importButton remains enabled
    })
    .startImportData(sheetType, newSheetID);
}

window.onload = function () {
  // Use strict string comparison for the checkmark
  enableUpdateMasterIdBtn(isImported === "✅");

  if (compareResult === -1) {
    alert("The version of the old sheet (" + oldVersion + ") is newer than the new sheet (" + newVersion + "). Import aborted.");
    return;
  }
  if (compareResult > 0) {
    const msg = "The old sheet uses a different (older) export version (" + oldVersion + "). Do you want to continue the import to version " + newVersion + "?";
    showYesNo(msg, function(yes) {
      if (!yes) {
        setStatus("Import cancelled by user.");
      }
    });
  }
}
</script>
<!-- End of WebApp.scripts.html -->
  </body>
</html>
