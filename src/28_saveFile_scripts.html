  function mergeSaveFileWarnings(existing, additions) {
    const merged = (existing || []).slice();
    (additions || []).forEach(function (file) {
      if (!merged.some(function (f) { return f.id === file.id; })) {
        merged.push(file);
      }
    });
    return merged;
  }

  async function checkSaveFileSheetAccess(fileIds) {
    const ids = (fileIds || []).filter(function (id) {
      return typeof id === "string" && id.length > 0;
    });
    if (ids.length === 0) {
      return { accessibleFiles: [], inaccessibleFiles: [], notOwnedFiles: [], warningFiles: [] };
    }

    const results = await Promise.all(
      ids.map(function (id) {
        return runAppsScript("checkSheetAccess", id)
          .then(function (result) {
            return { id: id, result: result };
          })
          .catch(function (error) {
            console.error("Sheet access check failed for", id, ":", error);
            return { id: id, result: { accessible: false } };
          });
      }),
    );

    const accessibleFiles = [];
    const inaccessibleFiles = [];
    const notOwnedFiles = [];
    const warningFiles = [];
    results.forEach(function (entry) {
      if (!entry.result || !entry.result.accessible) {
        inaccessibleFiles.push({ id: entry.id });
        return;
      }

      if (entry.result.owned || entry.result.canEdit) {
        accessibleFiles.push({ id: entry.id, name: entry.result.name });
        if (!entry.result.owned) {
          warningFiles.push({ id: entry.id, name: entry.result.name });
        }
      } else {
        notOwnedFiles.push({ id: entry.id, name: entry.result.name });
      }
    });

    return {
      accessibleFiles: accessibleFiles,
      inaccessibleFiles: inaccessibleFiles,
      notOwnedFiles: notOwnedFiles,
      warningFiles: warningFiles,
    };
  }
  function openSaveFileAccessPicker(fileIds) {
    return new Promise(function (resolve, reject) {
      try {
        const ids = (fileIds || []).filter(function (id) {
          return typeof id === "string" && id.length > 0;
        });
        if (ids.length === 0) {
          resolve([]);
          return;
        }

        const view = new google.picker.DocsView(
          google.picker.ViewId.SPREADSHEET,
        )
          .setFileIds(ids.join(","))
          .setIncludeFolders(false)
          .setSelectFolderEnabled(false)
          .setMode(google.picker.DocsViewMode.LIST)
          .setMimeTypes("application/vnd.google-apps.spreadsheet");

        const pickerSize = {
          width: Math.min(window.innerWidth - 10, 1400),
          height: Math.min(window.innerHeight - 80, 900),
        };

        const picker = new google.picker.PickerBuilder()
          .setDeveloperKey(API_KEY)
          .setAppId(APP_ID)
          .setOAuthToken(accessToken)
          .setSelectableMimeTypes("application/vnd.google-apps.spreadsheet")
          .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
          .addView(view)
          .setCallback(function (data) {
            if (data.action === google.picker.Action.PICKED) {
              const docs = data.docs || [];
              resolve(
                docs.map(function (d) {
                  return d.id;
                }),
              );
            } else if (data.action === google.picker.Action.CANCEL) {
              resolve([]);
            }
          })
          .setSize(pickerSize.width, pickerSize.height);

        if (isMobile) {
          picker.enableFeature(google.picker.Feature.NAV_HIDDEN);
        }

        if (
          typeof google !== "undefined" &&
          google.script &&
          google.script.host &&
          google.script.host.origin
        ) {
          picker.setOrigin(google.script.host.origin);
        }

        picker.build().setVisible(true);
      } catch (error) {
        reject(error);
      }
    });
  }

  async function ensureSaveFileAccess(label) {
    if (saveFilePendingAccessIds.length === 0) return true;

    if (
      !saveFilePickerReady ||
      typeof google === "undefined" ||
      !google.picker
    ) {
      setStatusText(
        `The script needs access to ${label}, but the file picker is not ready. ` +
          "Please reload the page and try again.",
      );
      return false;
    }

    setStatusWithSpinner(
      `Opening file picker to grant access to ${saveFilePendingAccessIds.length} sheet(s) (${label})...`,
    );

    let pickedIds;
    try {
      pickedIds = await openSaveFileAccessPicker(saveFilePendingAccessIds);
    } catch (error) {
      console.error("Error opening save file access picker:", error);
      setStatusText(`Error opening file picker: ${error.message || error}`);
      return false;
    }

    if (!pickedIds || pickedIds.length === 0) {
      setStatusText("File access was not granted.");
      return false;
    }

    setStatusWithSpinner("Verifying access to the selected sheet(s)...");
    let recheck;
    try {
      recheck = await checkSaveFileSheetAccess(pickedIds);
    } catch (error) {
      console.error("Error re-checking access to picked files:", error);
      setStatusText(`Error verifying access: ${error.message || error}`);
      return false;
    }

    if ((recheck.notOwnedFiles || []).length > 0) {
      saveFileNotOwnedFiles = recheck.notOwnedFiles;
      return false;
    }

    saveFileWarningFiles = mergeSaveFileWarnings(
      saveFileWarningFiles,
      recheck.warningFiles,
    );

    const nowAccessibleIds = (recheck.accessibleFiles || []).map(function (f) {
      return f.id;
    });
    saveFilePendingAccessIds = saveFilePendingAccessIds.filter(function (id) {
      return nowAccessibleIds.indexOf(id) === -1;
    });

    if (saveFilePendingAccessIds.length > 0) {
      setStatusText(
        `Still missing access to ${saveFilePendingAccessIds.length} sheet(s). ` +
          "Please grant access to the remaining sheets.",
      );
      return false;
    }
    return true;
  }

  function renderCategoryBody(type, data) {
    switch (type) {
      case "Laboratory":
        return renderLaboratoryBody(data);
      case "Workshop":
        return renderWorkshopBody(data);
      case "Ultimate Weapon":
        return renderUltimateBody(data);
      case "Themes, Songs & Relics":
        return renderThemesAndRelicsBody(data);
      case "Bots":
        return renderBotsBody(data);
      case "Vault":
        return renderVaultBody(data);
      case "Cards":
        return renderCardsBody(data);
      case "Modules":
        return renderModulesBody(data);
      case "Guardians":
        return renderGuardiansBody(data);
      case "Player & Stuff":
        return renderPlayerBody(data);
      case "IDS Master":
        return renderMasterBody(data);
      default:
        return renderGenericBody(data);
    }
  }

  // One column per global preset, in the order the parser resolved, with a row
  // per preset type so the same type lines up across every column.
  function renderMasterBody(data) {
    const presetsData = data.oldPresetsData || {};
    const presets = presetsData.data || {};
    const presetNames = presetsData.presetNames || Object.keys(presets);
    const typeOrder = data.presetTypesOrder || [];

    let columns = "";
    presetNames.forEach(function (name) {
      const preset = presets[name];
      if (!preset) return;
      let rows = "";
      typeOrder.forEach(function (type) {
        const value = preset[type];
        rows +=
          '<div class="sfSubstatRow"><span>' +
          escSaveFileHtml(type) +
          '</span><span class="sfSubstatRarity">' +
          escSaveFileHtml(
            value === null || value === undefined || value === "" ? "-" : value,
          ) +
          "</span></div>";
      });
      columns +=
        '<div class="sfWorkshopColumn"><div class="sfWorkshopColHeader">' +
        escSaveFileHtml(name) +
        "</div>" +
        rows +
        "</div>";
    });

    if (!columns) return "";
    return (
      sfSubLabel("Global Presets") +
      '<div class="sfPresetTracks">' +
      columns +
      "</div>"
    );
  }

  function renderMasterDiff(parsed, sheet) {
    const pPresets = (parsed.oldPresetsData || {}).data || {};
    const sPresets = (sheet.oldPresetsData || {}).data || {};
    const presetNames =
      (parsed.oldPresetsData || {}).presetNames || Object.keys(pPresets);
    const typeOrder = parsed.presetTypesOrder || sheet.presetTypesOrder || [];

    let columns = "";
    presetNames.forEach(function (name) {
      const pPreset = pPresets[name] || {};
      const sPreset = sPresets[name] || {};
      let rows = "";
      typeOrder.forEach(function (type) {
        if (sfNormGeneric(pPreset[type]) === sfNormGeneric(sPreset[type])) {
          return;
        }
        rows += sfDiffRow(
          sfDisplayValue(sPreset[type]),
          sfDisplayValue(pPreset[type]),
          type,
        );
      });
      if (!rows) return;
      columns +=
        '<div class="sfWorkshopColumn"><div class="sfWorkshopColHeader">' +
        escSaveFileHtml(name) +
        "</div>" +
        sfDiffGridStacked(rows) +
        "</div>";
    });

    if (!columns) return "";
    return (
      sfSubLabel("Global Presets") +
      '<div class="sfPresetTracks">' +
      columns +
      "</div>"
    );
  }

  function renderGenericBody(data) {
    let html = "";
    for (const key of Object.keys(data)) {
      html +=
        '<div class="sfFieldRow">' +
        '<div class="sfFieldName">' +
        escSaveFileHtml(key) +
        "</div>" +
        '<div class="sfFieldValue">' +
        renderSaveFileValue(data[key]) +
        "</div>" +
        "</div>";
    }
    return html;
  }

  function sfSubLabel(text) {
    return '<div class="sfSubLabel">' + escSaveFileHtml(text) + "</div>";
  }

  function sfUnlockMark(unlocked) {
    return unlocked
      ? '<span class="sfBool is-true">✓</span>'
      : '<span class="sfBool is-false">✗</span>';
  }

  function sfFmtVal(v) {
    if (v === true || v === false) return sfUnlockMark(v);
    if (v === null || v === undefined || v === "")
      return '<span class="sfNull">-</span>';
    return (
      '<span class="sfPrimitive">' + escSaveFileHtml(String(v)) + "</span>"
    );
  }

  function sfInlinePair(key, val) {
    return (
      '<span class="sfInlinePair">' +
      '<span class="sfInlineKey">' +
      escSaveFileHtml(key) +
      "</span>" +
      '<span class="sfInlineVal">' +
      sfFmtVal(val) +
      "</span></span>"
    );
  }

  function sfLevelRow(level, nameHtml) {
    return (
      '<div class="sfLevelRow"><span class="sfLevel">' +
      escSaveFileHtml(level == null ? 0 : level) +
      "</span>" +
      '<span class="sfLevelName">' +
      nameHtml +
      "</span></div>"
    );
  }

  function sfEntityUpgradeRows(upgradeNames, plusName, levels) {
    let html = "";
    (upgradeNames || []).forEach(function (attr) {
      if (!attr) return;
      const lvl = levels[attr];
      html += sfLevelRow(lvl != null ? lvl : "00", escSaveFileHtml(attr));
    });
    if (plusName) {
      const pv = levels[plusName];
      if (pv === "Lo") {
        html +=
          '<div class="sfLevelRow">' +
          '<span class="sfLevel sfBool is-false">✗</span>' +
          '<span class="sfLevelName">' +
          escSaveFileHtml(plusName) +
          "</span></div>";
      } else {
        html += sfLevelRow(pv != null ? pv : "00", escSaveFileHtml(plusName));
      }
    }
    return html;
  }

  function renderLaboratoryBody(data) {
    const labs = data.oldLabLevels || {};
    const labOrder = data.labOrder || [];
    let html = '<div class="sfLabGrid">';

    labOrder.forEach(function (name) {
      if (!name || !labs.hasOwnProperty(name)) return;
      const v = labs[name];
      const level = Array.isArray(v) ? v[0] : v;
      html += '<div class="sfLabItem">';
      html += sfLevelRow(level, escSaveFileHtml(name));
      html += "</div>";
    });
    return html + "</div>";
  }

  function renderWorkshopBody(data) {
    const upgrades = data.oldWorkshopLevels || null;
    const enhancements = data.oldWorkshopPlusLevels || null;
    if (!upgrades && !enhancements) return "";

    const upgradeNames = (upgrades && upgrades.presetNames) || [];
    const enhancementNames = (enhancements && enhancements.presetNames) || [];
    const presetNames =
      upgradeNames.length >= enhancementNames.length
        ? upgradeNames
        : enhancementNames;
    if (!presetNames.length) return "";

    let html = "";
    presetNames.forEach(function (presetName, presetIndex) {
      const groups =
        renderWorkshopPresetGroup(
          "Upgrades",
          upgrades,
          false,
          data.upgradeIndices,
          presetIndex,
        ) +
        renderWorkshopPresetGroup(
          "Enhancements",
          enhancements,
          true,
          data.enhancementIndices,
          presetIndex,
        );

      if (!groups) return;

      html +=
        '<div class="sfSubBlock"><div class="sfSubBlockHeader">' +
        escSaveFileHtml(presetName || "Preset " + (presetIndex + 1)) +
        '</div><div class="sfPresetBox">' +
        groups +
        "</div></div>";
    });

    return html;
  }

  function renderWorkshopPresetGroup(
    groupLabel,
    group,
    isEnhancement,
    tracks,
    presetIndex,
  ) {
    if (!group || !tracks) return "";
    const entries = group.data || {};
    const trackLabels = ["Attack", "Defense", "Utility"];
    let columnsHtml = "";
    let hasRows = false;

    trackLabels.forEach(function (track) {
      let rows = "";
      (tracks[track] || []).forEach(function (name) {
        if (!entries.hasOwnProperty(name)) return;
        const levels = isEnhancement
          ? entries[name]
          : entries[name].levels || [];
        const lvl = levels[isEnhancement ? presetIndex : presetIndex * 2];
        rows += sfLevelRow(lvl, escSaveFileHtml(name));
        hasRows = true;
      });
      columnsHtml +=
        '<div class="sfWorkshopColumn">' +
        '<div class="sfWorkshopColHeader">' +
        escSaveFileHtml(track) +
        "</div>" +
        rows +
        "</div>";
    });

    if (!hasRows) return "";
    return (
      '<div class="sfPresetGroup">' +
      '<div class="sfPresetGroupHeader">' +
      escSaveFileHtml(groupLabel) +
      "</div>" +
      '<div class="sfPresetTracks">' +
      columnsHtml +
      "</div></div>"
    );
  }

  function renderUltimateBody(data) {
    const uw = data.oldUltimate || {};
    const defs = data.targetWeapons || {};
    const order = data.weaponOrder || Object.keys(defs);
    let html = "";
    order.forEach(function (name) {
      if (!uw[name]) return;
      const def = defs[name];
      if (!def) return;
      const levels = uw[name].levels || {};
      html +=
        '<div class="sfBlock"><div class="sfBlockHeader">' +
        escSaveFileHtml(name) +
        " " +
        sfUnlockMark(uw[name].unlocked) +
        "</div>" +
        sfEntityUpgradeRows(def.upgrades, def.plusUpgrade, levels) +
        "</div>";
    });
    return html ? '<div class="sfUltimateColumns">' + html + "</div>" : "";
  }

  function renderThemesAndRelicsBody(data) {
    const relics = data.oldRelics || [];
    return (
      renderThemesBody(data) +
      sfSubLabel("Relics (" + relics.length + ")") +
      renderRelicsBody(data)
    );
  }

  function renderThemesBody(data) {
    const themes = data.oldThemesNames || {};
    const order = data.themesOrder || Object.keys(themes);
    let html = '<div class="sfThemeColumns">';
    order.forEach(function (cat) {
      const items = themes[cat] || [];
      html +=
        '<div class="sfThemeColumn">' +
        '<div class="sfThemeColHeader">' +
        escSaveFileHtml(cat) +
        " (" +
        items.length +
        ")</div>";
      items.forEach(function (name) {
        html += '<div class="sfThemeItem">' + escSaveFileHtml(name) + "</div>";
      });
      html += "</div>";
    });
    return html + "</div>";
  }

  function renderBotsBody(data) {
    const bots = data.oldBots || {};
    const botData = bots.data || {};
    const defs = data.targetBots || {};
    const order = data.botOrder || Object.keys(defs);
    const presetNames = bots.presetNames || [];
    if (!presetNames.length) return "";

    let html = '<div class="sfModuleColumns">';
    presetNames.forEach(function (presetName, presetIndex) {
      let entries = "";

      order.forEach(function (botName) {
        const bot = botData[botName];
        if (!bot) return;
        const def = defs[botName];
        if (!def) return;
        const preset = (bot.presets || {})[presetName] || {};
        entries +=
          '<div class="sfModuleEntry"><div class="sfModuleName">' +
          escSaveFileHtml(botName) +
          "</div>" +
          '<span class="sfTag"> active ' +
          sfUnlockMark(preset.active) +
          ' </span> <span class="sfTag"> sync ' +
          sfUnlockMark(preset.sync) +
          " </span>" +
          sfEntityUpgradeRows(def.upgrades, def.plusUpgrade, preset.props || {}) +
          "</div>";
      });

      if (!entries) return;
      html +=
        '<div class="sfModuleColumn"><div class="sfModuleColHeader">' +
        escSaveFileHtml(presetName || "Preset " + (presetIndex + 1)) +
        "</div>" +
        entries +
        "</div>";
    });
    return html + "</div>";
  }

  function renderRelicsBody(data) {
    const relics = data.oldRelics || [];
    let html = '<div class="sfRelicsGrid">';
    relics.forEach(function (name) {
      html += '<span class="sfArrayItem">' + escSaveFileHtml(name) + "</span>";
    });
    return html + "</div>";
  }

  function renderVaultBody(data) {
    const oldVault = data.oldVault || {};
    const unlockedGroups = oldVault.unlockedGroups || [];
    const upgradesLevel = oldVault.upgradesLevel || {};
    const groups = data.vaultIndices || [];
    const alwaysUnlocked = data.alwaysUnlocked || [];
    if (!groups.length) return "";

    let columnsHtml = "";

    groups.forEach(function (group) {
      let sectionsHtml = "";

      (group.sections || []).forEach(function (section) {
        const unlocked =
          unlockedGroups.indexOf(section.section) !== -1 ||
          alwaysUnlocked.indexOf(section.section) !== -1;
        let rows = "";
        (section.upgrades || []).forEach(function (name) {
          rows += sfLevelRow(
            upgradesLevel.hasOwnProperty(name) ? upgradesLevel[name] : 0,
            escSaveFileHtml(name),
          );
        });
        sectionsHtml +=
          '<div class="sfSubBlock"><div class="sfSubBlockHeader">' +
          escSaveFileHtml(section.section) +
          " " +
          sfUnlockMark(unlocked) +
          "</div>" +
          rows +
          "</div>";
      });

      if (!sectionsHtml) return;
      columnsHtml +=
        '<div class="sfWorkshopColumn">' +
        '<div class="sfWorkshopColHeader">' +
        escSaveFileHtml(group.group) +
        "</div>" +
        sectionsHtml +
        "</div>";
    });

    if (!columnsHtml) return "";
    return '<div class="sfPresetTracks">' + columnsHtml + "</div>";
  }

  function renderCardsBody(data) {
    const levels = data.oldCardsLevel || {};
    const presets = data.oldCardsPreset || {};
    const cardOrder = data.cardNameIndices || [];
    let html = '<div class="sfCardColumns">';

    html +=
      '<div class="sfCardColumn"><div class="sfCardColHeader">Card Levels</div>';
    cardOrder.forEach(function (card) {
      if (!card || !levels.hasOwnProperty(card)) return;
      const arr = levels[card] || [];
      const lvl = arr[0];
      const mastery = arr[1];
      html += sfLevelRow(lvl, escSaveFileHtml(card) + (mastery ? " ★" : ""));
    });
    html += "</div>";

    Object.keys(presets)
      .map(function (name) {
        return {
          name: name,
          order: presets[name].order || 0,
          cards: presets[name].cards || [],
        };
      })
      .sort(function (a, b) {
        return a.order - b.order;
      })
      .forEach(function (p) {
        html +=
          '<div class="sfCardColumn"><div class="sfCardColHeader">' +
          escSaveFileHtml(p.name) +
          "</div>";
        if (p.cards.length === 0) {
          html += '<div class="sfThemeItem sfNull">-</div>';
        } else {
          p.cards.forEach(function (c) {
            html += '<div class="sfThemeItem">' + escSaveFileHtml(c) + "</div>";
          });
        }
        html += "</div>";
      });

    html += "</div>";

    if (data.oldCardSlots !== undefined && data.oldCardSlots !== null) {
      html +=
        '<div class="sfModMeta">Unlocked Slots: ' +
        escSaveFileHtml(data.oldCardSlots) +
        "</div>";
    }
    return html;
  }

  function renderModulesBody(data) {
    const inv = data.oldModulesInventory || {};
    const presets = data.oldModulesPresets || {};
    const categories = ["cannon", "armor", "generator", "core"];
    return (
      renderModulesPresets(presets, categories) +
      renderModulesInventory(inv, presets, categories, data.moduleOrder)
    );
  }

  function renderModulesPresets(presets, categories) {
    const presetNames = presets.presetNames || [];
    if (!presetNames.length) return "";

    let html = '<div class="sfModuleColumns">';
    presetNames.forEach(function (presetName, presetIndex) {
      html +=
        '<div class="sfModuleColumn"><div class="sfModuleColHeader">' +
        escSaveFileHtml(presetName || "Preset " + (presetIndex + 1)) +
        "</div>";

      categories.forEach(function (cat) {
        const preset = (presets[cat] || {})[presetName] || {};
        html +=
          '<div class="sfModuleEntry"><div class="sfModuleName">' +
          escSaveFileHtml(cat) +
          "</div>" +
          sfModuleEquipRow("Main", preset.primary) +
          sfModuleEquipRow("Assist", preset.secondary) +
          "</div>";
      });

      html += "</div>";
    });

    return sfSubLabel("Presets") + html + "</div>";
  }

  function sfModuleEquipRow(label, moduleName) {
    return (
      '<div class="sfSubstatRow"><span class="sfSubstatRarity">' +
        (moduleName
          ? escSaveFileHtml(moduleName)
          : '<span class="sfNull">-</span>') +
      '</span><span>' +
            escSaveFileHtml(label) +
      "</span></div>"
    );
  }

  function sfOrderedModuleKeys(invCat, moduleOrder, skipKeys) {
    const ordered = [];
    const placed = {};
    (moduleOrder || []).forEach(function (name) {
      [name, "Spare " + name].forEach(function (key) {
        if (invCat.hasOwnProperty(key) && !placed[key]) {
          ordered.push(key);
          placed[key] = true;
        }
      });
    });
    Object.keys(invCat)
      .sort(function (a, b) {
        return a.localeCompare(b);
      })
      .forEach(function (key) {
        if (placed[key]) return;
        if (skipKeys && skipKeys.indexOf(key) !== -1) return;
        ordered.push(key);
      });
    return ordered;
  }

  function renderModulesInventory(inv, presets, categories, moduleOrder) {
    const metaKeys = ["Highest Level", "Assist Level"];
    let html = '<div class="sfModuleColumns">';
    let hasColumn = false;

    categories.forEach(function (cat) {
      const invCat = inv[cat] || {};
      const presetCat = presets[cat] || {};
      const assistSlot = presetCat["Assist Slot"];
      if (Object.keys(invCat).length === 0 && !assistSlot) return;
      hasColumn = true;

      html +=
        '<div class="sfModuleColumn"><div class="sfModuleColHeader">' +
        escSaveFileHtml(cat) +
        "</div>";

      metaKeys.forEach(function (key) {
        if (invCat[key] === undefined) return;
        html +=
          '<div class="sfModMeta">' +
          escSaveFileHtml(key) +
          " " +
          escSaveFileHtml(invCat[key]) +
          "</div>";
      });

      if (assistSlot) {
        html +=
          '<div class="sfModuleEntry">' +
          '<div class="sfModuleName">Assist Slot ' +
          sfUnlockMark(assistSlot.locked) +
          "</div>" +
          '<div class="sfSubstatRow"><span>Rarity</span><span class="sfSubstatRarity">' +
          escSaveFileHtml(assistSlot.rarity) +
          "</span></div>" +
          '<div class="sfSubstatRow"><span>Multiplier</span><span class="sfSubstatRarity">' +
          escSaveFileHtml(assistSlot.multiplier) +
          "</span></div>" +
          '<div class="sfSubstatRow"><span>Substat</span><span class="sfSubstatRarity">' +
          escSaveFileHtml(assistSlot.substat) +
          "</span></div>" +
          "</div>";
      }

      sfOrderedModuleKeys(invCat, moduleOrder, metaKeys).forEach(function (key) {
          if (metaKeys.indexOf(key) !== -1) return;
          const m = invCat[key];
          if (!m || typeof m !== "object") return;
          html +=
            '<div class="sfModuleEntry">' +
            '<div class="sfModuleName">' +
            escSaveFileHtml(key) +
            ' <span class="sfTag">' +
            escSaveFileHtml(m.rarity) +
            "</span></div>";
          (m.substats || [])
            .filter(function (s) {
              return s && s[0];
            })
            .forEach(function (s) {
              html +=
                '<div class="sfSubstatRow"><span>' +
                escSaveFileHtml(s[0]) +
                '</span><span class="sfSubstatRarity">' +
                escSaveFileHtml(s[1]) +
                "</span></div>";
            });
          html += "</div>";
        });

      html += "</div>";
    });

    return hasColumn ? sfSubLabel("Inventory") + html + "</div>" : "";
  }

  function renderGuardiansBody(data) {
    const guardians = data.oldGuardians || {};
    const gData = guardians.data || {};
    const presetNames = guardians.presetNames || [];
    const defs = data.targetGuardians || {};
    const order = data.guardianOrder || Object.keys(defs);

    let unlocks = "";
    order.forEach(function (name) {
      const g = gData[name];
      if (!g) return;
      const def = defs[name];
      if (!def) return;
      const unlocked = !!(g.unlocked || def.alwaysUnlocked);
      unlocks +=
        '<span class="sfArrayItem ' +
        (unlocked ? "is-true" : "is-false") +
        '">' +
        escSaveFileHtml(name) +
        " " +
        sfUnlockMark(unlocked) +
        "</span>";
    });
    let html = unlocks ? '<div class="sfUnlockRow">' + unlocks + "</div>" : "";
    if (!presetNames.length) return html;

    html += '<div class="sfModuleColumns">';
    presetNames.forEach(function (presetName, presetIndex) {
      let entries = "";
      order.forEach(function (name) {
        const g = gData[name];
        if (!g) return;
        const def = defs[name];
        if (!def) return;
        const preset = (g.presets || {})[presetName] || {};
        const rows = sfEntityUpgradeRows(def.upgrades, null, preset.props || {});
        entries +=
          '<div class="sfModuleEntry"><div class="sfModuleName">' +
          escSaveFileHtml(name) +
          "</div>" +
          '<span class="sfTag"> equipped ' +
          sfUnlockMark(preset.equipped) +
          " </span>" +
          (rows || '<div class="sfModMeta">-</div>') +
          "</div>";
      });

      if (!entries) return;
      html +=
        '<div class="sfModuleColumn"><div class="sfModuleColHeader">' +
        escSaveFileHtml(presetName || "Preset " + (presetIndex + 1)) +
        "</div>" +
        entries +
        "</div>";
    });
    return html + "</div>";
  }

  function sfTierNumber(key) {
    const m = String(key).match(/(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  }

  function sfCapWave(value, cap) {
    const num = typeof value === "number" ? value : parseFloat(value);
    if (!isFinite(num)) return value;
    return num > cap ? cap : value;
  }

  function sfPlayerWaveData(data) {
    if (!saveFilePlayerWavesAtCap || !data || !data.oldPlayerStuffTierData) {
      return data;
    }
    const tiers = data.oldPlayerStuffTierData;
    const cappedTiers = {};
    Object.keys(tiers).forEach(function (tierKey) {
      const tier = tiers[tierKey] || {};
      const diss = tier.diss;
      let cappedDiss = diss;
      if (diss) {
        cappedDiss = {};
        Object.keys(diss).forEach(function (key) {
          cappedDiss[key] = sfCapWave(diss[key], SF_PLAYER_DISS_CAP);
        });
      }
      cappedTiers[tierKey] = Object.assign({}, tier, {
        wave: sfCapWave(tier.wave, SF_PLAYER_WAVE_CAP),
        diss: cappedDiss,
      });
    });
    return Object.assign({}, data, { oldPlayerStuffTierData: cappedTiers });
  }

  function sfImportPayload(type, data) {
    return type === "Player & Stuff" ? sfPlayerWaveData(data) : data;
  }

  function sfPlayerWaveToggle() {
    const capped = saveFilePlayerWavesAtCap;
    return (
      '<div class="sfPlayerWaveToggle">' +
      '<span class="sfPlayerWaveOption' +
      (capped ? " is-active" : "") +
      '" onclick="setSaveFilePlayerWaveMode(true)">Capped waves</span>' +
      '<label class="sfPlayerWaveSwitch" title="Capped: ' +
      SF_PLAYER_WAVE_CAP +
      " tier / " +
      SF_PLAYER_DISS_CAP +
      ' dissonant">' +
      '<input type="checkbox" class="sfPlayerWaveCheckbox"' +
      (capped ? "" : " checked") +
      ' aria-label="Use max waves instead of capped waves"' +
      ' onchange="setSaveFilePlayerWaveMode(!this.checked)">' +
      '<span class="sfPlayerWaveSlider"></span>' +
      "</label>" +
      '<span class="sfPlayerWaveOption' +
      (capped ? "" : " is-active") +
      '" onclick="setSaveFilePlayerWaveMode(false)">Max waves</span>' +
      "</div>"
    );
  }

  function ensureSaveFilePlayerWaveCapPreference() {
    if (!saveFilePlayerWaveCapPrefPromise) {
      saveFilePlayerWaveCapPrefPromise = runAppsScript(
        "getSaveFilePlayerWaveCapPreference",
      )
        .then(function (atCap) {
          saveFilePlayerWavesAtCap = !!atCap;
        })
        .catch(function () {});
    }
    return saveFilePlayerWaveCapPrefPromise;
  }

  function setSaveFilePlayerWaveMode(atCap) {
    const input = document.querySelector(
      "#saveFileResults .sfPlayerWaveCheckbox",
    );
    if (input && input.disabled) return;
    if (saveFilePlayerWavesAtCap === !!atCap) return;
    saveFilePlayerWavesAtCap = !!atCap;
    renderSaveFileResults(lastSaveFileResult);
    runAppsScript(
      "setSaveFilePlayerWaveCapPreference",
      saveFilePlayerWavesAtCap,
    ).catch(function () {});
  }

  function renderPlayerBody(rawData) {
    const data = sfPlayerWaveData(rawData);
    const stats = data.oldPlayerStuffStatsData || {};
    const tiers = data.oldPlayerStuffTierData || {};
    const statOrder = data.statOrder || Object.keys(stats.Stat || []);
    const premiumPackOrder =
      data.premiumOrder || Object.keys(stats["Premium Packs"] || []);
    let html = sfPlayerWaveToggle();

    html += '<div class="sfInlineKV">';
    premiumPackOrder.forEach(function (key) {
      const val = stats["Premium Packs"][key] || {};
      html += sfInlinePair(key + ": ", val);
    });
    statOrder.forEach(function (key) {
      const val = stats.Stat[key] || {};
      html += sfInlinePair(key + ": ", val);
    });
    html += "</div>";

    const tierKeys = Object.keys(tiers).sort(function (a, b) {
      return sfTierNumber(a) - sfTierNumber(b);
    });

    if (tierKeys.length === 0) return html;

    html += '<div class="sfTierRow"> </div>';

    for (let i = 0; i < tierKeys.length; i += 3) {
      const chunk = tierKeys.slice(i, i + 3);
      const isPremium = !!(tiers[chunk[0]] || {}).premium;

      html += '<div class="sfTierRow">';
      html +=
        '<div class="sfTierMilestone">' +
        '<div class="sfMilestoneName">Milestone Pass ' +
        sfUnlockMark(isPremium) +
        "</div>" +
        "</div>";

      chunk.forEach(function (tk) {
        const t = tiers[tk] || {};
        const d = t.diss || {};
        const n = sfTierNumber(tk);
        html +=
          '<div class="sfTierCol">' +
          '<div class="sfTierColHeader">Tier ' +
          n +
          "</div>" +
          '<div class="sfTierStat"><span class="sfTierStatKey">Wave</span>' +
          '<span class="sfTierStatVal">' +
          escSaveFileHtml(t.wave != null ? t.wave : "-") +
          "</span></div>" +
          '<div class="sfTierStat"><span class="sfTierStatKey">Atk</span>' +
          '<span class="sfTierStatVal">' +
          escSaveFileHtml(d.attack != null ? d.attack : "-") +
          "</span></div>" +
          '<div class="sfTierStat"><span class="sfTierStatKey">Def</span>' +
          '<span class="sfTierStatVal">' +
          escSaveFileHtml(d.defense != null ? d.defense : "-") +
          "</span></div>" +
          '<div class="sfTierStat"><span class="sfTierStatKey">Util</span>' +
          '<span class="sfTierStatVal">' +
          escSaveFileHtml(d.utility != null ? d.utility : "-") +
          "</span></div>" +
          '<div class="sfTierStat"><span class="sfTierStatKey">Ult</span>' +
          '<span class="sfTierStatVal">' +
          escSaveFileHtml(d.ultimate != null ? d.ultimate : "-") +
          "</span></div>" +
          "</div>";
      });

      html += "</div>";
    }

    return html;
  }

  function renderSaveFileValue(val, depth) {
    depth = depth || 0;

    if (val === null || val === undefined) {
      return '<span class="sfNull">null</span>';
    }

    if (val === true) return '<span class="sfArrayItem is-true">✓</span>';
    if (val === false) return '<span class="sfArrayItem is-false">✗</span>';

    if (typeof val !== "object") {
      return (
        '<span class="sfPrimitive">' + escSaveFileHtml(String(val)) + "</span>"
      );
    }

    if (Array.isArray(val)) {
      if (val.length === 0) return '<span class="sfArrayItem">empty</span>';

      const allPrimitive = val.every(function (item) {
        return item === null || typeof item !== "object";
      });
      if (allPrimitive) {
        return val
          .map(function (item) {
            if (item === true)
              return '<span class="sfArrayItem is-true">✓</span>';
            if (item === false)
              return '<span class="sfArrayItem is-false">✗</span>';
            if (item === null)
              return '<span class="sfArrayItem sfNull">null</span>';
            return (
              '<span class="sfArrayItem">' +
              escSaveFileHtml(String(item)) +
              "</span>"
            );
          })
          .join("");
      }

      return (
        '<div class="sfNestedList">' +
        val
          .map(function (item, idx) {
            return (
              '<div class="sfNestedItem">' +
              '<span class="sfNestedIndex">[' +
              idx +
              "]</span>" +
              renderSaveFileValue(item, depth + 1) +
              "</div>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    const keys = Object.keys(val);
    if (keys.length === 0) return '<span class="sfArrayItem">{ }</span>';
    return (
      '<div class="sfNestedObject">' +
      keys
        .map(function (k) {
          return (
            '<div class="sfNestedRow">' +
            '<span class="sfNestedKey">' +
            escSaveFileHtml(k) +
            "</span>" +
            '<span class="sfNestedVal">' +
            renderSaveFileValue(val[k], depth + 1) +
            "</span>" +
            "</div>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function toggleSaveFileCategory(header) {
    header.parentElement.classList.toggle("open");
  }

  function escSaveFileHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>
