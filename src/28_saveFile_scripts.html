<script>
  let parsedSaveData = null;
  let saveFilePickerReady = false;
  let saveFileSheetType = "";
  let saveFileCollectionOutdated = null;
  let saveFileCollectionVersionChecked = false;

  const SF_MASTER_TYPE = "IDS Master";
  let saveFileImportTargets = null;
  let saveFilePendingAccessIds = [];
  let saveFileNotOwnedFiles = [];
  let saveFileWarningFiles = [];

  const SF_PLAYER_WAVE_CAP = 4500;
  const SF_PLAYER_DISS_CAP = 5000;
  let saveFilePlayerWavesAtCap = true;
  let saveFilePlayerWaveCapPrefPromise = null;

  let saveFileViewMode = "all";
  let sheetExportData = {};
  let sheetExportFetched = false;
  let sheetExportPromise = null;
  let lastSaveFileResult = null;
  let saveFileSelectedTypes = null;
  let saveFilePendingDriveFile = null;

  function runAppsScript(method, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [method](...args);
    });
  }

  document
    .getElementById("saveFileInput")
    .addEventListener("change", function () {
      const file = this.files[0];

      clearSaveFileParseUI();
      document.getElementById("saveFileParseBtn").disabled = !file;
      updateHeldSaveFileLabel();

      if (file) {
        setStatusText('Ready to parse. Click "Parse File" to continue...');
      } else {
        setStatusText("Choose saved file...");
      }
    });

  function clearSaveFileParseUI() {
    parsedSaveData = null;
    saveFilePendingDriveFile = null;
    resetSaveFileDiffState();
    document.getElementById("saveFileResults").style.display = "none";
    document.getElementById("saveFileResults").innerHTML = "";
    document.getElementById("saveFileViewControls").style.display = "none";
    document.getElementById("saveFileImportControls").style.display = "none";
    document.getElementById("saveFileImportBtn").disabled = true;
    refreshSaveFileImportSummary();
  }

  function updateHeldSaveFileLabel() {
    const el = document.getElementById("saveFileHeldName");
    if (!el) return;

    const localFile = document.getElementById("saveFileInput").files[0];
    let name = "";
    let source = "";
    if (localFile) {
      name = localFile.name;
      source = "your computer";
    } else if (saveFilePendingDriveFile) {
      name = saveFilePendingDriveFile.name;
      source = "Google Drive";
    }

    if (!name) {
      el.style.display = "none";
      el.innerHTML = "";
      return;
    }

    el.innerHTML =
      '<span class="saveFileHeldLabel">Selected file</span>' +
      '<span class="saveFileHeldValue">' +
      escSaveFileHtml(name) +
      "</span>" +
      '<span class="saveFileHeldSource">from ' +
      escSaveFileHtml(source) +
      "</span>";
    el.style.display = "";
  }

  function parseFile() {
    const file = document.getElementById("saveFileInput").files[0];
    if (file) {
      setSaveFileBusy(true);
      resetSaveFileDiffState();
      setStatusWithSpinner("Reading file…");

      const reader = new FileReader();
      reader.onload = function (e) {
        const byteArray = Array.from(new Uint8Array(e.target.result));
        parseSaveFileByteArray(byteArray, file.name);
      };
      reader.onerror = function () {
        setSaveFileBusy(false);
        setStatusText("Failed to read file.");
      };
      reader.readAsArrayBuffer(file);
      return;
    }

    if (saveFilePendingDriveFile) {
      parsePendingDriveFile();
    }
  }

  async function parsePendingDriveFile() {
    const picked = saveFilePendingDriveFile;
    if (!picked) return;
    if (!accessToken) {
      setStatusText(
        "Google Drive access isn't authorized yet. Please reload the page and try again.",
      );
      return;
    }

    setSaveFileBusy(true);
    resetSaveFileDiffState();
    setStatusWithSpinner('Downloading "' + picked.name + '" from Google Drive…');

    let byteArray;
    try {
      byteArray = await downloadDriveFileBytes(picked.id);
    } catch (err) {
      setSaveFileBusy(false);
      setStatusText(
        "Could not download the file from Google Drive: " + (err.message || err),
      );
      return;
    }

    await parseSaveFileByteArray(byteArray, picked.name);
  }

  function parseSaveFileByteArray(byteArray, fileName) {
    setStatusWithSpinner("Parsing…");
    return Promise.all([
      runAppsScript("parseSaveFileBytes", byteArray),
      ensureSaveFilePlayerWaveCapPreference(),
    ])
      .then(async function (results) {
        const result = results[0];
        parsedSaveData = (result && result.parsed) || {};
        lastSaveFileResult = result;
        setStatusText(`${fileName} parsed successfully`);
        if (idMasterID && (await ensureSaveFileSheetData())) {
          saveFileViewMode = "diff";
          setStatusText(`${fileName} parsed successfully. Showing differences.`);
        }
        setSaveFileBusy(false);
        renderSaveFileResults(result);
      })
      .catch(function (err) {
        setSaveFileBusy(false);
        setStatusText("Error: " + (err.message || err));
      });
  }

  async function pickSaveFileFromDrive() {
    if (!saveFilePickerReady || typeof google === "undefined" || !google.picker) {
      setStatusText(
        "The Google Drive picker isn't ready yet. Please reload the page and try again.",
      );
      return;
    }
    if (!accessToken) {
      setStatusText(
        "Google Drive access isn't authorized yet. Please reload the page and try again.",
      );
      return;
    }

    let picked;
    try {
      picked = await openSaveFileDrivePicker();
    } catch (err) {
      setStatusText(
        "Error opening the Google Drive picker: " + (err.message || err),
      );
      return;
    }
    if (!picked) {
      setStatusText("No file selected from Google Drive.");
      return;
    }

    clearSaveFileParseUI();
    document.getElementById("saveFileInput").value = "";
    saveFilePendingDriveFile = picked;
    document.getElementById("saveFileParseBtn").disabled = false;
    updateHeldSaveFileLabel();
    setStatusText(
      'Ready to parse "' + picked.name + '". Click "Parse File" to continue...',
    );
  }

  async function downloadDriveFileBytes(fileId) {
    const res = await fetch(
      "https://www.googleapis.com/drive/v3/files/" +
        encodeURIComponent(fileId) +
        "?alt=media&supportsAllDrives=true",
      { headers: { Authorization: "Bearer " + accessToken } },
    );
    if (!res.ok) {
      let detail = "";
      try {
        const body = await res.json();
        detail = (body && body.error && body.error.message) || "";
      } catch (e) {}
      throw new Error(detail || "Google Drive returned HTTP " + res.status);
    }
    const buffer = await res.arrayBuffer();
    return Array.from(new Uint8Array(buffer));
  }

  function openSaveFileDrivePicker() {
    return new Promise(function (resolve, reject) {
      try {
        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(false)
          .setMode(google.picker.DocsViewMode.LIST)
          .setQuery("playerInfo.dat");

        const pickerSize = {
          width: Math.min(window.innerWidth - 10, 1400),
          height: Math.min(window.innerHeight - 80, 900),
        };

        const picker = new google.picker.PickerBuilder()
          .setDeveloperKey(API_KEY)
          .setAppId(APP_ID)
          .setOAuthToken(accessToken)
          .setTitle("Select your save file")
          .addView(view)
          .setCallback(function (data) {
            if (data.action === google.picker.Action.PICKED) {
              const doc = (data.docs || [])[0];
              resolve(doc ? { id: doc.id, name: doc.name } : null);
            } else if (data.action === google.picker.Action.CANCEL) {
              resolve(null);
            }
          })
          .setSize(pickerSize.width, pickerSize.height);

        if (isMobile) {
          picker.enableFeature(google.picker.Feature.NAV_HIDDEN);
        }

        if (
          typeof google !== "undefined" &&
          google.script &&
          google.script.host &&
          google.script.host.origin
        ) {
          picker.setOrigin(google.script.host.origin);
        }

        picker.build().setVisible(true);
      } catch (error) {
        reject(error);
      }
    });
  }

  function renderSaveFileResults(result) {
    if (result) lastSaveFileResult = result;
    const container = document.getElementById("saveFileResults");
    const parsed = (result && result.parsed) || {};
    const order = (result && result.order) || Object.keys(parsed);
    let html = "<br>";
    let cardCount = 0;
    const selectedTypes = new Set();
    const openTypes = sfOpenCategoryTypes(container);

    for (const type of order) {
      const data = parsed[type];
      if (!categoryHasData(data)) continue;
      cardCount++;

      const bodyHtml = buildSaveFileCategoryBody(type, data);
      const noDiff = /sfDiffNone/.test(bodyHtml);
      const outdatedInfo = sfTypeOutdatedInfo(type);
      const isOutdated = !!outdatedInfo;
      const checked = sfTypeChecked(type) && !noDiff && !isOutdated;
      if (checked) selectedTypes.add(type);

      html +=
        '<div class="sfCategory' +
        (isOutdated ? " sfCategoryOutdated" : "") +
        (openTypes.has(type) ? " open" : "") +
        '">';
      html +=
        '<div class="sfCategoryHeader" onclick="toggleSaveFileCategory(this)">';
      html += '<span class="sfCategoryHeaderMain">';
      html +=
        '<input type="checkbox" class="sfCategoryCheckbox" data-sheettype="' +
        escSaveFileHtml(type) +
        '" ' +
        (checked ? "checked" : "") +
        (isOutdated ? ' disabled data-outdated="1"' : "") +
        ' onclick="event.stopPropagation()">';
      html +=
        '<span class="sfCategoryTitle">' + escSaveFileHtml(type) + "</span>";
      if (isOutdated) {
        html +=
          '<span class="sfCategoryOutdatedBadge" title="This sheet is out of date (' +
          escSaveFileHtml(outdatedInfo.currentVersion || "?") +
          " → " +
          escSaveFileHtml(outdatedInfo.latestVersion || "?") +
          ')">⚠️ Outdated</span>';
      } else if (noDiff) {
        html += '<span class="sfCategoryCheck" title="No differences">✓</span>';
      }
      html += "</span>";
      html += '<span class="sfCategoryChevron">►</span>';
      html += "</div>";
      html += '<div class="sfCategoryBody">';
      html += bodyHtml;
      html += "</div></div>";
    }

    if (cardCount === 0) {
      html +=
        '<div class="sfMissingSection">No recognizable data found in this save file.</div>';
    }

    saveFileSelectedTypes = selectedTypes;

    container.innerHTML = html;
    container.style.display = "block";

    document.getElementById("saveFileImportControls").style.display = "block";
    container.querySelectorAll(".sfCategoryCheckbox").forEach(function (cb) {
      cb.addEventListener("change", function () {
        captureSaveFileSelection();
        updateImportButtonState();
      });
    });

    refreshSaveFileImportSummary();

    updateImportButtonState();
    updateSaveFileViewControls();
  }

  function resetSaveFileDiffState() {
    saveFileViewMode = "all";
    saveFileSelectedTypes = null;
  }

  function sfOpenCategoryTypes(container) {
    const open = new Set();
    if (!container) return open;
    container.querySelectorAll(".sfCategory.open").forEach(function (card) {
      const cb = card.querySelector(".sfCategoryCheckbox");
      if (cb) open.add(cb.getAttribute("data-sheettype"));
    });
    return open;
  }

  function sfTypeChecked(type) {
    return saveFileSelectedTypes === null || saveFileSelectedTypes.has(type);
  }

  function sfTypeOutdatedInfo(type) {
    if (saveFileCollectionOutdated) {
      return {
        currentVersion: saveFileCollectionOutdated.currentVersion,
        latestVersion: saveFileCollectionOutdated.latestVersion,
      };
    }
    if (!saveFileImportTargets) return null;
    const targets = saveFileImportTargets.targets || {};
    const versions = saveFileImportTargets.versions || {};
    if (!targets[type]) return null;
    const v = versions[type];
    if (v && v.upToDate) return null;
    return {
      currentVersion: v ? v.currentVersion : "",
      latestVersion: v ? v.latestVersion : "",
    };
  }

  function getSaveFileOutdatedTargets() {
    if (!saveFileImportTargets || !saveFileImportTargets.versions) return [];
    const versions = saveFileImportTargets.versions;
    const targets = saveFileImportTargets.targets || {};
    return Object.keys(versions)
      .filter(function (type) {
        return targets[type] && !versions[type].upToDate;
      })
      .map(function (type) {
        return {
          type: type,
          currentVersion: versions[type].currentVersion,
          latestVersion: versions[type].latestVersion,
        };
      });
  }

  function refreshSaveFileImportSummary() {
    const el = document.getElementById("saveFileImportSummary");
    if (!el) return;
    if (!idMasterID) {
      el.innerHTML = `<div class="sfImportGroup"><strong>⚠️ Could not determine your ${saveFileSheetType} automatically, so importing is unavailable.</strong></div>`;
      return;
    }
    if (saveFileCollectionOutdated) {
      renderSaveFileCollectionOutdated(saveFileCollectionOutdated);
      return;
    }
    const outdated = getSaveFileOutdatedTargets();
    if (outdated.length > 0) {
      renderSaveFileOutdatedSheets(outdated);
      return;
    }
    el.innerHTML = "";
  }

  function captureSaveFileSelection() {
    const set = new Set();
    document
      .querySelectorAll("#saveFileResults .sfCategoryCheckbox")
      .forEach(function (cb) {
        if (cb.checked) set.add(cb.getAttribute("data-sheettype"));
      });
    saveFileSelectedTypes = set;
  }

  function updateSaveFileViewControls() {
    const controls = document.getElementById("saveFileViewControls");
    const btn = document.getElementById("saveFileViewToggleBtn");
    const legend = document.getElementById("saveFileDiffLegend");
    if (!controls || !btn) return;

    const show = !!idMasterID && !!lastSaveFileResult;
    controls.style.display = show ? "" : "none";

    if (saveFileViewMode === "diff") {
      btn.textContent = "Show all parsed data";
      if (legend) legend.style.display = "";
    } else {
      btn.textContent = "Show only differences";
      if (legend) legend.style.display = "none";
    }
  }

  function buildSaveFileCategoryBody(type, data) {
    if (saveFileViewMode !== "diff") {
      return renderCategoryBody(type, data);
    }
    const entry = sheetExportData ? sheetExportData[type] : null;
    if (!entry) {
      return '<div class="sfDiffUnavailable">Could not load your sheet data for this category.</div>';
    }
    if (entry.__error) {
      return (
        '<div class="sfDiffUnavailable">' +
        escSaveFileHtml(entry.__error) +
        "</div>"
      );
    }
    const diffHtml = renderSaveFileDiffBody(type, data, entry);
    if (!diffHtml || !diffHtml.trim()) {
      return sfDiffNoneHtml();
    }
    return diffHtml;
  }

  function sfDiffNoneHtml() {
    return '<div class="sfDiffNone">✓ Save file matches your sheet — no differences.</div>';
  }

  function startSaveFileSheetPrefetch() {
    if (!idMasterID || sheetExportFetched || sheetExportPromise) return;
    if (saveFileCollectionOutdated) return;
    sheetExportPromise = fetchSaveFileSheetData(true).catch(function () {
      return false;
    });
  }

  async function ensureSaveFileSheetData() {
    if (sheetExportFetched) return true;
    if (sheetExportPromise) {
      setStatusWithSpinner("Reading your sheet data to compare…");
      const ok = await sheetExportPromise;
      if (ok) return true;
      sheetExportPromise = null;
    }
    return fetchSaveFileSheetData();
  }

  async function toggleSaveFileViewMode() {
    if (saveFileViewMode === "all") {
      if (!idMasterID) {
        setStatusText(
          `Cannot compare: your ${saveFileSheetType || "sheet"} could not be determined.`,
        );
        return;
      }
      if (!sheetExportFetched) {
        setSaveFileBusy(true);
        const ok = await ensureSaveFileSheetData();
        setSaveFileBusy(false);
        if (!ok) return;
      }
      saveFileViewMode = "diff";
      setStatusText("Loaded your sheet data. Showing differences.");
    } else {
      saveFileViewMode = "all";
      setStatusText("Showing all parsed data.");
    }
    renderSaveFileResults(lastSaveFileResult);
  }

  async function fetchSaveFileSheetData(background) {
    if (!idMasterID) return false;
    const report = function (message, spinner) {
      if (background) return;
      if (spinner) setStatusWithSpinner(message);
      else setStatusText(message);
    };
    try {
      report("Reading your sheet data to compare…", true);
      const result = {};

      if (saveFileSheetType === "IDS Collection") {
        const compat = await runAppsScript(
          "checkExportCompatibility",
          idMasterID,
          "IDS Collection",
        );
        if (!compat || !compat.success || !compat.versionDifference) {
          report(
            "Could not compare with your IDS Collection: " +
              ((compat && compat.message) || "version check failed."),
          );
          return false;
        }
        const exp = await runAppsScript(
          "exportData",
          idMasterID,
          "IDS Collection",
          compat.versionDifference,
        );
        if (!exp || !exp.success) {
          report(
            "Could not read your IDS Collection: " +
              ((exp && exp.message) || "export failed."),
          );
          return false;
        }
        const data = exp.data || {};
        Object.keys(data).forEach(function (type) {
          result[type] = data[type];
        });
      } else {
        // The master's own export carries both halves we need: its global
        // presets, and the sub-sheet ids for every other category. Reading it
        // first means the ids arrive as a by-product of a category export we
        // had to make anyway, instead of a separate id lookup before it.
        let masterIds = null;
        try {
          const masterCompat = await runAppsScript(
            "checkExportCompatibility",
            idMasterID,
            SF_MASTER_TYPE,
          );
          if (
            !masterCompat ||
            !masterCompat.success ||
            !masterCompat.versionDifference
          ) {
            result[SF_MASTER_TYPE] = {
              __error:
                (masterCompat && masterCompat.message) ||
                "Version check failed.",
            };
          } else {
            const masterExp = await runAppsScript(
              "exportData",
              idMasterID,
              SF_MASTER_TYPE,
              masterCompat.versionDifference,
            );
            if (!masterExp || !masterExp.success) {
              result[SF_MASTER_TYPE] = {
                __error:
                  (masterExp && masterExp.message) || "Could not read sheet.",
              };
            } else {
              result[SF_MASTER_TYPE] = masterExp.data || {};
              masterIds = result[SF_MASTER_TYPE].oldIdsData || null;
            }
          }
        } catch (err) {
          result[SF_MASTER_TYPE] = { __error: err.message || String(err) };
        }

        // Only fall back to the separately resolved targets if that failed.
        const targets =
          masterIds ||
          (saveFileImportTargets && saveFileImportTargets.targets) ||
          {};
        const order =
          lastSaveFileResult && lastSaveFileResult.order
            ? lastSaveFileResult.order
            : Object.keys(parsedSaveData || {});
        const parsedTypes = order.filter(function (type) {
          return categoryHasData((parsedSaveData || {})[type]);
        });
        const types = (
          parsedTypes.length ? parsedTypes : Object.keys(targets)
        ).filter(function (type) {
          return type !== SF_MASTER_TYPE;
        });

        await Promise.all(
          types.map(async function (type) {
            const targetID = targets[type];
            if (!targetID) {
              result[type] = {
                __error: "This category isn't linked in your IDS Master.",
              };
              return;
            }
            try {
              const compat = await runAppsScript(
                "checkExportCompatibility",
                targetID,
                type,
              );
              if (!compat || !compat.success || !compat.versionDifference) {
                result[type] = {
                  __error:
                    (compat && compat.message) || "Version check failed.",
                };
                return;
              }
              const exp = await runAppsScript(
                "exportData",
                targetID,
                type,
                compat.versionDifference,
              );
              if (!exp || !exp.success) {
                result[type] = {
                  __error: (exp && exp.message) || "Could not read sheet.",
                };
                return;
              }
              result[type] = exp.data || {};
            } catch (err) {
              result[type] = { __error: err.message || String(err) };
            }
          }),
        );
      }

      const types = Object.keys(result);
      if (
        background &&
        types.length > 0 &&
        types.every(function (type) {
          return result[type] && result[type].__error;
        })
      ) {
        return false;
      }

      sheetExportData = result;
      sheetExportFetched = true;
      return true;
    } catch (err) {
      report("Error comparing with your sheet: " + (err.message || err));
      return false;
    }
  }

  function sfTrimLevel(v) {
    if (v === null || v === undefined) return null;
    let s = String(v);
    if (s.indexOf("|") !== -1) s = s.split("|")[0];
    return s.trim();
  }

  function sfNormLevel(v) {
    const t = sfTrimLevel(v);
    if (t === null || t === "") return "0";
    if (/^-?\d+(\.\d+)?$/.test(t)) return String(parseFloat(t));
    return t.toLowerCase();
  }

  function sfNormGeneric(v) {
    if (v === true || v === "true" || v === "TRUE") return "true";
    if (v === false || v === "false" || v === "FALSE") return "false";
    if (v === null || v === undefined || v === "" || v === "-") return "";
    const t = sfTrimLevel(v);
    if (/^-?\d+(\.\d+)?$/.test(t)) return String(parseFloat(t));
    return t.toLowerCase();
  }

  function sfNormBool(v) {
    return v === true || v === "true" || v === "TRUE" || v === 1 || v === "1";
  }

  function sfDisplayLevel(v) {
    const t = sfTrimLevel(v);
    if (t === null || t === "") return "0";
    if (/^-?\d+(\.\d+)?$/.test(t)) return String(parseFloat(t));
    return t;
  }

  function sfDisplayValue(v) {
    if (v === true || v === "true" || v === "TRUE") return "✓";
    if (v === false || v === "false" || v === "FALSE") return "✗";
    if (v === null || v === undefined || v === "") return "-";
    return sfTrimLevel(v);
  }

  function sfDisplayBool(v) {
    return sfNormBool(v) ? "✓" : "✗";
  }


  function sfDiffRow(oldDisp, newDisp, name) {
    return (
      '<div class="sfDiffRow">' +
      '<span class="sfDiffOld">' +
      escSaveFileHtml(oldDisp) +
      "</span>" +
      '<span class="sfDiffArrow">→</span>' +
      '<span class="sfDiffNew">' +
      escSaveFileHtml(newDisp) +
      "</span>" +
      (name
        ? '<span class="sfDiffName">' + escSaveFileHtml(name) + "</span>"
        : "") +
      "</div>"
    );
  }

  function sfDiffAddItem(label) {
    return (
      '<span class="sfArrayItem sfDiffAddItem">+ ' +
      escSaveFileHtml(label) +
      "</span>"
    );
  }

  function sfDiffRemItem(label) {
    return (
      '<span class="sfArrayItem sfDiffRemItem">− ' +
      escSaveFileHtml(label) +
      "</span>"
    );
  }

  function sfDiffGrid(rows) {
    return '<div class="sfDiffGrid">' + rows + "</div>";
  }

  function sfDiffGridStacked(rows) {
    return '<div class="sfDiffGrid sfDiffStack">' + rows + "</div>";
  }

  function sfDiffBlock(title, inner) {
    return (
      '<div class="sfBlock"><div class="sfBlockHeader">' +
      escSaveFileHtml(title) +
      "</div>" +
      inner +
      "</div>"
    );
  }

  function sfDiffSub(title, inner) {
    return (
      '<div class="sfSubBlock"><div class="sfSubBlockHeader">' +
      escSaveFileHtml(title) +
      "</div>" +
      inner +
      "</div>"
    );
  }

  function renderSaveFileDiffBody(type, parsed, sheet) {
    switch (type) {
      case "Laboratory":
        return renderLaboratoryDiff(parsed, sheet);
      case "Workshop":
        return renderWorkshopDiff(parsed, sheet);
      case "Ultimate Weapon":
        return renderUltimateDiff(parsed, sheet);
      case "Themes, Songs & Relics":
        return renderThemesAndRelicsDiff(parsed, sheet);
      case "Bots":
        return renderBotsDiff(parsed, sheet);
      case "Vault":
        return renderVaultDiff(parsed, sheet);
      case "Cards":
        return renderCardsDiff(parsed, sheet);
      case "Modules":
        return renderModulesDiff(parsed, sheet);
      case "Guardians":
        return renderGuardiansDiff(parsed, sheet);
      case "Player & Stuff":
        return renderPlayerDiff(parsed, sheet);
      case "IDS Master":
        return renderMasterDiff(parsed, sheet);
      default:
        return "";
    }
  }

  function renderLaboratoryDiff(parsed, sheet) {
    const p = parsed.oldLabLevels || {};
    const s = sheet.oldLabLevels || {};
    const order = parsed.labOrder || Object.keys(p);
    let rows = "";
    order.forEach(function (name) {
      if (!name || !p.hasOwnProperty(name)) return;
      const pv = Array.isArray(p[name]) ? p[name][0] : p[name];
      const sv = Array.isArray(s[name]) ? s[name][0] : s[name];
      if (sfNormLevel(pv) === sfNormLevel(sv)) return;
      rows += sfDiffRow(sfDisplayLevel(sv), sfDisplayLevel(pv), name);
    });
    return rows ? sfDiffGrid(rows) : "";
  }

  function renderWorkshopDiff(parsed, sheet) {
    const pUp = parsed.oldWorkshopLevels || {};
    const sUp = sheet.oldWorkshopLevels || {};
    const pEn = parsed.oldWorkshopPlusLevels || {};
    const sEn = sheet.oldWorkshopPlusLevels || {};
    const presetNames = pUp.presetNames || [];
    const upIdx = parsed.upgradeIndices || {};
    const enIdx = parsed.enhancementIndices || {};
    const tracks = ["Attack", "Defense", "Utility"];
    let html = "";

    presetNames.forEach(function (presetName, presetIndex) {
      const upTracks = {};
      const enTracks = {};
      let presetHasValue = false;

      tracks.forEach(function (track) {
        let rows = "";
        (upIdx[track] || []).forEach(function (name) {
          const pd = (pUp.data || {})[name];
          if (!pd) return;
          const pv = (pd.levels || [])[presetIndex * 2];
          if (sfNormLevel(pv) !== "0") presetHasValue = true;
          const sd = (sUp.data || {})[name];
          const sv = sfSheetPresetVal(
            sd ? sd.levels : null,
            presetIndex * 2,
            presetIndex,
            0,
          );
          if (sfNormLevel(pv) === sfNormLevel(sv)) return;
          rows += sfDiffRow(sfDisplayLevel(sv), sfDisplayLevel(pv), name);
        });
        upTracks[track] = rows;
      });

      tracks.forEach(function (track) {
        let rows = "";
        (enIdx[track] || []).forEach(function (name) {
          const parr = (pEn.data || {})[name];
          if (!parr) return;
          const pv = parr[presetIndex];
          if (sfNormLevel(pv) !== "0") presetHasValue = true;
          const sarr = (sEn.data || {})[name];
          const sv = sfSheetPresetVal(sarr, presetIndex, presetIndex, 0);
          if (sfNormLevel(pv) === sfNormLevel(sv)) return;
          rows += sfDiffRow(sfDisplayLevel(sv), sfDisplayLevel(pv), name);
        });
        enTracks[track] = rows;
      });

      if (!presetHasValue) return;

      const groups =
        sfDiffTrackGroup("Upgrades", upTracks, tracks) +
        sfDiffTrackGroup("Enhancements", enTracks, tracks);
      if (groups) {
        html += sfDiffBlock(
          presetName,
          '<div class="sfPresetBox">' + groups + "</div>",
        );
      }
    });
    return html;
  }

  function sfDiffTrackGroup(groupLabel, rowsByTrack, tracks) {
    let columns = "";
    tracks.forEach(function (track) {
      const rows = rowsByTrack[track];
      if (!rows) return;
      columns +=
        '<div class="sfWorkshopColumn"><div class="sfWorkshopColHeader">' +
        escSaveFileHtml(track) +
        "</div>" +
        sfDiffGridStacked(rows) +
        "</div>";
    });
    if (!columns) return "";
    return (
      '<div class="sfPresetGroup"><div class="sfPresetGroupHeader">' +
      escSaveFileHtml(groupLabel) +
      '</div><div class="sfPresetTracks">' +
      columns +
      "</div></div>"
    );

  function sfSheetPresetVal(arr, idx, presetIndex, farmingIdx) {
    if (!arr) return undefined;
    let v = arr[idx];
    if (
      presetIndex > 0 &&
      (v === null || v === undefined || String(v).trim() === "")
    ) {
      v = arr[farmingIdx];
    }
    return v;
  }

  function renderUltimateDiff(parsed, sheet) {
    const p = parsed.oldUltimate || {};

    const order = parsed.weaponOrder || Object.keys(defs);

    order.forEach(function (name) {
      const pw = p[name];

      const sw = s[name] || {};
      const def = defs[name];
      if (!def) return;
      let rows = "";
      if (sfNormBool(pw.unlocked) !== sfNormBool(sw.unlocked)) {
        rows += sfDiffRow(
          sfDisplayBool(sw.unlocked),
          sfDisplayBool(pw.unlocked),
          "Unlocked",
        );
      }
      const attrs = (def.upgrades || []).filter(Boolean);
      if (def.plusUpgrade) attrs.push(def.plusUpgrade);
      const pl = pw.levels || {};
      const sl = sw.levels || {};
      attrs.forEach(function (attr) {
        const pv = pl[attr];
        const sv = sl[attr];
        if (sfNormLevel(pv) === sfNormLevel(sv)) return;
        rows += sfDiffRow(sfDisplayLevel(sv), sfDisplayLevel(pv), attr);

  function renderBotsDiff(parsed, sheet) {

        const sBot = sBots[botName] || {};
        const def = defs[botName];
        if (!def) return;

        const attrs = (def.upgrades || []).filter(Boolean);
        if (def.plusUpgrade) attrs.push(def.plusUpgrade);

        const pPreset = (pBot.presets || {})[presetName] || {};
        const sPreset = (sBot.presets || {})[presetName] || {};
        const pProps = pPreset.props || {};
        const sProps = sPreset.props || {};
        const farmingProps =
          presetIndex > 0
            ? ((sBot.presets || {})[presetNames[0]] || {}).props || {}
            : sProps;

        let rows = "";
        if (sfNormBool(pPreset.active) !== sfNormBool(sPreset.active)) {
          rows += sfDiffRow(

          );
        }

          "</div>";

          columns +
          "</div>"

          rows += sfDiffRow(

          '<div class="sfSubBlock"><div class="sfSubBlockHeader">' +

          "</div>" +

      if (!sectionsHtml) return;
      columnsHtml +=
        '<div class="sfWorkshopColumn">' +
        '<div class="sfWorkshopColHeader">' +
        escSaveFileHtml(group.group) +
        "</div>" +
        sectionsHtml +
        "</div>";

    return '<div class="sfPresetTracks">' + columnsHtml + "</div>";

  function renderCardsDiff(parsed, sheet) {
    const pLevels = parsed.oldCardsLevel || {};
    const sLevels = sheet.oldCardsLevel || {};
    const order = parsed.cardNameIndices || Object.keys(pLevels);
    let html = "";

    let levelRows = "";
    order.forEach(function (card) {
      if (!card || !pLevels.hasOwnProperty(card)) return;
      const pArr = pLevels[card] || [];
      const sArr = sLevels[card] || [];
      if (sfNormLevel(pArr[0]) !== sfNormLevel(sArr[0])) {
        levelRows += sfDiffRow(
          sfDisplayLevel(sArr[0]),
          sfDisplayLevel(pArr[0]),

        );
      }
      if (sfNormBool(pArr[1]) !== sfNormBool(sArr[1])) {
        levelRows += sfDiffRow(
          sfDisplayBool(sArr[1]),

          card + " ★",

      }
    });
    if (levelRows) html += sfDiffSub("Card Levels", sfDiffGrid(levelRows));

    const pPresets = parsed.oldCardsPreset || {};
    const sPresets = sheet.oldCardsPreset || {};
    let presetInner = "";
    Object.keys(pPresets).forEach(function (name) {
      const pCards = (pPresets[name] && pPresets[name].cards) || [];
      const sCards = (sPresets[name] && sPresets[name].cards) || [];
      const pSet = new Set(pCards.map(String));
      const sSet = new Set(sCards.map(String));
      const added = pCards.filter(function (c) {
        return !sSet.has(String(c));
      });
      const removed = sCards.filter(function (c) {
        return !pSet.has(String(c));

    ) {

        sfDiffRow(
          sfDisplayLevel(sheet.oldCardSlots),

  function renderModulesDiff(parsed, sheet) {

    const pPre = parsed.oldModulesPresets || {};
    const sPre = sheet.oldModulesPresets || {};

    return (
      renderModulesPresetsDiff(pPre, sPre, moduleCats) +

  function renderModulesPresetsDiff(pPre, sPre, moduleCats) {
    const pNames = pPre.presetNames || [];
    const sNames = sPre.presetNames || [];

      ["Main", "primary"],
      ["Assist", "secondary"],
    ];

        slots.forEach(function (slot) {

  function renderModulesInventoryDiff(
    pInv,
    sInv,
    pPre,
    sPre,
    moduleCats,
    moduleOrder,
  ) {
    const metaKeys = ["Highest Level", "Assist Level"];
    let columns = "";
    moduleCats.forEach(function (cat) {
      const pCat = pInv[cat] || {};
      const sCat = sInv[cat] || {};
      let colInner = "";

      metaKeys.forEach(function (key) {
        if (!pCat.hasOwnProperty(key)) return;
        if (sfNormLevel(pCat[key]) !== sfNormLevel(sCat[key])) {
          colInner += sfDiffRow(
            sfDisplayLevel(sCat[key]),
            sfDisplayLevel(pCat[key]),
            key,
          );
        }
      });

      const pAssist = (pPre[cat] && pPre[cat]["Assist Slot"]) || null;
      const sAssist = (sPre[cat] && sPre[cat]["Assist Slot"]) || {};
      if (pAssist) {
        let assistRows = "";
        if (sfNormBool(pAssist.locked) !== sfNormBool(sAssist.locked)) {
          assistRows += sfDiffRow(
            sfDisplayBool(sAssist.locked),
            sfDisplayBool(pAssist.locked),
            "Unlocked",
          );
        }
        if (sfNormGeneric(pAssist.rarity) !== sfNormGeneric(sAssist.rarity)) {
          assistRows += sfDiffRow(
            sfDisplayValue(sAssist.rarity),
            sfDisplayValue(pAssist.rarity),
            "Rarity",
          );
        }
        if (
          sfNormLevel(pAssist.multiplier) !== sfNormLevel(sAssist.multiplier)
        ) {
          assistRows += sfDiffRow(
            sfDisplayLevel(sAssist.multiplier),
            sfDisplayLevel(pAssist.multiplier),
            "Multiplier",
          );
        }
        if (sfNormLevel(pAssist.substat) !== sfNormLevel(sAssist.substat)) {
          assistRows += sfDiffRow(
            sfDisplayLevel(sAssist.substat),
            sfDisplayLevel(pAssist.substat),
            "Substat",
          );
        }
        if (assistRows)
          colInner += sfModuleDiffEntry("Assist Slot", assistRows);
      }

      sfOrderedModuleKeys(pCat, moduleOrder, metaKeys).forEach(function (key) {
        if (metaKeys.indexOf(key) !== -1) return;
        const pMod = pCat[key];
        if (!pMod || typeof pMod !== "object") return;
        const sMod = sCat[key];
        let modRows = "";
        if (!sMod) {
          modRows += sfDiffRow("-", sfDisplayValue(pMod.rarity), "Rarity");
        } else if (sfNormGeneric(pMod.rarity) !== sfNormGeneric(sMod.rarity)) {
          modRows += sfDiffRow(
            sfDisplayValue(sMod.rarity),
            sfDisplayValue(pMod.rarity),
            "Rarity",
          );
        }
        const pSub = pMod.substats || [];
        const sSub = (sMod && sMod.substats) || [];
        const max = Math.max(pSub.length, sSub.length);
        for (let i = 0; i < max; i++) {
          const pPair = pSub[i] || [null, null];
          const sPair = sSub[i] || [null, null];
          if (
            sfNormGeneric(pPair[0]) === sfNormGeneric(sPair[0]) &&
            sfNormGeneric(pPair[1]) === sfNormGeneric(sPair[1])
          )
            continue;
          modRows += sfDiffRow(
            sfModuleSubstatLabel(sPair),
            sfModuleSubstatLabel(pPair),
          );
        }
        if (modRows) colInner += sfModuleDiffEntry(key, modRows);
      });

      if (colInner) {
        columns +=
          '<div class="sfModuleColumn"><div class="sfModuleColHeader">' +
          escSaveFileHtml(cat) +
          "</div>" +
          colInner +
          "</div>";
      }
    });

    return columns
      ? sfSubLabel("Inventory") +
          '<div class="sfModuleColumns sfDiffModuleColumns sfDiffFitColumns">' +
          columns +
          "</div>"
      : "";
  }

  function sfModuleDiffEntry(name, rows) {

      "</div>" +

  function renderPlayerDiff(rawParsed, sheet) {
    const parsed = sfPlayerWaveData(rawParsed);
    const pStats = parsed.oldPlayerStuffStatsData || {};
    const sStats = sheet.oldPlayerStuffStatsData || {};
    const statsOrder = parsed.statOrder || Object.keys(pStats.Stat);
    const premiumPackOrder =
      parsed.premiumOrder || Object.keys(pStats["Premium Packs"]);
    let html = "";

    let statRows = "";

    const pPack = pStats["Premium Packs"] || {};
    const sPack = sStats["Premium Packs"] || {};
    premiumPackOrder.forEach(function (key) {
      if (sfNormGeneric(pPack[key]) === sfNormGeneric(sPack[key])) return;
      statRows += sfDiffRow(
        sfDisplayValue(sPack[key]),
        sfDisplayValue(pPack[key]),
        key,
      );
    });

    const pStat = pStats.Stat || {};
    const sStat = sStats.Stat || {};
    statsOrder.forEach(function (key) {
      if (sfNormGeneric(pStat[key]) === sfNormGeneric(sStat[key])) return;
      statRows += sfDiffRow(
        sfDisplayValue(sStat[key]),
        sfDisplayValue(pStat[key]),
        key,
      );
    });
    if (statRows) html += sfDiffSub("Stats", sfDiffGrid(statRows));

    const pTiers = parsed.oldPlayerStuffTierData || {};
    const sTiers = sheet.oldPlayerStuffTierData || {};
    const tierOrder = Object.keys(pTiers).sort(function (a, b) {
      return sfTierNumber(a) - sfTierNumber(b);
    });
    tierOrder.forEach(function (tierKey) {
      const pt = pTiers[tierKey] || {};
      const st = sTiers[tierKey] || {};
      const pd = pt.diss || {};
      const sd = st.diss || {};
      let rows = "";
      if (sfNormLevel(pt.wave) !== sfNormLevel(st.wave))
        rows += sfDiffRow(
          sfDisplayLevel(st.wave),
          sfDisplayLevel(pt.wave),
          "Wave",
        );
      ["attack", "defense", "utility", "ultimate"].forEach(function (k) {
        if (sfNormLevel(pd[k]) !== sfNormLevel(sd[k]))
          rows += sfDiffRow(
            sfDisplayLevel(sd[k]),
            sfDisplayLevel(pd[k]),
            k.charAt(0).toUpperCase() + k.slice(1),
          );
      });
      if (sfNormBool(pt.premium) !== sfNormBool(st.premium))
        rows += sfDiffRow(
          sfDisplayBool(st.premium),
          sfDisplayBool(pt.premium),
          "Milestone Pass",
        );
      if (rows) html += sfDiffSub(tierKey, sfDiffGrid(rows));
    });
    return sfPlayerWaveToggle() + (html || sfDiffNoneHtml());
  }

  function categoryHasData(data) {
    if (!data || typeof data !== "object") return false;
    return Object.keys(data).some(function (k) {
      const v = data[k];
      if (Array.isArray(v)) return v.length > 0;
      if (v && typeof v === "object") return Object.keys(v).length > 0;
      return v !== null && v !== undefined && v !== "";
    });
  }

  async function evaluateSaveFileAccess() {
    saveFilePendingAccessIds = [];
    saveFileNotOwnedFiles = [];
    saveFileWarningFiles = [];
    if (!idMasterID) return true;

    setStatusWithSpinner("Checking sheet access...");
    const primaryAccess = await checkSaveFileSheetAccess([idMasterID]);
    if ((primaryAccess.notOwnedFiles || []).length > 0) {
      saveFileNotOwnedFiles = primaryAccess.notOwnedFiles;
      return false;
    }
    if ((primaryAccess.inaccessibleFiles || []).length > 0) {
      saveFilePendingAccessIds = [idMasterID];
      return false;
    }
    saveFileWarningFiles = mergeSaveFileWarnings(
      saveFileWarningFiles,
      primaryAccess.warningFiles,
    );

    return await resolveSaveFileSubsheetAccess();
  }

  async function resolveSaveFileSubsheetAccess() {
    saveFileNotOwnedFiles = [];
    if (!saveFileSheetType && typeof sheetType === "string") {
      saveFileSheetType = sheetType;
    }
    if (
      saveFileSheetType !== "IDS Master" &&
      saveFileSheetType !== "IDS Collection"
    ) {
      await resolveSaveFileSheetType();
    }

    if (saveFileSheetType === "IDS Collection") {
      await ensureSaveFileCollectionVersion();
    }
    if (saveFileSheetType !== "IDS Master") {
      saveFilePendingAccessIds = [];
      return true;
    }

    if (!saveFileImportTargets) {
      setStatusWithSpinner("Resolving your IDS Master sheets...");
      try {
        const result = await runAppsScript(
          "getSaveFileImportTargets",
          idMasterID,
        );
        if (result && result.success) saveFileImportTargets = result;
      } catch (err) {
        console.error("Could not resolve IDS Master sheets:", err);
      }
    }

    const targets =
      (saveFileImportTargets && saveFileImportTargets.targets) || {};
    const targetIds = Object.keys(targets).map(function (type) {
      return targets[type];
    });
    if (targetIds.length === 0) {
      saveFilePendingAccessIds = [];
      return true;
    }

    setStatusWithSpinner("Checking access to your IDS Master sheets...");
    const subAccess = await checkSaveFileSheetAccess(targetIds);
    if ((subAccess.notOwnedFiles || []).length > 0) {
      saveFileNotOwnedFiles = subAccess.notOwnedFiles;
      saveFilePendingAccessIds = [];
      return false;
    }
    saveFileWarningFiles = mergeSaveFileWarnings(
      saveFileWarningFiles,
      subAccess.warningFiles,
    );
    saveFilePendingAccessIds = (subAccess.inaccessibleFiles || []).map(
      function (f) {
        return f.id;
      },
    );
    return saveFilePendingAccessIds.length === 0;
  }

  async function resolveSaveFileSheetType() {
    if (!idMasterID) return;
    saveFileCollectionOutdated = null;
    try {
      setStatusWithSpinner("Determining sheet type...");
      const result = await runAppsScript("getSaveFileSheetType", idMasterID);
      if (result && result.success && result.sheetType) {
        saveFileSheetType = result.sheetType;
        if (saveFileSheetType === "IDS Collection") {
          saveFileCollectionVersionChecked = true;
          if (result.outdated) {
            saveFileCollectionOutdated = {
              currentVersion: result.currentVersion,
              latestVersion: result.latestVersion,
            };
          }
        }
      }
    } catch (err) {
      console.error("Could not determine sheet type:", err);
    }
  }

  async function ensureSaveFileCollectionVersion() {
    if (saveFileCollectionVersionChecked || !idMasterID) return;
    saveFileCollectionVersionChecked = true;
    try {
      setStatusWithSpinner("Checking your IDS Collection version...");
      const result = await runAppsScript("getSaveFileSheetType", idMasterID);
      if (
        result &&
        result.success &&
        result.sheetType === "IDS Collection" &&
        result.outdated
      ) {
        saveFileCollectionOutdated = {
          currentVersion: result.currentVersion,
          latestVersion: result.latestVersion,
        };
      }
    } catch (err) {
      console.error("Could not check IDS Collection version:", err);
    }
  }

  async function grantSaveFileAccess() {
    document.getElementById("saveFileAccessBtn").disabled = true;

    const wasPrimaryPending =
      saveFilePendingAccessIds.indexOf(idMasterID) !== -1;

    const grantedAll = await ensureSaveFileAccess(
      saveFilePendingAccessIds.length > 1 ? "your sheets" : "your sheet",
    );

    if (!grantedAll) {
      if (saveFileNotOwnedFiles.length > 0) {
        showSaveFileNotOwned();
      } else {
        document.getElementById("saveFileAccessBtn").disabled = false;
      }
      return;
    }

    let ready = true;
    if (wasPrimaryPending) {
      ready = await resolveSaveFileSubsheetAccess();
    }

    if (ready) {
      showSaveFileWorkflow();
    } else if (saveFileNotOwnedFiles.length > 0) {
      showSaveFileNotOwned();
    } else {
      showSaveFileAccessPrompt();
    }

  async function runSaveFileImport() {
    const selected = getSelectedSheetTypes();
    if (!idMasterID || selected.length === 0) return;

    setSaveFileBusy(true);

    if (saveFileSheetType === "IDS Collection") {
      await runSaveFileCollectionImport(selected);
      setSaveFileBusy(false);
      return;
    }

    if (!saveFileImportTargets || !saveFileImportTargets.success) {
      setStatusText(
        (saveFileImportTargets && saveFileImportTargets.message) ||
          "Could not read IDS Master. Please reload and try again.",
      );
      setSaveFileBusy(false);
      return;
    }

    const resolvedIdMasterID = saveFileImportTargets.idMasterID;
    const targets = saveFileImportTargets.targets || {};
    const versions = saveFileImportTargets.versions || {};

    const notLinked = selected.filter(function (type) {
      return !targets[type];
    });
    const outdated = selected
      .filter(function (type) {
        return targets[type] && !(versions[type] && versions[type].upToDate);
      })
      .map(function (type) {
        return {
          type: type,
          currentVersion: versions[type] ? versions[type].currentVersion : "",
          latestVersion: versions[type] ? versions[type].latestVersion : "",
        };
      });

    if (notLinked.length > 0 || outdated.length > 0) {
      renderSaveFileUpdateRequired(notLinked, outdated);
      setStatusText(
        "Update your IDS Master sheets before importing the save file.",
      );
      setSaveFileBusy(false);
      return;
    }

    const tasks = selected.map(function (type) {
      return { type: type, targetID: targets[type] };
    });

    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    setStatusWithSpinner(`Importing data into ${tasks.length} sheets...`);

    const results = await Promise.all(
      tasks.map(function (task) {
        return runAppsScript(
          "importData",
          task.targetID,
          task.type,
          sfImportPayload(task.type, parsedSaveData[task.type]),
          {},
          resolvedIdMasterID,
        )
          .then(function (r) {
            completedCount++;
            if (r && r.success) {
              successCount++;
            } else {
              failedCount++;
            }
            setStatusWithSpinner(
              `Import progress: ${completedCount}/${tasks.length} completed (${successCount} successful, ${failedCount} failed)`,
            );
            return { type: task.type, result: r };
          })
          .catch(function (e) {
            completedCount++;
            failedCount++;
            setStatusWithSpinner(
              `Import progress: ${completedCount}/${tasks.length} completed (${successCount} successful, ${failedCount} failed)`,
            );
            return {
              type: task.type,
              result: { success: false, message: e.message || e },
            };
          });
      }),
    );

    const okCount = results.filter(function (r) {
      return r.result && r.result.success;
    }).length;
    const failCount = results.length - okCount;

    renderSaveFileImportResults(results, []);

    let msg;
    if (failedCount === 0) {
      msg = `🎉 All ${successCount}/${tasks.length} sheet imports completed successfully!`;
    } else if (successCount === 0) {
      msg = `❌ All ${tasks.length} imports failed.`;
    } else {
      msg = `⚠️️ Imports completed: ${successCount}/${tasks.length} successful, ${failedCount} failed.`;
    }

    setStatusText(msg);

    setSaveFileBusy(false);
  }

  async function runSaveFileCollectionImport(selected) {
    const filtered = {};
    selected.forEach(function (type) {
      if (parsedSaveData && parsedSaveData[type] !== undefined) {
        filtered[type] = sfImportPayload(type, parsedSaveData[type]);
      }
    });

    setStatusWithSpinner(
      `Importing ${selected.length} categories into your IDS Collection...`,
    );

    let result;
    try {
      result = await runAppsScript(
        "importData",
        idMasterID,
        "IDS Collection",
        filtered,
        {},
        idMasterID,
      );
    } catch (err) {
      result = { success: false, message: err.message || err };
    }

    const failedMap = {};
    ((result && result.failedUpdates) || []).forEach(function (f) {
      if (f && f.sheetType) {
        failedMap[f.sheetType] = f.message || "Update failed";
      }
    });
    const overallFail = !(result && result.success);
    const hadFailedUpdates = Object.keys(failedMap).length > 0;

    const results = selected.map(function (type) {
      if (failedMap.hasOwnProperty(type)) {
        return {
          type: type,
          result: { success: false, message: failedMap[type] },
        };
      }
      if (overallFail && !hadFailedUpdates) {
        return {
          type: type,
          result: {
            success: false,
            message: (result && result.message) || "Import failed",
          },
        };
      }
      return { type: type, result: { success: true } };
    });

    renderSaveFileImportResults(results, []);

    const okCount = results.filter(function (r) {
      return r.result && r.result.success;
    }).length;
    const failCount = results.length - okCount;

    let msg;
    if (failCount === 0) {
      msg = `🎉 All ${okCount}/${selected.length} categories imported into your IDS Collection!`;
    } else if (okCount === 0) {
      msg = `❌ Import into your IDS Collection failed.`;
    } else {
      msg = `⚠️️ IDS Collection import: ${okCount}/${selected.length} succeeded, ${failCount} failed.`;
    }
    setStatusText(msg);
  }

  function renderSaveFileImportResults(results, skipped) {
    const el = document.getElementById("saveFileImportSummary");
    if (!el) return;

    const ok = results.filter(function (r) {
      return r.result && r.result.success;
    });
    const fail = results.filter(function (r) {
      return !(r.result && r.result.success);
    });

    let html = "";

    if (ok.length) {
      html += '<div class="sfImportGroup"><strong>✅ Imported:</strong>';
      ok.forEach(function (r) {
        html += "&nbsp;&nbsp;• " + escSaveFileHtml(r.type) + "<br>";
      });
      html += "</div>";
    }

    if (fail.length) {
      html += '<div class="sfImportGroup"><strong>❌ Failed:</strong>';
      fail.forEach(function (r) {
        html +=
          "&nbsp;&nbsp;• " +
          escSaveFileHtml(r.type) +
          " - " +
          escSaveFileHtml((r.result && r.result.message) || "Unknown error") +
          "<br>";
      });
      html += "</div>";
    }

    if (skipped && skipped.length) {
      html += `<div class="sfImportGroup"><strong>⚠️️ Not found in ${saveFileSheetType || "this sheet"}:</strong><br>`;
      skipped.forEach(function (type) {
        html += "&nbsp;&nbsp;• " + escSaveFileHtml(type) + "<br>";
      });
      html += "</div>";
    }

    el.innerHTML = html;
  }
