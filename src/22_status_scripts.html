<script>
  /**
   * Whether this looks like a mobile device, by user agent or touch plus size.
   * @returns {boolean}
   */
  function detectMobile() {
    const userAgent = navigator.userAgent.toLowerCase();
    const mobileKeywords = [
      "mobile",
      "android",
      "iphone",
      "ipad",
      "ipod",
      "blackberry",
      "windows phone",
    ];
    const isMobileUA = mobileKeywords.some((keyword) =>
      userAgent.includes(keyword)
    );
    const isTouchDevice =
      "ontouchstart" in window || navigator.maxTouchPoints > 0;
    const isSmallScreen = window.innerWidth <= 768;

    return isMobileUA || (isTouchDevice && isSmallScreen);
  }

  /**
   * Whether the device has touch and no fine pointer.
   * @returns {boolean}
   */
  function isTouchOnlyDevice() {
    return (
      "ontouchstart" in window && !window.matchMedia("(pointer: fine)").matches
    );
  }

  isMobile = detectMobile();
  console.log("Mobile device detected:", isMobile);

  /**
   * Passes through only Google Sheets and Drive folder URLs.
   * @param {*} url
   * @returns {string} The URL, or "" if it is not one we allow.
   */
  function sanitizeGetStartedUrl(url) {
    if (typeof url === "string") {
      if (
        url.indexOf("https://docs.google.com/spreadsheets/d/") === 0 ||
        url.indexOf("https://drive.google.com/drive/folders/") === 0
      ) {
        return url;
      }
    }
    return "";
  }

  /**
   * Shows a spinner and message on the status line, clearing any error panel.
   * @param {string} message
   * @returns {void}
   */
  function setStatusWithSpinner(message) {

    if (typeof AppError !== "undefined") AppError.clear();
    document.getElementById("statusText").innerHTML = `
        <span class="spinner spinner-small"></span>
        ${message}
      `;
  }

  /**
   * Sets the status line, shortening known messages on mobile.
   * @param {string} message
   * @returns {void}
   */
  function setStatusText(message) {
    if (isMobile) {
      const mobileMessages = {
        "Opening picker with files that need access...":
          "Opening file picker...",
        "Select the files you want to grant access to": "Tap files to select",
        "Access granted to files. Rechecking access status...":
          "Files selected. Checking...",
        "Picker loaded successfully": "Picker ready",
        "File selection cancelled": "Selection cancelled",
      };
      const shortMessage = mobileMessages[message];
      if (shortMessage) {
        document.getElementById("statusText").innerText =
          shortMessage;
        return;
      }
    }

    document.getElementById("statusText").innerText = message;
  }
</script>
