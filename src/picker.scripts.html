<script type="text/javascript">
  // API credentials - only need API key for picker when using server-side OAuth
  const API_KEY = 'AIzaSyBoleujCzXxUUhPoKmPzlbsOh0LEoer-gA';
  const APP_ID = '832137601831';

  const newSheetID = '<?= newSheetID ?>';
  const oldsheetID = '<?= oldsheetID ?>';
  const idMasterID = '<?= idMasterID ?>';
  const idType = '<?= idType ?>';
  const origin = '<?= origin ?>'

  let accessToken = null;
  let pickerInited = false;
  let isMobile = false;
  let selectedFiles = []; // Store selected files for mobile multi-select fallback
  let finalSelectedFiles = []; // Store the final selection for continue step
  let accessibleFilesCache = []; // Store the last known accessible files for reselection
  let inaccessibleFilesCache = []; // Store files that need access permissions

  // Detect mobile devices
  function detectMobile() {
    const userAgent = navigator.userAgent.toLowerCase();
    const mobileKeywords = ['mobile', 'android', 'iphone', 'ipad', 'ipod', 'blackberry', 'windows phone'];
    const isMobileUA = mobileKeywords.some(keyword => userAgent.includes(keyword));
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const isSmallScreen = window.innerWidth <= 768;
    
    return isMobileUA || (isTouchDevice && isSmallScreen);
  }

  // Initialize mobile detection
  isMobile = detectMobile();
  console.log('Mobile device detected:', isMobile);

  // Show appropriate instructions immediately based on device type
  if (isMobile) {
    document.getElementById('desktop-instructions').style.display = 'none';
    document.getElementById('mobile-instructions').style.display = 'block';
  } else {
    document.getElementById('desktop-instructions').style.display = 'block';
    document.getElementById('mobile-instructions').style.display = 'none';
  }
  // Grant access to files function - opens picker with only inaccessible files
  function addAnotherFile() {
    ensureAuthThenOpenPicker();
  }

  // Ensures auth, then opens picker if successful
  async function ensureAuthThenOpenPicker() {
    document.getElementById('status_text').innerText = 'Checking authorization...';
    const authSuccess = await handleAuthAndCheckAccess();
    if (authSuccess) {
      openPicker();
    } else {
      document.getElementById('status_text').innerText = 'Authorization failed. Cannot open picker.';
    }
  }

  // Continue to next step function
  function continueToNextStep() {
    if (finalSelectedFiles.length === 0) {
      document.getElementById('status_text').innerText = 'No files selected. Please select files first.';
      return;
    }

    document.getElementById('continue_button').disabled = true;
    document.getElementById('status_text').innerText = `Processing ${finalSelectedFiles.length} selected file(s)...`;

    // Extract file IDs for the server-side function
    const fileIds = finalSelectedFiles.map(file => file[google.picker.Document.ID]);
    
    console.log('Calling processSelectedFiles with file IDs:', fileIds);

    // Call the Apps Script function to process the selected files
    google.script.run
      .withSuccessHandler(onUpdateSheetSuccess)
      .withFailureHandler(onUpdateSheetFailure)
      .updateSheet(idType, newSheetID, idMasterID);
  }
  
  // Handle successful processing
  function onUpdateSheetSuccess(result) {
    document.getElementById('continue_button').disabled = false;
    
    if (result.success) {
      document.getElementById('status_text').innerText = `Successfully processed ${finalSelectedFiles.length} file(s)!`;
      // You can add more success handling here
      console.log('Processing result:', result);
    } else {
      document.getElementById('status_text').innerText = `Processing failed: ${result.message}`;
    }
  }

  // Handle processing failure
  function onUpdateSheetFailure(error) {
    document.getElementById('continue_button').disabled = false;
    console.error('Processing error:', error);
    document.getElementById('status_text').innerText = `Processing error: ${error.message || error}`;
  }

  // Show continue section with inaccessible files that need permission
  function showContinueSection(accessibleFiles = [], inaccessibleFiles = []) {
    // Cache the files for later use
    accessibleFilesCache = accessibleFiles.slice();
    inaccessibleFilesCache = inaccessibleFiles.slice();
    
    const summary = document.getElementById('selected-summary');
    const addAnotherButton = document.getElementById('add_another_button');
    const continueButton = document.getElementById('continue_button');
    
    if (inaccessibleFiles.length === 0) {
      // All files are accessible - show continue button
      summary.innerHTML = `<strong>✅ All Required Files Accessible</strong><br>` +
                         `The app script has access to all ${accessibleFiles.length} required file(s). You can proceed to the next step.`;
      addAnotherButton.style.display = 'none';
      continueButton.style.display = 'inline-block';
      
      // Set final selected files to all accessible files for processing
      finalSelectedFiles = accessibleFiles.slice();
      
    } else {
      // Some files need access - show grant access button
      summary.innerHTML = `<strong>🔐 ${inaccessibleFiles.length} File(s) Need Access Permission</strong><br>` +
                         `Please grant access to the following file(s):<br>` +
                         inaccessibleFiles.slice(0, 5).map(file => `• ${file.name || file.id}`).join('<br>') +
                         (inaccessibleFiles.length > 5 ? `<br>• ... and ${inaccessibleFiles.length - 5} more` : '');
      // List names of accessible files
      if (accessibleFiles.length > 0) {
        summary.innerHTML += `<br><br>You have granted access to ${accessibleFiles.length} file(s):` +
                            '<br>' + accessibleFiles.map(file => `&nbsp;&nbsp;• ${file.name || file[google.picker.Document.ID]}`).join('<br>');
      }
      
      addAnotherButton.style.display = 'inline-block';
      continueButton.style.display = 'none';
    }
    
    document.getElementById('continue-section').style.display = 'block';
  }

  document.getElementById('status_text').innerText = 'Initializing APIs...';

  /**
   * Callback after api.js is loaded.
   */
  function gapiLoaded() {
    console.log('GAPI loaded, loading client and picker...');
    gapi.load('client:picker', {
      callback: initializePicker,
      onerror: function() {
        console.error('Failed to load GAPI client:picker');
        document.getElementById('status_text').innerText = 'Failed to load Google APIs';
      }
    });
  }

  /**
   * Callback after the API client is loaded.
   */
  async function initializePicker() {
    try {
      console.log('Initializing GAPI client...');
      
      // Initialize the GAPI client
      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
      });
      
      console.log('GAPI client initialized successfully');
      console.log('Picker API available:', typeof google.picker !== 'undefined');
      
      pickerInited = true;
      document.getElementById('status_text').innerText = 'Checking file access permissions...';
      
      // Automatically start the authorization and access checking process
      handleAuthAndCheckAccess();
      
    } catch (error) {
      console.error('Error initializing GAPI client:', error);
      document.getElementById('status_text').innerText = `Initialization error: ${error.message}`;
    }
  }

  /**
   * Combined function to authorize and check file access
   */
  function handleAuthAndCheckAccess() {
    // If we already have a valid accessToken, skip re-auth and just check access
    if (accessToken) {
      // Check which sheets are accessible vs inaccessible
      google.script.run
        .withSuccessHandler(onSheetAccessCheckSuccess)
        .withFailureHandler(onSheetAccessCheckFailure)
        .checkSheetAccess(newSheetID, oldsheetID, idMasterID);
      return Promise.resolve(true);
    }
    return new Promise((resolve) => {
      document.getElementById('status_text').innerText = 'Getting authorization from Apps Script...';
      // Call Apps Script server-side function to get OAuth token
      google.script.run
        .withSuccessHandler(function(result) {
          const authSuccess = onAuthSuccessAndCheckAccess(result);
          resolve(authSuccess);
        })
        .withFailureHandler(function(error) {
          onAuthFailure(error);
          resolve(false);
        })
        .getOAuthToken();
    });
  }

  /**
   * Handle successful authorization and check which sheets are already accessible
   * Returns true if auth was successful, false otherwise
   */
  function onAuthSuccessAndCheckAccess(result) {
    console.log('Auth success result:', result);
    if (result.success) {
      accessToken = result.token;
      console.log('OAuth token received from Apps Script');
      document.getElementById('status_text').innerText = 'Authorized successfully! Checking file access...';
      // Check which sheets are accessible vs inaccessible
      google.script.run
        .withSuccessHandler(onSheetAccessCheckSuccess)
        .withFailureHandler(onSheetAccessCheckFailure)
        .checkSheetAccess(newSheetID, oldsheetID, idMasterID);
      return true;
    } else {
      console.error('Authorization failed:', result.message);
      document.getElementById('status_text').innerText = `Authorization failed: ${result.message}`;
      return false;
    }
  }

  /**
   * Handle authorization failure
   */
  function onAuthFailure(error) {
    document.getElementById('open_picker_button').disabled = false;
    console.error('Auth error:', error);
    document.getElementById('status_text').innerText = `Authorization error: ${error.message || error}`;
  }

  /**
   * Handle successful sheet access check
   */
  function onSheetAccessCheckSuccess(result) {
    console.log('Sheet access check result:', result);
    
    if (result.success) {
      // Convert accessible files to picker document format
      const accessibleDocuments = result.accessibleDetails ? result.accessibleDetails.map(file => {
        const doc = {};
        doc[google.picker.Document.ID] = file.id;
        doc[google.picker.Document.NAME] = file.name;
        doc[google.picker.Document.MIME_TYPE] = file.mimeType;
        doc[google.picker.Document.URL] = file.webViewLink;
        return doc;
      }) : [];
      
      // Show the continue section with accessible and inaccessible files
      showContinueSection(accessibleDocuments, result.inaccessibleFiles || []);
      
      if (result.inaccessibleFiles && result.inaccessibleFiles.length > 0) {
        document.getElementById('status_text').innerText = 
          `Found ${result.inaccessibleFiles.length} file(s) that need access permission. ` +
          `${result.accessibleFiles.length} file(s) are already accessible.`;
      } else {
        document.getElementById('status_text').innerText = 
          `All ${result.accessibleFiles.length} required file(s) are accessible! You can proceed.`;
      }
      
    } else {
      console.error('Sheet access check failed:', result.message);
      document.getElementById('status_text').innerText = 
        `Could not check file access: ${result.message}`;
      showContinueSection([], []);
    }
  }

  /**
   * Handle sheet access check failure
   */
  function onSheetAccessCheckFailure(error) {
    console.error('Sheet access check error:', error);
    document.getElementById('status_text').innerText = 
      `Error checking sheet access: ${error.message || error}. You can still use "Add Another File" to select sheets.`;
    showContinueSection([]);
  }
  function openPicker() {
    console.log('openPicker called');
    console.log('accessToken:', accessToken ? 'Present' : 'Missing');
    console.log('pickerInited:', pickerInited);
    console.log('google.picker available:', typeof google !== 'undefined' && typeof google.picker !== 'undefined');
    
    if (!accessToken) {
      document.getElementById('status_text').innerText = 'Please authorize first';
      return;
    }

    if (!pickerInited) {
      document.getElementById('status_text').innerText = 'Picker not initialized yet';
      return;
    }

    if (typeof google === 'undefined' || typeof google.picker === 'undefined') {
      document.getElementById('status_text').innerText = 'Google Picker API not loaded';
      console.error('Google Picker API not available');
      return;
    }

    // Check if we have inaccessible files to show
    if (inaccessibleFilesCache.length === 0) {
      document.getElementById('status_text').innerText = 'No files need access permission';
      return;
    }

    // Extract file IDs from inaccessible files, filter out any without a valid id
    const inaccessibleFileIds = inaccessibleFilesCache
      .map(file => file.id)
      .filter(id => typeof id === 'string' && id.length > 0);
    if (inaccessibleFileIds.length !== inaccessibleFilesCache.length) {
      console.warn('Some inaccessible files are missing an id:', inaccessibleFilesCache);
    }
    console.log('Opening picker with inaccessible file IDs:', inaccessibleFileIds);
    
    try {
      document.getElementById('status_text').innerText = 'Opening picker with files that need access...';
      
      // Convert array to comma-separated string for setFileIds
      const fileIdsString = inaccessibleFileIds.join(',');
      console.log('File IDs string:', fileIdsString);
      if (!fileIdsString) {
        document.getElementById('status_text').innerText = 'No valid file IDs to show in picker.';
        return;
      }
      // Create filtered view with only inaccessible file IDs
      const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setFileIds(fileIdsString)
          .setIncludeFolders(false)
          .setSelectFolderEnabled(false)
          .setMode(google.picker.DocsViewMode.GRID);
      
      console.log('DocsView created with', inaccessibleFileIds.length, 'inaccessible files');
      
      // Create picker with optimized settings for mobile/desktop
      const pickerBuilder = new google.picker.PickerBuilder()
          .setDeveloperKey(API_KEY)
          .setAppId(APP_ID)
          .setOAuthToken(accessToken);
      
      // Configure picker size based on device type
      let pickerWidth, pickerHeight;
      if (isMobile) {
        pickerWidth = Math.min(window.innerWidth - 10, 900);
        pickerHeight = Math.min(window.innerHeight - 50, 750);
        console.log('Mobile picker size:', pickerWidth + 'x' + pickerHeight);
      } else {
        pickerWidth = 1200;
        pickerHeight = 800;
        console.log('Desktop picker size:', pickerWidth + 'x' + pickerHeight);
      }
      
      // Add view and other settings
      const picker = pickerBuilder
          .addView(view)
          .setCallback(pickerCallback)
          // .setOrigin(google.script.host.origin)
          // .setOrigin(window.location.origin)
          .setOrigin(origin)
          .setSize(pickerWidth, pickerHeight)
          .enableFeature(google.picker.Feature.MULTISELECT_ENABLED);
      
      // Add features based on device type
      if (!isMobile) {
        picker.enableFeature(google.picker.Feature.MINE_ONLY)
              .enableFeature(google.picker.Feature.NAV_HIDDEN);
      } else {
        picker.enableFeature(google.picker.Feature.MINE_ONLY);
      }
      
      const builtPicker = picker.build();
      
      console.log('Picker built successfully with', inaccessibleFileIds.length, 'inaccessible files');
      
      document.getElementById('status_text').innerText = 
        `Select the files you want to grant access to (${inaccessibleFileIds.length} files available).`;
      
      builtPicker.setVisible(true);
      console.log('Picker.setVisible(true) called');
      
    } catch (error) {
      console.error('Error creating/showing picker:', error);
      document.getElementById('status_text').innerText = `Picker error: ${error.message}`;
    }
  }

  async function pickerCallback(data) {
    console.log('Picker callback received:', data);
    
    try {
      if (data.action === google.picker.Action.PICKED) {
        const documents = data[google.picker.Response.DOCUMENTS];
        
        if (!documents || documents.length === 0) {
          document.getElementById('status_text').innerText = 'No files selected';
          return;
        }
        
        document.getElementById('status_text').innerText = 
          `Access granted to ${documents.length} file(s). Rechecking access status...`;
        
        google.script.run
          .withSuccessHandler(onSheetAccessCheckSuccess)
          .withFailureHandler(onSheetAccessCheckFailure)
          .checkSheetAccess(newSheetID, oldsheetID, idMasterID);
        
      } else if (data.action === google.picker.Action.CANCEL) {
        console.log('User cancelled the picker');
        document.getElementById('status_text').innerText = 'File selection cancelled';
        
      } else {
        console.log('Unknown picker action:', data.action);
        document.getElementById('status_text').innerText = `Unknown action: ${data.action}`;
      }
    } catch (error) {
      console.error('Error in picker callback:', error);
      document.getElementById('status_text').innerText = `Callback error: ${error.message}`;
    }
  }

</script>
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
