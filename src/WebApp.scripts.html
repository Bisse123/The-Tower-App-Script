<script>
// These are dynamically filled by your server script
const newSheetID = '<?= newSheetID ?>';
const oldsheetID = '<?= oldsheetID ?>';
const idMasterID = '<?= idMasterID ?>';
const sheetType = '<?= sheetType ?>';
const newVersion = '<?= newVersion ?>';
const oldVersion = '<?= oldVersion ?>';
const compareResult = '<?= compareResult ?>';
const idType = '<?= idType ?>';
const isImported = '<?= isImported ?>';

function setStatus(text) {
  document.getElementById('statusLabel').textContent = text;
}

// Modal logic
let yesNoCallback = null;
function showYesNo(msg, callback) {
  document.getElementById('yesNoMsg').textContent = msg;
  const modal = document.getElementById('yesNoModal');
  modal.classList.add('visible');
  yesNoCallback = callback;
}
function handleYesNo(answer) {
  const modal = document.getElementById('yesNoModal');
  modal.classList.remove('visible');
  if (yesNoCallback) yesNoCallback(callback);
}

  function switchToPicker() {
    google.script.run.withSuccessHandler(function(html) {
      document.getElementById('main-content').style.display = 'none';
      var container = document.getElementById('picker-container');
      container.innerHTML = html;

      // Re-execute scripts in the injected HTML
      var scripts = container.querySelectorAll('script');
      scripts.forEach(function(oldScript) {
        var newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
          newScript.async = oldScript.async;
          newScript.defer = oldScript.defer;
          // Add onload handler for Google API script
          if (oldScript.src.includes('apis.google.com/js/api.js')) {
            newScript.onload = function() {
              if (typeof window.gapiLoaded === 'function') {
                window.gapiLoaded();
              }
            };
          }
        } else {
          newScript.textContent = oldScript.textContent;
        }
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });

      // If gapi is already loaded, call gapiLoaded manually
      if (typeof window.gapi !== 'undefined' && typeof window.gapi.load === 'function') {
        if (typeof window.gapiLoaded === 'function') {
          window.gapiLoaded();
        }
      }
    }).getPickerHtml(idType, newSheetID, oldsheetID, idMasterID);
  }

function enableUpdateMasterIdBtn(enable) {
  const btn = document.getElementById('updateMasterIdButton');
  if (btn) btn.disabled = !enable;
}

function importData() {
  setStatus("Importing data...");
  // DO NOT disable the importButton!
  google.script.run
    .withSuccessHandler(function (result) {
      setStatus("Import completed!");
      enableUpdateMasterIdBtn(true); // Enable the update button after import
    })
    .withFailureHandler(function (error) {
      setStatus("Failed!");
      alert('Import failed: ' + error.message);
      // importButton remains enabled
    })
    .startImportData(sheetType, newSheetID);
}

window.onload = function () {
  // Use strict string comparison for the checkmark
  enableUpdateMasterIdBtn(isImported === "✅");

  if (compareResult === -1) {
    alert("The version of the old sheet (" + oldVersion + ") is newer than the new sheet (" + newVersion + "). Import aborted.");
    return;
  }
  if (compareResult > 0) {
    const msg = "The old sheet uses a different (older) export version (" + oldVersion + "). Do you want to continue the import to version " + newVersion + "?";
    showYesNo(msg, function(yes) {
      if (!yes) {
        setStatus("Import cancelled by user.");
      }
    });
  }
}
</script>
