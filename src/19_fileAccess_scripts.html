<script>
  function showFileAccessSection() {
    var selectImportSection = document.getElementById("selectImportSection");
    var fileAccessSection = document.getElementById("fileAccessSection");
    selectImportSection.style.display = "none";
    fileAccessSection.style.display = "block";
    document.getElementById("statusText").innerText =
      "Checking which files need access permissions...";
  }

  async function addAnotherFile() {
    document.getElementById("statusText").innerText =
      "Checking authorization...";
    document.getElementById("addAnotherButton").disabled = true;
    if (!accessToken) {
        document.getElementById("statusText").innerText =
          "Authorization failed. Cannot open picker.";
        return;
    }
    openMultiFilePicker();
  }

  function importData() {
    document.getElementById("importButton").disabled = true;
    document.getElementById("updateMasterButton").disabled = true;
    if (sheetType === "IDS Master") {
      const totalAvailableFiles = (copiedTemplateFiles || []).length + (importedFilesFailed || []).length + (exportedFilesFailed || []).length;
      if (totalAvailableFiles === 0) {
        document.getElementById("statusText").innerText = "No copied sheets available for import. Please copy templates first.";
        return;
      }

      document.getElementById("statusText").innerText = `Preparing import for ${totalAvailableFiles} sheets...`;
      
      google.script.run
        .withSuccessHandler(onprepareImportDataSuccess)
        .withFailureHandler(onprepareImportDataFailure)
        .prepareImportData(idMasterID, copiedTemplateFiles || [], importedFilesFailed || [], exportedFilesFailed || []);
      return;
    }
    var updateType = sheetType === "IDS Collection - all IDS-Sheets on one file" ? "IDS Collection" : sheetType;
    if (sheetType === "IDS Collection - all IDS-Sheets on one file" && versionDifference === "None") {
      document.getElementById("statusText").innerText = `Preparing import for sheet...`;
      const sheetTypes = [
        "Laboratory",
        "Workshop", 
        "Ultimate Weapon",
        "Themes & Songs",
        "Bots",
        "Relics",
        "Vault",
        "Cards",
        "Modules",
        "Guardians"
      ];
      sheetTypes.forEach(type => {
        copiedTemplateFiles.push({
          sheetType: type,
          fileId: newSheetID,
        });
      });
      google.script.run
        .withSuccessHandler(async function(result) {
              console.log("Import preparation result:", result);
  
              if (!result.succeededTasks || result.succeededTasks.length === 0) {
                document.getElementById("importButton").disabled = false;
                
                // Show generic message in status text
                const statusMessage = result.failedTasks && result.failedTasks.length > 0 
                  ? "Import preparation failed for all tasks."
                  : "No valid import tasks prepared.";
                document.getElementById("statusText").innerText = statusMessage;
                
                // Show detailed error messages for each failed task in the summary
                if (result.failedTasks && result.failedTasks.length > 0) {
                  let summaryHtml = "<strong>❌ Import Preparation Failed:</strong><br>";
                  result.failedTasks.forEach(task => {
                    summaryHtml += `&nbsp;&nbsp;• ${task.sheetType}: ${task.message}<br>`;
                  });
                  document.getElementById("selectedFileSummary").innerHTML = summaryHtml;
                }
                
                return;
              }
              
              if (result.failedTasks && result.failedTasks.length > 0) {
                console.warn(`${result.failedTasks.length} tasks failed during preparation:`, result.failedTasks);
              }

              try {
                // First, export all data
                document.getElementById("statusText").innerText = `Exporting data from ${result.succeededTasks.length} sheets...`;
                const exportResults = await exportAllData(result.succeededTasks);
                
                console.log("Export results:", exportResults);
                
                if (exportResults.failedCount > 0) {
                  console.warn(`${exportResults.failedCount} exports failed out of ${exportResults.totalTasks}`);
                }
                
                // Check if we have any successful exports to import
                if (exportedFilesSuccess.length === 0) {
                  document.getElementById("importButton").disabled = false;
                  document.getElementById("statusText").innerText = "No data was successfully exported. Cannot proceed with import.";
                  return;
                }
                // Create nested dictionary structure where each sheet type has its own data dictionary
                const exportedData = {};
                exportedFilesSuccess.forEach(exportedFile => {
                  if (exportedFile.exportData && exportedFile.sheetType) {
                    exportedData[exportedFile.sheetType] = exportedFile.exportData;
                  }
                });
                
                // Now proceed with imports
                document.getElementById("statusText").innerText = `Importing ${updateType} data...`;
                google.script.run
                  .withSuccessHandler(onImportSuccess)
                  .withFailureHandler(onImportFailure)
                  .importData(
                    newSheetID,
                    sheetType,
                    exportedData
                  );

              } catch (error) {
                console.error("Error in export/import process:", error);
                document.getElementById("importButton").disabled = false;
                document.getElementById("statusText").innerText = `Error during export/import process: ${error.message || error}`;
              }
        })
        .withFailureHandler(function(error) {
          document.getElementById("importButton").disabled = false;
          console.error("Import preparation failed:", error);
          document.getElementById("statusText").innerText = `Import preparation error: ${error.message || error}`;
        })
        .prepareImportData(oldSheetID, copiedTemplateFiles);
      return;
    }
    
    // For non-IDS Master sheets, first export data, then import it
    document.getElementById(
      "statusText"
    ).innerText = `Exporting ${updateType} data...`;
    
    google.script.run
      .withSuccessHandler(function(exportResult) {
        if (exportResult.success) {
          document.getElementById(
            "statusText"
          ).innerText = `Importing ${updateType} data...`;
          
          // Now call importData with the exported data
          google.script.run
            .withSuccessHandler(onImportSuccess)
            .withFailureHandler(onImportFailure)
            .importData(
              newSheetID,
              sheetType,
              exportResult.data
            );
        } else {
          document.getElementById("importButton").disabled = false;
          document.getElementById("statusText").innerText = `Export failed: ${exportResult.message}`;
        }
      })
      .withFailureHandler(function(error) {
        document.getElementById("importButton").disabled = false;
        console.error("Export error:", error);
        document.getElementById("statusText").innerText = `Export error: ${error.message || error}`;
      })
      .exportData(
        oldSheetID,
        sheetType,
        versionDifference
      );
  }

  async function onprepareImportDataSuccess(result) {
    console.log("Import preparation result:", result);
    
    if (!result.succeededTasks || result.succeededTasks.length === 0) {
      document.getElementById("importButton").disabled = false;
      
      // Show generic message in status text
      const statusMessage = result.failedTasks && result.failedTasks.length > 0 
        ? "Import preparation failed for all tasks."
        : "No valid import tasks prepared.";
      document.getElementById("statusText").innerText = statusMessage;
      
      // Show detailed error messages for each failed task in the summary
      if (result.failedTasks && result.failedTasks.length > 0) {
        let summaryHtml = "<strong>❌ Import Preparation Failed:</strong><br>";
        result.failedTasks.forEach(task => {
          summaryHtml += `&nbsp;&nbsp;• ${task.sheetType}: ${task.message}<br>`;
        });
        document.getElementById("selectedFileSummary").innerHTML = summaryHtml;
      }
      
      return;
    }
    
    if (result.failedTasks && result.failedTasks.length > 0) {
      console.warn(`${result.failedTasks.length} tasks failed during preparation:`, result.failedTasks);
    }

    try {
      // First, export all data
      document.getElementById("statusText").innerText = `Exporting data from ${result.succeededTasks.length} sheets...`;
      const exportResults = await exportAllData(result.succeededTasks);
      
      console.log("Export results:", exportResults);
      
      if (exportResults.failedCount > 0) {
        console.warn(`${exportResults.failedCount} exports failed out of ${exportResults.totalTasks}`);
      }
      
      // Check if we have any successful exports to import
      if (exportedFilesSuccess.length === 0) {
        document.getElementById("importButton").disabled = false;
        document.getElementById("statusText").innerText = "No data was successfully exported. Cannot proceed with import.";
        return;
      }
      
      // Create import tasks based on successfully exported files
      const importTasks = exportedFilesSuccess.map(exportedFile => ({
        newSheetID: exportedFile.fileId,
        sheetType: exportedFile.sheetType,
        exportData: exportedFile.exportData,
      }));
      
      // Now proceed with imports
      document.getElementById("statusText").innerText = `Importing data into ${importTasks.length} sheets...`;
      await importAllData(importTasks);
      
    } catch (error) {
      console.error("Error in export/import process:", error);
      document.getElementById("importButton").disabled = false;
      document.getElementById("statusText").innerText = `Error during export/import process: ${error.message || error}`;
    }
  }

  function onprepareImportDataFailure(error) {
    document.getElementById("importButton").disabled = false;
    document.getElementById("statusText").innerText = `Import preparation error: ${error.message || error}`;
    console.error("Import preparation failed:", error);
  }

  async function exportAllData(exportTasks) {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalTasks = exportTasks.length;

    try {
      console.log(`Starting ${totalTasks} exports`);
      
      // Create promises for all export operations
      const exportPromises = exportTasks.map((task, index) => {
        return new Promise((resolve) => {
          console.log(`Starting export for ${task.sheetType}`);
          
          google.script.run
            .withSuccessHandler(function(result) {
              completedCount++;
              if (result.success) {
                successCount++;
                console.log(`✅ ${task.sheetType} export completed successfully`);
                
                // Check both arrays for the file to move to success
                let exportedFile = null;
                let sourceArray = null;
                
                // First check copiedTemplateFiles
                const copiedFileIndex = copiedTemplateFiles.findIndex(f => f.sheetType === task.sheetType);
                if (copiedFileIndex !== -1) {
                  exportedFile = copiedTemplateFiles.splice(copiedFileIndex, 1)[0];
                  sourceArray = 'copied';
                } else {
                  // Then check exportedFilesFailed (for retry attempts)
                  const failedFileIndex = exportedFilesFailed.findIndex(f => f.sheetType === task.sheetType);
                  if (failedFileIndex !== -1) {
                    exportedFile = exportedFilesFailed.splice(failedFileIndex, 1)[0];
                    sourceArray = 'failed';
                  }
                }
                
                if (exportedFile) {
                  exportedFilesSuccess.push({
                    ...exportedFile,
                    oldSheetID: task.oldSheetID,
                    idMasterID: task.idMasterID,
                    exportData: result.data
                  });
                  console.log(`Moved ${task.sheetType} from ${sourceArray} to exported success`);
                } else {
                  console.warn(`Could not find ${task.sheetType} in either copiedTemplateFiles or exportedFilesFailed`);
                }
              } else {
                failedCount++;
                console.error(`❌ ${task.sheetType} export failed:`, result.message);
                
                // Move failed export from copiedTemplateFiles to exportedFilesFailed
                const copiedFileIndex = copiedTemplateFiles.findIndex(f => f.sheetType === task.sheetType);
                if (copiedFileIndex !== -1) {
                  const failedFile = copiedTemplateFiles.splice(copiedFileIndex, 1)[0];
                  exportedFilesFailed.push({
                    ...failedFile,
                    error: result.message || 'Export failed',
                    oldSheetID: task.oldSheetID,
                    idMasterID: task.idMasterID
                  });
                  console.log(`Moved ${task.sheetType} from copied to export failed with error: ${result.message}`);
                } else {
                  // File was already in exportedFilesFailed (retry attempt) - update error info
                  const failedFileIndex = exportedFilesFailed.findIndex(f => f.sheetType === task.sheetType);
                  if (failedFileIndex !== -1) {
                    exportedFilesFailed[failedFileIndex].error = result.message || 'Export failed';
                    console.log(`Updated error for ${task.sheetType} in export failed list: ${result.message}`);
                  }
                }
              }
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Export progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`;
              
              resolve({
                ...result,
                sheetType: task.sheetType,
                taskIndex: index
              });
            })
            .withFailureHandler(function(error) {
              completedCount++;
              failedCount++;
              console.error(`❌ ${task.sheetType} export error:`, error);
              
              // Move failed export from copiedTemplateFiles to exportedFilesFailed
              const copiedFileIndex = copiedTemplateFiles.findIndex(f => f.sheetType === task.sheetType);
              if (copiedFileIndex !== -1) {
                const failedFile = copiedTemplateFiles.splice(copiedFileIndex, 1)[0];
                exportedFilesFailed.push({
                  ...failedFile,
                  error: error.message || error,
                  oldSheetID: task.oldSheetID,
                  idMasterID: task.idMasterID
                });
                console.log(`Moved ${task.sheetType} from copied to export failed with error: ${error.message || error}`);
              } else {
                // File was already in exportedFilesFailed (retry attempt) - update error info
                const failedFileIndex = exportedFilesFailed.findIndex(f => f.sheetType === task.sheetType);
                if (failedFileIndex !== -1) {
                  exportedFilesFailed[failedFileIndex].error = error.message || error;
                  console.log(`Updated error for ${task.sheetType} in export failed list: ${error.message || error}`);
                }
              }
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Export progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`;
              
              resolve({
                success: false,
                message: error.message || error,
                sheetType: task.sheetType,
                taskIndex: index
              });
            })
            .exportData(
              task.oldSheetID,
              task.sheetType,
              task.versionDifference
            );
        });
      });
      
      // Wait for all exports to complete
      const results = await Promise.all(exportPromises);
      
      // Return export results summary
      return {
        success: failedCount === 0,
        totalTasks,
        successCount,
        failedCount,
        results
      };
      
    } catch (error) {
      console.error("Error in export execution:", error);
      throw error;
    }
  }

  async function importAllData(importTasks) {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalTasks = importTasks.length;

    try {
      console.log(`Starting ${totalTasks} imports`);
      
      // Create promises for all import operations
      const importPromises = importTasks.map((task, index) => {
        return new Promise((resolve) => {
          console.log(`Starting import for ${task.sheetType}`);
          
          // Find the corresponding exported file data
          const exportedFile = exportedFilesSuccess.find(f => f.sheetType === task.sheetType);
          if (!exportedFile || !exportedFile.exportData) {
            completedCount++;
            failedCount++;
            const errorMessage = `No exported data found for ${task.sheetType}`;
            console.error(`❌ ${errorMessage}`);
            
            // Update status
            document.getElementById("statusText").innerText = 
              `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`;
            
            resolve({
              success: false,
              message: errorMessage,
              sheetType: task.sheetType,
              taskIndex: index
            });
            return;
          }
          
          google.script.run
            .withSuccessHandler(function(result) {
              completedCount++;
              if (result.success) {
                successCount++;
                console.log(`✅ ${task.sheetType} import completed successfully`);
                
                // Move successfully imported file from exportedFilesSuccess to importedFilesSuccess
                const exportedFileIndex = exportedFilesSuccess.findIndex(f => f.sheetType === task.sheetType);
                if (exportedFileIndex !== -1) {
                  const importedFile = exportedFilesSuccess.splice(exportedFileIndex, 1)[0];
                  // Remove exportData from the imported file object as it's no longer needed
                  const { exportData, ...fileWithoutExportData } = importedFile;
                  importedFilesSuccess.push(fileWithoutExportData);
                  console.log(`Moved ${task.sheetType} from exported success to imported success`);
                } else {
                  console.warn(`Could not find ${task.sheetType} in exportedFilesSuccess after successful import`);
                }
              } else {
                failedCount++;
                console.error(`❌ ${task.sheetType} import failed:`, result.message);
                
                // Move failed import from exportedFilesSuccess to importedFilesFailed
                const exportedFileIndex = exportedFilesSuccess.findIndex(f => f.sheetType === task.sheetType);
                if (exportedFileIndex !== -1) {
                  const failedFile = exportedFilesSuccess.splice(exportedFileIndex, 1)[0];
                  // Remove exportData from the failed file object
                  const { exportData, ...fileWithoutExportData } = failedFile;
                  importedFilesFailed.push({
                    ...fileWithoutExportData,
                    error: result.message || 'Import failed'
                  });
                  console.log(`Moved ${task.sheetType} from exported success to imported failed with error: ${result.message}`);
                } else {
                  console.warn(`Could not find ${task.sheetType} in exportedFilesSuccess for failure handling`);
                }
              }
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`;
              
              resolve({
                ...result,
                sheetType: task.sheetType,
                taskIndex: index
              });
            })
            .withFailureHandler(function(error) {
              completedCount++;
              failedCount++;
              console.error(`❌ ${task.sheetType} import error:`, error);
              
              // Move failed import from exportedFilesSuccess to importedFilesFailed
              const exportedFileIndex = exportedFilesSuccess.findIndex(f => f.sheetType === task.sheetType);
              if (exportedFileIndex !== -1) {
                const failedFile = exportedFilesSuccess.splice(exportedFileIndex, 1)[0];
                // Remove exportData from the failed file object
                const { exportData, ...fileWithoutExportData } = failedFile;
                importedFilesFailed.push({
                  ...fileWithoutExportData,
                  error: error.message || error
                });
                console.log(`Moved ${task.sheetType} from exported success to imported failed with error: ${error.message || error}`);
              } else {
                console.warn(`Could not find ${task.sheetType} in exportedFilesSuccess for error handling`);
              }
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Import progress: ${completedCount}/${totalTasks} completed (${successCount} successful, ${failedCount} failed)`;
              
              resolve({
                success: false,
                message: error.message || error,
                sheetType: task.sheetType,
                taskIndex: index
              });
            })
            .importData(
              task.newSheetID,
              task.sheetType,
              task.exportData
            );
        });
      });
      
      // Wait for all imports to complete
      const results = await Promise.all(importPromises);
      
      // Final status update
      let finalMessage;
      let titleText;
      
      if (failedCount === 0) {
        finalMessage = `🎉 All ${totalTasks} sheet imports completed successfully!`;
        titleText = `✅ Copied Sheets Imported (${successCount}/${totalTasks})`;
      } else if (successCount === 0) {
        finalMessage = `❌ All ${totalTasks} sheet imports failed.`;
        titleText = `❌ Copied Sheet Import Failed (0/${totalTasks})`;
      } else {
        finalMessage = `⚠️ Imports completed: ${successCount} successful, ${failedCount} failed.`;
        titleText = `⚠️ Sheets Partial Import (${successCount}/${totalTasks})`;
      }
      
      document.getElementById("updateMasterButton").disabled = false;
      
      // Update status text and title
      document.getElementById("statusText").innerText = finalMessage;
      document.getElementById("fileAccessTitle").innerHTML = titleText;
      
      // Use display function for file sections
      displayOperationResults();
      
      console.log("Import results:", results);
      console.log("Remaining copiedTemplateFiles:", copiedTemplateFiles);
      console.log("Remaining exportedFilesSuccess:", exportedFilesSuccess);
      console.log("Remaining exportedFilesFailed:", exportedFilesFailed);
      console.log("Remaining importedFilesSuccess:", importedFilesSuccess);
      console.log("Remaining importedFilesFailed:", importedFilesFailed);
      
    } catch (error) {
      console.error("Error in import execution:", error);
      document.getElementById("statusText").innerText = `Error during imports: ${error.message || error}`;
    } finally {
      document.getElementById("importButton").disabled = false;
    }
  }

  function onImportSuccess(result) {
    document.getElementById("importButton").disabled = false;
    console.log("Import result:", result);
    if (result.success) {
      var updateType = sheetType === "IDS Collection - all IDS-Sheets on one file" ? "IDS Collection" : "IDS Master";
      document.getElementById("statusText").innerText = `${result.message}`;
      document.getElementById("updateMasterButton").disabled = false;
      document.getElementById(
        "selectedFileSummary"
      ).innerHTML = `<strong>⚠️ Make sure your data is imported correctly before updating your ${updateType}! ⚠️</strong><br>`;
      showAccessibleFilesSummary();
    } else {
      if (result.failedUpdates && result.failedUpdates.length > 0) {
        let summaryHtml = "<strong>❌ Import Failed:</strong><br>";
        result.failedUpdates.forEach(update => {
          summaryHtml += `&nbsp;&nbsp;• ${update.sheetType}: ${update.message}<br>`;
        });
        document.getElementById("selectedFileSummary").innerHTML = summaryHtml;
      } else {
        document.getElementById("selectedFileSummary").innerText = "Import failed with no specific updates.";
      }
      document.getElementById(
        "statusText"
      ).innerText = `Import failed: ${result.message}`;
    }
  }

  function onImportFailure(error) {
    document.getElementById("importButton").disabled = false;
    console.error("Import error:", error);
    document.getElementById("statusText").innerText = `Import error: ${
      error.message || error
    }`;
  }

  function updateSheet() {
    // Check if this is IDS Master with multiple imported files
    if (sheetType === "IDS Master" && importedFilesSuccess && importedFilesSuccess.length > 0) {
      document.getElementById("importButton").disabled = true;
      document.getElementById("updateMasterButton").disabled = true;
      document.getElementById("statusText").innerText = `Processing ${importedFilesSuccess.length} imported files...`;
      
      console.log(`Calling updateSheet for IDS Master with ${importedFilesSuccess.length} imported files`);
      
      updateMultipleSheets();
      return;
    }
    
    // Original logic for single sheet updates
    if (finalSelectedFiles.length === 0) {
      document.getElementById("statusText").innerText =
        "No files selected. Please select files first.";
      return;
    }

    document.getElementById("importButton").disabled = true;
    document.getElementById("updateMasterButton").disabled = true;
    document.getElementById(
      "statusText"
    ).innerText = `Processing ${finalSelectedFiles.length} selected files...`;

    // Extract file IDs for the server-side function
    const fileIds = finalSelectedFiles.map(
      (file) => file[google.picker.Document.ID]
    );

    console.log(
      `Calling updateSheet -> sheetType: ${sheetType}, newSheetID: ${newSheetID}, oldSheetID: ${oldSheetID}, idMasterID: ${idMasterID}`
    );

    // Call the Apps Script function to process the selected files
    google.script.run
      .withSuccessHandler(onUpdateSheetSuccess)
      .withFailureHandler(onUpdateSheetFailure)
      .updateSheet(sheetType, newSheetID, oldSheetID, idMasterID);
  }

  async function updateMultipleSheets() {
    let completedCount = 0;
    let successCount = 0;
    let failedCount = 0;
    const totalUpdates = importedFilesSuccess.length;

    try {
      console.log(`Starting ${totalUpdates} sheet updates`);
      
      // Create promises for all update operations
      const updatePromises = importedFilesSuccess.map((file, index) => {
        return new Promise((resolve) => {
          console.log(`Starting update for ${file.sheetType}`);
          
          google.script.run
            .withSuccessHandler(function(result) {
              completedCount++;
              if (result.success) {
                successCount++;
                console.log(`✅ ${file.sheetType} update completed successfully`);
                
                // Move successfully updated file to updatedFiles list
                updatedFiles.push({
                  ...file,
                  updateResult: result
                });
              } else {
                failedCount++;
                console.error(`❌ ${file.sheetType} update failed:`, result.message);
              }
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Updates progress: ${completedCount}/${totalUpdates} completed (${successCount} successful, ${failedCount} failed)`;
              
              resolve({
                ...result,
                sheetType: file.sheetType,
                updateIndex: index,
                fileData: file
              });
            })
            .withFailureHandler(function(error) {
              completedCount++;
              failedCount++;
              console.error(`❌ ${file.sheetType} update error:`, error);
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Updates progress: ${completedCount}/${totalUpdates} completed (${successCount} successful, ${failedCount} failed)`;
              
              resolve({
                success: false,
                message: error.message || error,
                sheetType: file.sheetType,
                updateIndex: index,
                fileData: file
              });
            })
            .updateSheet(file.sheetType, file.fileId, file.oldSheetID, file.idMasterID);
        });
      });
      
      // Wait for all updates to complete
      const results = await Promise.all(updatePromises);
      
      // Remove successfully updated files from importedFiles and add to updatedFiles
      const successfulResults = results.filter(result => result.success);
      
      // Remove successful files from importedFilesSuccess (working backwards to avoid index issues)
      for (let i = importedFilesSuccess.length - 1; i >= 0; i--) {
        const file = importedFilesSuccess[i];
        const successfulResult = successfulResults.find(result => result.sheetType === file.sheetType);
        if (successfulResult) {
          // Remove from importedFilesSuccess and ensure it's in updatedFiles
          const removedFile = importedFilesSuccess.splice(i, 1)[0];
          
          // Check if not already in updatedFiles (defensive programming)
          if (!updatedFiles.find(f => f.sheetType === removedFile.sheetType)) {
            updatedFiles.push({
              ...removedFile,
              updateResult: successfulResult
            });
          }
        }
      }
      
      // Final status update
      let finalMessage;
      let titleText;
      let gid = '';
      
      if (failedCount === 0) {
        finalMessage = `🎉 All ${totalUpdates} sheet updates completed successfully!`;
        titleText = `✅ IDS Master Updated (${successCount}/${totalUpdates})`;
        gid = successfulResults[0]?.gid || '';
        document.getElementById("importButton").style.display = "none";
      document.getElementById("updateMasterButton").style.display = "none";
      } else if (successCount === 0) {
        finalMessage = `❌ All ${totalUpdates} sheet updates failed.`;
        titleText = `❌ IDS Master Update Failed (0/${totalUpdates})`;
      } else {
        finalMessage = `⚠️ Updates completed: ${successCount} successful, ${failedCount} failed.`;
        titleText = `⚠️ IDS Master Partial Update (${successCount}/${totalUpdates})`;
        gid = successfulResults[0]?.gid || '';
      }
      
      // Update status text and title
      document.getElementById("statusText").innerText = finalMessage;
      document.getElementById("fileAccessTitle").innerHTML = titleText;
      
      // Update UI state
      document.getElementById("importButton").disabled = false;
      document.getElementById("updateMasterButton").disabled = false;
      
      // Use display function for file sections
      displayOperationResults(gid);
      
      console.log("Update results:", results);
      console.log("Successfully updatedFiles:", updatedFiles);
      console.log("Remaining importedFilesSuccess:", importedFilesSuccess);
      
    } catch (error) {
      console.error("Error in update execution:", error);
      document.getElementById("statusText").innerText = `Error during updates: ${error.message || error}`;
      document.getElementById("importButton").disabled = false;
      document.getElementById("updateMasterButton").disabled = false;
    }
  }

  // Function to display file workflow status sections only
  function displayOperationResults(gid) {
    let summaryHtml = "";
    
    // Show warning message if there are successfully imported files
    if (importedFilesSuccess && importedFilesSuccess.length > 0) {
      summaryHtml += `<strong>⚠️ Make sure your data is imported correctly before updating your IDS Master! ⚠️</strong><br>`;
    }
    
    // Show master link if there are updated files
    if (updatedFiles && updatedFiles.length > 0) {
      summaryHtml += `<strong>🔄 Please go to your IDS Master and grant the new sheet access.</strong>`;
      summaryHtml += `<br><a href="docs.google.com/spreadsheets/d/${idMasterID}/edit#gid=${gid}" target="_blank" style="margin-left: 2em"> Open your IDS Master sheet™.</a>`;
    }
    
    // Show comprehensive file status across all workflow stages
    
    // Show files that are still copied (ready for import)
    if (copiedTemplateFiles && copiedTemplateFiles.length > 0) {
      summaryHtml += `<br><strong>📋 Sheets (Ready for Import):</strong><br>`;
      copiedTemplateFiles.forEach(file => {
        summaryHtml += `&nbsp;&nbsp;• Copy of ${file.sheetType} ${file.version}<br>`;
      });
    }
    
    // Show files that failed to export
    if (exportedFilesFailed && exportedFilesFailed.length > 0) {
      summaryHtml += `<br><strong>❌ Export Failed (Requires Retry):</strong><br>`;
      exportedFilesFailed.forEach(file => {
        summaryHtml += `&nbsp;&nbsp;• Copy of ${file.sheetType} ${file.version} - ${file.error}<br>`;
      });
    }
    
    // Show files that failed to import
    if (importedFilesFailed && importedFilesFailed.length > 0) {
      summaryHtml += `<br><strong>❌ Import Failed (Requires Retry):</strong><br>`;
      importedFilesFailed.forEach(file => {
        summaryHtml += `&nbsp;&nbsp;• Copy of ${file.sheetType} ${file.version} - ${file.error}<br>`;
      });
    }
    
    // Show files that imported successfully but haven't been updated yet
    if (importedFilesSuccess && importedFilesSuccess.length > 0) {
      summaryHtml += `<br><strong>✅ Successfully Imported Sheets (Ready for IDS Master Update):</strong><br>`;
      importedFilesSuccess.forEach(file => {
        summaryHtml += `&nbsp;&nbsp;• Copy of ${file.sheetType} ${file.version}<br>`;
      });
    }
    
    // Show files that have been successfully updated (with their new names)
    if (updatedFiles && updatedFiles.length > 0) {
      summaryHtml += `<br><strong>🎉 Successfully Updated & Completed:</strong><br>`;
      updatedFiles.forEach(file => {
        const displayName = file.updateResult && file.updateResult.newName 
          ? file.updateResult.newName 
          : `Updated Copy of ${file.sheetType} ${file.version}`;
        summaryHtml += `&nbsp;&nbsp;• ${displayName}<br>`;
      });
    }
    
    document.getElementById("selectedFileSummary").innerHTML = summaryHtml;
  }

  // Handle successful processing
  async function onUpdateSheetSuccess(result) {
    document.getElementById("importButton").disabled = false;
    document.getElementById("updateMasterButton").disabled = false;
    if (result.success) {
      document.getElementById("importButton").style.display = "none";
      document.getElementById("updateMasterButton").style.display = "none";
      var gid = result.gid || "";
      console.log("Update IDS Master result:", result);
      
      // Check if this is an IDS Collection update
      if (sheetType === "IDS Collection - all IDS-Sheets on one file") {
        // Check if there are cached sheet IDs that need cleanup
        if (cachedSheetIds && cachedSheetIds.length > 0) {
          console.log(`IDS Collection updated successfully. Checking ${cachedSheetIds.length} cached sheet IDs for cleanup...`);
          
          // Filter to get only sheet IDs that are not the old or new sheet IDs
          const sheetsToDelete = cachedSheetIds.filter(sheetId => 
            sheetId && sheetId !== oldSheetID && sheetId !== newSheetID
          );
          
          if (sheetsToDelete.length > 0) {
            // Delete all the filtered subsheets
            await deleteImportedSubsheets(sheetsToDelete);
            
            document.getElementById("statusText").innerText = `${result.message} Cleaning up ${sheetsToDelete.length} old subsheets...`;
            document.getElementById("fileAccessTitle").innerHTML = `✅ IDS Collection updated! Cleaning up subsheets...`;
          } else {
            console.log("Skipping subsheet cleanup - no valid sheet IDs found for deletion");
            document.getElementById("statusText").innerText = result.message;
            document.getElementById("fileAccessTitle").innerHTML = `✅ IDS Collection updated successfully!`;
          }
        } else {
          console.log("Skipping subsheet cleanup - no cached sheet IDs available");
          document.getElementById("statusText").innerText = result.message;
          document.getElementById("fileAccessTitle").innerHTML = `✅ IDS Collection updated successfully!`;
        }
        
        document.getElementById(
          "selectedFileSummary"
        ).innerHTML = `<strong>🎉 IDS Collection updated successfully!</strong><br><strong>Your data has been consolidated into your IDS Collection sheet.</strong>`;
      } else {
        document.getElementById("statusText").innerText = result.message;
        document.getElementById("fileAccessTitle").innerHTML = `✅ IDS Master updated successfully!`;
        document.getElementById(
          "selectedFileSummary"
        ).innerHTML = `<strong>🔄 Please go to your IDS Master and grant the new sheet access.</strong><br><a href="docs.google.com/spreadsheets/d/${idMasterID}/edit#gid=${gid}" target="_blank" style="margin-left: 2em"> Open your IDS Master sheet™.</a>`;
      }
    } else {
      document.getElementById(
        "statusText"
      ).innerText = `Update IDS Master failed: ${result.message}`;
    }
  }

  async function deleteImportedSubsheets(sheetIds) {
    let deletedCount = 0;
    let failedDeletions = [];
    const totalDeletions = sheetIds.length;

    try {
      console.log(`Starting deletion of ${totalDeletions} subsheets`);
      
      // Create promises for all deletion operations
      const deletionPromises = sheetIds.map((sheetId, index) => {
        return new Promise((resolve) => {
          console.log(`Starting deletion of sheet ID: ${sheetId}`);
          
          google.script.run
            .withSuccessHandler(function(result) {
              if (result.success) {
                deletedCount++;
                console.log(`✅ Sheet ${sheetId} deleted successfully`);
              } else {
                failedDeletions.push({
                  sheetId: sheetId,
                  error: result.message
                });
                console.error(`❌ Sheet ${sheetId} deletion failed:`, result.message);
              }
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Cleanup progress: ${deletedCount + failedDeletions.length}/${totalDeletions} processed (${deletedCount} deleted)`;
              
              resolve({
                ...result,
                sheetId: sheetId
              });
            })
            .withFailureHandler(function(error) {
              failedDeletions.push({
                sheetId: sheetId,
                error: error.message || error
              });
              console.error(`❌ Sheet ${sheetId} deletion error:`, error);
              
              // Update status
              document.getElementById("statusText").innerText = 
                `Cleanup progress: ${deletedCount + failedDeletions.length}/${totalDeletions} processed (${deletedCount} deleted)`;
              
              resolve({
                success: false,
                message: error.message || error,
                sheetId: sheetId
              });
            })
            .deleteOldSheet(sheetId);
        });
      });

      // Wait for all deletions to complete
      await Promise.all(deletionPromises);

      // Update final status
      if (failedDeletions.length === 0) {
        document.getElementById("statusText").innerText = 
          `✅ IDS Collection updated and ${deletedCount} subsheets cleaned up successfully!`;
        document.getElementById("fileAccessTitle").innerHTML = 
          `✅ IDS Collection updated! All subsheets cleaned up!`;
      } else {
        document.getElementById("statusText").innerText = 
          `✅ IDS Collection updated! ${deletedCount} subsheets cleaned up, ${failedDeletions.length} failed to delete.`;
        document.getElementById("fileAccessTitle").innerHTML = 
          `✅ IDS Collection updated! Partial cleanup completed.`;
        
        console.warn("Some subsheets failed to delete:", failedDeletions);
      }
      
    } catch (error) {
      console.error("Error during subsheet cleanup:", error);
      document.getElementById("statusText").innerText = 
        `✅ IDS Collection updated, but subsheet cleanup encountered errors: ${error.message}`;
    }
  }

  function onUpdateSheetFailure(error) {
    document.getElementById("importButton").disabled = false;
    document.getElementById("updateMasterButton").disabled = false;
    console.error("Import error:", error);
    document.getElementById(
      "statusText"
    ).innerText = `Update IDS Master error: ${error.message || error}`;
  }

  function showAccessibleFilesSummary() {
    const summary = document.getElementById("selectedFileSummary");
    if (accessibleFilesCache.length > 0) {
      summary.innerHTML +=
        `The app will access the following files:` +
        "<br>" +
        accessibleFilesCache
          .map((file) => `&nbsp;&nbsp;• ${file.name || file.id}`)
          .join("<br>");
    }
  }

  async function proceedWithTemplateCopying(copyMode) {
    const totalTemplates = templateAccessibleFilesCache.length;
    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const selectedFileSummary = document.getElementById("selectedFileSummary");
    const statusText = document.getElementById("statusText");
    
    const modeDescription = copyMode === 'update' ? 'templates with updates' : 'templates';
    
    // Initialize the summary with header
    let linksHtml = "<strong>📂 Go to your new sheets™ and allow access to your IDS Master Sheet™:</strong><br>";
    selectedFileSummary.innerHTML = linksHtml;
    
    statusText.innerText = `Copying ${totalTemplates} ${modeDescription}...`;
    
    let successCount = 0;
    let failedCount = 0;
    let completedCount = 0;
    
    // Create promises for all template copying operations with immediate UI updates
    const copyPromises = templateAccessibleFilesCache.map((template, index) => {
      console.log(`Starting copy for ${template.sheetType} template:`, template);
      
      return new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(function(result) {
            console.log(`Template ${template.sheetType} copied successfully:`, result);
            
            let templateResult;
            if (result.success && result.fileId) {
              successCount++;
              templateResult = {
                success: true,
                sheetType: template.sheetType,
                fileId: result.fileId,
                gid: result.gid || '',
                version: template.version
              };
              
              copiedTemplateFiles.push(templateResult);

              // Add the newly copied file to accessible files cache
              accessibleFilesCache.push({
                id: result.fileId,
                name: `Copy of ${template.sheetType} ${template.version}`,
                sheetType: template.sheetType
              });

              // Immediately add successful link to display
              linksHtml += `<br><a href="docs.google.com/spreadsheets/d/${result.fileId}/edit#gid=${result.gid}" target="_blank" style="margin-left: 2em">📋 Open ${template.sheetType} Sheet™</a>`;
            } else {
              failedCount++;
              const errorMessage = result.message || 'Copy operation returned unsuccessful result';
              templateResult = {
                success: false,
                sheetType: template.sheetType,
                error: errorMessage
              };
              
              // Immediately add failure message to display
              linksHtml += `<br><span style="margin-left: 2em; color: #d32f2f;">❌ ${template.sheetType} template failed to copy: ${errorMessage}</span>`;
            }
            
            // Update UI immediately
            completedCount++;
            selectedFileSummary.innerHTML = linksHtml;
            statusText.innerText = `Copying templates... (${completedCount}/${totalTemplates} completed)`;
            
            resolve(templateResult);
          })
          .withFailureHandler(function(error) {
            console.error(`Error copying template ${template.sheetType}:`, error);
            
            failedCount++;
            completedCount++;
            
            const errorMessage = error.message || error;
            
            // Immediately add failure message to display
            linksHtml += `<br><span style="margin-left: 2em; color: #d32f2f;">❌ ${template.sheetType} template failed to copy: ${errorMessage}</span>`;
            selectedFileSummary.innerHTML = linksHtml;
            statusText.innerText = `Copying templates... (${completedCount}/${totalTemplates} completed)`;
            
            resolve({
              success: false,
              sheetType: template.sheetType,
              error: errorMessage
            });
          })
          .copyFileTemplate(
            idMasterID,
            template.id,
            template.sheetType,
            template.version
          );
      });
    });
    
    // Wait for all copying operations to complete
    try {
      await Promise.all(copyPromises);
      
      // Final status update
      const modeDescription = copyMode === 'update' ? 'templates with updates' : 'templates';
      let statusMessage = `All ${modeDescription} copied successfully.`;
      if (failedCount > 0) {
        statusMessage = `${modeDescription.charAt(0).toUpperCase() + modeDescription.slice(1)} copying completed: ${successCount} successful, ${failedCount} failed`;
      }
      statusText.innerText = statusMessage;
      
      // Update title
      if (successCount > 0) {
        const titleModeDescription = copyMode === 'update' ? 'Template(s) with Updates' : 'Template(s)';
        fileAccessTitle.innerHTML = `✅ ${successCount} ${titleModeDescription} Copied Successfully!`;
        if (failedCount > 0) {
          fileAccessTitle.innerHTML += ` (${failedCount} failed)`;
        }
        
        document.getElementById("copyButton").style.display = "none";
        document.getElementById("copyUpdateButton").style.display = "none";
        document.getElementById("addAnotherButton").style.display = "none";
        document.getElementById("instructionsSection").style.display = "none";
        document.getElementById("importButton").style.display = "inline-block";
        document.getElementById("importButton").innerText = "Import Data";
        document.getElementById("importButton").disabled = false;
        document.getElementById("updateMasterButton").style.display = "inline-block";
        document.getElementById("updateMasterButton").disabled = true;
        statusText.innerText += " Ready for import!";
      } else {
        const titleModeDescription = copyMode === 'update' ? 'Templates with Updates' : 'Templates';
        fileAccessTitle.innerHTML = `❌ All ${totalTemplates} ${titleModeDescription} Failed to Copy`;
      }
      
    } catch (error) {
      console.error("Error in template copying process:", error);
      statusText.innerText = `Error during template copying: ${error.message || error}`;
    } finally {
      document.getElementById("copyButton").disabled = false;
      document.getElementById("copyUpdateButton").disabled = false;
    }
  }

  function showContinueSection() {
    console.log("Accessible files:", accessibleFilesCache);
    console.log("Inaccessible files:", inaccessibleFilesCache);
    console.log("Not owned files:", notOwnedFilesCache);
    console.log("Template inaccessible files:", templateInaccessibleFilesCache);

    const statusText = document.getElementById("statusText");
    const fileAccessTitle = document.getElementById("fileAccessTitle");
    const summary = document.getElementById("selectedFileSummary");
    const addAnotherButton = document.getElementById("addAnotherButton");
    const importButton = document.getElementById("importButton");
    const copyButton = document.getElementById("copyButton");
    const copyUpdateButton = document.getElementById("copyUpdateButton");
    const updateButton = document.getElementById("updateMasterButton");
    const instructionsSection = document.getElementById("instructionsSection");

    const totalInaccessibleFiles = inaccessibleFilesCache.length + templateInaccessibleFilesCache.length;

    if (totalInaccessibleFiles === 0) {
      fileAccessTitle.innerText = `✅ All Required Files Access Granted`;
      summary.innerHTML = "";
      showAccessibleFilesSummary();
      addAnotherButton.style.display = "none";
      instructionsSection.style.display = "none";
      if (sheetType === "IDS Master") {
        statusText.innerText = `Choose copy option:`;
        copyButton.style.display = "inline-block";
        copyButton.disabled = false;
        copyUpdateButton.style.display = "inline-block";
        copyUpdateButton.disabled = false;
        importButton.style.display = "none";
        updateButton.style.display = "none";
      } else {
        statusText.innerText = `Checking import status and compatibility.`;
        var updateType = sheetType === "IDS Collection - all IDS-Sheets on one file" ? "IDS Collection" : sheetType;
        importButton.innerText = `Import ${updateType} data`;
        importButton.style.display = "inline-block";
        importButton.disabled = true;
        updateButton.style.display = "inline-block";
        updateButton.disabled = true;
        updateButton.innerText = `Update ${updateType === "IDS Collection" ? "IDS Collection" : "IDS Master"}`;
        copyButton.style.display = "none";
        copyUpdateButton.style.display = "none";
        google.script.run
          .withSuccessHandler(onImportStatusAndCompatibilitySuccess)
          .withFailureHandler(onImportStatusAndCompatibilityFailure)
          .checkImportStatusAndCompatibility(newSheetID, oldSheetID, sheetType);
      }

      finalSelectedFiles = accessibleFilesCache.slice();
    } else if (notOwnedFilesCache.length > 0) {
      fileAccessTitle.innerHTML = `⛔ ${notOwnedFilesCache.length} Files Not Owned By You`;

      summary.innerHTML =
        `<br><strong>📂 Please ensure you own the following files </strong><br>` +
        notOwnedFilesCache
          .map((file) => `&nbsp;&nbsp;• ${file.name || file.id}`)
          .join("<br>");

      addAnotherButton.style.display = "none";
      importButton.style.display = "none";
      updateButton.style.display = "none";
      copyButton.style.display = "none";
      copyUpdateButton.style.display = "none";
      instructionsSection.style.display = "none";
    } else {
      let summaryParts = [];
      if (inaccessibleFilesCache.length > 0) {
        summaryParts.push(`${inaccessibleFilesCache.length} sheet(s)`);
      }
      if (templateInaccessibleFilesCache.length > 0) {
        summaryParts.push(`${templateInaccessibleFilesCache.length} template(s)`);
      }
      
      summary.innerHTML = `<strong>🔐 ${summaryParts.join(' and ')} need access permission</strong><br>`;

      instructionsSection.style.display = "block";
      addAnotherButton.style.display = "inline-block";
      addAnotherButton.disabled = false;
      importButton.style.display = "none";
      updateButton.style.display = "none";
      copyButton.style.display = "none";
      copyUpdateButton.style.display = "none";
    }

    document.getElementById("fileAccessSection").style.display = "block";
  }

  function onImportStatusAndCompatibilitySuccess(result) {
    console.log("Import status and compatibility result:", result);
    if (result.success) {
      document.getElementById("importButton").disabled = false;
      document.getElementById("statusText").innerText = `${result.message}`;
      if (result.versionDifference) {
        versionDifference = result.versionDifference;
      }
      if (result.imported) {
        document.getElementById("updateMasterButton").disabled = false;
        document.getElementById(
          "selectedFileSummary"
        ).innerHTML = `<strong>⚠️ Make sure your data is imported correctly before updating your IDS Master! ⚠️</strong><br>`;
        showAccessibleFilesSummary();
      }
    } else {
      document.getElementById("importButton").disabled = true;
      document.getElementById("updateMasterButton").disabled = true;
      document.getElementById(
        "statusText"
      ).innerText = `Import status and compatibility failed: ${result.message}`;
    }
  }

  function onImportStatusAndCompatibilityFailure(error) {
    document.getElementById("importButton").disabled = true;
    document.getElementById("updateMasterButton").disabled = true;
    console.error("Import status and compatibility error:", error);
    document.getElementById(
      "statusText"
    ).innerText = `Import status and compatibility check failed: ${error.message || error}`;
  }
</script>
