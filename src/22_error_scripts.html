<script>
  const AppError = {
    CODES: {
      ACCESS_DENIED: "ACCESS_DENIED",
      NOT_FOUND: "NOT_FOUND",
      INVALID_INPUT: "INVALID_INPUT",
      INVALID_LINK: "INVALID_LINK",
      INVALID_FILE: "INVALID_FILE",
      SHEET_STRUCTURE: "SHEET_STRUCTURE",
      VERSION_OUTDATED: "VERSION_OUTDATED",
      QUOTA: "QUOTA",
      TIMEOUT: "TIMEOUT",
      CLIENT: "CLIENT",
      INTERNAL: "INTERNAL",
    },

    TITLES: {
      ACCESS_DENIED: "Access needed",
      NOT_FOUND: "Sheet not found",
      INVALID_INPUT: "That request was incomplete",
      INVALID_LINK: "That link could not be read",
      INVALID_FILE: "Not a valid save file",
      SHEET_STRUCTURE: "Could not read part of your sheet",
      VERSION_OUTDATED: "Sheet out of date",
      QUOTA: "Google is rate-limiting this account",
      TIMEOUT: "That took too long",
      CLIENT: "Something went wrong in this page",
      INTERNAL: "Something went wrong",
    },

    FALLBACK_MESSAGE: "Something went wrong. Please try again.",

    /**
     * Prefixes a message with the sheet type unless it already starts with it.
     * @param {string} sheetType
     * @param {string} message
     * @returns {string}
     */
    labelled: function (sheetType, message) {
      const text = String(message || "").trim();
      if (!sheetType) return text;
      return text.toLowerCase().indexOf(String(sheetType).toLowerCase()) === 0
        ? text
        : sheetType + ": " + text;
    },

    EXPECTED: {
      ACCESS_DENIED: true,
      INVALID_LINK: true,
      INVALID_FILE: true,
      NOT_FOUND: true,
      QUOTA: true,
      TIMEOUT: true,
      VERSION_OUTDATED: true,
    },

    last: null,
    _reported: {},

    /**
     * Whether a normalised error is an expected outcome. The server's flag wins;
     * the code list is the fallback.
     * @param {Object} err
     * @returns {boolean}
     */
    _isExpected: function (err) {
      if (err && typeof err.expected === "boolean") return err.expected;
      return AppError.EXPECTED[err && err.code] === true;
    },

    /**
     * Turns a server envelope, an Error, a string, or an already-normalised
     * error into one shape. Idempotent: re-normalising extends the trace rather
     * than reclassifying.
     * @param {*} raw
     * @param {{source?: string, message?: string}} [options]
     * @returns {Object} { __appError, code, trace, title, message, detail,
     *   reference, origin, source, stack, note, data, expected }
     */
    normalize: function (raw, options) {
      options = options || {};
      const source = options.source || "client";

      if (raw && raw.__appError === true) {
        const carried = Object.assign({}, raw);
        carried.trace = (raw.trace || []).slice();
        if (source && carried.trace[carried.trace.length - 1] !== source) {
          carried.trace.push(source);
        }
        if (options.message) carried.message = options.message;
        return carried;
      }

      let code = AppError.CODES.INTERNAL;
      let message = "";
      let detail = "";
      let reference = "";
      let origin = "client";
      let expected = null;
      let trace = [];

      let note = "";
      let data = null;

      if (raw && typeof raw === "object" && raw.success === false) {

        origin = "server";
        code = raw.code || AppError.CODES.INTERNAL;
        message = raw.message || "";
        detail = raw.detail || "";
        reference = raw.reference || "";
        trace = Array.isArray(raw.trace) ? raw.trace.slice() : [];
        if (typeof raw.expected === "boolean") expected = raw.expected;
        if (raw.note) note = raw.note;
        if (raw.data) data = raw.data;
      } else if (raw instanceof Error || (raw && raw.message)) {
        message = "";
        detail = String(raw.message || raw);
        code = AppError.CODES.CLIENT;
      } else if (typeof raw === "string") {
        detail = raw;
        code = AppError.CODES.CLIENT;
      }

      if (!message) {
        message =
          code === AppError.CODES.CLIENT
            ? AppError.FALLBACK_MESSAGE
            : AppError.TITLES[code] || AppError.FALLBACK_MESSAGE;
      }
      if (options.message) message = options.message;

      if (source && trace[trace.length - 1] !== source) trace.push(source);

      const err = {

        __appError: true,
        code: code,
        trace: trace,
        title: AppError.TITLES[code] || AppError.TITLES.INTERNAL,
        message: message,
        detail: detail,
        reference: reference,
        origin: origin,
        source: source,
        stack: raw && raw.stack ? String(raw.stack) : "",
        note: note,
        data: data,
      };
      err.expected = expected === null ? AppError._isExpected(err) : expected;
      return err;
    },

    /**
     * The text for the panel's Technical details block. Empty for an expected
     * failure beyond its own detail.
     * @param {Object} err A normalised error.
     * @returns {string}
     */
    technicalDetails: function (err) {
      if (err.expected) return err.detail || "";

      if (err.parts && err.parts.length) {
        return err.parts
          .map(function (part) {
            const head = part.label ? [part.label] : [];
            return head.concat(AppError._detailLines(part, true)).join("\n");
          })
          .join("\n\n");
      }

      return AppError._detailLines(err, false).join("\n");
    },

    /**
     * Builds the where/code/ref/note/detail lines for one failure.
     * @param {Object} err
     * @param {boolean} withReference Include the ref line.
     * @returns {string[]}
     */
    _detailLines: function (err, withReference) {
      const lines = [];
      if (err.trace && err.trace.length) {
        lines.push("where: " + err.trace.join("  →  "));
      } else if (err.source) {
        lines.push("where: " + err.source);
      }
      if (err.code) lines.push("code:  " + err.code);
      if (withReference && err.reference) {
        lines.push("ref:   " + err.reference);
      }
      if (err.note) lines.push("note:  " + err.note);
      if (err.detail) lines.push("", err.detail);
      return lines;
    },

    /**
     * Normalises a failure, logs it, and renders it into the panel.
     * @param {*} raw
     * @param {{source?: string, message?: string, actions?: Array}} [options]
     * @returns {Object} The normalised error.
     */
    show: function (raw, options) {
      options = options || {};
      const err = AppError.normalize(raw, options);
      AppError._dispatch(err);
      AppError.last = err;
      return AppError._render(err, options);
    },

    /**
     * Renders several failures in one panel, each with its own row, reference
     * and log entry. Falls back to show() for a single failure.
     * @param {Array} rawList
     * @param {{source?: string, message?: string, label?: Function}} [options]
     * @returns {Object|null} The merged error, or null when the list is empty.
     */
    showAll: function (rawList, options) {
      options = options || {};
      const list = (rawList || []).filter(Boolean);
      if (list.length === 0) return null;
      if (list.length === 1) return AppError.show(list[0], options);

      const partOptions = { source: options.source };
      const parts = list.map(function (raw) {
        const part = AppError.normalize(raw, partOptions);
        part.label = options.label ? options.label(raw, part) : part.source;
        AppError._dispatch(part);
        return part;
      });

      const references = parts
        .map(function (part) {
          return part.reference;
        })
        .filter(Boolean);

      const merged = {
        __appError: true,
        code: parts[0].code,
        trace: parts[0].trace,
        title: parts[0].title,
        message: options.message || parts[0].message,
        detail: "",
        reference: references.join("  "),
        origin: parts[0].origin,
        source: parts[0].source,
        expected: parts.every(function (part) {
          return part.expected;
        }),
        parts: parts,
      };

      AppError.last = merged;
      return AppError._render(merged, options);
    },

    /**
     * Raises the panel for the first failure that is a bug, and logs every other
     * bug in the batch so none goes unrecorded.
     * @param {Array<{envelope: *, sheetType?: string, error?: string}>} entries
     * @param {{source?: string}} [options]
     * @returns {Object|null} The shown error, or null when no bug was found.
     */
    surfaceBatch: function (entries, options) {
      options = options || {};
      const source = options.source || "client";
      let first = null;

      (entries || []).forEach(function (entry) {
        if (!entry || !entry.envelope) return;
        const err = AppError.normalize(entry.envelope, { source: source });
        if (err.expected) return;
        if (!first) {

          first = entry;
          return;
        }
        AppError._dispatch(err);
      });

      if (!first) return null;
      return AppError.show(first.envelope, {
        source: source,
        message: AppError.labelled(first.sheetType, first.error),
      });
    },

    /**
     * Builds one failure's row for a shared panel: message, reference, copy.
     * @param {Object} part A normalised error with an optional label.
     * @returns {HTMLElement}
     */
    _entry: function (part) {
      const row = document.createElement("div");
      row.className = "errorPanelEntry";

      const message = document.createElement("p");
      message.className = "errorPanelEntryMessage";

      message.textContent = AppError.labelled(
        part.label,
        part.message || part.detail,
      );
      row.appendChild(message);

      if (part.reference) {
        const footer = document.createElement("div");
        footer.className = "errorPanelEntryRef";

        const label = document.createElement("span");
        label.className = "errorPanelRefLabel";
        label.textContent = "Reference";
        footer.appendChild(label);

        const reference = document.createElement("code");
        reference.className = "errorPanelReference";
        reference.textContent = part.reference;
        footer.appendChild(reference);

        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "errorPanelCopy";
        copy.textContent = "Copy";
        copy.addEventListener("click", function () {
          AppError.copyReference(part.reference, copy);
        });
        footer.appendChild(copy);

        row.appendChild(footer);
      }

      return row;
    },

    /**
     * Sends a failure to Cloud Logging by the route its origin calls for.
     * @param {Object} err A normalised error; may gain a reference.
     * @returns {void}
     */
    _dispatch: function (err) {
      if (err.origin === "client") {
        AppError.report(err);
      } else if (err.origin === "server" && !err.expected) {

        if (!err.reference) err.reference = AppError._reference();

        AppError.finalize(err);
      }
    },

    /**
     * Paints a normalised error into the panel, or falls back to the console and
     * status line when no panel exists on the page.
     * @param {Object} err
     * @param {{actions?: Array<{label: string, onClick: Function}>}} [options]
     * @returns {Object} The same error.
     */
    _render: function (err, options) {
      options = options || {};
      const panel = document.getElementById("errorPanel");
      if (!panel) {
        console.error("[AppError]", err.source, err.message, err.detail);
        if (typeof setStatusText === "function") setStatusText(err.message);
        return err;
      }

      panel.classList.toggle("errorPanelWarning", err.expected);
      const icon = panel.querySelector(".errorPanelIcon");
      if (icon) icon.textContent = err.expected ? "⚠️" : "⛔";

      document.getElementById("errorPanelTitle").textContent = err.title;

      const parts = err.parts && err.parts.length > 1 ? err.parts : null;
      const messageEl = document.getElementById("errorPanelMessage");
      messageEl.textContent = parts ? "" : err.message;
      messageEl.hidden = !!parts;

      const details = document.getElementById("errorPanelDetails");
      const detailText = document.getElementById("errorPanelDetailText");
      if (details && detailText) {
        detailText.textContent = AppError.technicalDetails(err);
        details.hidden = !detailText.textContent;
        details.open = false;
      }

      const list = document.getElementById("errorPanelList");
      if (list) {
        list.innerHTML = "";
        list.hidden = !parts;
        if (parts) {
          parts.forEach(function (part) {
            list.appendChild(AppError._entry(part));
          });
          const hint = document.createElement("div");
          hint.className = "errorPanelRefHint";
          hint.textContent = "Quote these when reporting the problem.";
          list.appendChild(hint);
        }
      }

      const footer = panel.querySelector(".errorPanelFooter");
      if (footer) footer.hidden = !err.reference || !!parts;
      const refEl = document.getElementById("errorPanelReference");
      if (refEl) refEl.textContent = parts ? "" : err.reference;

      const actionsEl = document.getElementById("errorPanelActions");
      if (actionsEl) {
        actionsEl.innerHTML = "";
        (options.actions || []).forEach(function (action) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = action.label;
          button.addEventListener("click", action.onClick);
          actionsEl.appendChild(button);
        });
      }

      panel.hidden = false;
      if (typeof setStatusText === "function") setStatusText(err.message);
      if (panel.scrollIntoView) {
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
      return err;
    },

    /**
     * Hides the panel and forgets the last error.
     * @returns {void}
     */
    clear: function () {
      const panel = document.getElementById("errorPanel");
      if (panel) panel.hidden = true;
      AppError.last = null;
    },

    /**
     * Copies a reference to the clipboard and flashes the button.
     * @param {string} [reference] Defaults to the panel's own.
     * @param {HTMLElement} [button] Defaults to the shared footer button.
     * @returns {void}
     */
    copyReference: function (reference, button) {
      reference = reference || (AppError.last && AppError.last.reference);
      if (!reference) return;
      const done = function () {
        const target = button || document.getElementById("errorPanelCopy");
        if (!target) return;
        target.textContent = "Copied";
        setTimeout(function () {
          target.textContent = "Copy";
        }, 1500);
      };
      try {
        navigator.clipboard.writeText(reference).then(done, function () {
          AppError._copyFallback(reference, done);
        });
      } catch (ignored) {
        AppError._copyFallback(reference, done);
      }
    },

    /**
     * Clipboard copy via a hidden textarea, for when the async API is refused.
     * @param {string} text
     * @param {Function} done Called on success.
     * @returns {void}
     */
    _copyFallback: function (text, done) {
      const field = document.createElement("textarea");
      field.value = text;
      field.setAttribute("readonly", "");
      field.style.position = "fixed";
      field.style.opacity = "0";
      document.body.appendChild(field);
      field.select();
      try {
        document.execCommand("copy");
        done();
      } catch (ignored) {

      }
      document.body.removeChild(field);
    },

    /**
     * Records a failure without interrupting the user, for paths that recover.
     * @param {*} raw
     * @param {string} source
     * @returns {Object} The normalised error.
     */
    log: function (raw, source) {
      const err = AppError.normalize(raw, { source: source });
      console.error(`[${source}]`, raw);

      AppError._dispatch(err);
      return err;
    },

    /**
     * Sends a browser-side failure to reportClientError. Fire and forget, once
     * per distinct failure per page load.
     * @param {Object} err A normalised error; gains a reference.
     * @returns {void}
     */
    report: function (err) {
      try {
        const fingerprint = `${err.source}|${err.detail || err.message}`;
        const already = AppError._reported[fingerprint];
        if (already) {

          err.reference = already;
          return;
        }

        const reference = err.reference || AppError._reference();
        err.reference = reference;
        AppError._reported[fingerprint] = reference;

        google.script.run
          .withSuccessHandler(function (response) {
            AppError._adoptReference(err, fingerprint, response);
          })
          .withFailureHandler(function () {})
          .reportClientError({
            source: err.source,
            message: err.detail || err.message,
            stack: err.stack,
            reference: reference,
            page: typeof document !== "undefined" ? document.title : "",
            viewType: typeof viewType !== "undefined" ? viewType : "",
            userAgent: navigator.userAgent,
            context: { code: err.code },
          });
      } catch (ignored) {

      }
    },

    /**
     * Swaps in the reference the server actually wrote under when our own was
     * throttled away, updating the error and every copy of it on screen.
     * @param {Object} err
     * @param {string} fingerprint
     * @param {{reference?: string}} response
     * @returns {void}
     */
    _adoptReference: function (err, fingerprint, response) {
      const reference = response && response.reference;
      if (!reference || reference === err.reference) return;

      const previous = err.reference;

      err.reference = reference;
      if (fingerprint) AppError._reported[fingerprint] = reference;
      if (!previous) return;

      const nodes = document.querySelectorAll(".errorPanelReference");
      Array.prototype.forEach.call(nodes, function (node) {
        if (node.textContent === previous) node.textContent = reference;
      });
    },

    /**
     * Sends a server bug back to reportServerError so its deferred entry gets
     * written. Fire and forget, once per distinct failure per page load.
     * @param {Object} err A normalised error carrying a reference.
     * @returns {void}
     */
    finalize: function (err) {
      try {
        const fingerprint = `server:${(err.trace && err.trace[0]) || err.source}|${err.detail || err.message}`;
        const already = AppError._reported[fingerprint];
        if (already) {

          err.reference = already;
          return;
        }
        AppError._reported[fingerprint] = err.reference;

        google.script.run
          .withSuccessHandler(function (response) {
            AppError._adoptReference(err, fingerprint, response);
          })
          .withFailureHandler(function () {})
          .reportServerError({
            reference: err.reference,
            code: err.code,
            detail: err.detail,

            message: err.message,
            trace: err.trace,
            note: err.note,
            data: err.data,
            stack: err.stack,
          });
      } catch (ignored) {

      }
    },

    /**
     * Mints a client-side reference in the server's format.
     * @returns {string}
     */
    _reference: function () {
      const stamp = Date.now().toString(36).toUpperCase();
      const salt = Math.floor(Math.random() * 0xffff)
        .toString(36)
        .toUpperCase();
      return `TWR-${stamp}-${salt}`;
    },

    /**
     * Shows result if it is a failed envelope.
     * @param {*} result
     * @param {string} source
     * @param {Object} [options]
     * @returns {boolean} True when it was a failure and the panel was raised.
     */
    check: function (result, source, options) {
      if (result && result.success === false) {
        AppError.show(result, Object.assign({ source: source }, options || {}));
        return true;
      }
      return false;
    },
  };

  /**
   * Calls a server function, rejecting with a normalised error.
   * @param {string} method Name of the google.script.run function.
   * @param {...*} args
   * @returns {Promise<*>} Whatever the server returned.
   */
  function runAppsScript(method, ...args) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) {
          reject(AppError.normalize(error, { source: method }));
        })
        [method](...args);
    });
  }

  window.addEventListener("error", function (event) {

    if (!event.error && (!event.message || event.message === "Script error.")) {
      return;
    }
    AppError.show(event.error || event.message, {
      source: `window.onerror:${event.filename || "page"}:${event.lineno || 0}`,
    });
  });

  window.addEventListener("unhandledrejection", function (event) {

    AppError.show(event.reason, { source: "unhandledrejection" });
  });
</script>
