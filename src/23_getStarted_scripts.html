  /**
   * Renders the manual copy links for every template.
   * @returns {void}
   */
  function renderGetStartedTemplateLinks() {
    var linksContainer = document.getElementById("getStartedTemplateLinks");
    if (!linksContainer) {
      return;
    }

    var htmlParts = [];
    htmlParts.push("<ul>");

    for (var category in GET_STARTED_TEMPLATE_CONFIG) {
      var templates = GET_STARTED_TEMPLATE_CONFIG[category];
      if (templates && templates.length > 0) {
        templates.forEach((template) => {
          var safeName = template.sheetType || "Sheet";
          htmlParts.push(
            `<li><a href="https://docs.google.com/spreadsheets/d/${template.templateID}/copy" target="_blank">${safeName} Sheet™</a></li>`,
          );
        });
      }
    }

    htmlParts.push("</ul>");
    linksContainer.innerHTML = htmlParts.join("");
  }

  /**
   * Reveals the Get Started section and enables the copy button.
   * @returns {void}
   */
  function continueGetStarted() {
    var getStartedSection = document.getElementById("getStartedSection");
    if (getStartedSection) {
      getStartedSection.style.display = "block";
    }
    var copyButton = document.getElementById("getStartedCopyBtn");
    if (copyButton) {
      copyButton.disabled = false;
    }
    setStatusText("Ready to copy templates");
  }

  /**
   * Resolves the destination Drive folder, creating it if needed.
   * @returns {Promise<void>}
   * @throws {Error} When the folder cannot be resolved.
   */
  async function getOrCreateGetStartedFolder() {
    var folderResult = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (result) {
          if (result.id) {
            resolve(result);
          } else if (result.error) {
            reject(new Error(result.error));
          } else {
            reject(new Error("Failed to get or create The Tower folder"));
          }
        })
        .withFailureHandler(function (error) {
          reject(error);
        })
        .getOrCreateGetStartedFolder();
    });

    if (folderResult && folderResult.success && folderResult.id) {
      getStartedSelectedFolder = {
        id: folderResult.id,
        name: folderResult.name || "The Tower",
        url: folderResult.url,
      };
      updateGetStartedSelectedFolderDisplay();
    } else {
      throw new Error("Invalid folder result: " + JSON.stringify(folderResult));
    }
  }

  /**
   * Shows the chosen destination folder, or hides the row when unset.
   * @returns {void}
   */
  function updateGetStartedSelectedFolderDisplay() {
    var folderElement = document.getElementById("getStartedSelectedFolder");
    if (!folderElement) {
      return;
    }

    if (!getStartedSelectedFolder || !getStartedSelectedFolder.id) {
      folderElement.hidden = true;
      return;
    }

    var safeName = getStartedSelectedFolder.name || "loading folder...";
    folderElement.hidden = false;
    folderElement.innerHTML = `Destination: <a href="${getStartedSelectedFolder.url}" target="_blank">${safeName}</a>`;
  }

  /**
   * gapi onload hook: loads the client and picker libraries.
   * @returns {void}
   */
  function getStartedGapiLoaded() {
    console.log("Get Started GAPI script loaded, loading client and picker...");
    gapi.load("client:picker", {
      callback: initializeGetStartedPicker,
      onerror: function () {
        console.error("Failed to load GAPI client:picker for Get Started");
        setStatusText("Failed to load Google™ APIs");
      },
    });
  }

  /**
   * Initialises the Drive picker, then starts authorization.
   * @returns {Promise<void>}
   */
  async function initializeGetStartedPicker() {
    try {
      console.log("Initializing Get Started GAPI client...");

      if (!API_KEY || !APP_ID) {
        throw new Error("Missing API_KEY or APP_ID for folder picker.");
      }

      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: [
          "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest",
        ],
      });

      console.log("Get Started GAPI client initialized successfully");
      console.log(
        "Get Started Picker API available:",
        typeof google.picker !== "undefined",
      );

      getStartedPickerReady = true;
      renderGetStartedTemplateLinks();
      authorizeGetStarted();
    } catch (error) {
      AppError.show(error, {
        source: "initializeGetStartedPicker",
        message: "This page could not finish loading. Reload and try again.",
      });
    }
  }

  /**
   * Renders created, failed and retryable sheets, and raises the panel for
   * the first failure that is a defect.
   * @param {Object} result
   * @returns {void}
   */
  function renderGetStartedCopyResult(result) {
    var resultElement = document.getElementById("getStartedCopyResult");
    if (!resultElement) return;

    var createdFiles = (result && result.createdFiles) || [];
    var failedCopies = (result && (result.failedCopies)) || [];
    var failedIDUpdates = (result && result.failedIDUpdates) || [];
    var successfulIDUpdates = (result && result.successfulIDUpdates) || [];

    createdFiles.forEach(function (newFile) {
      if (!newFile || !newFile.fileId) {
        return;
      }

      var existingCreated = allCreatedFiles.find(function (file) {
        return file.fileId === newFile.fileId;
      });

      if (existingCreated) {
        if (newFile.fileName) existingCreated.fileName = newFile.fileName;
        if (newFile.fileUrl) existingCreated.fileUrl = newFile.fileUrl;
        if (newFile.sheetType) existingCreated.sheetType = newFile.sheetType;
      } else {
        allCreatedFiles.push(newFile);
      }
    });

    failedCopies.forEach(function (newFail) {
      if (!newFail || !newFail.templateID) {
        return;
      }

      if (
        allCreatedFiles.some(function (file) {
          return file.sheetType === newFail.sheetType;
        })
      ) {
        return;
      }

      var existingCopyFailure = allFailedCopyFiles.find(function (file) {
        return (
          file.sheetType === newFail.sheetType &&
          file.templateID === newFail.templateID
        );
      });

      if (existingCopyFailure) {
        if (newFail.error) existingCopyFailure.error = newFail.error;
        if (newFail.copyUrl) existingCopyFailure.copyUrl = newFail.copyUrl;
        if (newFail.templateVersion) {
          existingCopyFailure.templateVersion = newFail.templateVersion;
        }
      } else {
        allFailedCopyFiles.push(newFail);
      }
    });

    allFailedCopyFiles = allFailedCopyFiles.filter(function (fail) {
      return !allCreatedFiles.some(function (created) {
        return created.sheetType === fail.sheetType;
      });
    });

    failedIDUpdates.forEach(function (newFail) {
      if (!newFail || !newFail.fileId) {
        return;
      }

      if (
        !allCreatedFiles.some(function (created) {
          return created.fileId === newFail.fileId;
        })
      ) {
        return;
      }

      var existingIDFailure = allFailedIDUpdateFiles.find(function (file) {
        return file.fileId === newFail.fileId;
      });

      if (existingIDFailure) {
        if (newFail.error) existingIDFailure.error = newFail.error;
        if (newFail.fileName) existingIDFailure.fileName = newFail.fileName;
        if (newFail.fileUrl) existingIDFailure.fileUrl = newFail.fileUrl;
        if (newFail.sheetType) existingIDFailure.sheetType = newFail.sheetType;
      } else {
        allFailedIDUpdateFiles.push(newFail);
      }
    });

    allFailedIDUpdateFiles = allFailedIDUpdateFiles.filter(function (fail) {
      var stillCreated = allCreatedFiles.some(function (created) {
        return created.fileId === fail.fileId;
      });

      if (!stillCreated) {
        return false;
      }

      return !successfulIDUpdates.some(function (success) {
        return success.fileId === fail.fileId;
      });
    });

    lastFailedCopyTemplates = allFailedCopyFiles.map(function (file) {
      return {
        sheetType: file.sheetType,
        templateID: file.templateID,
        templateVersion: file.templateVersion || "",
      };
    });

    lastFailedIDUpdateFiles = allFailedIDUpdateFiles.map(function (file) {
      return {
        sheetType: file.sheetType,
        fileId: file.fileId,
        fileName: file.fileName,
        fileUrl: file.fileUrl,
        error: file.error,
      };
    });

    var htmlParts = [];
    if (allCreatedFiles.length > 0) {
      htmlParts.push('<div class="copyResultBlock copyResultSuccess">');
      htmlParts.push(`<strong>Created files (${allCreatedFiles.length}):</strong>`);
      htmlParts.push("<ul>");
      allCreatedFiles.forEach(function (created) {
        var createdName = created.fileName || `${created.sheetType} copy`;
        var createdType = created.sheetType || "Sheet";
        var createdUrl = sanitizeGetStartedUrl(created.fileUrl);
        if (createdUrl) {
          htmlParts.push(`<li><a href="${createdUrl}" target="_blank">${createdName}</a> (${createdType})</li>`);
        } else {
          htmlParts.push(`<li>${createdName} (${createdType})</li>`);
        }
      });
      htmlParts.push("</ul>");
      htmlParts.push("</div>");
    }

    if (allFailedCopyFiles.length > 0) {
      htmlParts.push('<div class="copyResultBlock copyResultFailure">');
      htmlParts.push(`<strong>Could not create automatically (${allFailedCopyFiles.length}):</strong>`);
      htmlParts.push("<ul>");
      allFailedCopyFiles.forEach(function (failed) {
        var failedType = failed.sheetType || "Sheet";
        var failedError = failed.error || "Unknown error";
        var manualUrl = sanitizeGetStartedUrl(failed.copyUrl);
        if (manualUrl) {
          htmlParts.push(`<li><strong>${failedType}</strong>: ${failedError}<br><a href="${manualUrl}" target="_blank">Open ${failedType} copy link</a></li>`);
        } else {
          htmlParts.push(`<li><strong>${failedType}</strong>: ${failedError}</li>`);
        }
      });
      htmlParts.push("</ul>");
      htmlParts.push("</div>");
    }

    if (allFailedIDUpdateFiles.length > 0) {
      htmlParts.push('<div class="copyResultBlock copyResultFailure">');
      htmlParts.push(`<strong>Copied but failed ID setup (${allFailedIDUpdateFiles.length}):</strong>`);
      htmlParts.push("<ul>");
      allFailedIDUpdateFiles.forEach(function (failed) {
        var failedType = failed.sheetType || "Sheet";
        var failedError = failed.error || "Unknown error";
        var failedUrl = sanitizeGetStartedUrl(failed.fileUrl);
        if (failedUrl) {
          htmlParts.push(`<li><strong>${failedType}</strong>: ${failedError}<br><a href="${failedUrl}" target="_blank">Open copied file</a></li>`);
        } else {
          htmlParts.push(`<li><strong>${failedType}</strong>: ${failedError}</li>`);
        }
      });
      htmlParts.push("</ul>");
      htmlParts.push("</div>");
    }

    if (htmlParts.length === 0) {
      htmlParts.push("No files were created.");
    }
    resultElement.innerHTML = htmlParts.join("");

    AppError.surfaceBatch(allFailedCopyFiles.concat(allFailedIDUpdateFiles), {
      source: "getStartedCopy",
    });

    var copyButton = document.getElementById("getStartedCopyBtn");
    var modeSelect = document.getElementById("getStartedCopyMode");
    var modeSelectLabel = document.getElementById("getStartedCopyModeLabel");
    var retryBtn = document.getElementById("retryFailedCopiesBtn");
    if (copyButton) copyButton.style.display = "none";
    if (modeSelect) modeSelect.style.display = "none";
    if (modeSelectLabel) modeSelectLabel.style.display = "none";
    if (retryBtn) {
      retryBtn.style.display =
        allFailedCopyFiles.length > 0 || allFailedIDUpdateFiles.length > 0
          ? "inline-block"
          : "none";
    }
  }

  /**
   * Copies one template, resolving rather than rejecting on failure.
   * @param {{sheetType: string, templateID: string, templateVersion?: string}} template
   * @param {string} parentFolderID
   * @returns {Promise<Object>} { success, result, error?, sheetType, templateID }
   */
  function copyGetStartedTemplateAsync(template, parentFolderID) {
    return new Promise(function (resolve) {
      google.script.run
        .withSuccessHandler(function (result) {
          resolve({
            success: !!(result && result.success && result.fileId),
            result: result,
            sheetType: template.sheetType,
            templateID: template.templateID,
            templateVersion: template.templateVersion || "",
          });
        })
        .withFailureHandler(function (error) {
          resolve({
            success: false,
            result: null,
            error: error,
            sheetType: template.sheetType,
            templateID: template.templateID,
            templateVersion: template.templateVersion || "",
          });
        })
        .copyFileTemplate(
          template.templateID,
          template.sheetType,
          template.templateVersion || "",
          parentFolderID || "",
        );
    });
  }

  /**
   * Splits templates into those the script can read and those it cannot.
   * @param {Array<Object>} templates
   * @returns {Promise<{success: boolean, accessibleTemplates: Array, inaccessibleTemplates: Array}>}
   */
  async function checkGetStartedTemplateAccess(templates) {
    try {
      if (!Array.isArray(templates) || templates.length === 0) {
        return {
          success: true,
          accessibleTemplates: [],
          inaccessibleTemplates: [],
          message: "No templates to check.",
        };
      }

      console.log(
        `Checking access to ${templates.length} Get Started templates`,
      );

      const promises = templates.map((template) => {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((result) => resolve({ template, result }))
            .withFailureHandler((error) => reject({ template, error }))
            .checkTemplateAccess(template.templateID);
        });
      });

      const results = await Promise.allSettled(promises);

      const accessibleTemplates = [];
      const inaccessibleTemplates = [];

      results.forEach((promiseResult) => {
        if (promiseResult.status === "fulfilled") {
          const { template, result } = promiseResult.value;

          if (result.accessible) {
            accessibleTemplates.push(template);
          } else {
            inaccessibleTemplates.push({
              sheetType: template.sheetType,
              templateID: template.templateID,
            });
          }
        } else {
          console.error(
            "Template access check failed for",
            promiseResult.reason.template.templateID,
            ":",
            promiseResult.reason.error,
          );
          inaccessibleTemplates.push({
            sheetType: promiseResult.reason.template.sheetType,
            templateID: promiseResult.reason.template.templateID,
          });
        }
      });

      const message =
        inaccessibleTemplates.length > 0
          ? `${inaccessibleTemplates.length} template(s) are not accessible.`
          : "All templates are accessible.";

      console.log(
        `Template access check complete: ${accessibleTemplates.length} accessible, ${inaccessibleTemplates.length} inaccessible`,
      );

      return {
        success: inaccessibleTemplates.length === 0,
        accessibleTemplates: accessibleTemplates,
        inaccessibleTemplates: inaccessibleTemplates,
        message: message,
      };
    } catch (error) {
      AppError.log(error, "checkGetStartedTemplateAccess: Template access check error");
      return {
        success: false,
        accessibleTemplates: [],
        inaccessibleTemplates: templates,
        message: `Error checking template access: ${error.message || error}`,
      };
    }
  }

  /**
   * Opens the picker so the user can grant the templates that failed.
   * @param {Array<Object>} failedTemplates
   * @returns {Promise<boolean>} Whether access was granted.
   */
  async function openGetStartedAccessPicker(failedTemplates) {
    if (
      !getStartedPickerReady ||
      typeof google === "undefined" ||
      !google.picker
    ) {
      throw new Error("Google Picker API not ready. Please try again.");
    }

    if (!Array.isArray(failedTemplates) || failedTemplates.length === 0) {
      throw new Error("No templates to grant access to.");
    }

    return new Promise(function (resolve, reject) {
      try {
        var failedTemplateIds = failedTemplates
          .map(function (template) {
            return template.templateID;
          })
          .filter(function (id) {
            return typeof id === "string" && id.length > 0;
          });

        if (failedTemplateIds.length === 0) {
          reject(new Error("No valid template IDs found."));
          return;
        }

        console.log(
          "Opening Get Started access picker for templates:",
          failedTemplateIds,
        );

        var fileIdsString = failedTemplateIds.join(",");
        var view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEET)
          .setFileIds(fileIdsString)
          .setIncludeFolders(false)
          .setSelectFolderEnabled(false)
          .setMode(google.picker.DocsViewMode.LIST)
          .setMimeTypes("application/vnd.google-apps.spreadsheet");

        var pickerSize = {
          width: Math.min(window.innerWidth - 10, 1400),
          height: Math.min(window.innerHeight - 80, 900),
        };

        var picker = new google.picker.PickerBuilder()
          .setDeveloperKey(API_KEY)
          .setAppId(APP_ID)
          .setOAuthToken(accessToken)
          .setSelectableMimeTypes("application/vnd.google-apps.spreadsheet")
          .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
          .addView(view)
          .setCallback(function (data) {
            if (data.action === google.picker.Action.PICKED) {
              const pickedIds = (data.docs || []).map(function (d) {
                return d.id;
              });
              console.log(
                "Get Started access picker: files selected:",
                pickedIds,
              );
              resolve(pickedIds);
            } else if (data.action === google.picker.Action.CANCEL) {
              console.log("Get Started access picker: cancelled");
              resolve([]);
            }
          })
          .setSize(pickerSize.width, pickerSize.height);

        if (
          typeof google !== "undefined" &&
          google.script &&
          google.script.host &&
          google.script.host.origin
        ) {
          picker.setOrigin(google.script.host.origin);
        }

        var builtPicker = picker.build();
        builtPicker.setVisible(true);
      } catch (error) {
        reject(error);
      }
    });
  }

  /**
   * Copies every template in parallel.
   * @param {Array<Object>} templates
   * @param {string} parentFolderID
   * @returns {Promise<Array<Object>>} One response per template.
   */
  async function executeGetStartedTemplateCopies(templates, parentFolderID) {

    var copyResponses = await Promise.all(
      templates.map(function (template) {
        if (
          effectivePathsID &&
          template &&
          template.templateID === effectivePathsID
        ) {
          return new Promise(function (resolve) {
            google.script.run
              .withSuccessHandler(function (result) {
                resolve({
                  success: !!(result && result.success),
                  result: result,
                  sheetType: template.sheetType || "Effective Paths",
                  templateID: template.templateID,
                  templateVersion: template.templateVersion || "",
                });
              })
              .withFailureHandler(function (error) {
                resolve({
                  success: false,
                  result: null,
                  error: error,
                  sheetType: template.sheetType || "Effective Paths",
                  templateID: template.templateID,
                  templateVersion: template.templateVersion || "",
                });
              })
              .moveGetStartedFileToFolder(
                template.templateID,
                parentFolderID || "",
              );
          });
        }

        return copyGetStartedTemplateAsync(template, parentFolderID);
      }),
    );

    return copyResponses;
  }

  /**
   * Links the created sheets to each other by writing their IDs.
   * @param {Array<Object>} createdFiles
   * @param {string} copyMode
   * @returns {Promise<{success: boolean, updateResults: Array<Object>}>}
   */
  async function applyGetStartedIDUpdates(createdFiles, copyMode) {

    try {
      if (!Array.isArray(createdFiles) || createdFiles.length === 0) {
        return { success: true, updateResults: [] };
      }

      console.log(
        `Applying ID updates for ${copyMode} mode to ${createdFiles.length} file(s)`,
      );

      var masterFile = null;
      var masterRelatedIDs = [];
      var knownCreatedFiles = [];
      var knownCreatedFileMap = {};

      /**
       * Merges a created file into the known set, by file id.
       * @param {{fileId: string, sheetType?: string, fileName?: string, fileUrl?: string}} file
       * @returns {void}
       */
      function mergeKnownCreatedFile(file) {
        if (!file || !file.fileId) {
          return;
        }

        var existing = knownCreatedFileMap[file.fileId];
        if (!existing) {
          existing = {
            fileId: file.fileId,
            sheetType: file.sheetType,
            fileName: file.fileName,
            fileUrl: file.fileUrl,
          };
          knownCreatedFileMap[file.fileId] = existing;
          knownCreatedFiles.push(existing);
          return;
        }

        if (file.sheetType) existing.sheetType = file.sheetType;
        if (file.fileName) existing.fileName = file.fileName;
        if (file.fileUrl) existing.fileUrl = file.fileUrl;
      }

      if (Array.isArray(allCreatedFiles)) {
        allCreatedFiles.forEach(mergeKnownCreatedFile);
      }
      if (Array.isArray(createdFiles)) {
        createdFiles.forEach(mergeKnownCreatedFile);
      }

      if (copyMode === "master-and-subsheets") {
        masterFile =
          createdFiles.find(function (file) {
            return file.sheetType === "IDS Master";
          }) ||
          knownCreatedFiles.find(function (file) {
            return file.sheetType === "IDS Master";
          });

        masterRelatedIDs = knownCreatedFiles
          .filter(function (file) {
            return (
              file.sheetType !== "IDS Master" &&
              file.sheetType !== "Effective Paths" &&
              !!file.fileId
            );
          })
          .map(function (file) {
            return {
              sheetType: file.sheetType,
              sheetID: file.fileId,
            };
          });
      } else if (copyMode === "ids-collection") {
        masterFile =
          createdFiles.find(function (file) {
            return file.sheetType === "IDS Collection";
          }) ||
          knownCreatedFiles.find(function (file) {
            return file.sheetType === "IDS Collection";
          });
      }

      var updatePromises = createdFiles.map(function (file) {
        return new Promise(function (resolve) {
          try {
            var relatedSheetIDs = [];
            if (masterFile && file.sheetType === masterFile.sheetType) {
              relatedSheetIDs = masterRelatedIDs;
            } else if (masterFile) {
              relatedSheetIDs.push({
                sheetType: "IDS Master",
                sheetID: masterFile.fileId,
              });
            }

            console.log(
              `Updating ${file.sheetType} (${file.fileId}) with related IDs:`,
              relatedSheetIDs,
            );

            google.script.run
              .withSuccessHandler(function (result) {
                console.log(`ID update result for ${file.sheetType}:`, result);
                resolve(result);
              })
              .withFailureHandler(function (error) {
                console.error(
                  `Failed to update IDs for ${file.sheetType}:`,
                  error,
                );
                resolve({ success: false, error: error });
              })
              .updateGetStartedSheetIdsAndReferences(
                file.fileId,
                file.sheetType,
                relatedSheetIDs,
              );
          } catch (error) {
            AppError.log(error, "mergeKnownCreatedFile: Error updating IDs for");
            resolve({ success: false, error: error });
          }
        });
      });

      var updateResults = await Promise.all(updatePromises);

      return { success: true, updateResults: updateResults };
    } catch (error) {
      AppError.log(error, "mergeKnownCreatedFile: Error applying ID updates");
      return { success: false, error: error };
    }
  }

  /**
   * Sorts ID-update results into successes and failures.
   * @param {Array<Object>} createdFiles
   * @param {Object} idUpdateResult
   * @returns {Object} { successfulIDUpdates, failedIDUpdates }
   */
  function processGetStartedIDUpdateResults(createdFiles, idUpdateResult) {
    var successfulIDUpdates = [];
    var failedIDUpdates = [];

    if (!Array.isArray(createdFiles) || createdFiles.length === 0) {
      return {
        successfulIDUpdates: successfulIDUpdates,
        failedIDUpdates: failedIDUpdates,
      };
    }

    var updateResults = (idUpdateResult && idUpdateResult.updateResults) || [];
    var globalError =
      idUpdateResult && idUpdateResult.success === false
        ? idUpdateResult.error
        : null;

    createdFiles.forEach(function (file, index) {
      var updateResult = updateResults[index];

      if (updateResult && updateResult.fileName) {
        file.fileName = updateResult.fileName;
      }

      var updateSucceeded = false;
      if (!globalError && updateResult) {
        if (typeof updateResult.success === "boolean") {
          updateSucceeded = updateResult.success;
        } else {
          updateSucceeded = !updateResult.error;
        }
      }

      if (updateSucceeded) {
        successfulIDUpdates.push({
          sheetType: file.sheetType,
          fileId: file.fileId,
          fileName: file.fileName,
          fileUrl: file.fileUrl,
        });
        return;
      }

      var errorMessage = "Unknown ID update error";
      if (globalError) {
        errorMessage = globalError.message || String(globalError);
      } else if (updateResult && updateResult.error) {
        errorMessage = updateResult.error.message || String(updateResult.error);
      } else if (updateResult && updateResult.message) {
        errorMessage = updateResult.message;
      } else if (!updateResult) {
        errorMessage = "No response from ID update operation.";
      }

      failedIDUpdates.push({
        sheetType: file.sheetType,
        fileId: file.fileId,
        fileName: file.fileName,
        fileUrl: file.fileUrl,
        error: errorMessage,
        envelope: globalError || (updateResult && updateResult.error) || updateResult,
      });
    });

    return {
      successfulIDUpdates: successfulIDUpdates,
      failedIDUpdates: failedIDUpdates,
    };
  }

  /**
   * Sorts copy responses into created files and failures, keeping each
   * failure's envelope so it can be reported.
   * @param {Array<Object>} copyResponses
   * @returns {Object} { success, createdFiles, failedCopies, message, ... }
   */
  function processGetStartedCopyResults(copyResponses) {

    var createdFiles = [];
    var failedCopies = [];

    copyResponses.forEach(function (response) {
      if (response.success && response.result && response.result.fileId) {
        var createdFileName =
          response.result.fileName ||
          response.result.name ||
          `${response.sheetType}`;
        var createdFileUrl = response.result.fileUrl;
        if (!createdFileUrl && response.result.fileId) {
          createdFileUrl =
            "https://docs.google.com/spreadsheets/d/" +
            response.result.fileId +
            "/edit";
        }
        createdFiles.push({
          sheetType: response.sheetType,
          fileId: response.result.fileId,
          fileName: createdFileName,
          fileUrl: createdFileUrl,
        });
        return;
      }

      var errorMessage = "Unknown error";
      if (response.success && (!response.result || !response.result.fileId)) {
        errorMessage = "Missing file ID from template operation.";
      } else if (response.result && response.result.message) {
        errorMessage = response.result.message;
      } else if (response.error) {
        errorMessage = response.error.message || String(response.error);
      }
      failedCopies.push({
        sheetType: response.sheetType,
        templateID: response.templateID,
        templateVersion: response.templateVersion || "",
        copyUrl: response.result ? response.result.copyUrl : "",
        error: errorMessage,
        envelope: response.error || response.result,
      });
    });

    var completeSuccess = failedCopies.length === 0;
    var partialSuccess = createdFiles.length > 0 && failedCopies.length > 0;
    var success = createdFiles.length > 0;

    var message = "";
    if (completeSuccess) {
      message = `Successfully created ${createdFiles.length} file(s).`;
    } else if (partialSuccess) {
      message = `Created ${createdFiles.length} file(s), but ${failedCopies.length} failed.`;
    } else {
      message =
        "Could not create any files automatically. Use manual copy links below.";
    }

    return {
      success: success,
      message: message,
      createdFiles: createdFiles,
      failedCopies: failedCopies,
    };
  }

  /**
   * Checks template access, copies what it can, and links the results.
   * @param {Array<Object>} templates
   * @param {string} parentFolderID
   * @param {string} copyMode
   * @returns {Promise<Object>} The copy result summary.
   */
  async function performGetStartedAccessCheckAndCopy(
    templates,
    parentFolderID,
    destinationLabel,
    copyMode,
  ) {
    try {
      var accessCheckResult = await checkGetStartedTemplateAccess(templates);
      var inaccessibleTemplates = accessCheckResult.inaccessibleTemplates || [];

      while (inaccessibleTemplates.length > 0) {
        console.log(
          "Templates need access, opening picker for:",
          inaccessibleTemplates,
        );

        setStatusWithSpinner(
          `Opening file picker to grant access to ${inaccessibleTemplates.length} template(s)...`,
        );

        var pickedIds;
        try {
          pickedIds = await openGetStartedAccessPicker(inaccessibleTemplates);
        } catch (pickerError) {
          AppError.show(pickerError, {
            source: "performGetStartedAccessCheckAndCopy",
            message: "The file picker could not be opened.",
          });
          return null;
        }

        if (!pickedIds || pickedIds.length === 0) {
          setStatusText(
            "File access picker cancelled. Please grant access to continue.",
          );
          return null;
        }

        inaccessibleTemplates = inaccessibleTemplates.filter(function (template) {
          return pickedIds.indexOf(template.templateID) === -1;
        });

        if (inaccessibleTemplates.length > 0) {
          setStatusText(
            `Still missing access to ${inaccessibleTemplates.length} template(s). Please grant access to the remaining templates.`,
          );
        }
      }

      setStatusWithSpinner(
        `Copying ${templates.length} templates to ${destinationLabel}...`,
      );

      var copyResponses = await executeGetStartedTemplateCopies(
        templates,
        parentFolderID,
      );
      var copyResult = processGetStartedCopyResults(copyResponses);
      var finalResult = {
        createdFiles: copyResult.createdFiles,
        failedCopies: copyResult.failedCopies,
        failedIDUpdates: [],
        successfulIDUpdates: [],
        message: copyResult.message,
      };

      if (copyResult.createdFiles.length > 0) {
        setStatusWithSpinner(`Setting sheet™ connections...`);

        var idUpdateResult = await applyGetStartedIDUpdates(
          copyResult.createdFiles,
          copyMode,
        );

        var idUpdateSummary = processGetStartedIDUpdateResults(
          copyResult.createdFiles,
          idUpdateResult,
        );
        finalResult.successfulIDUpdates = idUpdateSummary.successfulIDUpdates;
        finalResult.failedIDUpdates = idUpdateSummary.failedIDUpdates;
      }

      var statusParts = [];
      if (finalResult.createdFiles.length > 0) {
        statusParts.push(`Created ${finalResult.createdFiles.length} file(s)`);
      }
      if (finalResult.failedCopies.length > 0) {
        statusParts.push(
          `${finalResult.failedCopies.length} file(s) failed to copy`,
        );
      }
      if (finalResult.failedIDUpdates.length > 0) {
        statusParts.push(
          `${finalResult.failedIDUpdates.length} file(s) failed ID setup`,
        );
      }

      if (finalResult.createdFiles.length === 0 && finalResult.failedCopies.length > 0) {
        finalResult.message =
          "Could not create any files automatically. Use manual copy links below.";
      } else if (statusParts.length > 0) {
        finalResult.message = statusParts.join(", ") + ".";
      }

      setStatusText(finalResult.message);
      renderGetStartedCopyResult(finalResult);

      return finalResult;
    } catch (error) {
      AppError.show(error, {
        source: "performGetStartedAccessCheckAndCopy",
        message: "That step did not finish.",
      });
      return null;
    }
  }

  /**
   * Runs the whole Get Started copy for the selected mode.
   * @returns {Promise<void>}
   */
  async function createGetStartedCopies() {
    var modeSelect = document.getElementById("getStartedCopyMode");
    var copyButton = document.getElementById("getStartedCopyBtn");
    var resultElement = document.getElementById("getStartedCopyResult");
    var retryBtn = document.getElementById("retryFailedCopiesBtn");

    if (!modeSelect || !copyButton) return;

    allCreatedFiles = [];
    allFailedCopyFiles = [];
    allFailedIDUpdateFiles = [];
    lastFailedCopyTemplates = [];
    lastFailedIDUpdateFiles = [];

    var copyMode = modeSelect.value || "master-and-subsheets";
    getStartedLastCopyMode = copyMode;

    var templates = [];
    var effectivePaths = GET_STARTED_TEMPLATE_CONFIG["effective-paths"] || [];

    if (effectivePathsID) {
      templates.push({
        sheetType: "Effective Paths",
        templateID: effectivePathsID,
      });
    } else if (effectivePaths.length > 0) {
      templates = templates.concat(effectivePaths);
    }

    var selectedTemplates = GET_STARTED_TEMPLATE_CONFIG[copyMode] || [];
    templates = templates.concat(selectedTemplates);

    if (!templates || templates.length === 0) {
      setStatusText("Invalid copy mode selected.");
      return;
    }

    copyButton.disabled = true;
    modeSelect.disabled = true;
    if (resultElement) resultElement.innerHTML = "";
    if (retryBtn) retryBtn.style.display = "none";

    setStatusWithSpinner(`Checking access to ${templates.length} templates...`);

    try {
      if (!getStartedSelectedFolder || !getStartedSelectedFolder.id) {
        await getOrCreateGetStartedFolder();
      }
      var parentFolderID = getStartedSelectedFolder.id;
      var destinationLabel = getStartedSelectedFolder.name;

      await performGetStartedAccessCheckAndCopy(
        templates,
        parentFolderID,
        destinationLabel,
        copyMode,
      );
    } catch (error) {
      AppError.show(error, {
        source: "createGetStartedCopies",
        message: "That step did not finish. . Please try again.",
      });
    } finally {
      copyButton.disabled = false;
      modeSelect.disabled = false;
    }
  }

  /**
   * Retries the templates that failed on the previous attempt.
   * @returns {Promise<void>}
   */
  async function retryFailedCopies() {
    var modeSelect = document.getElementById("getStartedCopyMode");
    var retryBtn = document.getElementById("retryFailedCopiesBtn");
    var pendingCopyRetries = lastFailedCopyTemplates.length;
    var pendingIDUpdateRetries = lastFailedIDUpdateFiles.length;

    if (pendingCopyRetries === 0 && pendingIDUpdateRetries === 0) {
      setStatusText("There are no failed steps to retry.");
      return;
    }

    var copyMode =
      modeSelect && modeSelect.value ? modeSelect.value : getStartedLastCopyMode;
    getStartedLastCopyMode = copyMode;

    if (retryBtn) retryBtn.disabled = true;

    var retryTargets = [];
    if (pendingCopyRetries > 0) {
      retryTargets.push(`${pendingCopyRetries} copy operation(s)`);
    }
    if (pendingIDUpdateRetries > 0) {
      retryTargets.push(`${pendingIDUpdateRetries} ID update(s)`);
    }

    setStatusWithSpinner(`Retrying ${retryTargets.join(" and ")}...`);

    try {
      var parentFolderID = getStartedSelectedFolder.id;
      if (!parentFolderID) {
        await getOrCreateGetStartedFolder();
        parentFolderID = getStartedSelectedFolder.id;
      }

      var retryResult = {
        createdFiles: [],
        failedCopies: [],
        failedIDUpdates: [],
        successfulIDUpdates: [],
      };

      var newCreatedFiles = [];
      if (pendingCopyRetries > 0) {
        var copyResponses = await Promise.all(
          lastFailedCopyTemplates.map(function (template) {
            return copyGetStartedTemplateAsync(template, parentFolderID);
          }),
        );

        var copyResult = processGetStartedCopyResults(copyResponses);
        retryResult.createdFiles = copyResult.createdFiles;
        retryResult.failedCopies = copyResult.failedCopies;
        newCreatedFiles = copyResult.createdFiles;
      }

      var idUpdateTargets = [];
      if (pendingIDUpdateRetries > 0) {
        idUpdateTargets = idUpdateTargets.concat(lastFailedIDUpdateFiles);
      }
      if (newCreatedFiles.length > 0) {
        idUpdateTargets = idUpdateTargets.concat(newCreatedFiles);
      }

      var uniqueIDUpdateTargets = [];
      idUpdateTargets.forEach(function (file) {
        if (!file || !file.fileId) {
          return;
        }

        var exists = uniqueIDUpdateTargets.some(function (existing) {
          return existing.fileId === file.fileId;
        });

        if (!exists) {
          uniqueIDUpdateTargets.push(file);
        }
      });

      if (copyMode === "master-and-subsheets") {
        var masterCreatedFile =
          allCreatedFiles.find(function (file) {
            return file.sheetType === "IDS Master";
          }) ||
          newCreatedFiles.find(function (file) {
            return file.sheetType === "IDS Master";
          });

        var hasSubsheetTarget = uniqueIDUpdateTargets.some(function (file) {
          return (
            file.sheetType !== "IDS Master" &&
            file.sheetType !== "Effective Paths"
          );
        });

        if (masterCreatedFile && hasSubsheetTarget) {
          var hasMasterTarget = uniqueIDUpdateTargets.some(function (file) {
            return file.fileId === masterCreatedFile.fileId;
          });

          if (!hasMasterTarget) {
            uniqueIDUpdateTargets.push(masterCreatedFile);
          }
        }
      }

      if (uniqueIDUpdateTargets.length > 0) {
        setStatusWithSpinner(
          `Retrying ID setup for ${uniqueIDUpdateTargets.length} file(s)...`,
        );

        var idUpdateResult = await applyGetStartedIDUpdates(
          uniqueIDUpdateTargets,
          copyMode,
        );
        var idUpdateSummary = processGetStartedIDUpdateResults(
          uniqueIDUpdateTargets,
          idUpdateResult,
        );
        retryResult.successfulIDUpdates = idUpdateSummary.successfulIDUpdates;
        retryResult.failedIDUpdates = idUpdateSummary.failedIDUpdates;
      }

      var statusParts = [];
      if (retryResult.createdFiles.length > 0) {
        statusParts.push(`Created ${retryResult.createdFiles.length} file(s)`);
      }
      if (retryResult.failedCopies.length > 0) {
        statusParts.push(
          `${retryResult.failedCopies.length} file(s) still failed to copy`,
        );
      }
      if (retryResult.successfulIDUpdates.length > 0) {
        statusParts.push(
          `Updated IDs for ${retryResult.successfulIDUpdates.length} file(s)`,
        );
      }
      if (retryResult.failedIDUpdates.length > 0) {
        statusParts.push(
          `${retryResult.failedIDUpdates.length} file(s) still failed ID setup`,
        );
      }

      retryResult.message =
        statusParts.length > 0
          ? statusParts.join(", ") + "."
          : "Nothing changed during retry.";

      setStatusText(retryResult.message);
      renderGetStartedCopyResult(retryResult);
    } catch (error) {
      AppError.show(error, {
        source: "retryFailedCopies",
        message: "The retry did not finish.",
      });
    } finally {
      if (retryBtn) retryBtn.disabled = false;
    }
  }
</script>
