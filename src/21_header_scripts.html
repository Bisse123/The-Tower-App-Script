<script>
  /**
   * Copies text, falling back to execCommand when the async API is refused.
   * @param {string} text
   * @param {Function} [done] Called with (ok: boolean).
   * @returns {void}
   */
  function copyTextToClipboard(text, done) {
    const finish = typeof done === "function" ? done : function () {};
    if (!text) {
      finish(false);
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () {
          finish(true);
        },
        function () {
          finish(legacyCopyText(text));
        },
      );
      return;
    }
    finish(legacyCopyText(text));
  }

  /**
   * Clipboard copy via a hidden textarea.
   * @param {string} text
   * @returns {boolean} Whether the copy succeeded.
   */
  function legacyCopyText(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  /**
   * Selects an element's text in the document.
   * @param {HTMLElement} el
   * @returns {void}
   */
  function selectElementText(el) {
    try {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
  }

  /**
   * Flashes a copied/failed class on an element for 1.2s.
   * @param {HTMLElement} el
   * @param {boolean} ok
   * @returns {void}
   */
  function flashCopyState(el, ok) {
    el.classList.remove("is-copied", "is-copyfailed");
    el.classList.add(ok ? "is-copied" : "is-copyfailed");
    clearTimeout(el.copyFlashTimer);
    el.copyFlashTimer = setTimeout(function () {
      el.classList.remove("is-copied", "is-copyfailed");
    }, 1700);
  }

  /**
   * Wires click and Enter/Space on an element to copy the text it supplies.
   * @param {HTMLElement} el
   * @param {Function} getText Returns the string to copy.
   * @param {Function} [onFail] Called when the copy fails.
   * @returns {void}
   */
  function initCopyOnClick(el, getText, onFail) {
    const run = function () {
      const text = getText();
      if (!text) return;
      copyTextToClipboard(text, function (ok) {
        if (!ok && onFail) onFail(el);
        flashCopyState(el, ok);
      });
    };
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.addEventListener("click", run);
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        run();
      }
    });
  }

  (function initCreatorCodeCopy() {
    const chips = document.querySelectorAll(".creatorChip");
    Array.prototype.forEach.call(chips, function (chip) {
      const codeEl = chip.querySelector(".creatorCode");
      const code = codeEl ? codeEl.textContent.trim() : "";
      if (!code) return;
      chip.setAttribute("title", 'Click to copy "' + code + '"');
      initCopyOnClick(chip, function () {
        return code;
      });
    });
  })();

  (function initSaveGuideCopy() {
    const blocks = document.querySelectorAll(".saveGuideSection .sgCode");
    Array.prototype.forEach.call(blocks, function (el) {
      el.setAttribute("title", "Click to copy");
      initCopyOnClick(
        el,
        function () {
          const raw = el.textContent || "";
          return el.tagName === "PRE"
            ? raw.replace(/\s+$/, "")
            : raw.replace(/\s+/g, " ").trim();
        },
        selectElementText,
      );
    });
  })();
</script>
